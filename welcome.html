<style>
  :root{
    --desk:#28362E;
    --desk-dark:#1B2620;
    --paper:#F1EAD9;
    --ink:#2A2318;
    --ink-soft:#7A6E58;
    --primary:#A9782F;
    --primary-light:#C99A4E;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; height:100%;
    background:var(--desk-dark);
    background-image: radial-gradient(ellipse at top, var(--desk), var(--desk-dark));
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--paper);
  }
  body{
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px;
  }
  .card{
    max-width:420px; width:100%;
    background:var(--paper);
    color:var(--ink);
    border-radius:10px;
    padding:40px 32px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.6rem;
    margin:0 0 12px;
  }
  p{
    font-size:0.95rem;
    color:var(--ink-soft);
    line-height:1.5;
    margin:0 0 24px;
  }
  a.cta{
    display:inline-block;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:0.9rem;
    color:var(--paper);
    background:var(--primary);
    text-decoration:none;
    padding:12px 28px;
    border-radius:6px;
    transition:background 0.15s ease;
  }
  a.cta:hover{ background:var(--primary-light); }
</style>
</head>
<body>
  <div class="card">
    <h1>You're all set.</h1>
    <p>Your account is confirmed. Taking you to The Ledger&hellip;</p>
    <a class="cta" href="priority-ledger.html" id="continueLink">Continue to The Ledger</a>
  </div>
  <script>
    // Preserve any hash/query Supabase attached to the confirmation
    // redirect (e.g. #access_token=...&type=signup) in case a future
    // change wants to read it — harmless to carry along either way.
    var dest = 'priority-ledger.html' + window.location.search + window.location.hash;
    document.getElementById('continueLink').href = dest;
    setTimeout(function(){ window.location.replace(dest); }, 1200);
  </script>
</body>
</html>
