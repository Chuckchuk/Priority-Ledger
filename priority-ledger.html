    width:100%; display:flex; align-items:center; justify-content:space-between;
    background:none; border:none; cursor:pointer; padding:12px 14px; text-align:left;
  }
  .settingssectiontitle{
    font-family:'IBM Plex Mono', monospace; font-size:0.66rem; letter-spacing:0.06em; text-transform:uppercase;
    color: var(--ink); font-weight:600;
  }
  .settingssectionchevron{ color: var(--ink-soft); font-size:0.62rem; flex-shrink:0; margin-left:8px; }
  .settingssectionbody{ padding:0 14px 14px; }
  /* A plain rule separating Appearance's sub-areas — first between the
     color section (swatches + Background gradient + Reset) and the
     surface-finish buttons, then again between those and the checkbox-
     nudge picker — enough to mark where each ends without a second
     nested card per area. */
  .settingsdivider{ border-top:1px dashed var(--line); margin:4px 0 14px; }
  /* Desktop: colors stacked on the left, color-related options (right
     now just Background gradient) on the right — see colorSplit() in
     09-settings.js. Mobile (default, no override below): the two just
     stack as their own full-width rows in document order, reproducing
     the single-column layout this always had. Gated by the same
     body:not(.mobileui-active) signal as every other Desktop-vs-Mobile
     split in this app (tabBarDesktopStyle, sidetabsAppearance, etc.),
     not a bespoke breakpoint, so "Desktop" means the same thing here it
     does everywhere else. */
  .colorsplit{ margin-bottom:12px; }
  .colorsplit-colors{ margin-bottom:12px; }
  body:not(.mobileui-active) .colorsplit{
    display:flex; align-items:stretch;
  }
  /* A fixed width, not flex:0 0 auto — the left column used to size
     itself off whichever of its two rows' text happened to be longer
     ("Desk & Ledger — Navy & Parchment" vs. "UI Colors — Brass & Rust"),
     which meant picking a different preset could shift the checkbox on
     the right sideways. A dashed rule between the two (border-left on
     the options side, so it only ever spans that side's own content
     height) reads as a real divider rather than just empty gap. */
  body:not(.mobileui-active) .colorsplit-colors{ flex:0 0 270px; min-width:0; margin-bottom:0; }
  body:not(.mobileui-active) .colorsplit-options{
    flex:1; min-width:0; padding:8px 0 0 20px; margin-left:20px;
    border-left:1px dashed var(--line);
  }
  .texturerow{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .texturebtn{
    font-family:'IBM Plex Mono', monospace; font-size:0.66rem; text-transform:uppercase; letter-spacing:0.03em;
    background: var(--card-bg-dim); border:1px solid var(--line); border-radius:6px; padding:8px 12px;
    color: var(--ink-soft); cursor:pointer;
  }
  .texturebtn.active{ background: var(--primary); border-color: var(--primary); color:white; }
  .resetthemebtn{
    font-family:'IBM Plex Mono', monospace; font-size:0.66rem; text-transform:uppercase; letter-spacing:0.04em;
    background:transparent; border:1px dashed var(--primary); color:var(--primary); border-radius:6px;
    padding:8px 12px; cursor:pointer;
  }
  /* Checkbox nudge picker (appearanceSection(), 09-settings.js) —
     graduated out of Dev Settings, now a real Appearance control. A
     label + dropdown on the left, a permanently-looping example of the
     currently-picked style on the right, so you see what you're
     choosing without having to go complete a real task's steps first. */
  .checkguiderow{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .checkguidetext{ flex:1; min-width:180px; display:flex; flex-direction:column; gap:6px; }
  .checkguideexample{
    flex-shrink:0; width:44px; height:44px; border-radius:8px;
    background: var(--card-bg-dim); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
  }
  /* guide-preview forces the same nudge animation every real checkbox
     plays (see checkGuideClass(), 08-render-core.js) into looping
     forever instead of the real 3-then-stop limit — a settings example
     that quietly stopped animating a moment after you opened the panel
     would read as broken, not as "that's the whole effect." Specificity
     needs to beat :is(.check,.checkcircle).guide-check's own --guide-
     iter:3 (also two classes) — three classes here (.check.guide-check
     .guide-preview) wins outright rather than relying on source order. */
  .check.guide-check.guide-preview{ --guide-iter: infinite; }
  .customselectmenu .check.guide-preview{
    width:16px; height:16px; margin-left:4px; pointer-events:none; flex-shrink:0;
  }
  /* EXPERIMENTAL — see defaultDevSettings() in <script>. A floating panel
     pinned to the far left of the viewport rather than folded into the
     Settings stacked-page: Settings fully covers the app while open (see
     render()'s settingsOpen branch), so a toggle buried in there can never
     be checked against the live page it affects. This panel renders
     unconditionally on every render() call (see renderDevPanel(), called
     first thing in render()) and lives outside .shell entirely, so it
     stays on screen — and stays open, see devPanelOpen in
     02-storage-state.js — no matter what view is showing underneath.
     Desktop-only on purpose (see the media query below): there's no room
     for a fixed left-edge strip on a narrow or touch screen, and this is a
     Claude Code development aid, not a real end-user feature. */
  .devpanel{
    position:fixed; top:50%; left:0; transform:translateY(-50%);
    display:flex; align-items:stretch; z-index:200;
  }
  .devpaneltab{
    writing-mode: vertical-rl; text-orientation: mixed;
    font-family:'IBM Plex Mono', monospace; font-size:0.66rem; letter-spacing:0.08em;
    text-transform:uppercase; color: var(--primary-light); background: var(--desk-dark);
    border:1px solid var(--primary); border-left:none; border-radius:0 8px 8px 0;
    padding:14px 6px; cursor:pointer;
  }
  .devpaneltab:hover{ color:white; }
  .devpanelbody{
    width:0; max-height:80vh; overflow:hidden; opacity:0;
    background: var(--card-bg); border:1px solid transparent; border-left:none;
    border-radius:0 8px 8px 0; transition: width .15s ease, opacity .15s ease;
  }
  /* .open is toggled only by toggleDevPanel() — never by renderDevPanel(),
     which only replaces #devPanelBody's innerHTML. That split is what lets
     flipping a checkbox re-render the panel's contents without ever
     touching this class, so the panel can't auto-collapse on a change. */
  .devpanel.open .devpanelbody{
    width:210px; opacity:1; overflow-y:auto; padding:14px 12px;
    border-color: var(--primary);
  }
  .devpanellabel{
    font-family:'IBM Plex Mono', monospace; font-size:0.62rem; letter-spacing:0.06em; text-transform:uppercase;
    color: var(--ink-soft); margin: 0 0 12px;
  }
  .devpanelfield{ margin-bottom:12px; }
  .devpanelcaption{
    display:block; font-family:'IBM Plex Mono', monospace; font-size:0.6rem;
    letter-spacing:0.04em; text-transform:uppercase; color: var(--ink-soft); margin-bottom:4px;
  }
  /* Section divider for the (long) Dev Settings list — see
     devSectionHeadHtml() in 01-categories-theme.js. One shared class for
     both hosts (the narrow floating side panel and Settings' own wider
     Dev Settings section): a top border + extra top margin to actually
     break the list into scannable chunks, plus the Primary accent color
     and bold weight to read as clearly heavier than a plain field
     caption like "Compact tag style" right below it — using the same
     look for both a section break and an individual field's label was
     exactly why this list read as one undifferentiated wall before. */
  .devsectionhead{
    font-family:'IBM Plex Mono', monospace; font-size:0.62rem; font-weight:600;
    letter-spacing:0.05em; text-transform:uppercase; color: var(--ink-soft);
    margin: 14px 0 8px;
  }
  /* One level up from .devsectionhead — General/Desktop/Mobile (see
     devGroupHtml() in 01-categories-theme.js), each collapsible on its
     own. Bolder and Primary-colored specifically so it outranks the
     (now more muted) .devsectionhead subsections nested inside it —
     before this existed, a subsection break and the three device
     groupings would have read as the exact same weight. */
  .devgroup{ margin: 18px 0 10px; padding-top:12px; border-top:1px solid var(--line); }
  .devgrouphead{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    background:none; border:none; cursor:pointer; padding:0; margin-bottom:4px;
    font-family:'IBM Plex Mono', monospace; font-size:0.68rem; font-weight:700;
    letter-spacing:0.06em; text-transform:uppercase; color: var(--primary);
  }
  .devgroupchevron{ font-size:0.6rem; color: var(--ink-soft); flex-shrink:0; margin-left:8px; }
  .devgroupnote{
    font-family:'IBM Plex Sans', sans-serif; font-size:0.66rem; font-style:italic;
    color: var(--ink-soft); margin: -4px 0 12px; line-height:1.4;
  }
  .devpanelrow{
    display:flex; align-items:flex-start; gap:6px; cursor:pointer;
    font-family:'IBM Plex Mono', monospace; font-size:0.62rem; line-height:1.35;
    letter-spacing:0.02em; color: var(--ink-soft); margin-bottom:12px;
  }
  .devpanelrow input{ cursor:pointer; margin-top:2px; flex-shrink:0; }
  .devpanelselect{
    display:block; width:100%; font-family:'IBM Plex Mono', monospace; font-size:0.62rem;
    background: var(--card-bg-dim); border:1px solid var(--line); border-radius:5px;
    color: var(--ink); padding:4px;
  }
  @media (max-width:1250px), (pointer:coarse){
    .devpanel{ display:none !important; }
  }
  /* Plain, semantic text output for the Claude-readable view — no
     decorative markup to strip, just a monospace block a page-reading
     tool can grab in one pass. */
  .claudepre{
    white-space: pre-wrap; word-break: break-word; margin:0;
    font-family:'IBM Plex Mono', monospace; font-size:0.76rem; line-height:1.55;
    background: var(--card-bg-dim); border:1px solid var(--line); border-radius:8px;
    padding:14px; max-height:65vh; overflow:auto; color:var(--ink);
  }
  .claudeviewrow{ display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  /* ---------- Calendar view ---------- */
  /* Reached via the "Calendar" tag on Daily's own day list — see
     renderDailyCalendar() in 18-calendar.js. */
  /* Same idea as .daynavrow above, reusing .navarrow — see the comment
     there for why the two share one button style instead of each
     defining a near-identical one. */
  .calnav{ display:flex; align-items:center; justify-content:center; gap:16px; margin:2px 0 10px; }
  .calmonthlabel{
    position:relative; overflow:hidden; height:26px; line-height:26px;
    font-family:'Fraunces', serif; font-style:italic; font-weight:500; font-size:1.15rem; color:var(--ink);
    background:none; border:none; cursor:pointer; padding:0; min-width:150px; text-align:center;
  }
  .calsummary{
    text-align:center; font-family:'IBM Plex Mono', monospace; font-size:0.68rem; text-transform:uppercase;
    letter-spacing:0.05em; color:var(--ink-soft); margin-bottom:12px;
  }
  .calweekdays{
    display:grid; grid-template-columns:repeat(7,1fr); text-align:center; margin-bottom:4px;
    font-family:'IBM Plex Mono', monospace; font-size:0.62rem; text-transform:uppercase; color:var(--ink-soft); letter-spacing:0.04em;
  }
  .calgrid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  /* Every cell (blank or real) is a fixed-ratio box via aspect-ratio, not
     a hardcoded height — that's what keeps the grid looking like an
     actual calendar (square-ish cells) at any card width, phone included,
     rather than a fixed pixel height that either wastes space on a wide
     card or gets cramped on a narrow one. */
  .calcell{
    aspect-ratio:1; border-radius:6px; border:1px solid var(--line); background: var(--card-bg-dim);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    cursor:pointer; padding:2px; font-family:'IBM Plex Sans',sans-serif; color:var(--ink);
    /* Backstop for the category-color chips below (and
       CALENDAR_CELL_CAT_CAP, their own primary defense)
       — a fixed aspect-ratio:1 box can't grow to fit more content, so
       anything that doesn't fit should clip rather than spill past the
       cell's own edges into its neighbors, especially on a phone-width
       card where cells are smallest. */
    overflow:hidden;
  }
  .calcell.calblank{ border:none; background:none; cursor:default; }
  .caldatenum{ font-size:0.8rem; }
  /* Any day already in state.days gets a slightly stronger card-bg tint
     (barely — the border below carries most of the signal), whether or
     not it actually has anything planned — clicking a cell creates the
     day (see openCalendarDay()), so an already-logged-but-empty day needs
     to look different from an untouched one, or there's no way to tell
     "nothing here yet" from "I checked, it's just empty" without
     clicking through. .calexistsdot (a plain middle dot, standing in for
     the ratio text a day with actual items shows) is what carries that
     distinction for the empty case specifically. */
  .calcell.exists{ background: color-mix(in srgb, var(--card-bg-dim) 80%, var(--primary) 20%); }
  .calratio{
    font-family:'IBM Plex Mono', monospace; font-size:0.58rem; color:var(--ink-soft); letter-spacing:0.02em;
  }
  .calratio.calexistsdot{ opacity:0.55; }
  /* Today gets the same Secondary-accent treatment .dayhero.today/
     .todaytag use elsewhere for "today," not a new one-off color, so
     "today" reads the same wherever it shows up in the app (the whole
     family moved together from Primary to Secondary — see the
     --primary/--secondary doc comment at the top of this file for why).
     border-width:3px (up from an original 2px) so it reads clearly even
     at a phone-width card's smaller cell size. */
  .calcell.today{ border-color:var(--secondary); border-width:3px; }
  .calcell.today .caldatenum{ color:var(--secondary); font-weight:700; }
  /* Ornate (double-line) border on today's cell — CSS's own
     border-style:double draws two parallel lines with a gap between them
     from a single border declaration, no pseudo-elements or extra
     box-shadow layers needed for the "engraved picture-frame" look, and
     it needs border-width:4px (double needs a little more room than a
     solid border to read as two distinct lines rather than one thick
     blur). Used to be a dev-only toggle ("keep it, why not" per the
     project owner); confirmed as the permanent look. */
  .calcell.today{ border-style:double; border-width:4px; }
  /* Category-color chips row above a cell's date number, from that day's
     dayCategoryIds() (11-daily-core.js) — the confirmed calendarCellStyle
     look (an alternate under-the-ratio icon-glyph variant was tried and
     removed once this one won). Sized deliberately tiny (see the comment
     on CALENDAR_CELL_CAT_CAP in 18-calendar.js for why the count itself
     is capped) — this is the piece that actually has to survive a
     phone-width card's smallest cells without forcing .calcell's
     overflow:hidden backstop to kick in under normal use. */
  .calcatchips{ display:flex; align-items:center; justify-content:center; gap:2px; line-height:1; }
  .calcatchip.dot{ width:5px; height:5px; border-radius:50%; flex-shrink:0; }
  .calcatchip.more{ font-family:'IBM Plex Mono', monospace; font-size:0.5rem; color:var(--ink-soft); flex-shrink:0; }
  @media (max-width:480px){
    .masthead h1{ font-size:1.9rem; }
    .card{ padding: 18px 14px 10px; }
    .locbadge{ width:44px; height:44px; top:-2px; }
  }

  /* ================= Mobile UI Lab (EXPERIMENTAL) =================
     2026-08 mobile-friendliness pass — see the long comment on
     defaultDevSettings() in 02-storage-state.js for what each dev
     setting means and why they're all gated behind mobileUiActive()
     (01-categories-theme.js) rather than a plain viewport media query.
     body.mobileui-active is that gate's own CSS mirror, toggled by
     refreshMobileUiActive() on load, on every dev-setting change, and on
     resize — everything below keys off it plus one of the
     body[data-quickadd-mode]/[data-taskrow-mobile]/[data-taskdetail-mobile]
     attributes or body.fab-on, so a variant picked in Settings has zero
     effect on desktop unless "Preview on desktop" is also checked. */

  /* iOS Safari (and most mobile WebKit) auto-zooms the whole page the
     moment a focused text input/textarea/select computes to under 16px —
     several of this app's own fields (.subadd's "+ add a step" input
     most noticeably, since that's the one people type into repeatedly)
     are smaller than that for their normal compact desktop look, which
     is exactly what was causing the jarring zoom-in on every new subtask.
     Not scoped to any specific field — ANY focusable text field under
     16px triggers the same zoom, so this is a blanket floor for the
     whole mobile UI rather than a per-field patch that'd just leave the
     next undersized field to rediscover the same bug. Specificity here
     (element selector prefixed with body.mobileui-active) is deliberately
     just high enough to beat each field's own smaller class-level
     font-size, not to fight it in general — nothing needs to look bigger
     than 16px, so anything already at or above that (.bigtitle,
     .fabaddsheet's inputs) is untouched. */
  body.mobileui-active input[type="text"],
  body.mobileui-active input[type="email"],
  body.mobileui-active input[type="password"],
  body.mobileui-active input[type="date"],
  body.mobileui-active textarea,
  body.mobileui-active select{
    font-size:16px;
  }

  /* ---- quickAddMobileStyle: the sticky trigger + sheet ----
     The trigger itself is no longer part of the category view's normal
     static flow (that was the whole "Default (always-visible inline row)"
     variant, now deleted — see the comment on quickAddMobileStyle in
     defaultDevSettings(), 02-storage-state.js) — cosmetic properties
     (color/shape/font) are shared by both quickAddTriggerPosition
     variants below; position/anchor is NOT, split out per-variant since
     "fixed to the bottom" and "sticky under the tabs" need genuinely
     different CSS mechanisms, not just different offsets. */
  .quickaddtrigger{
    display:none; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:10px; cursor:pointer;
    background: radial-gradient(circle at 30% 20%, var(--primary-light), var(--primary) 75%);
    color:#fff; font-family:'IBM Plex Mono', monospace; font-size:0.78rem;
    text-transform:uppercase; letter-spacing:0.06em;
    box-shadow: 0 6px 18px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.4);
  }
  body.mobileui-active .quickaddtrigger{ display:flex; }
  /* 'bottom': position:fixed, unconditionally reachable without scrolling
     back up to the top of a long list — the variant built for the
     original "sticky" ask. 76px of extra #categoryView bottom padding
     (bottom(16) + height(50) + a 10px gap) keeps the last task (or the
     undo/redo row and Refresh link further down the page) from ending up
     underneath it once scrolled all the way down; scoped to this one
     variant since 'top' never covers anything below to begin with. */
  body.mobileui-active[data-quickadd-trigger-pos="bottom"] .quickaddtrigger{
    position:fixed; left:12px; right:12px; bottom:16px; z-index:50; max-width:480px; margin:0 auto;
    height:50px; padding:0 14px;
  }
  body.mobileui-active[data-quickadd-trigger-pos="bottom"] #categoryView{ padding-bottom: 76px; }
  /* 'top': restored to its original spot in the normal flow, right under
     the tab bar — position:sticky (not fixed) is what keeps it there
     without scrolling away, while still costing nothing extra in layout
     terms (it reserves its own space same as any other in-flow element,
     so no #categoryView padding compensation is needed the way 'bottom'
     needs). top is env(safe-area-inset-top) plus a small gap, NOT a bare
     0 — on an iPhone with a notch/Dynamic Island, a sticky element with
     top:0 sticks flush to the true top of the viewport, which is the
     unsafe area itself (reported: it was ending up underneath the
     FaceTime camera). Anchoring to the safe-area inset instead means it
     stops just clear of that, same idiom body's own top padding already
     uses for the masthead. */
  body.mobileui-active[data-quickadd-trigger-pos="top"] .quickaddtrigger{
    position:sticky; top: calc(8px + env(safe-area-inset-top)); z-index:45; width:100%;
    padding:14px; margin-bottom:16px;
  }
  /* Grabber + close row — only meaningful once #quickAddBar itself has
     left its resting spot to float as a sheet/panel (topsheet/bottomsheet/
     inline all now do, just to different spots — see below). */
  .quickaddsheethead{ display:none; }
  body.mobileui-active[data-quickadd-mode="topsheet"] .quickaddsheethead,
  body.mobileui-active[data-quickadd-mode="bottomsheet"] .quickaddsheethead{
    display:flex; align-items:center; justify-content:center; position:relative; margin-bottom:6px;
  }
  .quickaddsheetgrabber{ width:36px; height:4px; border-radius:2px; background:var(--ink-soft); opacity:0.4; }
  .quickaddsheetclose{
    position:absolute; right:0; top:-6px; background:none; border:none;
    color:var(--ink-soft); font-size:1.3rem; line-height:1; cursor:pointer; padding:6px;
  }
  .quickaddscrim{ display:none; }
  body.mobileui-active.quickadd-open[data-quickadd-mode="topsheet"] .quickaddscrim,
  body.mobileui-active.quickadd-open[data-quickadd-mode="bottomsheet"] .quickaddscrim{
    display:block; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:55;
  }
  /* topsheet/bottomsheet: #quickAddBar leaves the document flow entirely
     and floats "just above everything" — tabs included — per the
     project owner's own framing of the ask. Column layout + full-width
     fields (below) replace the cramped inline flex-wrap row for exactly
     as long as the sheet is open. z-index:60 (above the scrim's 55, and
     above the trigger's own 50) is what keeps the trigger from ever
     poking out from underneath either — it doesn't need its own
     open/closed visibility toggle as a result. */
  body.mobileui-active[data-quickadd-mode="topsheet"] #quickAddBar,
  body.mobileui-active[data-quickadd-mode="bottomsheet"] #quickAddBar{
    position:fixed; left:12px; right:12px; z-index:60; max-width:480px; margin:0 auto;
    flex-direction:column; align-items:stretch; gap:12px;
    background: var(--card-bg); padding:18px 16px 20px; box-shadow:0 12px 32px rgba(0,0,0,0.35);
    transition: transform .28s cubic-bezier(.2,.8,.3,1), opacity .2s ease;
  }
  body.mobileui-active[data-quickadd-mode="topsheet"] #quickAddBar{
    top:12px; border-radius:14px 14px 20px 20px; transform:translateY(-140%);
  }
  body.mobileui-active[data-quickadd-mode="bottomsheet"] #quickAddBar{
    bottom:12px; border-radius:20px 20px 14px 14px; transform:translateY(140%);
  }
  body.mobileui-active[data-quickadd-mode="topsheet"]:not(.quickadd-open) #quickAddBar,
  body.mobileui-active[data-quickadd-mode="bottomsheet"]:not(.quickadd-open) #quickAddBar{
    opacity:0; pointer-events:none;
  }
  body.mobileui-active.quickadd-open[data-quickadd-mode="topsheet"] #quickAddBar,
  body.mobileui-active.quickadd-open[data-quickadd-mode="bottomsheet"] #quickAddBar{
    transform:translateY(0); opacity:1;
  }
  /* inline: no dimming overlay either way — the bar grows open right next
     to the (still-visible) trigger rather than behind a scrim. Which
     direction depends on where the trigger itself is docked:
       - 'bottom': the trigger is position:fixed with nothing below it to
         push on, so the bar instead grows UP out of the gap just above
         it. bottom:76px is the trigger's own bottom(16) + height(50) + a
         10px gap — same math as its #categoryView padding-bottom above,
         just anchoring this sheet instead of clearing content beneath
         it. Growing via max-height with only `bottom` set (no `top`) is
         what makes it expand upward instead of off the bottom of the
         screen.
       - 'top': the trigger is back in the normal flow (position:sticky),
         so this can just be a normal-flow sibling again too, growing
         DOWN and pushing the task list below it, the way it always did
         pre-sticky-trigger.
     Re-tapping the trigger is how this closes either way — it's never
     covered by its own sheet in either variant, so no extra close
     affordance was needed for that to keep working. */
  body.mobileui-active[data-quickadd-trigger-pos="bottom"][data-quickadd-mode="inline"] #quickAddBar{
    position:fixed; left:12px; right:12px; bottom:76px; z-index:45; max-width:480px; margin:0 auto;
    flex-direction:column; align-items:stretch; gap:12px;
    background: var(--card-bg); border-radius:14px; box-shadow:0 12px 32px rgba(0,0,0,0.35);
    max-height:0; overflow:hidden; opacity:0; padding:0 16px;
    transition: max-height .25s ease, opacity .2s ease, padding .25s ease;
  }
  body.mobileui-active.quickadd-open[data-quickadd-trigger-pos="bottom"][data-quickadd-mode="inline"] #quickAddBar{
    max-height:360px; opacity:1; padding:18px 16px 20px;
  }
  body.mobileui-active[data-quickadd-trigger-pos="top"][data-quickadd-mode="inline"] #quickAddBar{
    flex-direction:column; align-items:stretch; gap:12px;
    max-height:0; overflow:hidden; opacity:0; margin-bottom:0; padding:0;
    transition: max-height .25s ease, opacity .2s ease, margin-bottom .25s ease;
  }
  body.mobileui-active.quickadd-open[data-quickadd-trigger-pos="top"][data-quickadd-mode="inline"] #quickAddBar{
    max-height:360px; opacity:1; margin-bottom:16px;
  }
  body.mobileui-active[data-quickadd-mode="topsheet"] #quickAddBar input[type=text],
  body.mobileui-active[data-quickadd-mode="topsheet"] #quickAddBar select,
  body.mobileui-active[data-quickadd-mode="bottomsheet"] #quickAddBar input[type=text],
  body.mobileui-active[data-quickadd-mode="bottomsheet"] #quickAddBar select,
  body.mobileui-active[data-quickadd-mode="inline"] #quickAddBar input[type=text],
  body.mobileui-active[data-quickadd-mode="inline"] #quickAddBar select{
    width:100%; font-size:1.05rem; padding:11px 8px;
  }

  /* ---- floatingAddButton: the always-reachable (+) and its own
     lightweight "quick capture" sheet (openFabAdd() in 16-task-crud.js).
     Lives outside #appCard/.leathercover in shell-body.html so it keeps
     working no matter which tab or overlay is on screen underneath it. ---- */
  .fabaddbtn{
    display:none; position:fixed; right:20px; bottom:24px; z-index:70;
    width:56px; height:56px; border-radius:50%; border:none; cursor:pointer;
    background: radial-gradient(circle at 35% 30%, var(--primary-light), var(--primary) 70%);
    color:#fff; font-size:1.7rem; line-height:1;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.4);
    /* This is already meant to be pinned to the viewport regardless of
       scroll — "the always-reachable (+)" above isn't aspirational, it's
       the whole point of position:fixed here. iOS Safari/WKWebView has a
       long-standing quirk where a plain position:fixed element can lag or
       visibly detach during momentum-scroll on a long page instead of
       tracking the viewport smoothly, unless it's promoted to its own
       GPU-composited layer — translateZ(0) is the standard nudge for
       that; backface-visibility is the usual accompanying hint some iOS
       versions want too. Layout-wise this changes nothing (0px
       translation) — purely a rendering-path hint. */
    transform: translateZ(0);
    backface-visibility: hidden;
  }
  body.mobileui-active.fab-on .fabaddbtn{ display:flex; align-items:center; justify-content:center; }
  .fabaddscrim{ display:none; }
  /* #fabAddScrim specifically, NOT the shared .fabaddscrim class — the
     long-press settings sheet below (#taskSettingsScrim) also carries
     that class, and a bare "body.fab-open .fabaddscrim" used to match
     it too, popping the wrong scrim (and, via the same mistake on
     .fabaddsheet below, the wrong sheet) on top of the FAB's own
     whenever the FAB was opened — tapping what looked like the FAB's
     scrim actually called closeTaskSettingsSheet(), which does nothing
     for fabAddOpen, making the FAB read as stuck open. */
  body.fab-open #fabAddScrim{ display:block; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:65; }
  .fabaddsheet{
    display:flex; flex-direction:column; gap:12px;
    position:fixed; left:12px; right:12px; bottom:12px; z-index:70; max-width:480px; margin:0 auto;
    background: var(--card-bg); padding:18px 16px 20px; border-radius:20px 20px 14px 14px;
    box-shadow:0 12px 32px rgba(0,0,0,0.35);
    transform:translateY(140%); opacity:0; pointer-events:none;
    transition: transform .28s cubic-bezier(.2,.8,.3,1), opacity .2s ease;
  }
  body.fab-open #fabAddSheet{ transform:translateY(0); opacity:1; pointer-events:auto; }
  .fabaddsheet input[type=text], .fabaddsheet select{ width:100%; font-size:1.05rem; padding:11px 8px; }

  /* ---- taskLongPressMode 'split': the long-press settings sheet ----
     Reuses .fabaddsheet/.fabaddscrim's own hidden-by-default base rules
     above (same bottom-sheet mechanics as the FAB's quick-capture sheet)
     — only the *shown* state is gated by a different body class, since
     the FAB sheet and this one are independent and either can be open
     without the other. .tasksettingssheet adds the taller/scrollable
     override this one needs — a task's full management fields (title,
     category, due, flags, timeframe/priority, notes) run taller than the
     FAB's plain title+category. */
  body.tasksettings-open #taskSettingsScrim{ display:block; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:65; }
  body.tasksettings-open #taskSettingsSheet{ transform:translateY(0); opacity:1; pointer-events:auto; }
  .tasksettingssheet{ max-height:80vh; overflow-y:auto; }
  .tasksettingssheet .expand-row{ margin-top:0; }

  /* ---- Shake-to-undo/redo (see 04-undo.js) ----
     Reuses .fabaddsheet/.fabaddscrim's own hidden-by-default base rules
     above (same bottom-sheet mechanics as the FAB/long-press sheets) —
     only the *shown* state is gated by its own body class. Deliberately
     NOT scoped to body.mobileui-active: shaking a physical phone is a
     real device capability, independent of the Mobile UI Lab's viewport
     emulation, so this works (or doesn't, for lack of an accelerometer)
     the same regardless of that toggle. */
  body.shakeundo-open #shakeUndoScrim{ display:block; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:65; }
  body.shakeundo-open #shakeUndoSheet{ transform:translateY(0); opacity:1; pointer-events:auto; }
  .shakeundo-title{
    text-align:center; font-family:'Fraunces', serif; font-size:1.05rem; color:var(--ink); margin:2px 0;
  }
  .shakeundo-actions{ display:flex; flex-direction:column; gap:10px; }
  .shakeundo-actions button{
    width:100%; padding:14px 12px; border-radius:12px; border:1px solid var(--line);
    background: var(--card-bg-dim); font-family:'IBM Plex Sans', sans-serif; font-size:0.95rem;
    color:var(--ink); cursor:pointer; text-align:center;
  }
  .shakeundo-actions button:not(:disabled):hover{ border-color: var(--primary); }
  .shakeundo-actions button:disabled{ opacity:0.4; cursor:default; }

  /* ---- taskRowMobileStyle: reflowing a task row's title vs. its badges ---- */
  /* stacked: .titlewrap (wrapping .title+.meta, see the base rule above)
     switches from a side-by-side row to a column — the title takes the
     row's full width on its own line, and the priority/timeframe/due
     badges drop to a second, wrapping line right below it instead of
     competing with the title for space on one line. */
  body.mobileui-active[data-taskrow-mobile="stacked"] .titlewrap{
    flex-direction:column; align-items:flex-start; gap:3px;
  }
  body.mobileui-active[data-taskrow-mobile="stacked"] .meta{ flex-wrap:wrap; }
  /* minimal: reclaims width by dropping the two lowest-value elements on
     a phone — the drag handle (touch drag-reorder is marginal to begin
     with) and the category dot (redundant once you're already inside
     that category's own tab; "All" still shows it, since there the dot
     is the only thing saying which category a row belongs to). Scoped to
     .row's own direct children so this can't also hit a subtask row's
     .draghandle.sub or a task-detail-page header's .cdot. */
  body.mobileui-active[data-taskrow-mobile="minimal"] .row > .draghandle,
  body.mobileui-active[data-taskrow-mobile="minimal"] .row > .cdot{ display:none; }

  /* ---- taskDetailMobileStyle: the expand-row's category/due/actions ---- */
  /* stacked: every field (and the .expandactions group) gets its own
     full-width line instead of wrapping wherever it happens to fit. */
  body.mobileui-active[data-taskdetail-mobile="stacked"] .expand-row{
    flex-direction:column; align-items:stretch; gap:8px;
  }
  body.mobileui-active[data-taskdetail-mobile="stacked"] .expand-row .catselect,
  body.mobileui-active[data-taskdetail-mobile="stacked"] .expand-row .datefield{
    width:100%;
  }
  body.mobileui-active[data-taskdetail-mobile="stacked"] .expandactions{
    display:flex; gap:10px; justify-content:space-between; align-items:center; margin-top:2px;
  }
  body.mobileui-active[data-taskdetail-mobile="stacked"] .expandactions .remove{ margin-left:0; }
  /* grouped: category + due date sit in an even two-column grid (their
     text labels dropped — the field itself is self-explanatory once it's
     not crammed against three other things), with the action buttons in
     their own evenly-spaced row underneath. A middle ground between the
     cramped default and fully-stacked. */
  body.mobileui-active[data-taskdetail-mobile="grouped"] .expand-row{
    display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; align-items:center;
  }
  body.mobileui-active[data-taskdetail-mobile="grouped"] .expand-row .fieldlabel{ display:none; }
  body.mobileui-active[data-taskdetail-mobile="grouped"] .expand-row .catselect,
  body.mobileui-active[data-taskdetail-mobile="grouped"] .expand-row .datefield{
    width:100%;
  }
  body.mobileui-active[data-taskdetail-mobile="grouped"] .expandactions{
    grid-column:1 / -1; display:flex; justify-content:space-around; align-items:center; margin-top:4px;
  }
  body.mobileui-active[data-taskdetail-mobile="grouped"] .expandactions .remove{ margin-left:0; }
  /* Glitch fix: this variant's 2-column grid was written back when
     .catselect and .datefield always shared the row as its two columns.
     The full detail page's own .expand-row (.hideactions — see
     taskCoreFieldsRowHtml()'s own comment, 08-render-core.js) hides
     .catselect entirely now, leaving .datefield as the row's only real
     content — with nothing telling it to span both columns, it just sat
     in column 1, claiming half the row's width and leaving column 2
     visibly empty. */
  body.mobileui-active[data-taskdetail-mobile="grouped"] .expand-row.hideactions .datefield{
    grid-column: 1 / -1;
  }

  /* stickyTabBar (EXPERIMENTAL, see defaultDevSettings() in 02-storage-
     state.js) — pins .tabswrap (and the .tabs row inside it) to the top of
     the viewport instead of letting it scroll away with the rest of the
     page, so Daily (or any tab) stays one tap away no matter how far down
     a long task list you've scrolled. `top` reads the safe-area inset
     directly rather than 0 so this respects the notch/status bar in
     standalone "Add to Home Screen" mode the same way body's own padding
     does (see the html/body safe-area comment near :root) — sticky's own
     offset is measured against the viewport, not body's padding, so it
     needs this independently. .tabs already carries a translucent shelf
     background (see the comment above its own rule) which is enough to
     read against whatever scrolls underneath once pinned; the added
     box-shadow here is what actually sells "this is now floating above
     the page" rather than just sitting in normal flow. z-index has to
     clear #appCard's own z-index:1 (and everything inside it, including
     any .stackedpage drilldown) so the pinned bar isn't scrolled-under by
     Settings, a day's detail, etc. the moment one of those opens. */
  body.dev-stickytabs .tabswrap{
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
  }
  body.dev-stickytabs .tabs{
    box-shadow: 0 8px 14px rgba(0,0,0,0.35);
  }

  /* ---- tabBarMobileStyle / tabBarDesktopStyle ----
     .appmain/.tabswrap (see shell-body.html) are plain unstyled wrappers
     in every mode but 'sidetabs' below — nothing here changes the
     default look. tabBarMobileStyle is gated by mobileui-active like the
     rest of this lab; tabBarDesktopStyle is gated the opposite way
     (body:not(.mobileui-active)) so it can never activate at phone width
     regardless of what's selected — see the comment on
     defaultDevSettings() in 02-storage-state.js. */

  /* Taller tap target on any phone-ish viewport, regardless of which
     tabBarMobileStyle variant is active — per the explicit ask: the
     desktop-sized 9px/11px padding made a real swipe/tap easy to miss by
     a few pixels, which (especially in "scroll" mode just below) read as
     the gesture failing or grabbing the wrong thing rather than a plain
     mis-tap. */
  body.mobileui-active .tab{ padding: 13px 14px 15px; }
  /* scroll: one row, no wrap — scrolls sideways instead, with scroll-snap
     and a trailing fade hinting more tabs are off-screen. Scrollbar
     hidden since the fade + snap already communicate "more content"
     without needing a visible track on top of it. */
  body.mobileui-active[data-tabbar-mobile="scroll"] .tabs{
    flex-wrap:nowrap; overflow-x:auto; scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
    /* Tells the browser a touch that starts on this row is this row's
       own horizontal gesture, full stop — without it (the default
       touch-action:auto lets either axis win), a swipe that starts even
       slightly off-axis could get claimed by the page's own vertical
       scroll instead, which is exactly the "scrolls up/down instead of
       left/right if I don't hit it just right" complaint. Same standard
       fix any horizontally-scrolling strip needs (an OS tab bar, a
       carousel) — a touch starting on a strip this thin is overwhelmingly
       meant for it, not the page behind it. */
    touch-action: pan-x;
  }
  body.mobileui-active[data-tabbar-mobile="scroll"] .tabs::-webkit-scrollbar{ display:none; }
  body.mobileui-active[data-tabbar-mobile="scroll"] .tab{ flex-shrink:0; scroll-snap-align:start; }
  .tabswrap{ position:relative; }
  .tabswrap::before, .tabswrap::after{ content:none; }
  /* Both fades exist (content:'') at all times once scroll mode is on,
     permanently at opacity:0, and only the .fade-left/.fade-right classes
     updateTabScrollFade() (06-tabs-render.js) toggles on scroll/resize/
     re-render flip them to opacity:1 — right hints "more tabs past the
     edge" only while that's actually true (never past the last tab), and
     left mirrors it once you've scrolled away from the first tab at all.
     Crossfading opacity on an always-present pseudo-element (rather than
     the content:none/'' toggle above, which pops the box in and out of
     existence with nothing to animate between) is what makes this a
     smooth fade instead of a hard flicker at the scroll extremes. Toned
     down from an earlier, harsher pass — 24px/0.32 reads as a soft hint,
     not a hard edge. */
  body.mobileui-active[data-tabbar-mobile="scroll"] .tabswrap::before{
    content:''; position:absolute; top:0; left:0; bottom:1px; width:24px;
    background:linear-gradient(to left, transparent, rgba(0,0,0,0.32));
    border-radius:10px 0 0 0; pointer-events:none;
    opacity:0; transition: opacity .3s ease;
  }
  body.mobileui-active[data-tabbar-mobile="scroll"] .tabswrap::after{
    content:''; position:absolute; top:0; right:0; bottom:1px; width:24px;
    background:linear-gradient(to right, transparent, rgba(0,0,0,0.32));
    border-radius:0 10px 0 0; pointer-events:none;
    opacity:0; transition: opacity .3s ease;
  }
  body.mobileui-active[data-tabbar-mobile="scroll"] .tabswrap.fade-left::before{ opacity:1; }
  body.mobileui-active[data-tabbar-mobile="scroll"] .tabswrap.fade-right::after{ opacity:1; }

  /* sidetabs: EXPERIMENTAL, and now two genuinely different families under
     one dev setting (see defaultDevSettings() in 02-storage-state.js for
     the full rationale). 'classic'/'classicband' are the ORIGINAL layout,
     unchanged from before any of this reworking started: a plain column
     of full-width tabs in normal flex flow beside .leathercover. 'color'/
     'translucentpill'/'edge' are the newer peeking book-index-tab look —
     each mostly tucked BEHIND #appCard and OVER .leathercover, poking out
     just enough past the page's own left edge to read and click. #appMain
     stays a flex row either way (harmless with only .leathercover left in
     it once #tabswrap is taken out of flow for the peeking family below)
     so .leathercover simply fills whatever width #tabswrap isn't using.
     See layoutSidetabsPeek() in 06-tabs-render.js for how #sidetabsPeek (a
     real child of .leathercover, see shell-body.html) gets populated for
     the peeking family, and the .sidetabspeek rules below for the
     geometry. */
  body:not(.mobileui-active)[data-tabbar-desktop="sidetabs"] .appmain{
    display:flex; align-items:stretch; gap:0;
  }
  /* display:none, not just hidden — layoutSidetabsPeek() only ever needs
     cloneNode(true) off these (for their classes/inline --tabhex etc./
     content) for the peeking family, never a live measurement of the real
     column, so there's no need to keep it occupying space or even
     rendering. Excluded for 'classic'/'classicband' below, which use this
     real column directly instead of cloning it anywhere. */
  body:not(.mobileui-active)[data-tabbar-desktop="sidetabs"]:not([data-sidetabs-appearance="classic"]):not([data-sidetabs-appearance="classicband"]) .tabswrap{
    display:none;
  }
  body:not(.mobileui-active)[data-tabbar-desktop="sidetabs"] .leathercover{ flex:1; min-width:0; }
  /* 'classic'/'classicband': the original sidetabs layout, restored
     verbatim — a fixed-width column, every tab full-width and flush with
     its neighbors, no overlap, no shape, no peeking mechanism at all. Its
     resting/active colors come from the same base .tab/.tab.active rules
     every other tab style already uses (translucent dark resting, --card-
     bg active) rather than any override here, which is exactly what
     originally shipped — nothing to duplicate. */
  body:not(.mobileui-active)[data-tabbar-desktop="sidetabs"][data-sidetabs-appearance="classic"] .tabswrap,
  body:not(.mobileui-active)[data-tabbar-desktop="sidetabs"][data-sidetabs-appearance="classicband"] .tabswrap{
    width:168px; flex-shrink:0;
  }
  body:not(.mobileui-active)[data-tabbar-desktop="sidetabs"][data-sidetabs-appearance="classic"] .tabs,
  body:not(.mobileui-active)[data-tabbar-desktop="sidetabs"][data-sidetabs-appearance="classicband"] .tabs{
    flex-direction:column; flex-wrap:nowrap; height:100%; gap:4px;
    padding:10px; border-radius:10px 0 0 10px; border-right:none; border-bottom:1px solid rgba(241,234,217,0.16);
  }
  body:not(.mobileui-active)[data-tabbar-desktop="sidetabs"][data-sidetabs-appearance="classic"] .tab,
  body:not(.mobileui-active)[data-tabbar-desktop="sidetabs"][data-sidetabs-appearance="classicband"] .tab{
    border-radius:7px 0 0 7px; justify-content:flex-start; width:100%; padding:11px 16px;
  }
  /* classicband: same column, icon glyph swapped for a colored left-edge
     stripe — the one thing it keeps from the peeking family's own 'edge'
     idea. A plain border-left would do here (no clip-path/shape to keep
     clear of, unlike the peeking family's own band on ::before), but
     ::before matches how every other "color band" in this feature is
     built, so there's one mental model for "the band" rather than two. */
  body:not(.mobileui-active)[data-tabbar-desktop="sidetabs"][data-sidetabs-appearance="classicband"] .tab .dot{
    display:none;
  }
  body:not(.mobileui-active)[data-tabbar-desktop="sidetabs"][data-sidetabs-appearance="classicband"] .tab{
    position:relative;
  }
  body:not(.mobileui-active)[data-tabbar-desktop="sidetabs"][data-sidetabs-appearance="classicband"] .tab::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:6px;
    background: var(--tabhex, var(--primary));
  }
  /* #sidetabspeek's own left:0 lands exactly on #appCard's rendered left
     edge ONLY while leather is off (see the .leathercover.leather-on
     override right below for why it needs one) — an absolutely positioned
     child is placed relative to the PADDING edge of its nearest positioned
     ancestor (.leathercover, see .leathercover{position:relative} above),
     which is .leathercover's own OUTER edge, not wherever its padding
     happens to push #appCard to. With no leather, .leathercover has no
     padding of its own, so that outer edge and #appCard's edge are the
     same point and left:0 just works. No explicit z-index here
     (deliberately): #appCard's own z-index:1 (see .card above) already
     unconditionally outranks any *unpositioned-or-z-index-auto* box
     regardless of DOM order, so leaving this at the auto default is what
     guarantees it always paints below #appCard — an explicit value here
     would just be one more number to keep in sync with .card's for no
     benefit. Being a real element placed after .leathercover's own
     ::before (the leather grain texture, generated as that element's
     conceptual first child) is what keeps it painting above that texture,
     same idea as .bookmark just above it in shell-body.html. */
  .sidetabspeek{
    position:absolute; left:0; top:28px; display:flex; flex-direction:column;
    pointer-events:none;
  }
  /* Once leather is on, .leathercover.leather-on adds padding-left:
     var(--leather-pad-left) (see that rule above) which pushes #appCard's
     own edge inward by that same amount — without this override
     #sidetabspeek stayed anchored to .leathercover's now-unmoved OUTER
     edge, so every tab under it drifted further and further UNDER the
     page as the preset's padding grew, reading as "tabs going way too far
     in, covering elements inside the page." Reusing the exact same
     variable #appCard's own inset is built from is what guarantees this
     tracks it exactly, at every preset, instead of needing its own
     hand-tuned number per preset the way an earlier pass tried and got
     wrong. This is the actual fix for "they should always have the same
     position on the side of the page" — same position *relative to the
     page*, which is what makes the leather's own inward shift something
     to compensate for rather than something to match. */
  .leathercover.leather-on .sidetabspeek{ left: var(--leather-pad-left); }
  /* Fixed height + a negative margin-top overlap (not a dynamic solver
     the way layoutOverlapTabs()'s horizontal row needs — see the comment
     on layoutSidetabsPeek()) is enough room for any realistic category
     count down a column this tall. width/margin-left below are only the
     PRE-JS fallback (same idiom as the overlap look's own static margin-
     left default) — layoutSidetabsPeek() sets both inline per tab now, so
     a label that needs more room to read (see SIDETAB_MIN_POKE there) can
     actually get it instead of every tab sharing one guessed constant.
     position:relative only so hover/.active below can use z-index (it has
     no effect on a static element) — it doesn't otherwise change this
     box's place in the column's normal flow. No mask-image fade here (a
     first pass put one on every tab — see .tab.active below for why that
     was wrong on two counts). */
  /* background is a two-stop gradient, not a plain fill — var(--tabband)
     near the left edge (0 to 10px, the 'flat' shape's own band depth —
     see the sidetabsShape rules below for how each other shape moves
     that split point to match its own protruding/notched depth) and
     var(--sidetab-fill) for the rest. This is the ONE thing that decides
     "does the color band follow the shape": since both the split point
     AND the clip-path silhouette are properties of this SAME element,
     they can never disagree with each other the way two separately
     clipped elements (an earlier pass used a ::before for the band) can
     — there's only one shape here, just two colors within it. */
  .sidetabspeek .tab{
    width:84px; height:44px; margin-left:-72px; margin-top:-10px;
    padding:0 10px 0 18px; border-radius:0; justify-content:flex-start;
    box-shadow: -2px 3px 6px rgba(0,0,0,0.35);
    position:relative; pointer-events:auto;
    background: linear-gradient(to right, var(--tabband, var(--tabhex, var(--primary))) 0 10px, var(--sidetab-fill, var(--tabhex, var(--primary))) 10px 100%);
    clip-path:none;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .sidetabspeek .tab:first-child{ margin-top:0; }
  /* Past SIDETAB_MAX_POKE (layoutSidetabsPeek(), 06-tabs-render.js) a long
     label stops growing the tab wider and wraps here instead — height is
     set inline per tab (SIDETAB_HEIGHT_2LINE) since only labels that
     actually need it get taller, not every tab uniformly. -webkit-line-
     clamp:2 does double duty as both "wrap to a second line" AND "if it's
     STILL too long even wrapped, ellipsize" in one property, rather than
     needing a separate overflow check for the pathological-single-long-
     word case. flex:1;min-width:0 on the label is required for it to
     actually shrink/wrap inside the tab's flex row at all — a flex item's
     default min-width:auto would otherwise hold it at its own intrinsic
     (unwrapped) width and force the tab wider regardless of what's set
     above it. */
  .sidetabspeek .tab.two-line .tablabel{
    flex:1; min-width:0; white-space:normal; line-height:1.15;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
  }
  /* Hovering brings a tab out a little further rather than reordering the
     stack (there's nothing to reorder — position:relative in a normal-
     flow column, not the overlap look's z-index-stacked pile) — the
     project owner's own ask ("hover should bring the tag out to the left
     a little"). z-index:5 only matters where this tab's translated
     position now overlaps a still-resting neighbor above/below it in the
     column. Compounding :hover onto .active too (same fix as the overlap
     look's own .tab.active:hover — see that rule's comment) keeps
     hovering the tab you're already on from snapping it back to a lesser
     "just hovering" look. */
  .sidetabspeek .tab:hover, .sidetabspeek .tab.active:hover{
    transform: translateX(-10px); box-shadow: -4px 5px 10px rgba(0,0,0,0.4);
    z-index:5;
  }
  /* The active tab sits out a bit further even at rest, so it's always
     legible without needing a hover — and above every resting neighbor it
     might overlap in the column. Its own deeper tuck (SIDETAB_TUCK_ACTIVE
     vs SIDETAB_TUCK, both in layoutSidetabsPeek()) is what the mask-image
     fade below exists to cover for. No width here any more — that's
     layoutSidetabsPeek()'s own inline style now (see its comment for why),
     so this only sets the properties that are genuinely fixed regardless
     of a tab's own label width. The mask-image fade is ONLY here, not on
     the base .tab rule — a first pass put a wide 20%-of-width fade on
     EVERY tab, which (a) doesn't make sense for a resting tab that isn't
     tucked deep enough to need one, and (b) actively broke every outward-
     pointing shape below: mask-image's own coordinate space is the
     element's plain border-box, 0 to its own width, so a clip-path point
     sitting at a negative x-offset (pagetab/arrows/sawtooth/jagged all
     protrude past x:0 — see sidetabsShape below) fell entirely outside
     that space and got masked to nothing, which is why every shape but
     invertedv (the one shape whose point stays inside the box, since it
     cuts *inward*) looked "stopped working." Scoped to only the active
     tab's own tucked/right edge instead (90%-100% of its width — well
     past both the label, which ends inside its own 10px right padding,
     and the pointed shapes, whose protruding tips sit on the opposite,
     LEFT side entirely) — "fade at the very tip, never the text," per the
     project owner's own ask. */
  /* white, not black, for the "fully visible" stops below — mask-image
     (both the standard property and -webkit-mask-image) evaluates by
     LUMINANCE by default in Chromium/WebKit, not alpha: a "black" stop
     has zero luminance regardless of its own alpha, so black-to-
     transparent (both share the same 0,0,0 RGB, differing only in alpha,
     which luminance mode ignores) evaluated to "hidden" across the ENTIRE
     gradient, not just the transparent end — the whole active tab was
     reading as washed-out/near-invisible against the dark desk behind it
     ("weird transparent gray"), not just faded at its tip. White has full
     luminance, so white-to-transparent works correctly under both
     luminance and alpha interpretations — the standard, correct way to
     write a mask gradient, not a black one. */
  .sidetabspeek .tab.active{
    transform: translateX(-6px); z-index:4; font-weight:500;
    -webkit-mask-image: linear-gradient(to right, white 0%, white 90%, transparent 100%);
    mask-image: linear-gradient(to right, white 0%, white 90%, transparent 100%);
  }
  /* No background declared here on purpose (an earlier pass had a plain
     one) — the shape rules below already give every tab, active or not,
     the right background via the [data-shape="…"] selectors, which match
     regardless of .active. Redeclaring it here would either duplicate
     that or (worse) fight it depending on source order. */
  /* ---- sidetabsAppearance (see defaultDevSettings() in 02-storage-
     state.js) ---- each mode sets --sidetab-fill/--tabband/color (read by
     the shape rules' own background gradients below) rather than
     background directly, so no appearance needs its own per-shape copy.
     'color' (default) needs no override beyond the --tabhex/--tabtext
     already set inline by renderTabs() (copied onto every clone by
     cloneNode(true)) for --sidetab-fill, but DOES need --tabband (the
     accent used near the shape's point/edge) pointed at --tabedge — the
     same pre-shaded darker tone the overlap look's own border-top already
     reads — since --tabband's own fallback (--tabhex) would otherwise be
     identical to --sidetab-fill and the band wouldn't read as distinct
     against a fill that's already the tab's own color. */
  body[data-sidetabs-appearance="color"] .sidetabspeek .tab{
    --tabband: var(--tabedge, var(--primary-light));
  }
  /* 'translucentpill': a plain half-round left end (border-radius using
     half the tab's own 44px height, a true pill/stadium curve) instead of
     any clip-path, no color band, no fade — this is what 'classic' meant
     before that name got reclaimed for the real original layout above.
     Keeps its icon (unlike 'edge'). Plain background (not the shared
     gradient) is deliberate — "without the color band" was the explicit
     ask for this look specifically. */
  body[data-sidetabs-appearance="translucentpill"] .sidetabspeek .tab{
    --sidetab-fill: rgba(0,0,0,0.18); color: rgba(241,234,217,0.65);
    clip-path:none; border-radius:22px 0 0 22px; background: var(--sidetab-fill);
    mask-image:none; -webkit-mask-image:none;
  }
  /* Blocks pagetab's own ::before diamond (see the sidetabsShape rules
     below) from showing up here too — "no color band" applies regardless
     of which shape happens to be selected in the dropdown. */
  body[data-sidetabs-appearance="translucentpill"] .sidetabspeek .tab::before,
  body[data-sidetabs-appearance="translucentpill"] .sidetabspeek .tab::after{ content:none; }
  /* 'edge': drop the fill to the plain page color (so the tab reads as
     part of the page it's tucked behind) and drop the icon glyph (.dot —
     see categoryDotHtml() in 01-categories-theme.js) in favor of the
     color band (the shape rules' own gradient split) doing the
     identifying instead — the "left edge of the tab with a color instead
     of the icon" ask. */
  body[data-sidetabs-appearance="edge"] .sidetabspeek .tab{
    --sidetab-fill: var(--card-bg); color: var(--ink);
  }
  body[data-sidetabs-appearance="edge"] .sidetabspeek .dot{ display:none; }
  /* 'color': the icon glyph is still in the markup (categoryDotHtml()),
     just invisible — its own color is the category's hex, same as the
     tab's background, so it was rendering exactly on top of itself while
     still eating its own padding/gap, reading as "text pushed over for no
     reason." Hidden outright, with padding-left pulled in to match (was
     sized for the icon + gap; the color band is the only thing that
     needs room there now). */
  body[data-sidetabs-appearance="color"] .sidetabspeek .dot{ display:none; }
  body[data-sidetabs-appearance="color"] .sidetabspeek .tab{ padding-left:10px; }
  /* ---- sidetabsShape — cuts the tab's own left (poking-out) edge and
     positions the color band with it; top/right/bottom stay straight
     since those are shared with the column and with #appCard, not part
     of what's actually visible poking out.
     'jagged' is intentionally never assigned by resolveSidetabShape() for
     'random'/'iconstyle' (06-tabs-render.js) — same for 'flat', a
     deliberately plain opt-in rather than something to land on by chance.
     Every polygon's x-coordinates are non-negative and no bigger than the
     tab's own width — this Browser environment doesn't paint a clip-path
     vertex placed outside the element's own 0..width box (confirmed with
     an isolated test div — a mainstream desktop browser handles this
     fine, but here the point just silently doesn't render and the edge
     stays flat), so every outward-pointing shape below is shifted right
     by its own SIDETAB_SHAPE_EXTRA (06-tabs-render.js), which also pads
     the tab that same amount so its on-screen position doesn't change —
     see that constant's own comment for the full explanation.
     The color band is each shape's own background gradient (see .tab's
     base rule above) with its split point moved to match that shape's own
     depth — "the color band follows the shape" by construction, since the
     split and the clip-path silhouette are the same element's properties,
     not two separately clipped layers trying to agree. flat needs no
     override at all: the base rule's own 10px split already is its band.
     pagetab is the one exception to the gradient approach entirely — see
     its own comment below. */
  /* invertedv: a single V notch cut into the edge — "a bookmark with an
     inverted V chunk out of it" — with a border tracing the cut, like a
     ribbon's own edge trim. Two FULL-TAB layers, not the shared gradient
     every other shape uses, since a flat left-to-right split can't trace
     a diagonal edge:
     - .tab itself (the "band" layer) is clipped to a notch (10px) and
       filled with --tabband. This is deliberately the SHALLOWER of the
       two layers — since clip-path on a parent bounds what its own
       ::before can ever show (a child can never poke out past its
       parent's own clip), whichever layer is shallower here is the one
       that actually decides how deep the notch reads on screen. 10px
       plus SIDETAB_SHAPE_EXTRA's own 6px (06-tabs-render.js, added to
       this shape's padding-left) leaves a real buffer before the label
       text at every appearance's padding.
     - ::before (the "fill" layer) sits on top, covers the FULL tab
       (inset:0 — a previous pass capped this at width:16px to dodge a
       text-visibility bug, which instead left --sidetab-fill covering
       only a 16px sliver and .tab's own --tabband color exposed as the
       background for the ENTIRE REST of the tab — reported back as "the
       color band is just a vertical other color" and, in 'edge' mode
       specifically, as the fill/band colors reading inverted, both
       exactly what you'd expect from the fill layer covering almost none
       of the tab), clipped to a deeper notch filled with --sidetab-fill.
       .tab's own background only shows through where ::before's own clip
       leaves it uncovered — that gap is the border.
       Each polygon's depth is CONSTANT from y:0%-12% and y:88%-100% (3px
       for .tab, 7px for ::before — a straight run, not a taper down to a
       sharp 0,0 corner) and ramps only between 12%/50%/88%, where each
       layer's depth differs from the other by a CONSTANT 4px (3/10/3 for
       .tab, 7/14/7 for ::before). A constant depth difference over the
       SAME y-span is what makes two line segments parallel — so from 12%
       to 88% (most of the notch's actual length) the two edges run
       genuinely parallel, a uniform 4px apart, rather than the single
       depth value (10px vs 14px) a first pass used for BOTH edges' entire
       span, sharing actual (0,0)/(0,100%) corner points: that version's
       "border" was a wedge that pinched to nothing at the corners and
       only reached its full 4px right at the tip — reported back as "far
       too short" and "not the same angle," both just different symptoms
       of the same wedge-not-a-parallel-stroke shape. A second pass then
       tapered the two SHORT corner runs (0%-12%/88%-100%) down to 0 same
       as the original, to avoid clip-path points at y<0%/y>100% (outside
       the box, which is its own rendering problem here) — "you don't
       need to taper it off at the end, you can just have it go straight"
       was the fix: keep those runs at a flat 3px/7px instead of ramping
       to 0, i.e. the tab's own top-left/bottom-left corners sit at x:3px/
       x:7px rather than the sharp x:0 every other shape's corner uses.
       Any hairline gap that leaves at the very top/bottom (this tab's
       true corner vs. its neighbor's) reads as nothing in practice — the
       column's own tabs overlap by design (negative margin-top). */
  .sidetabspeek .tab[data-shape="invertedv"]{
    clip-path: polygon(3px 0, 100% 0, 100% 100%, 3px 100%, 3px 88%, 10px 50%, 3px 12%);
    background: var(--tabband, var(--tabhex, var(--primary)));
  }
  .sidetabspeek .tab[data-shape="invertedv"]::before{
    content:''; position:absolute; inset:0;
    clip-path: polygon(7px 0, 100% 0, 100% 100%, 7px 100%, 7px 88%, 14px 50%, 7px 12%);
    background: var(--sidetab-fill, var(--tabhex, var(--primary))); pointer-events:none;
  }
  .sidetabspeek .tab[data-shape="invertedv"] > *{
    position:relative; z-index:1;
  }
  /* arrows: same two-layer idea as invertedv above, mirrored for a
     protruding point instead of a notch. The role of "which layer is the
     true outer boundary" flips for a convex shape: a parent's clip-path
     bounds what its own ::before can show, so whichever layer reaches
     FURTHER OUT is the one that has to be the parent (a shallower child
     can never poke past a shallower parent to reach the true tip).
     - .tab ("band") is the DEEPER/further-out point — corners pulled out
       to 14px (6px past the shape's own 20px baseline) and the tip at the
       full 0px (unchanged from before, so the arrow pokes out exactly as
       far as it always did). This is the true visible silhouette.
     - ::before ("fill") sits on top, corners at the plain 20px baseline
       (flush, same as every other shape's un-shaped corner) and its own
       tip at 6px — 6px short of .tab's own tip everywhere.
     Both layers use the same 3-point-per-half shape (corner, tip, corner)
     with a CONSTANT 6px difference at both the corner point AND the tip
     point (bumped up from an initial 4px, "a little thicker") — that's
     sufficient on its own for two straight segments to be genuinely
     parallel (identical direction vector), no extra flat-run breakpoints
     needed the way invertedv's notch used — so the border reads as one
     uniform stroke from corner to corner, full width immediately, no
     taper in from either end. */
  .sidetabspeek .tab[data-shape="arrows"]{
    clip-path: polygon(14px 0, 100% 0, 100% 100%, 14px 100%, 0px 50%);
    background: var(--tabband, var(--tabhex, var(--primary)));
  }
  .sidetabspeek .tab[data-shape="arrows"]::before{
    content:''; position:absolute; inset:0;
    clip-path: polygon(20px 0, 100% 0, 100% 100%, 20px 100%, 6px 50%);
    background: var(--sidetab-fill, var(--tabhex, var(--primary))); pointer-events:none;
  }
  .sidetabspeek .tab[data-shape="arrows"] > *{
    position:relative; z-index:1;
  }
  .sidetabspeek .tab[data-shape="sawtooth"]{
    clip-path: polygon(7px 0, 100% 0, 100% 100%, 7px 100%, 0px 87.5%, 7px 75%, 0px 62.5%, 7px 50%, 0px 37.5%, 7px 25%, 0px 12.5%, 7px 0);
    background: linear-gradient(to right, var(--tabband, var(--tabhex, var(--primary))) 0 7px, var(--sidetab-fill, var(--tabhex, var(--primary))) 7px 100%);
  }
  .sidetabspeek .tab[data-shape="jagged"]{
    clip-path: polygon(13px 0, 100% 0, 100% 100%, 13px 100%, 10px 91%, 2px 82%, 11px 74%, 4px 63%, 9px 55%, 0px 46%, 10px 38%, 5px 27%, 11px 18%, 3px 9%, 13px 0);
    background: linear-gradient(to right, var(--tabband, var(--tabhex, var(--primary))) 0 13px, var(--sidetab-fill, var(--tabhex, var(--primary))) 13px 100%);
  }
  /* pagetab: a real rotated square on ::before instead of a clip-path dart
     — an earlier clip-path attempt at this (twice) read as "ridiculous"/
     "so weird," and a thin dart is a poor match for what "like the Page
     Tabs" actually meant anyway (see .pagetag/.pagetagtip in <style>,
     which is itself a rotated square behind a rounded label, not a
     clip-path shape at all). The tab itself stays a plain flat rectangle
     (background: --sidetab-fill, no gradient split) and the diamond alone
     carries the accent color, sized/positioned to echo .pagetagtip's own
     16px/45deg — a transform-based shape has none of the "point outside
     the box" problem clip-path has here, so this sidesteps that
     limitation entirely rather than working around it. */
  .sidetabspeek .tab[data-shape="pagetab"]{
    clip-path:none; background: var(--sidetab-fill, var(--tabhex, var(--primary)));
  }
  .sidetabspeek .tab[data-shape="pagetab"]::before{
    content:''; position:absolute; left:-7px; top:50%; width:16px; height:16px;
    transform: translateY(-50%) rotate(45deg); border-radius:3px;
    background: var(--tabband, var(--tabhex, var(--primary))); pointer-events:none;
  }
  /* "a neat straight shape with a diamond bump in the middle" — a plain
     vertical line the same color as the diamond, running the tab's full
     height, centered on the diamond itself (left:-7px + half its 16px
     width = 1px, matching this strip's own center: left:0 + half its 2px
     width). ::after rather than a second ::before, since ::before is
     already the diamond. */
  .sidetabspeek .tab[data-shape="pagetab"]::after{
    content:''; position:absolute; left:0px; top:0; bottom:0; width:2px;
    background: var(--tabband, var(--tabhex, var(--primary))); pointer-events:none;
  }

  /* indextabs: pure restyle of the existing horizontal row — no wrap/
     click behavior changes. Each tab's own category color (--tabhex, set
     inline by renderTabs() in 06-tabs-render.js) becomes a top accent
     border instead of only showing up in the small dot glyph, and a
     3-step stagger + stronger shadow sells "protruding book-index tab"
     instead of "flat pill". 'all'/'daily' have no category color, so
     they fall back to var(--primary). */
  body:not(.mobileui-active)[data-tabbar-desktop="indextabs"] .tab{
    border-radius:7px 7px 0 0; border-top:3px solid var(--tabhex, var(--primary));
    box-shadow:0 2px 5px rgba(0,0,0,0.25);
  }
  body:not(.mobileui-active)[data-tabbar-desktop="indextabs"] .tab:nth-child(3n+2){ margin-top:4px; }
  body:not(.mobileui-active)[data-tabbar-desktop="indextabs"] .tab:nth-child(3n+3){ margin-top:8px; }

  /* overlap: a more extreme take on indextabs — tabs try to stay on one
     line (flex-wrap:nowrap, a negative margin so each one overlaps the
     previous rather than wrapping to a 2nd row once they don't all fit)
     rather than the plain translucent shelf every other tabBarDesktopStyle
     keeps: fully colored in the category's own hex (--tabhex, set inline
     by renderTabs() in 06-tabs-render.js) with a darker edge accent
     (--tabedge) along the *top*, so each reads as a solid book-index tab
     rather than a pill on a shelf. The translucent .tabs shelf background/
     border is explicitly cleared here (background/border:none) — it read
     as a dirty smear behind fully-opaque colored tabs instead of the
     "continuous surface" it's meant to suggest elsewhere, so this mode
     goes bare instead: just the tabs themselves sitting on the desk.

     Every tab is taller than its visible label needs — TAB_TAIL_PX
     (26px) of that height is a plain colored "tail" below the label,
     which .tabs' own matching negative margin-bottom tucks behind
     #appCard (z-index:1 there beats every *resting* tab's negative
     z-index below, see --tabidx). That's what makes a resting tab read
     as nestled behind the current page rather than a chip floating in
     open space above it: the tail is always there, just hidden behind
     the page except for whatever isn't covered. align-items:flex-start
     on .tabs (overriding its default stretch) is required for this — an
     .active tab's shorter tail (see below) would otherwise get stretched
     to match its taller siblings, and a stray floating rectangle would
     show up beneath a hovered tab's own lifted position. */
  body:not(.mobileui-active)[data-tabbar-desktop="overlap"] .tabs{
    background:none; border:none; flex-wrap:nowrap; gap:0; padding:8px 8px 0;
    align-items:flex-start; margin-bottom:-26px;
  }
  /* margin-left is set inline per-tab by layoutOverlapTabs() (see
     solveGapOverlaps() in 06-tabs-render.js) — each GAP gets its own
     overlap capped by that pair's own widths, not one shared value, so
     scrunching a wide tab further never starves a narrow neighbor
     elsewhere in the row; -16px here is only the pre-JS fallback. --tab-dx/
     --tab-jitter/--tab-connect/--tab-angle are covered below. white-
     space:nowrap is the default the same JS tries hard to keep every
     label on — see .two-line below for the fallback when it can't. */
  body:not(.mobileui-active)[data-tabbar-desktop="overlap"] .tab{
    position:relative; margin-left: -16px;
    z-index:calc(var(--tabidx, 1) - 100);
    background: var(--tabhex, var(--primary)); color: var(--tabtext, white);
    border-radius:8px 8px 0 0; align-items:flex-start;
    padding:9px var(--tab-hpad, 14px) 37px; white-space:nowrap;
    border-top:3px solid var(--tabedge, color-mix(in srgb, var(--primary) 70%, black));
    box-shadow:0 -1px 5px rgba(0,0,0,0.3);
    /* margin-left is deliberately NOT transitioned (it once was, for a
       smooth scrunch-in animation) — layoutOverlapTabs() in
       06-tabs-render.js sets it via JS and then, in the very same
       synchronous call, reads offsetLeft/offsetWidth back off these same
       elements (for overlapNaturalRects, the active tab's #tabConnector
       clone position, computeOverlapPush()'s math, all of it). A
       transitioned property doesn't take its new computed value until the
       next paint — read synchronously right after the change, it's still
       reporting the OLD margin — so every one of those measurements was
       silently stale, occasionally by a lot: reported as tabs "shooting
       out to a fixed position completely in the wrong spot" after a
       click. Letting margin-left apply instantly avoids the whole class
       of bug; only transform/box-shadow (paint-only, never read back
       synchronously — see the .tab.active --tab-connect comment for how
       that one avoids the same trap) still animate. */
    transition: transform .16s ease, box-shadow .18s ease;
    /* Resting position: a small stable per-tab jitter (hashStr()'d off the
       tab's own id, see tabJitterPx()) so a row of same-height pills reads
       a little more like a hand-fanned stack of index cards; --tab-stagger
       (0 unless overlapRankStagger is on) adds a further-back tab's own
       rank-based lift on top, so a covered tab's label has a better shot
       at peeking above whatever's covering it (see renderTabs() in
       06-tabs-render.js); plus whatever horizontal push computeOverlapPush()
       has assigned it (0 unless overlapHoverMode is "push" and this tab
       has a hovered/selected neighbor). */
    transform: translate(var(--tab-dx, 0px), calc(var(--tab-jitter, 0px) + var(--tab-stagger, 0px)));
  }
  body:not(.mobileui-active)[data-tabbar-desktop="overlap"] .tab:first-child{ margin-left:0; }
  body:not(.mobileui-active)[data-tabbar-desktop="overlap"] .tab .count{ color:inherit; opacity:0.8; }
  /* A label layoutOverlapTabs() couldn't keep on one line even at the
     smallest readable font-size gets pushed a little higher than its
     jittered neighbors — "keep it higher, don't move every other tab up
     to match" per the project owner's ask — rather than letting its own
     extra height read as a mismatched row baseline. Resting only:
     .active's own transform rule below always wins regardless of line
     count (see OVERLAP_CONNECT_MIN/MAX in 06-tabs-render.js for how). */
  body:not(.mobileui-active)[data-tabbar-desktop="overlap"] .tab.two-line{
    transform: translate(var(--tab-dx, 0px), calc(var(--tab-jitter, 0px) + var(--tab-stagger, 0px) - 6px));
  }
  /* !important on transform here is load-bearing, not decorative — it
     needs to outrank the inline --tabidx-driven stacking order above (an
     inline style otherwise beats a plain class rule regardless of source
     order). Split in two because the two overlapHoverMode variants (see
     devSettingsFieldsHtml() in 01-categories-theme.js and applyDevSettings()
     for the body[data-overlap-hover-mode] attribute) disagree about
     z-index specifically: the *default* variant wants hovering to reorder
     to the very front (z-index:999), the whole point of that look. */
  body:not(.mobileui-active)[data-tabbar-desktop="overlap"]:not([data-overlap-hover-mode="push"]) .tab:hover{
    transform: translate(var(--tab-dx, 0px), -8px) !important;
    z-index:999 !important;
    box-shadow:0 5px 16px rgba(0,0,0,0.4);
  }
  /* overlapHoverMode's 'push' variant explicitly wants a FIXED stacking
     order (tabImportanceRank()) that never reorders — reveal comes from
     computeOverlapPush() physically moving the covering neighbor away
     instead. z-index:999 here was a real bug, not a harmless leftover: it
     let a hovered tab leap above tabs it doesn't normally beat, which
     could hide a *third*, unrelated tab sandwiched behind it that was
     visible a moment earlier — reported as "the small tag gets lost, you
     have to completely unhover the adjacent tags to reach it." Keeping
     --tabidx's own z-index (no override at all here) fixes that outright:
     once its covering neighbor has moved out of the way, the hovered tab
     doesn't need to win a stacking fight it was never meant to be in. */
  body:not(.mobileui-active)[data-tabbar-desktop="overlap"][data-overlap-hover-mode="push"] .tab:hover{
    transform: translate(var(--tab-dx, 0px), -8px) !important;
    box-shadow:0 5px 16px rgba(0,0,0,0.4);
  }
  /* .active's own tail is taller than a resting tab's, not shorter — the
     opposite of this look's original "a little overlap, not the same long
     drape a hover gets" idea, which fell apart in practice: a *short* tail
     plus a lift big enough to clear every jittered/two-line neighbor
     (guaranteeing "selected always highest") left a visible gap above
     #appCard on a single-line label. A tall tail plus a firm -20px lift
     comfortably clears every resting tab's own max poke (jitter's ±3px,
     two-line's -6px, and overlapRankStagger's up to -6px — see
     OVERLAP_STAGGER_MAX in 06-tabs-render.js — worst case -15px combined,
     leaving a real margin rather than a hairline one; dialed back from an
     original -28px, which read as jutting up too far) while still leaving
     slack for layoutOverlapTabs()'s --tab-connect to dial in a modest,
     unambiguous overlap (OVERLAP_CONNECT_MIN/MAX, 7-16px — itself dialed
     back from an original 14-30px band that read as dipping distractingly
     far into the card) by measurement rather than guessed font metrics —
     "look like you opened up to the tag," not a flap resting on top of
     it. The padding-bottom (50px -> 58px) exactly offsets the lift
     increase (-12px -> -20px) so the actual overlap depth this produces
     is unchanged — only how much higher the *top* of the tab pokes above
     its resting neighbors changes. box-
     shadow:none is deliberate: with a real overlap there's nothing for a
     drop shadow to float over, and keeping one just re-introduces a
     "hovering" look by another route. Background/text color stay the
     tab's own category color (--tabhex/--tabtext) rather than switching
     to --card-bg — selecting a tab shouldn't bleach it; the deep connect
     overlap plus the clone sitting on top of #appCard already carries
     "this one's open" on its own, and keeping the color is one less
     change happening at once. The white gradient reads as a sheen on
     that color instead of a page-tint, which works just as well.
     rotate(var(--tab-angle)) (a small stable per-category tilt, see
     tabAngleDeg() in 06-tabs-render.js — same hashStr() idiom as --tab-
     jitter, not truly random, so it doesn't reshuffle mid-session) plus
     transform-origin:bottom center is what gives the connecting edge its
     "flat but at a bit of an angle" read: rotating around the bottom
     center keeps that edge anchored in place while the top leans a
     couple degrees either way, so one bottom corner sits fractionally
     deeper into the page than the other — a crooked dog-ear, not a
     perfectly square chip — without needing to actually carve a slanted
     bottom edge via clip-path. */
  /* The :hover variant here is deliberate, not a duplicate: hovering the
     already-selected tab used to snap it to the plain :hover treatment
     (-8px, no tilt, no deep connect) instead of leaving it alone — jarring
     ("way up high to way down low"), and pointless besides, since there's
     no separate action to take by hovering a tab you're already on. Per-
     rule specificity is why plain !important on .tab.active alone didn't
     already win that fight: push mode's own :hover rule above carries an
     extra [data-overlap-hover-mode="push"] attribute selector, making it
