function normalizeState(){
  if(!Array.isArray(state.days)) state.days = [];
  // Accounts saved before tabs became editable won't have a categories
  // array yet — seed it with the same set they've always seen so nothing
  // about their existing tasks' categories changes. Same idea for
  // locations, added alongside per-tab location editing, and theme,
  // added alongside custom colors/texture.
  if(!Array.isArray(state.categories) || !state.categories.length) state.categories = defaultCategories();
  // Accounts saved before category types existed only ever had the
  // 'standard' behavior, so that's the correct backfill.
  state.categories.forEach(c => { if(!c.type) c.type = 'standard'; });
  if(!Array.isArray(state.locations) || !state.locations.length) state.locations = defaultLocations();
  if(typeof state.locationEnabled !== 'boolean') state.locationEnabled = true;
  if(!state.theme) state.theme = defaultTheme();
  // Migrate the short-lived single-choice `texture: 'flat'|'grain'|'pages'`
  // shape (texture used to be exclusive) to the current independent
  // grain/pages booleans (now layerable).
  if(state.theme.texture !== undefined){
    state.theme.grain = state.theme.texture === 'grain';
    state.theme.pages = state.theme.texture === 'pages';
    delete state.theme.texture;
  }
  if(typeof state.theme.gradient !== 'boolean') state.theme.gradient = false;
  if(typeof state.theme.grain !== 'boolean') state.theme.grain = false;
  if(typeof state.theme.pages !== 'boolean') state.theme.pages = false;
  if(typeof state.theme.leather !== 'boolean') state.theme.leather = false;
  if(typeof state.theme.uiPreset !== 'string' || !UI_COLOR_PRESETS.some(p=>p.id===state.theme.uiPreset)) state.theme.uiPreset = 'classic';
  if(typeof state.advancedTaskFields !== 'boolean') state.advancedTaskFields = true;
  if(!state.devSettings) state.devSettings = defaultDevSettings();
  if(typeof state.devSettings.tagSeam !== 'boolean') state.devSettings.tagSeam = false;
  if(typeof state.devSettings.tagOutline !== 'boolean') state.devSettings.tagOutline = false;
  if(typeof state.devSettings.pendingTagStyle !== 'string') state.devSettings.pendingTagStyle = 'default';
  if(typeof state.devSettings.pendingTagColor !== 'string') state.devSettings.pendingTagColor = 'theme';
  if(typeof state.devSettings.showListDates !== 'boolean') state.devSettings.showListDates = false;
  if(typeof state.devSettings.dayTreeCatBubble !== 'boolean') state.devSettings.dayTreeCatBubble = false;
  if(typeof state.devSettings.sidePanelEnabled !== 'boolean') state.devSettings.sidePanelEnabled = false;
  state.tasks.forEach(t=>{
    if(t.subtasks===undefined) t.subtasks = [];
    // plannedDate (one day, exclusive) migrated to plannedDates (an array)
    // so a task can sit on more than one day's list at once — see the
    // note on planTaskForDay() for why exclusivity was actually a bug.
    if(t.plannedDates===undefined) t.plannedDates = t.plannedDate ? [t.plannedDate] : [];
    delete t.plannedDate;
    // Steps didn't used to carry their own dates — dueDate (typed/parsed,
    // informational) and plannedDates (which days' lists this step is on,
    // independent of the parent task's own plannedDates) both default to
    // "unset" for every pre-existing step.
    (t.subtasks||[]).forEach(s=>{
      if(s.dueDate===undefined) s.dueDate = '';
      if(s.plannedDates===undefined) s.plannedDates = s.plannedDate ? [s.plannedDate] : [];
      delete s.plannedDate;
    });
    // Bookkeeping (createdAt already existed) plus the optional advanced
    // fields — timeframe/priority default to "unset" rather than any
    // particular value, and completedAt is only ever set by toggleStatus().
    if(t.timeframe===undefined) t.timeframe = '';
    if(t.priority===undefined) t.priority = 0;
    if(t.completedAt===undefined) t.completedAt = '';
  });
  rebuildCategoriesIndex();
}

async function loadState(){
  // Retry once before giving up — a single failed request (e.g. a network
  // blip) should never be mistaken for "no saved data" and wipe the ledger.
  for(let attempt=0; attempt<2; attempt++){
    try{
      const res = await storage.get('tracker-state', false);
      if(res && res.value){ state = JSON.parse(res.value); normalizeState(); return; }
      break; // request succeeded and genuinely found nothing saved yet
    }catch(e){
      if(attempt===0){ await new Promise(r=>setTimeout(r,500)); continue; }
      console.error('Could not load saved ledger after retry, starting fresh locally', e);
    }
  }
  // Use the default in memory, but do NOT write it to storage here — only
  // save once you actually interact, so a load failure can never overwrite
  // real saved data with a blank slate.
  state = defaultState();
  normalizeState();
}

// ---------- Cross-device refresh ----------
// There's no realtime subscription and no per-field merge here — storage
// is "replace the whole blob," for saves and for this alike. So this only
// ever pulls in a server copy when there's nothing local it could
// clobber: no unsaved edit in flight, and no field actively focused
// (replacing state re-renders the whole task list via innerHTML, which
// would yank an in-progress, not-yet-blurred keystroke out from under
// someone mid-edit). It's deliberately a simple last-write-wins model,
// same as saving already is — not real conflict resolution. If two
// devices edit within the same window before either refreshes, whichever
// saves last wins, same as it always has.
//
// Bandwidth: most ticks cost a few bytes, not the whole state blob — see
// checkServerUpdatedAt() below. Interval is 3 minutes rather than
// something tighter, since the visibility-change listener already covers
// "I just switched back to this tab" immediately regardless of how long
// the base interval is; 3 minutes just bounds how stale a *backgrounded*
// tab can silently get.
const REFRESH_INTERVAL_MS = 180000;
let refreshTimer = null;
let refreshInFlight = false;
let appEntered = false; // guards the visibilitychange listener from firing before/after a real login

// Asks for just the updated_at column (a handful of bytes) instead of the
// full data blob, so a poll that finds nothing new — the overwhelmingly
// common case — costs almost nothing. Only the Supabase path has a
// server-side updated_at to compare against; callers already gate out
// window.storage/localOnlyMode before reaching here.
async function checkServerUpdatedAt(){
  const s = await ensureFreshSession();
  if(!s){ forceReauth(); throw new Error('session expired'); }
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/ledger_state?user_id=eq.${s.user_id}&select=updated_at`,
    { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${s.access_token}` } }
  );
  if(!res.ok) throw new Error('supabase updated_at check failed: ' + res.status);
  const rows = await res.json();
  return rows.length ? rows[0].updated_at : null;
}

async function refreshFromServer(manual){
  if(!appEntered || localOnlyMode || window.storage) return; // nothing external to pull from
  if(unsavedChanges || refreshInFlight) return; // don't clobber an in-flight local edit
  if(!manual && document.hidden) return; // only poll while the tab is actually visible
  const active = document.activeElement;
  if(active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName)) return; // don't interrupt an in-progress edit
  refreshInFlight = true;
  const btn = document.getElementById('refreshBtn');
  if(btn) btn.disabled = true;
  try{
    const serverUpdatedAt = await checkServerUpdatedAt();
    if(serverUpdatedAt !== null && serverUpdatedAt === lastKnownUpdatedAt){
      if(manual) showUndoStatus('Already up to date');
      return;
    }
    // Either something changed, or there's nothing to compare against yet
    // (e.g. no row saved so far) — worth the full fetch either way.
    // storage.get() also refreshes lastKnownUpdatedAt as a side effect.
    const res = await storage.get('tracker-state', false);
    if(res && res.value){
      const incoming = res.value;
      if(incoming !== JSON.stringify(state)){
        state = JSON.parse(incoming);
        normalizeState();
        afterStateRestore();
        render();
        showUndoStatus('Refreshed with new changes');
      } else if(manual){
        showUndoStatus('Already up to date');
      }
    }
  }catch(e){
    console.error('Background refresh failed', e);
  }finally{
    refreshInFlight = false;
    if(btn) btn.disabled = false;
  }
}

function startAutoRefresh(){
  stopAutoRefresh();
  if(!localOnlyMode && !window.storage) refreshTimer = setInterval(() => refreshFromServer(false), REFRESH_INTERVAL_MS);
}
function stopAutoRefresh(){
  if(refreshTimer){ clearInterval(refreshTimer); refreshTimer = null; }
}
// Catches "I switched back to this tab" immediately rather than waiting
// for the next interval tick — appEntered/other guards inside
// refreshFromServer() make this a safe no-op before login or on the auth
// screen.
document.addEventListener('visibilitychange', () => {
  if(!document.hidden) refreshFromServer(false);
});

// Resolves after `ms`, or immediately if the browser reports connectivity
// coming back first — so a save that's mid-backoff after a network blip
// doesn't sit out the rest of a long delay once the connection is actually
// usable again.
function delayOrOnline(ms){
  return new Promise(resolve => {
    const timer = setTimeout(finish, ms);
    function finish(){
      clearTimeout(timer);
      window.removeEventListener('online', finish);
      resolve();
    }
    window.addEventListener('online', finish);
  });
}

// Capped exponential backoff — retries get less frequent but never stop
// entirely while offline, since giving up after N tries would mean the
// edit just silently never reaches Supabase.
const SAVE_RETRY_DELAYS_MS = [1000, 2000, 5000, 10000, 20000, 30000];

let unsavedChanges = false;

// Retries a failed save with backoff instead of dropping the edit after
// one attempt — a single network blip used to mean the change only ever
// existed in memory, with nothing but a small, easy-to-miss status line
// as a warning. This keeps trying (and the caller, via queueSave/saveChain,
// keeps later edits queued behind it) until it either succeeds or the
// session itself is gone. A dead session is the one case worth giving up
// on immediately: storage.set() has already called forceReauth() and sent
// the user back to login by the time that error reaches here, retrying
// against it can't succeed, and the pending edit will be superseded by
// loadState() pulling fresh data on the next login anyway.
async function saveState(){
  const statusEl = document.getElementById('saveStatus');
  let attempt = 0;
  while(true){
    if(statusEl) statusEl.textContent = attempt ? `Saving… (retry ${attempt})` : 'Saving…';
    try{
      await storage.set('tracker-state', JSON.stringify(state), false);
      unsavedChanges = false;
      if(statusEl){
        statusEl.textContent = 'Saved';
        setTimeout(()=>{ if(statusEl.textContent==='Saved') statusEl.textContent=''; }, 1500);
      }
      return;
    }catch(e){
      console.error('Storage save failed', e);
      if(e.message === 'session expired'){
        if(statusEl) statusEl.textContent = 'Signed out — sign back in to keep syncing';
        return;
      }
      const delay = SAVE_RETRY_DELAYS_MS[Math.min(attempt, SAVE_RETRY_DELAYS_MS.length - 1)];
      if(statusEl) statusEl.textContent = `Save failed — retrying in ${Math.round(delay/1000)}s`;
      await delayOrOnline(delay);
      attempt++;
    }
  }
}

// Mutations render immediately against in-memory state and queue the actual
// network save behind whatever's still in flight, rather than making the
// tap wait on a Supabase round-trip to feel responsive. Chaining onto
// saveChain (instead of firing saveState() directly) keeps saves in the
// order they were made — without it, two rapid edits could race and the
// slower request could land second and overwrite the newer one with stale
// data.
let saveChain = Promise.resolve();
function queueSave(){
  unsavedChanges = true;
  saveChain = saveChain.then(() => saveState());
  return saveChain;
}

// Undo/redo — whole-state snapshots rather than hand-written inverse
// operations per action. This app's entire content is already one JSON
// blob (`state`), so cloning it before each mutation is cheap and, unlike
// per-action-type inverses, can't drift out of sync with a mutation that
// forgets to update it. Every user-facing content change calls
// pushUndo(label) as its first step (before mutating state); pure
// navigation (switching tabs, toggling which location you're viewing,
// opening a day) is deliberately NOT on the undo stack — undo is for
// content you changed, not where you were looking.
let undoStack = [];
let redoStack = [];
const UNDO_LIMIT = 50;

function pushUndo(label){
  undoStack.push({ label, snapshot: JSON.parse(JSON.stringify(state)) });
  if(undoStack.length > UNDO_LIMIT) undoStack.shift();
  redoStack = [];
}

function showUndoStatus(text){
  const el = document.getElementById('undoStatus');
  if(!el) return;
  el.textContent = text;
  clearTimeout(showUndoStatus._t);
  showUndoStatus._t = setTimeout(()=>{ if(el.textContent===text) el.textContent=''; }, 2500);
}

function refreshUndoButtons(){
  const u = document.getElementById('undoBtn');
  const r = document.getElementById('redoBtn');
  if(u) u.disabled = undoStack.length===0;
  if(r) r.disabled = redoStack.length===0;
}

// Runs after restoring a snapshot, since the restored state may no longer
// match transient UI state that isn't itself part of the undo history
// (e.g. you're viewing a day that undo just un-created).
function afterStateRestore(){
  rebuildCategoriesIndex();
  applyTheme();
  applyDevSettings();
  if(!visibleTabs().includes(activeTab)) activeTab = 'all';
  if(selectedDay && !state.days.includes(selectedDay)) selectedDay = null;
  if(selectedListId && !state.tasks.some(t=>t.id===selectedListId)) selectedListId = null;
  pendingDeleteCategoryId = null;
  pendingDeleteLocationId = null;
  openCategoryPickerId = null;
  uiColorPickerOpen = false;
  customColorOpen = false;
  catWheelCancelDrag();
}

function undo(){
  if(undoStack.length===0) return;
  const entry = undoStack.pop();
  redoStack.push({ label: entry.label, snapshot: JSON.parse(JSON.stringify(state)) });
  state = entry.snapshot;
  afterStateRestore();
  render();
  queueSave();
  showUndoStatus('Undid: ' + entry.label);
}

function redo(){
  if(redoStack.length===0) return;
  const entry = redoStack.pop();
  undoStack.push({ label: entry.label, snapshot: JSON.parse(JSON.stringify(state)) });
  state = entry.snapshot;
  afterStateRestore();
  render();
  queueSave();
  showUndoStatus('Redid: ' + entry.label);
}

function isOverdue(t){
  return t.dueDate && t.status !== 'done' && new Date(t.dueDate) < new Date(todayStr());
}

// Used to decide whether a due task is worth surfacing in a day's "pull
// in an existing task" list — due today, already overdue (no lower
// bound: overdue is exactly the case you'd most want to catch up on),
// or due within the next `days`. A task due further out than that isn't
// urgent enough yet to clutter a specific day's plan.
function isDueWithinDays(dueDate, days){
  const diffMs = new Date(dueDate) - new Date(todayStr());
  return diffMs / 86400000 <= days;
}

function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

// Discreet display format for a step's own date — M/D/YY, distinct from
// fmtDate()'s "Sep 1" used everywhere else, per the explicit ask for
// mm/dd/yy-style step dates.
function fmtDateShort(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  const yy = String(dt.getFullYear()).slice(-2);
  return `${dt.getMonth()+1}/${dt.getDate()}/${yy}`;
}

const WEEKDAY_NAMES = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const MONTH_NAMES = ['january','february','march','april','may','june','july','august','september','october','november','december'];

// Rudimentary natural-language date detection for steps — deliberately
// covers only the handful of shorthands actually asked for (today/
// tomorrow, weekday names, M/D[/YY], "Month Day") rather than a general
// date-parsing library. Returns '' rather than guessing when nothing
// matches, so a typo never silently saves the wrong date.
function parseNaturalDate(raw){
  const str = (raw||'').trim().toLowerCase().replace(/\b(\d+)(st|nd|rd|th)\b/,'$1');
  if(!str) return '';
  const today = new Date(todayStr()+'T00:00:00');
  if(str==='today') return todayStr();
  if(str==='tomorrow' || str==='tmrw' || str==='tmr' || str==='tmrrw') return addDaysToDateStr(todayStr(), 1);
  if(str==='yesterday') return addDaysToDateStr(todayStr(), -1);

  for(let i=0;i<WEEKDAY_NAMES.length;i++){
    const name = WEEKDAY_NAMES[i];
    if(str===name || str===name.slice(0,3)){
      let delta = (i - today.getDay() + 7) % 7; // today itself counts as a match
      return addDaysToDateStr(todayStr(), delta);
    }
  }

  let m = str.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
  if(m){
    const month = parseInt(m[1],10), day = parseInt(m[2],10);
    if(month>=1 && month<=12 && day>=1 && day<=31){
      let year;
      if(m[3]){
        year = parseInt(m[3],10);
        if(m[3].length===2) year += 2000;
      } else {
        year = today.getFullYear();
      }
      let iso = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      if(!m[3] && isDueWithinDays(iso, -30)) iso = `${year+1}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      return iso;
    }
  }

  m = str.match(/^([a-z]+)\.?\s+(\d{1,2})(?:,?\s+(\d{4}))?$/);
  if(m){
    // Prefix match (not just the strict 3-letter abbreviation) so common
    // 4-letter forms like "sept" or "jan." also resolve — month names are
    // distinct enough at 3+ characters that this can't collide.
    const monthIdx = MONTH_NAMES.findIndex(name => name===m[1] || (m[1].length>=3 && name.startsWith(m[1])));
    const day = parseInt(m[2],10);
    if(monthIdx>=0 && day>=1 && day<=31){
      const year = m[3] ? parseInt(m[3],10) : today.getFullYear();
      let iso = `${year}-${String(monthIdx+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      if(!m[3] && isDueWithinDays(iso, -30)) iso = `${year+1}-${String(monthIdx+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      return iso;
    }
  }

  return '';
}

function sortTasks(list){
  return list.slice().sort((a,b)=>{
    if((a.status==='done') !== (b.status==='done')) return a.status==='done' ? 1 : -1;
    if(a.urgent !== b.urgent) return a.urgent ? -1 : 1;
    // Priority slots in between the urgent flag and due date — tasks that
    // never set it (the default, 0) tie here and fall through to due date
    // exactly as before, so this is a no-op for anyone not using the field.
    const ap = a.priority||0, bp = b.priority||0;
    if(ap !== bp) return bp - ap;
    const ad = a.dueDate ? new Date(a.dueDate).getTime() : Infinity;
    const bd = b.dueDate ? new Date(b.dueDate).getTime() : Infinity;
    if(ad !== bd) return ad - bd;
    return new Date(b.createdAt) - new Date(a.createdAt);
  });
}

function daysBetween(a, b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }

// ---------- Sort modes ----------
// state.tasks' own array order IS "My Order" — dragging a task in
// 'default' mode splices it to a new spot in that array directly (see
// reorderTask() below), so there's no separate manual-order field to
// store or migrate; the order that's always been there just becomes a
// first-class, always-available view. Every other mode is a single sort
// key layered on top of the same "done sinks to the bottom" rule that
// sortTasks() already enforced, so switching modes never hides anything,
// just re-orders it. Ties fall back to array order since Array#sort is
// spec-guaranteed stable — that's what keeps 'default' mode a pure
// reflection of array order with only the done/open split imposed on it.
let sortMode = 'default';
const SORT_MODE_LABELS = { default:'My Order', mixed:'Mixed', timeframe:'Timeframe', newest:'Newest First', timestamp:'Oldest First', priority:'Priority', category:'Category' };
const TIMEFRAME_ORDER = { urgent:0, today:1, short:2, medium:3, long:4, '':5 };

function setSortMode(val){
  sortMode = val;
  render();
}

function applySortMode(list){
  const doneLast = (a,b) => (a.status==='done') !== (b.status==='done') ? (a.status==='done'?1:-1) : 0;
  switch(sortMode){
    case 'mixed': return sortTasks(list);
    case 'timeframe': return list.slice().sort((a,b)=> doneLast(a,b) || (TIMEFRAME_ORDER[a.timeframe||''] - TIMEFRAME_ORDER[b.timeframe||'']));
    case 'timestamp': return list.slice().sort((a,b)=> doneLast(a,b) || (new Date(a.createdAt) - new Date(b.createdAt)));
    case 'newest': return list.slice().sort((a,b)=> doneLast(a,b) || (new Date(b.createdAt) - new Date(a.createdAt)));
    case 'priority': return list.slice().sort((a,b)=> doneLast(a,b) || ((b.priority||0) - (a.priority||0)));
    case 'category': {
      const order = state.categories.map(c=>c.id);
      return list.slice().sort((a,b)=> doneLast(a,b) || (order.indexOf(a.category) - order.indexOf(b.category)));
    }
    default: return list.slice().sort(doneLast);
  }
}

// `includeCategory` gates the "Category" option — meaningful only where a
// list can mix multiple categories at once (the "All" tab, Daily's day
// detail). Inside a single category tab every visible task already shares
// that one category, so sorting "by category" is a silent no-op — omit
// the option there rather than offer a sort that does nothing.
function sortModeOptionsHtml(includeCategory){
  return Object.entries(SORT_MODE_LABELS)
    .filter(([k])=> includeCategory || k !== 'category')
    .map(([k,label])=>`<option value="${k}" ${sortMode===k?'selected':''}>${label}</option>`).join('');
}

function visibleTabs(){
  return tabOrder().filter(key => key==='all' || key==='daily' || !state.locationEnabled || CATEGORIES[key].locations.includes(state.location));
}

function currentLocation(){
  return state.locations.find(l=>l.id===state.location) || state.locations[0];
}

// Known tabs get a hand-picked line; a custom or renamed tab falls back to
// a stable pick from GENERIC_TAGLINES, keyed off the tab id via hashStr so
// it doesn't change on every render — a real random pick would flicker
// distractingly since this repaints on every render(), not just tab
// switches.
const TAB_TAGLINES = {
  all: 'Every open thread, one place.',
  work: 'Steady work, steady progress.',
  household: 'A well-kept home, one task at a time.',
  personal: "Make time for what's yours.",
  daily: "Today's page, one line at a time."
};
const GENERIC_TAGLINES = [
  'One task at a time.',
  'Small steps, steadily kept.',
  'Clear the page, clear the mind.',
  'Progress worth logging.',
  'Every entry counts.'
];
function hashStr(s){
  let h = 0;
  for(let i=0; i<s.length; i++) h = (h*31 + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function taglineFor(tabId){
  return TAB_TAGLINES[tabId] || GENERIC_TAGLINES[hashStr(tabId) % GENERIC_TAGLINES.length];
}

function renderLocBadge(){
  const badge = document.getElementById('locBadge');
  badge.style.display = state.locationEnabled ? '' : 'none';
  if(state.locationEnabled) badge.textContent = currentLocation().label;
  // The subheader used to list which tabs the current location was
  // hiding — that read as a warning rather than something useful, and
  // didn't apply when locations were off at all. A tagline is useful
  // (or at least pleasant) regardless of the location feature's state.
  document.getElementById('statusLine').textContent = taglineFor(activeTab);
}

// A checklist tab's count is pending *items* across all its lists, not a
// count of not-done lists — "how much is still left to get" is the more
// useful number for that kind of tab. "All" excludes checklist-owned
// tasks entirely, matching what renderList() actually shows there.
function tabOpenCount(key){
  // A calendar tab has no tasks of its own to count (see
  // isCalendarCategory()'s comment) — today's own open count is the most
  // relevant single number to show on its tab, same reasoning as 'daily'
  // itself, and the two intentionally share this branch rather than each
  // recomputing it.
  if(key==='daily' || isCalendarCategory(key)){
    const s = dayItemsSummary(todayStr());
    return s.total - s.done;
  }
  if(key==='all'){
    return state.tasks.filter(t=>{
      if(t.status==='done') return false;
      const cat = CATEGORIES[t.category];
      return !cat || cat.type !== 'checklist';
    }).length;
  }
  if(isChecklistCategory(key)){
    return state.tasks.filter(t=>t.category===key).reduce((sum,t)=>sum+(t.subtasks||[]).filter(s=>!s.done).length, 0);
  }
  return state.tasks.filter(t => t.category===key && t.status!=='done').length;
}

function renderTabs(){
  const wrap = document.getElementById('tabs');
  wrap.innerHTML = visibleTabs().map(key=>{
    const openCount = tabOpenCount(key);
    const dot = (key==='all'||key==='daily') ? '' : categoryDotHtml(CATEGORIES[key], 'dot');
    const label = key==='all' ? 'All' : key==='daily' ? 'Daily' : CATEGORIES[key].label;
    return `<button class="tab ${activeTab===key?'active':''}" onclick="switchTab('${key}')">${dot}${label} <span class="count">${openCount}</span></button>`;
  }).join('');
  renderTabRowLines();
}

// Row membership depends on how the tab labels happen to wrap at the
// current container width, which CSS alone has no hook for (no ::row
// selector) — so this measures each tab's actual offsetTop after layout,
// groups tabs sharing a top into a row, and draws a .tabrow-line under
// every row but the last (which already rests directly on the card).
function renderTabRowLines(){
  const wrap = document.getElementById('tabs');
  wrap.querySelectorAll('.tabrow-line').forEach(el=>el.remove());
  const tabs = Array.from(wrap.querySelectorAll('.tab'));
  if(!tabs.length) return;
  const rows = [];
  tabs.forEach(t=>{
    const top = t.offsetTop;
    let row = rows.find(r=>Math.abs(r.top-top)<2);
    if(!row){ row = { top, bottom:0 }; rows.push(row); }
    row.bottom = Math.max(row.bottom, t.offsetTop + t.offsetHeight);
  });
  if(rows.length < 2) return;
  rows.sort((a,b)=>a.top-b.top);
  rows.slice(0,-1).forEach(row=>{
    const line = document.createElement('div');
    line.className = 'tabrow-line';
    line.style.top = (row.bottom + 3) + 'px';
    wrap.appendChild(line);
  });
}

function renderQuickCategory(){
  const sel = document.getElementById('quickCategory');
  if(activeTab !== 'all'){
    sel.style.display = 'none';
    sel.value = activeTab;
  } else {
    sel.style.display = '';
    sel.innerHTML = standardCategoryEntries().map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');
  }
  document.getElementById('quickInput').placeholder =
    activeTab==='household' ? 'Log a household task…' :
    activeTab==='work' ? 'Add a work task…' :
    activeTab==='personal' ? 'Add a personal to-do…' : 'What needs doing?';
  document.getElementById('quickTimeframe').style.display = state.advancedTaskFields ? '' : 'none';
  document.getElementById('quickPriority').style.display = state.advancedTaskFields ? '' : 'none';
}

function subProgressHtml(subs){
  if(!subs.length) return '';
  const done = subs.filter(s=>s.done).length;
  const total = subs.length;
  if(total <= 6){
    const pips = subs.map(s=>`<span class="subpip ${s.done?'filled':''}"></span>`).join('');
    return `<div class="substack" title="${done}/${total} steps done">${pips}</div>`;
  }
  const pct = Math.round(done/total*100);
  return `<div class="substack bar" title="${done}/${total} steps done"><div class="subfill" style="width:${pct}%"></div></div>`;
}

// ---------- Drag reordering ----------
// Main tasks: only draggable in 'default' sort mode (taskRowHtml only
// renders the handle/attributes there in the first place), reordering
// state.tasks directly — the same array applySortMode()'s 'default' case
// reads as-is. Subtasks: always draggable regardless of the main list's
// sort mode, since a task's steps have never had a sort mode of their own
// to lock against — array order is the only order they've ever had.
let draggedTaskId = null;
let draggedSubtask = null; // { taskId, subId }

function taskDragStart(e, id){
  draggedTaskId = id;
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.closest('li.task').classList.add('dragging');
}

function taskDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('li.task.dragover, .dropend.dragover').forEach(el=>el.classList.remove('dragover'));
  e.currentTarget.classList.add('dragover');
}

function taskDrop(e, targetId){
  e.preventDefault();
  e.currentTarget.classList.remove('dragover');
  if(draggedTaskId && draggedTaskId !== targetId){
    const rect = e.currentTarget.getBoundingClientRect();
    reorderTask(draggedTaskId, targetId, (e.clientY - rect.top) < rect.height/2);
  }
  draggedTaskId = null;
}

function taskDragEnd(){
  document.querySelectorAll('li.task.dragging, li.task.dragover, .dropend.dragover').forEach(el=>el.classList.remove('dragging','dragover'));
  draggedTaskId = null;
}

// A dedicated trailing target, appended after the last row whenever the
// list is in 'default' sort mode — rather than requiring a drop to land
// in exactly the bottom half of the last row's own (fairly short) bounds
// to reach "the end," this gives that same outcome a large, unambiguous
// target immediately below the list.
function taskDropEnd(e, lastId){
  e.preventDefault();
  e.currentTarget.classList.remove('dragover');
  if(draggedTaskId) reorderTask(draggedTaskId, lastId, false);
  draggedTaskId = null;
}

function dropEndHtml(visible){
  if(sortMode !== 'default' || !visible.length) return '';
  const lastId = visible[visible.length-1].id;
  return `<li class="dropend" ondragover="taskDragOver(event)" ondrop="taskDropEnd(event,'${lastId}')"></li>`;
}

function reorderTask(draggedId, targetId, before){
  // Reached via taskDropEnd() when the dragged task is already the last
  // row: draggedId===targetId here, which would otherwise splice the
  // dragged item out, then fail to re-find "itself" as the target and
  // fall back to index 0 — silently yanking it to the front instead of
  // leaving it exactly where it already was.
  if(draggedId === targetId) return;
  const fromIdx = state.tasks.findIndex(t=>t.id===draggedId);
  const targetExists = state.tasks.some(t=>t.id===targetId);
  if(fromIdx===-1 || !targetExists) return;
  const item = state.tasks[fromIdx];
  pushUndo(`Reordered "${item.title}"`);
  state.tasks.splice(fromIdx, 1);
  let toIdx = state.tasks.findIndex(t=>t.id===targetId);
  if(!before) toIdx += 1;
  state.tasks.splice(toIdx, 0, item);
  // render() replaces the dragged <li> with a brand-new DOM node via
  // innerHTML — doing that synchronously inside the drop handler yanks
  // the element the browser's native drag session is still tracking out
  // from under it, before dragend has even fired on it. That corrupts the
  // browser's own drag-state bookkeeping and is what made *later* drags
  // in the same session increasingly unreliable. Deferring to the next
  // tick lets the drag session finish (dragend included) before the DOM
  // underneath it changes. queueSave() doesn't touch the DOM, so it can
  // fire right away against the already-mutated state.
  setTimeout(render, 0);
  queueSave();
}

function subDragStart(e, taskId, subId){
  draggedSubtask = { taskId, subId };
  e.dataTransfer.effectAllowed = 'move';
  e.stopPropagation();
  e.currentTarget.closest('.subrow').classList.add('dragging');
}

function subDragOver(e){
  e.preventDefault();
  e.stopPropagation();
  document.querySelectorAll('.subrow.dragover, .subdropend.dragover').forEach(el=>el.classList.remove('dragover'));
  e.currentTarget.classList.add('dragover');
}

function subDrop(e, taskId, subId){
  e.preventDefault();
  e.stopPropagation();
  e.currentTarget.classList.remove('dragover');
  // Reordering only within the same task's own steps — dragging a step
  // onto a different task is silently ignored rather than moving it
  // there, since that's a distinct feature nobody asked for here.
  if(draggedSubtask && draggedSubtask.taskId===taskId && draggedSubtask.subId!==subId){
    const rect = e.currentTarget.getBoundingClientRect();
    reorderSubtask(taskId, draggedSubtask.subId, subId, (e.clientY - rect.top) < rect.height/2);
  }
  draggedSubtask = null;
}

function subDragEnd(){
  document.querySelectorAll('.subrow.dragging, .subrow.dragover, .subdropend.dragover').forEach(el=>el.classList.remove('dragging','dragover'));
  draggedSubtask = null;
}

// Same reasoning as dropEndHtml() above, one level down: a dedicated
// trailing target below a task's own steps (or a checklist's own items),
// so dropping at "the very end" doesn't depend on landing in exactly the
// bottom half of the last (fairly short) .subrow's bounds.
function subDropEnd(e, taskId, lastSubId){
  e.preventDefault();
  e.stopPropagation();
  e.currentTarget.classList.remove('dragover');
  if(draggedSubtask && draggedSubtask.taskId===taskId) reorderSubtask(taskId, draggedSubtask.subId, lastSubId, false);
  draggedSubtask = null;
}

function subDropEndHtml(taskId, subs){
  if(!subs.length) return '';
  const lastId = subs[subs.length-1].id;
  return `<div class="subdropend" ondragover="subDragOver(event)" ondrop="subDropEnd(event,'${taskId}','${lastId}')"></div>`;
}

function reorderSubtask(taskId, draggedSubId, targetSubId, before){
  // Same reasoning as reorderTask()'s identical guard — reached via
  // subDropEnd() when the dragged step is already the last one.
  if(draggedSubId === targetSubId) return;
  const t = state.tasks.find(t=>t.id===taskId);
  if(!t) return;
  const fromIdx = t.subtasks.findIndex(s=>s.id===draggedSubId);
  const targetExists = t.subtasks.some(s=>s.id===targetSubId);
  if(fromIdx===-1 || !targetExists) return;
  const item = t.subtasks[fromIdx];
  pushUndo(`Reordered a step in "${t.title}"`);
  t.subtasks.splice(fromIdx, 1);
  let toIdx = t.subtasks.findIndex(s=>s.id===targetSubId);
  if(!before) toIdx += 1;
  t.subtasks.splice(toIdx, 0, item);
  // Same reasoning as reorderTask() — defer past the still-active native
  // drag session on the dragged .subrow rather than yanking it out from
  // under itself.
  setTimeout(()=>{ render(); reopen(taskId); }, 0);
  queueSave();
}


// Everything a task's own detail shows below its row header — title,
// category/due/urgent/today fields, timeframe/priority, steps, notes,
// meta line. Shared by the inline .expand under a normal row and the
// full-page task detail opened from Daily (renderTaskDetailPage) so the
// two can never drift out of sync — edit once, both places update.
function taskExpandFieldsHtml(t, canRemoveHere){
  const subs = t.subtasks || [];
  let metaLine = `Created ${fmtDate(t.createdAt)}`;
  if(t.status==='done' && t.completedAt){
    metaLine += ` · Completed ${fmtDate(t.completedAt)} (${daysBetween(t.createdAt, t.completedAt)}d)`;
  } else {
    const age = daysBetween(t.createdAt, todayStr());
    if(age > 0) metaLine += ` · Open ${age}d`;
  }
  const plannedToday = (t.plannedDates||[]).includes(todayStr());
  const otherPlanned = (t.plannedDates||[]).filter(d=>d!==todayStr()).length;
  const todayTitle = plannedToday ? 'Remove from today’s list'
    : otherPlanned ? `Also planned on ${otherPlanned} other day${otherPlanned===1?'':'s'} — tap to add today too`
    : 'Add to today’s list';
  return `
      <input type="text" class="titleedit" value="${escapeHtml(t.title)}"
        onblur="updateTitle('${t.id}', this.value)"
        onkeydown="if(event.key==='Enter'){ event.preventDefault(); this.blur(); }">
      <div class="expand-row">
        <select class="catselect" onchange="updateCategory('${t.id}', this.value)">
          ${standardCategoryEntries().map(([k,v])=>`<option value="${k}" ${t.category===k?'selected':''}>${v.label}</option>`).join('')}
        </select>
        <label class="fieldlabel">DUE</label>
        <input type="date" value="${t.dueDate||''}" onchange="updateDueDate('${t.id}', this.value)">
        <button class="flagbtn ${t.urgent?'on':''}" onclick="toggleUrgent('${t.id}')" title="Toggle urgent">⚑</button>
        <button class="flagbtn daybtn ${(t.plannedDates||[]).length?'on':''}" onclick="toggleTaskToday('${t.id}')" title="${todayTitle}">📌</button>
        ${canRemoveHere ? `<button class="remove" onclick="deleteTask('${t.id}')">Remove</button>` : ''}
      </div>
      ${state.advancedTaskFields ? `
      <div class="expand-row">
        <label class="fieldlabel">TIMEFRAME</label>
        <select class="catselect" onchange="updateTimeframe('${t.id}', this.value)">
          <option value="" ${!t.timeframe?'selected':''}>None</option>
          <option value="today" ${t.timeframe==='today'?'selected':''}>Today</option>
          <option value="short" ${t.timeframe==='short'?'selected':''}>Short</option>
          <option value="medium" ${t.timeframe==='medium'?'selected':''}>Medium</option>
          <option value="long" ${t.timeframe==='long'?'selected':''}>Long</option>
          <option value="urgent" ${t.timeframe==='urgent'?'selected':''}>Urgent</option>
        </select>
        <label class="fieldlabel">PRIORITY</label>
        <select class="catselect" onchange="updatePriority('${t.id}', this.value)">
          <option value="0" ${!t.priority?'selected':''}>None</option>
          <option value="1" ${t.priority===1?'selected':''}>Low</option>
          <option value="2" ${t.priority===2?'selected':''}>Medium</option>
          <option value="3" ${t.priority===3?'selected':''}>High</option>
        </select>
      </div>` : ''}
      <div class="subwrap">
        <div class="sublabel">Steps</div>
        ${subs.map(s=>{
          const subPlannedToday = (s.plannedDates||[]).includes(todayStr());
          const subOtherPlanned = (s.plannedDates||[]).filter(d=>d!==todayStr()).length;
          const subTodayTitle = subPlannedToday ? 'Remove from today’s list'
            : subOtherPlanned ? `Also planned on ${subOtherPlanned} other day${subOtherPlanned===1?'':'s'} — tap to add today too`
            : 'Add to today’s list';
          return `
          <div class="subrow" ondragover="subDragOver(event)" ondrop="subDrop(event,'${t.id}','${s.id}')">
            <span class="draghandle sub" draggable="true" ondragstart="subDragStart(event,'${t.id}','${s.id}')" ondragend="subDragEnd()" title="Drag to reorder">⠿</span>
            <div class="subcheck ${s.done?'done':''}" onclick="toggleSubtask('${t.id}','${s.id}')"></div>
            <div class="subtext ${s.done?'done':''}" onclick="startEditSubtask(this,'${t.id}','${s.id}')">${escapeHtml(s.text)}</div>
            <div class="subdate ${s.dueDate?'':'empty'}" onclick="startEditSubtaskDate(this,'${t.id}','${s.id}')">${s.dueDate ? fmtDateShort(s.dueDate) : 'Date'}</div>
            <button class="flagbtn daybtn small ${(s.plannedDates||[]).length?'on':''}" onclick="event.stopPropagation(); toggleSubtaskToday('${t.id}','${s.id}')" title="${subTodayTitle}">📌</button>
            <button class="subdel" onclick="deleteSubtask('${t.id}','${s.id}')">×</button>
          </div>`;
        }).join('')}
        ${subDropEndHtml(t.id, subs)}
        <input type="text" class="subadd" placeholder="+ add a step, enter to save" onkeydown="if(event.key==='Enter'){ addSubtask('${t.id}', this.value); }">
      </div>
      <textarea placeholder="Notes…" onblur="updateNotes('${t.id}', this.value)">${escapeHtml(t.notes||'')}</textarea>
      <div class="taskmeta">${metaLine}</div>
  `;
}

function taskRowHtml(t, showDot, inDaily, dayDate){
  const cat = CATEGORIES[t.category] || FALLBACK_CATEGORY;
  const canRemoveHere = !inDaily || t.category==='misc';
  const overdue = isOverdue(t);
  let badge = '';
  if(overdue) badge = `<span class="badge overdue">Overdue</span>`;
  else if(t.dueDate) badge = `<span class="badge due">${fmtDate(t.dueDate)}</span>`;
  // Priority/timeframe badges only render when actually set (both default
  // to "unset") and only in advanced mode — a task nobody has triaged
  // stays exactly as uncluttered as it always was.
  let priorityBadge = '';
  if(state.advancedTaskFields && t.priority){
    const pClass = t.priority===3 ? 'priority-high' : t.priority===2 ? 'priority-medium' : 'priority-low';
    priorityBadge = `<span class="badge ${pClass}">${PRIORITY_LABELS[t.priority]}</span>`;
  }
  let timeframeBadge = '';
  if(state.advancedTaskFields && t.timeframe){
    timeframeBadge = `<span class="badge timeframe">${TIMEFRAME_LABELS[t.timeframe]}</span>`;
  }
  const dotHtml = showDot ? categoryDotHtml(cat, 'cdot') : '';
  const subs = t.subtasks || [];
  // Drag-to-reorder is only meaningful in 'default' sort mode — every
  // other mode derives the row's position from a sort key, so a drag
  // there would just snap back on the next render. No handle, no drag
  // attributes at all outside 'default', rather than a handle that's
  // present but silently does nothing.
  const draggableMain = sortMode === 'default';
  const dragHandle = draggableMain
    ? `<span class="draghandle" draggable="true" ondragstart="taskDragStart(event,'${t.id}')" ondragend="taskDragEnd()" onclick="event.stopPropagation()" title="Drag to reorder">⠿</span>`
    : '';
  const dragTargetAttrs = draggableMain
    ? `ondragover="taskDragOver(event)" ondrop="taskDrop(event,'${t.id}')"`
    : '';
  // Within Daily, clicking a task opens its own full page (see
  // openTaskDetailFromDay/renderTaskDetailPage) rather than expanding
  // inline — everywhere else it's the usual inline .expand toggle.
  const rowClick = inDaily ? `openTaskDetailFromDay('${t.id}')` : `toggleExpand(event,'${t.id}')`;
  const onTomorrow = inDaily && (t.plannedDates||[]).includes(addDaysToDateStr(dayDate, 1));
  return `
  <li class="task" ${dragTargetAttrs}>
    <div class="row" onclick="${rowClick}">
      ${dragHandle}
      <div class="checkwrap" onclick="event.stopPropagation()">
        <div class="check ${t.status==='done'?'done':''}" onclick="toggleStatus('${t.id}')"></div>
        ${subProgressHtml(subs)}
      </div>
      ${dotHtml}
      <div class="title ${t.status==='done'?'done':''}">${escapeHtml(t.title)}${t.urgent && t.status!=='done' ? ' ⚑' : ''}</div>
      <div class="meta">${priorityBadge}${timeframeBadge}${badge}</div>
      ${inDaily ? `
        <button class="movetmrw" ${onTomorrow?'disabled':''} onclick="event.stopPropagation(); moveTaskToTomorrow('${t.id}','${dayDate}')" title="${onTomorrow ? 'Already planned for tomorrow' : 'Also plan for tomorrow'}">→</button>
        <button class="dayremove" onclick="event.stopPropagation(); unplanTaskFromDay('${t.id}','${dayDate}')" title="Remove from this day">×</button>
      ` : ''}
    </div>
    ${inDaily ? '' : `<div class="expand ${expandedTaskIds.has(t.id)?'open':''}" id="exp-${t.id}">${taskExpandFieldsHtml(t, canRemoveHere)}</div>`}
  </li>`;
}

// Full-page task detail, opened by clicking a task or step within Daily
// (see openTaskDetailFromDay) — same shared fields as the inline .expand,
// wrapped in the "stacked page" pattern with a page tag back to the day
// it was opened from, rather than expanding inline the way it does
// everywhere else.
function renderTaskDetailPage(taskId, dateStr){
  const t = state.tasks.find(t=>t.id===taskId);
  const cat = CATEGORIES[t.category] || FALLBACK_CATEGORY;
  const canRemoveHere = t.category==='misc';
  return `
    <div class="stackedpage">
      ${pageTagHtml('closeTaskDetail()', 'Daily')}
      <div class="taskdetailhead">
        <div class="check ${t.status==='done'?'done':''}" onclick="toggleStatus('${t.id}')"></div>
        ${categoryDotHtml(cat, 'cdot')}
      </div>
      ${taskExpandFieldsHtml(t, canRemoveHere)}
    </div>
  `;
}

function openTaskDetailFromDay(taskId){
  taskDetailId = taskId;
  renderDaily();
}
function closeTaskDetail(){
  taskDetailId = null;
  renderDaily();
}

function renderList(){
  // Checklist lists don't carry due dates/priority and open into their
  // own dedicated view rather than an inline expand, so taskRowHtml can't
  // render them sensibly — they're excluded from "All" entirely rather
  // than shown with fields that don't apply. Orphaned tasks (category id
  // matches nothing current) still fall through to "All" as always.
  const list = state.tasks.filter(t => {
    if(activeTab !== 'all') return t.category === activeTab;
    const cat = CATEGORIES[t.category];
    return !cat || cat.type !== 'checklist';
  });
  const visible = applySortMode(list).filter(t => showDone || t.status!=='done');
  const doneCount = list.filter(t=>t.status==='done').length;

  document.getElementById('sortRow').innerHTML = `
    <label class="fieldlabel">SORT</label>
    <select onchange="setSortMode(this.value)">${sortModeOptionsHtml(activeTab==='all')}</select>
  `;

  const el = document.getElementById('taskList');
  if(visible.length===0){
    el.innerHTML = `<div class="empty">${EMPTY_MSG[activeTab] || 'Nothing here yet.'}</div>`;
  } else {
    el.innerHTML = visible.map(t=>taskRowHtml(t, activeTab==='all', false)).join('') + dropEndHtml(visible);
  }

  const btn = document.getElementById('showDoneBtn');
  btn.textContent = showDone ? `Hide completed (${doneCount})` : `Show completed (${doneCount})`;
  btn.style.display = doneCount>0 ? '' : 'none';
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// "Stacked page" pattern (see .stackedpage/.pagetag/.pagetagtip/
// .pagetaglabel in <style>) — a small flag/tag with a rounded-triangle
// tip jutting past the edge of whatever it's anchored to, standing in
// for a plain .backbtn text link on any view that should read as its
// own page stacked on top of what's beneath it. Shared across every
// such view (checklist detail/pending, Settings, and whatever's next)
// so they can't drift into one-off variants — pass `compact` for a tag
// that isn't anchored to a .stackedpage (see .pagetag.compact).
function pageTagHtml(onclick, label, compact){
  return `<button class="pagetag${compact?' compact':''}" onclick="${onclick}"><span class="pagetagtip"></span><span class="pagetaglabel">${escapeHtml(label)}</span></button>`;
}

function render(){
  renderDevPanel();
  renderLocBadge();
  renderTabs();
  refreshUndoButtons();
  document.getElementById('settingsBtn').classList.toggle('on', settingsOpen);
  const catView = document.getElementById('categoryView');
  const dayView = document.getElementById('dailyView');
  const chkView = document.getElementById('checklistView');
  const calView = document.getElementById('calendarView');
  const setView = document.getElementById('settingsView');
  const cldView = document.getElementById('claudeView');
  if(claudeView){
    catView.style.display = 'none';
    dayView.style.display = 'none';
    chkView.style.display = 'none';
    calView.style.display = 'none';
    setView.style.display = 'none';
    cldView.style.display = '';
    renderClaudeView();
    document.getElementById('taskList').innerHTML = ''; // avoid stale duplicate ids
    dayView.innerHTML = '';
    chkView.innerHTML = '';
    calView.innerHTML = '';
    setView.innerHTML = '';
    return;
  }
  cldView.style.display = 'none';
  cldView.innerHTML = '';
  if(settingsOpen){
    catView.style.display = 'none';
    dayView.style.display = 'none';
    chkView.style.display = 'none';
    calView.style.display = 'none';
    setView.style.display = '';
    renderSettings();
    document.getElementById('taskList').innerHTML = ''; // avoid stale duplicate ids
    dayView.innerHTML = '';
    chkView.innerHTML = '';
    calView.innerHTML = '';
    return;
  }
  setView.style.display = 'none';
  setView.innerHTML = '';
  const isDaily = activeTab==='daily';
  const isChecklist = isChecklistCategory(activeTab);
  const isCalendar = isCalendarCategory(activeTab);
  catView.style.display = (isDaily || isChecklist || isCalendar) ? 'none' : '';
  dayView.style.display = isDaily ? '' : 'none';
  chkView.style.display = isChecklist ? '' : 'none';
  calView.style.display = isCalendar ? '' : 'none';
  if(isDaily){
    renderDaily();
    document.getElementById('taskList').innerHTML = ''; // avoid stale duplicate ids
    chkView.innerHTML = '';
    calView.innerHTML = '';
  } else if(isChecklist){
    renderChecklist();
    document.getElementById('taskList').innerHTML = ''; // avoid stale duplicate ids
    dayView.innerHTML = '';
    calView.innerHTML = '';
  } else if(isCalendar){
    renderCalendar();
    document.getElementById('taskList').innerHTML = ''; // avoid stale duplicate ids
    dayView.innerHTML = '';
    chkView.innerHTML = '';
  } else {
    renderQuickCategory();
    renderList();
    dayView.innerHTML = ''; // avoid stale duplicate ids
    chkView.innerHTML = '';
    calView.innerHTML = '';
  }
}

// Only visible when the "Pages" texture is on, but harmless to always
// set — it's just an unused CSS variable otherwise. Picked from a fixed
// preset list (not fully random per-axis) so the tilt+offset always stay
// a matched, plausible-looking pair rather than occasionally combining
// into something that reads as broken.
const PAGE_TILTS = [
  'rotate(-2deg)',
  'rotate(2.5deg) translate(-2px, 1px)',
  'rotate(-3.5deg) translate(2px, -1px)',
  'rotate(1.5deg) translate(-1px, 2px)',
  'rotate(-1deg) translate(1px, -2px)',
  'rotate(3deg) translate(-1px, -1px)',
];
function randomizePageTilt(){
  const appCard = document.getElementById('appCard');
  if(!appCard) return;
  const t = PAGE_TILTS[Math.floor(Math.random() * PAGE_TILTS.length)];
  appCard.style.setProperty('--page-transform', t);
}

// Clicking a category tab always lands on that category, acting like an
// Esc out of whatever overlay (Settings, the Claude-readable view) was
// showing first — the tab bar stays visible and clickable through both,
// so without this a tap on a tab would silently update activeTab behind
// the still-open overlay instead of visibly taking you anywhere. No
// early-return for key === activeTab: clicking the tab you're already
// "on" while an overlay is open must still exit the overlay.
function switchTab(key){
  checklistReturnDay = null;
  claudeView = null;
  settingsOpen = false;
  // Only an actual change of category counts as "leaving" it — re-clicking
  // the tab you're already on (which still runs this whole function, to
  // exit an open overlay per the note above) must not collapse tasks you
  // have expanded right now in that same category.
  if(key !== activeTab) expandedTaskIds = new Set();
  activeTab = key;
  // Device-local only (plain localStorage, not the synced storage adapter)
  // — which tab you're looking at isn't ledger data, so it doesn't belong
  // in state/Supabase. Restored in enterApp() so a reload lands back where
  // you were instead of always snapping to "All".
  localStorage.setItem('ledger-last-tab', key);
  randomizePageTilt();
  render();
}

    </div>
  `;

  const appearanceSection = `
    <div class="settingslabel">Appearance</div>
    <div class="themerow">
      <label class="themeswatch">
        <input type="color" value="${state.theme.bg}" onchange="updateThemeColor('bg', this.value)">
        Background
      </label>
      <label class="themeswatch">

    </div>
    <label class="catlocchk" style="margin-bottom:10px;">
      <input type="checkbox" ${state.theme.gradient?'checked':''} onchange="toggleThemeGradient(this.checked)">

  const claudeSection = `

  `;

  // EXPERIMENTAL — see defaultDevSettings() in 02-storage-state.js. Back
  // in a <details> here (collapsed by default, native browser disclosure)
  // AND in the floating side panel (see renderDevPanel() in
  // 01-categories-theme.js) — the side panel is the one that lets a
  // toggle be checked against the live page underneath it, but it only
  // exists once "Show the floating dev panel" (the last field below) is
  // turned on, and this section is the only place that checkbox lives, so
  // it always needs to stay reachable from here even when the panel
  // itself is off. devSettingsFieldsHtml() is the single shared source
  // for both hosts' fields.
  const devSection = `
    <details class="devsettings">
      <summary>Dev Settings</summary>
      ${devSettingsFieldsHtml('catlocchk devsettingsrow', 'devpanelfield', 'devpanelcaption', 'devpanelselect')}
    </details>
  `;

  el.innerHTML = `
    <div class="stackedpage">
      ${pageTagHtml('toggleSettings()', 'Done')}
      <div class="daylistlabel">Manage Tabs</div>
      ${rows}
      <div class="catrow">
        <input type="text" class="catedit" placeholder="+ add a new tab, enter to save" id="newCatNameInput"
          onkeydown="if(event.key==='Enter'){ addCategory(this.value, document.getElementById('newCatTypeSelect').value); this.value=''; }">
        <select class="catselect" id="newCatTypeSelect" title="Standard tabs track due dates, priority, and timeframe. Checklist tabs are simple named lists of items — good for groceries, packing, shopping, anything you just need to check off. Calendar tabs show a month grid of your Daily pages, with at-a-glance counts of what's due and done each day.">

}

async function renameCategory(id, val){
  const c = state.categories.find(c=>c.id===id);
  if(!c) return;
  const newVal = val.trim();
  // render() always runs (even on a no-op edit) so a cleared-then-blurred
  // field snaps back to the real label instead of staying blank — but
  // undo/save are skipped unless something actually changed.
  if(newVal && newVal !== c.label){
    pushUndo(`Renamed tab to "${newVal}"`);
    c.label = newVal;
    rebuildCategoriesIndex();
    queueSave();
  }
  render();
}

function askDeleteCategory(id){
  pendingDeleteCategoryId = id;
  render();
}

function cancelDeleteCategory(){
  pendingDeleteCategoryId = null;
  render();
}

async function deleteCategory(id){
  if(state.categories.length <= 1) return;
  const c = state.categories.find(c=>c.id===id);
  pushUndo(`Deleted tab "${c ? c.label : ''}"`);
  // Tasks keep whatever category id they already had — with no tab left
  // that matches it, they simply stop appearing under a specific tab and
  // only show under "All" (styled via the CATEGORIES-lookup fallback in
  // taskRowHtml). Nothing about the tasks themselves is touched, so this
  // is safe even if the tab being deleted has a lot of tasks in it.
  state.categories = state.categories.filter(c=>c.id!==id);
  pendingDeleteCategoryId = null;
  rebuildCategoriesIndex();
  if(activeTab === id) activeTab = 'all';
  render();
  queueSave();
}

// Type is fixed at creation — there's no UI to convert a tab afterward
// (see isChecklistCategory() above for why).
async function addCategory(text, type){
  const label = (text||'').trim();
  if(!label) return;
  pushUndo(`Added tab "${label}"`);
  const hex = CATEGORY_PALETTE[state.categories.length % CATEGORY_PALETTE.length];
  // Only the workspace you're currently in gets checked by default — you
  // add a tab while thinking about the location you're actually at, and
  // can check any others afterward the same way you would for an
  // existing tab (toggleCategoryLocation). Irrelevant when locations are
  // off (visibleTabs() ignores .locations entirely in that case), so no
  // need to branch on state.locationEnabled here.
  const catType = type==='checklist' ? 'checklist' : type==='calendar' ? 'calendar' : 'standard';
  state.categories.push({ id: newId('cat'), label, hex, locations: [state.location], type: catType });
  rebuildCategoriesIndex();
  render();
  queueSave();
}

function moveCategory(id, direction){
  const idx = state.categories.findIndex(c=>c.id===id);
  const newIdx = idx + direction;
  if(idx===-1 || newIdx<0 || newIdx>=state.categories.length) return;
  pushUndo('Reordered tabs');
  const [c] = state.categories.splice(idx, 1);
  state.categories.splice(newIdx, 0, c);
  rebuildCategoriesIndex();
  render();
  queueSave();
}

async function toggleCategoryLocation(catId, locId, checked){
  const c = state.categories.find(c=>c.id===catId);
  if(!c) return;
  pushUndo(`Updated "${c.label}" locations`);
  if(checked){
    if(!c.locations.includes(locId)) c.locations.push(locId);
  } else {
    c.locations = c.locations.filter(id=>id!==locId);
  }
  rebuildCategoriesIndex();
  render();
  queueSave();
}

// The whole popover this row's .cdot button opens (see the catrow
// template above) — a small in-place card, not a real page like
// .stackedpage, since it belongs to one specific row and should feel
// anchored to the dot you clicked, not a full drilldown. Only one can be
// open at a time (openCategoryPickerId is a single id, not a Set), so
// opening a different row's picker implicitly closes whichever was open.
function categoryPickerHtml(c){
  if(customColorOpen) return customColorWheelHtml(c);
  const swatches = CATEGORY_PALETTE.map(hex=>`
    <button class="catswatch ${c.hex.toLowerCase()===hex.toLowerCase()?'active':''}" style="background:${hex}" onclick="setCategoryColor('${c.id}','${hex}')" title="${hex}"></button>`
  ).join('');
  // A permanent little rainbow, not a preview of the current color (that
  // would fight with .catswatch.active's own border-based "you're here"
  // signal when the current hex already matches this exactly) — its
  // .active state (a preset can never equal it) is what actually shows
  // "your color right now isn't one of the presets."
  const customIsActive = !CATEGORY_PALETTE.some(hex=>hex.toLowerCase()===c.hex.toLowerCase());
  const icons = CATEGORY_ICON_ORDER.map(id=>`
    <button class="caticonbtn ${(c.icon||'dot')===id?'active':''}" onclick="setCategoryIcon('${c.id}','${id}')" title="${id}" style="color:${c.hex}">${CATEGORY_ICON_GLYPHS[id]}</button>`
  ).join('');
  return `
    <div class="catpicker">
      <button class="catpickerclose" onclick="toggleCategoryPicker('${c.id}')" title="Close">×</button>
      <div class="catpickerlabel">Color</div>
      <div class="catswatchrow">
        ${swatches}
        <button class="catswatch catswatchcustom ${customIsActive?'active':''}" onclick="openCustomColor('${c.id}')" title="Custom color"></button>
      </div>
      <div class="catpickerlabel">Icon</div>
      <div class="caticonrow">${icons}</div>
    </div>`;
}

// Pure UI navigation, like askDeleteCategory — no pushUndo, opening/
// closing the popover isn't a content change. Reset alongside
// pendingDeleteCategoryId everywhere that already resets that (see
// toggleSettings(), afterStateRestore(), openClaudeView(), signOut()).
function toggleCategoryPicker(id){
  openCategoryPickerId = openCategoryPickerId === id ? null : id;
  customColorOpen = false;
  catWheelCancelDrag();
  render();
}

// ---------- Category custom color wheel ----------
// A hue ring (drag around it to pick a hue) with a saturation/value
// square inscribed in its hole (drag within it for the rest) — the
// classic "ring + square" picker shape, built from scratch rather than
// the browser's native <input type=color> so it can actually match the
// app's look (the native picker is a totally different, OS-drawn dialog
// with zero styling hooks). Dragging updates customColorDraft and repaints
// specific DOM nodes directly via updateCatWheelUI() — NOT the app's own
// render() — since render() would tear down and rebuild the very elements
// being dragged, breaking the gesture mid-drag. Nothing is written to
// state.categories until confirmCustomColor() (Done, or Enter in the hex
// field), which is the one moment this goes through the normal
// pushUndo/render/queueSave path like any other mutation.
const CAT_WHEEL_SIZE = 140, CAT_WHEEL_BAND = 16, CAT_WHEEL_HOLE = CAT_WHEEL_SIZE - CAT_WHEEL_BAND*2;
const CAT_WHEEL_CENTER = CAT_WHEEL_SIZE/2, CAT_WHEEL_RADIUS = CAT_WHEEL_CENTER - CAT_WHEEL_BAND/2;

function customColorWheelHtml(c){
  const { h, s, v } = customColorDraft;
  const hex = hsvToHex(h, s, v);
  const rad = (h - 90) * Math.PI/180;
  const hueX = CAT_WHEEL_CENTER + CAT_WHEEL_RADIUS*Math.cos(rad);
  const hueY = CAT_WHEEL_CENTER + CAT_WHEEL_RADIUS*Math.sin(rad);
  const svX = s * CAT_WHEEL_HOLE, svY = (1-v) * CAT_WHEEL_HOLE;
  return `
    <div class="catpicker">
      <button class="catpickerclose" onclick="toggleCategoryPicker('${c.id}')" title="Close">×</button>
      <button class="catwheelback" onclick="closeCustomColor('${c.id}')">‹ Presets</button>
      <div class="catwheelring" id="catWheelRing" onpointerdown="catWheelPointerDown(event,'hue')">
        <div class="catwheelknob" id="catWheelHueKnob" style="left:${hueX}px; top:${hueY}px;"></div>
        <div class="catwheelsquarewrap">
          <div class="catwheelsquare" id="catWheelSquare" style="background-color:hsl(${h},100%,50%);" onpointerdown="catWheelPointerDown(event,'sv')">
            <div class="catwheelsvknob" id="catWheelSvKnob" style="left:${svX}px; top:${svY}px;"></div>
          </div>
        </div>
      </div>
      <div class="catcustomrow">
        <span class="catcustomswatch" id="catCustomPreview" style="background:${hex}"></span>
        <input type="text" class="catcustomhex" id="catCustomHexInput" value="${hex}" maxlength="7"
          oninput="catCustomHexInput('${c.id}', this.value)"
          onkeydown="if(event.key==='Enter'){ event.preventDefault(); confirmCustomColor('${c.id}'); }">
        <button class="catcustomdone" onclick="confirmCustomColor('${c.id}')">Done</button>
      </div>
    </div>`;
}

function openCustomColor(id){
  const c = state.categories.find(c=>c.id===id);
  if(!c) return;
  customColorDraft = hexToHsv(c.hex);
  customColorOpen = true;
  render();
}

function closeCustomColor(id){
  customColorOpen = false;
  catWheelCancelDrag();
  render();
}

function catWheelPointerDown(evt, type){
  evt.preventDefault();
  // The SV square sits DOM-inside the ring (visually inscribed in its
  // hole), so a pointerdown on the square would otherwise bubble up and
  // also fire the ring's own 'hue' handler — stopPropagation is what
  // keeps the two controls independent despite the nesting.
  evt.stopPropagation();
  catWheelDragCtx = { type, rect: evt.currentTarget.getBoundingClientRect() };
  catWheelHandleMove(evt);
  document.addEventListener('pointermove', catWheelHandleMove);
  document.addEventListener('pointerup', catWheelPointerUp);
}

function catWheelHandleMove(evt){
  if(!catWheelDragCtx) return;
  const { type, rect } = catWheelDragCtx;
  if(type === 'hue'){
    const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    customColorDraft.h = (Math.atan2(evt.clientY-cy, evt.clientX-cx) * 180/Math.PI + 90 + 360) % 360;
  } else {
    customColorDraft.s = Math.max(0, Math.min(1, (evt.clientX-rect.left)/rect.width));
    customColorDraft.v = Math.max(0, Math.min(1, 1 - (evt.clientY-rect.top)/rect.height));
  }
  updateCatWheelUI();
}

function catWheelPointerUp(){
  catWheelCancelDrag();
}

// The only thing allowed to remove these document-level listeners — must
// run whenever the wheel panel can disappear out from under a drag
// (closeCustomColor, toggleCategoryPicker, confirmCustomColor, and every
// other spot that resets openCategoryPickerId/customColorOpen), not just
// on a normal pointerup, or a drag started right before e.g. Settings
// closes would leave a dangling listener updating DOM nodes that no
// longer exist.
function catWheelCancelDrag(){
  catWheelDragCtx = null;
  document.removeEventListener('pointermove', catWheelHandleMove);
  document.removeEventListener('pointerup', catWheelPointerUp);
}

// Repaints the wheel's own knobs/preview/hex field directly — see the
// big comment above customColorWheelHtml() for why this can't go through
// the app's normal render().
function updateCatWheelUI(){
  const ring = document.getElementById('catWheelRing');
  if(!ring) return; // popover closed out from under an in-flight drag
  const { h, s, v } = customColorDraft;
  const hex = hsvToHex(h, s, v);
  const rad = (h - 90) * Math.PI/180;
  const hueKnob = document.getElementById('catWheelHueKnob');
  if(hueKnob){
    hueKnob.style.left = (CAT_WHEEL_CENTER + CAT_WHEEL_RADIUS*Math.cos(rad)) + 'px';
    hueKnob.style.top = (CAT_WHEEL_CENTER + CAT_WHEEL_RADIUS*Math.sin(rad)) + 'px';
  }
  const square = document.getElementById('catWheelSquare');
  if(square) square.style.backgroundColor = `hsl(${h},100%,50%)`;
  const svKnob = document.getElementById('catWheelSvKnob');
  if(svKnob){
    svKnob.style.left = (s*CAT_WHEEL_HOLE) + 'px';
    svKnob.style.top = ((1-v)*CAT_WHEEL_HOLE) + 'px';
  }
  const preview = document.getElementById('catCustomPreview');
  if(preview) preview.style.background = hex;
  const hexInput = document.getElementById('catCustomHexInput');
  // Never stomp on the field while it's actively focused (typing) — only
  // a drag on the ring/square should push a value into it live.
  if(hexInput && document.activeElement !== hexInput) hexInput.value = hex;
}

function normalizeHexInput(val){
  const v = (val||'').trim().replace(/^#/, '');
  return /^[0-9a-fA-F]{6}$/.test(v) ? ('#' + v.toUpperCase()) : null;
}

// Typing a valid hex live-repositions the wheel to match, same as
// dragging it would — doesn't commit anything (see confirmCustomColor()
// for the actual commit), and silently no-ops on a partial/invalid value
// mid-keystroke rather than erroring.
function catCustomHexInput(id, val){
  const hex = normalizeHexInput(val);
  if(!hex) return;
  customColorDraft = hexToHsv(hex);
  updateCatWheelUI();
}

// The one moment a custom color actually applies — Done, or Enter in the
// hex field. Always reads the hex field's current value (not
// customColorDraft's HSV) so a typed hex that was never dragged to is
// still authoritative, and always re-renders even when setCategoryColor()
// itself no-ops (hex unchanged) — otherwise closing customColorOpen here
// would never actually reach the DOM.
async function confirmCustomColor(id){
  const input = document.getElementById('catCustomHexInput');
  const hex = normalizeHexInput(input ? input.value : '');
  if(!hex) return;
  customColorOpen = false;
  catWheelCancelDrag();
  await setCategoryColor(id, hex);
  render();
}

async function setCategoryColor(id, hex){
  const c = state.categories.find(c=>c.id===id);
  if(!c || c.hex.toLowerCase()===hex.toLowerCase()) return;
  pushUndo(`Changed "${c.label}" color`);
  c.hex = hex;
  rebuildCategoriesIndex();
  render();
  queueSave();
}

async function setCategoryIcon(id, icon){
  const c = state.categories.find(c=>c.id===id);
  if(!c || (c.icon||'dot')===icon) return;
  pushUndo(`Changed "${c.label}" icon`);

}

function askDeleteLocation(id){

async function deleteLocation(id){
