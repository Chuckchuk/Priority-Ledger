// ---------- Claude view ----------
// A plain-text view meant to be read by an agent (e.g. the Claude Chrome
// extension) via its page-text tools, instead of screenshotting the
// visual ledger. Pure navigation like switchTab/toggleSettings, so it's
// not on the undo stack and isn't itself state — it just renders a text
// snapshot of the current in-memory `state` on demand.

function openClaudeView(mode){
  claudeView = mode === 'full' ? 'full' : 'digest';
  settingsOpen = false;
  pendingDeleteCategoryId = null;
  pendingDeleteLocationId = null;
  openCategoryPickerId = null;
  uiColorPickerOpen = false;
  customColorOpen = false;
  catWheelCancelDrag();
  render();
}

// The only way into the Claude view is the "Open Claude-readable view"
// button inside Settings (or the ?claude= URL param, which a page-reading
// agent wouldn't be clicking a tag or pressing Esc from anyway) — so
// closing it, whether via the page tag or Esc, goes back to Settings
// rather than whatever category tab happened to be active underneath.
function closeClaudeView(){
  claudeView = null;
  settingsOpen = true;
  render();
}

function toggleClaudeViewMode(){
  claudeView = claudeView === 'full' ? 'digest' : 'full';
  render();
}

// One line per task, plain enough for an LLM to parse without any markup:
// a checkbox-style status, urgent flag, due date (flagged if overdue),
// step progress, then notes and each subtask step on their own indented
// lines so nothing stays hidden the way it does in the collapsed UI.
function claudeTaskLine(t, withCategory){
  const cat = CATEGORIES[t.category] || FALLBACK_CATEGORY;
  const bits = ['-', t.urgent ? '[URGENT]' : '[ ]', t.title];
  if(withCategory) bits.push(`(${cat.label})`);
  if(t.priority) bits.push(`priority:${PRIORITY_LABELS[t.priority].toLowerCase()}`);
  if(t.timeframe) bits.push(`timeframe:${t.timeframe}`);
  if(t.dueDate) bits.push(isOverdue(t) ? `— OVERDUE ${fmtDate(t.dueDate)}` : `— due ${fmtDate(t.dueDate)}`);
  if(t.subtasks && t.subtasks.length){
    const done = t.subtasks.filter(s=>s.done).length;
    bits.push(`(${done}/${t.subtasks.length} steps)`);
  }
  // Age is the whole point of this digest for a "what's been sitting
  // around" read — every open line gets one, not just old ones, so an LLM
  // can compare across the list without guessing at missing data.
  const age = daysBetween(t.createdAt, todayStr());
  bits.push(`(open ${age}d)`);
  let line = bits.join(' ');
  if(t.notes && t.notes.trim()) line += `\n    note: ${t.notes.trim().replace(/\s*\n\s*/g,' ')}`;
  (t.subtasks||[]).forEach(s=>{ line += `\n    · [${s.done?'x':' '}] ${s.text}`; });
  return line;
}

// Curated for "what should I work on next" — open tasks only, grouped by
// tab in the same order the tabs themselves appear, plus today's and any
// upcoming Daily plans. Ignores the location filter deliberately: an
// agent reading this wants the whole picture, not just what's visible
// while standing in one location.
function claudeDigestText(){
  const lines = ['THE LEDGER — Claude priority digest', `Generated ${new Date().toLocaleString()}`];
  if(state.locationEnabled) lines.push(`Currently at: ${currentLocation().label}`);
  lines.push('');
  const knownIds = new Set(state.categories.map(c=>c.id));
  state.categories.forEach(c=>{
    const open = sortTasks(state.tasks.filter(t=>t.category===c.id && t.status!=='done'));
    const locNote = state.locationEnabled
      ? ` (${c.locations.map(id=>(state.locations.find(l=>l.id===id)||{label:id}).label).join(', ')})`
      : '';
    lines.push(`== ${c.label}${locNote} — ${open.length} open ==`);
    lines.push(open.length ? open.map(t=>claudeTaskLine(t)).join('\n') : '(nothing open)');
    lines.push('');
  });
  const orphaned = sortTasks(state.tasks.filter(t=>!knownIds.has(t.category) && t.status!=='done'));
  if(orphaned.length){
    lines.push(`== Uncategorized — ${orphaned.length} open ==`);
    lines.push(orphaned.map(t=>claudeTaskLine(t)).join('\n'));
    lines.push('');
  }
  lines.push('== Daily plan ==');
  const today = todayStr();
  const todayTasks = sortTasks(tasksForDay(today).filter(t=>t.status!=='done'));
  lines.push(`-- Today, ${dayLabel(today)} --`);
  lines.push(todayTasks.length ? todayTasks.map(t=>claudeTaskLine(t, true)).join('\n') : '(nothing planned)');
  state.days.filter(d=>d>today).sort().forEach(d=>{
    const dt = sortTasks(tasksForDay(d).filter(t=>t.status!=='done'));
    if(!dt.length) return;
    lines.push('');
    lines.push(`-- ${dayLabel(d)} --`);
    lines.push(dt.map(t=>claudeTaskLine(t, true)).join('\n'));
  });
  return lines.join('\n');
}

// Complete, structured, and trivial for an LLM to parse — the entire
// state object as-is, not a curated subset like the digest above.
function claudeFullDumpText(){
  return JSON.stringify(state, null, 2);
}

function renderClaudeView(){
  const el = document.getElementById('claudeView');
  const text = claudeView === 'full' ? claudeFullDumpText() : claudeDigestText();
  el.innerHTML = `
    <div class="stackedpage">
      ${pageTagHtml('closeClaudeView()', 'Back')}
      <div class="daylistlabel">Claude-readable ${claudeView==='full' ? 'raw data (JSON)' : 'priority digest'}</div>
      <div class="lockednote">Point your assistant here directly by adding <b>?claude=1</b> (digest) or <b>?claude=full</b> (raw data) to this page's URL — it can read the text below without screenshotting the app.</div>
      <div class="claudeviewrow">
        <button class="pullbtn" onclick="toggleClaudeViewMode()">${claudeView==='full' ? 'Show digest' : 'Show full raw data'}</button>
        <button class="pullbtn" onclick="copyClaudeView(this)">Copy to clipboard</button>
      </div>
      <pre class="claudepre" id="claudeViewText">${escapeHtml(text)}</pre>
    </div>
  `;
}

async function copyClaudeView(btn){
  const text = document.getElementById('claudeViewText').textContent;
  try{
    await navigator.clipboard.writeText(text);
    const original = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(()=>{ if(btn.textContent==='Copied!') btn.textContent = original; }, 1500);
  }catch(e){
    console.error('Clipboard copy failed', e);
  }
}

// ---------- Daily tab ----------

function monthKey(dateStr){ return dateStr.slice(0,7); }

function newId(prefix){ return prefix + '-' + Date.now() + '-' + Math.random().toString(36).slice(2,8); }

function addDaysToDateStr(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}

let pickerOpen = false;

// "Add to this day" tree picker state — transient UI state, not
// persisted, same idiom as pickerOpen/expandedMonths above. Reset by
// resetDayAddPicker() whenever a day is opened or closed.
let dayAddOpen = false;
let dayTreeExpanded = new Set(); // open nodes, keyed 'cat:<id>' / 'task:<id>' / 'cklist:<id>'
// Which row (if any) just got toggled on/off the day, keyed the same way
// as dayTreeExpanded — read at render time to apply a one-shot fade
// animation, then cleared shortly after so an unrelated later re-render
// (which recreates the row's DOM node from scratch) doesn't replay it.
let dayTreeFlashKey = null;

// Which task's full-page detail view (opened from clicking a task or step
// within Daily — see openTaskDetailFromDay()) is showing on top of the
// current day's detail, if any. Transient UI state, reset the same places
// dayAddOpen/dayTreeExpanded are.
let taskDetailId = null;

function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('en-US', { month:'long', year:'numeric' });
}

function dayLabel(dateStr){
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { weekday:'long', month:'short', day:'numeric' });
}

function tasksForDay(dateStr){
  return state.tasks.filter(t=>(t.plannedDates||[]).includes(dateStr));
}

// Of the whole tasks planned onto a day, the checklist lists among them
// render as checklist rows (dayChecklistRowHtml), not standard task rows
// — taskRowHtml doesn't know how to show a checklist's items/fields.
function standardTasksForDay(dateStr){
  return tasksForDay(dateStr).filter(t=>!isChecklistCategory(t.category));
}
function checklistDailyItemsForDay(dateStr){
  return tasksForDay(dateStr).filter(t=>isChecklistCategory(t.category));
}

// Steps planned onto a day independently of their parent task's own
// plannedDates — {task, sub} pairs. Checklist items aren't part of this;
// a checklist is planned onto a day as a whole list, same as a task.
function subDailyItemsForDay(dateStr){
  const out = [];
  state.tasks.forEach(t=>{
    if(isChecklistCategory(t.category)) return;
    (t.subtasks||[]).forEach(s=>{
      if((s.plannedDates||[]).includes(dateStr)) out.push({ task:t, sub:s });
    });
  });
  return out;
}

// Unified "how much is on this day, how much of it's done" across all
// three kinds of daily item — used by the day-list ratio badge, the
// day-detail header, and the Daily tab's badge count, so all three agree
// once steps/checklists can be planned onto a day too.
function dayItemsSummary(dateStr){
  const tasks = standardTasksForDay(dateStr);
  const subs = subDailyItemsForDay(dateStr);
  const lists = checklistDailyItemsForDay(dateStr);
  return {
    total: tasks.length + subs.length + lists.length,
    done: tasks.filter(t=>t.status==='done').length
      + subs.filter(x=>x.sub.done).length
      + lists.filter(t=>t.status==='done').length
  };
}

async function ensureDay(dateStr){
  if(!state.days.includes(dateStr)){
    state.days.unshift(dateStr);
    queueSave();
  }
}

async function addDay(){
  // Default is today — but if today (and however many days after it) already
  // exist, roll forward to the next day that isn't taken yet, rather than
  // trying to create a duplicate "Today".
  let dateStr = todayStr();
  while(state.days.includes(dateStr)){
    dateStr = addDaysToDateStr(dateStr, 1);
  }
  pushUndo('Added a day');
  await ensureDay(dateStr);
  selectedDay = dateStr;
  render();
}

function togglePicker(){ pickerOpen = !pickerOpen; renderDaily(); }

async function confirmPickDate(){
  const input = document.getElementById('pickDateInput');
  const val = input ? input.value : '';
  if(!val) return;
  pickerOpen = false;
  pushUndo('Added a day');
  await ensureDay(val); // no-op if that day already exists — never duplicates
  selectedDay = val;
  render();
}

// Replaces the old whole-day reschedule + "copy unfinished as new tasks"
// pair — the project owner found the "Move this Day To" date-picker
// distracting and wanted it gone, with the copy-forward behavior kept but
// changed to actually carry the *same* task/step forward (via the
// plannedDates array — see the migration note in normalizeState()) rather
// than minting duplicate task objects. An item already carrying tomorrow's
// date is skipped, so mashing this button repeatedly can't pile up
// duplicate entries on tomorrow's list the way the old copy did.
async function moveIncompleteToTomorrow(dateStr){
  const nextDate = addDaysToDateStr(dateStr, 1);
  // Checklist lists excluded — a whole named list doesn't have the
  // "incomplete" urgency a standard task/step does, same reasoning the
  // old cascade used.
  const tasks = standardTasksForDay(dateStr).filter(t=>t.status!=='done');
  const subs = subDailyItemsForDay(dateStr).filter(x=>!x.sub.done);
  if(tasks.length===0 && subs.length===0) return;
  pushUndo('Moved incomplete items to tomorrow');
  await ensureDay(nextDate);
  tasks.forEach(t=>{
    if(!t.plannedDates) t.plannedDates = [];
    if(!t.plannedDates.includes(nextDate)) t.plannedDates.push(nextDate);
  });
  subs.forEach(({sub})=>{
    if(!sub.plannedDates) sub.plannedDates = [];
    if(!sub.plannedDates.includes(nextDate)) sub.plannedDates.push(nextDate);
  });
  render();
  queueSave();
}

function resetDayAddPicker(){
  dayAddOpen = false;
  dayTreeExpanded = new Set();
  dayTreeFlashKey = null;
  taskDetailId = null;
}

function openDay(dateStr){ selectedDay = dateStr; resetDayAddPicker(); render(); }
function closeDay(){ selectedDay = null; resetDayAddPicker(); render(); }

// Chronological, not state.days' own insertion order (state.days.unshift()
// in ensureDay() means the array itself is newest-first) — "previous"/
// "next" on a day-detail page should mean the closest earlier/later day
// you've actually logged, matching what the left/right arrows visually
// promise, not whichever day happened to be added most recently.
function sortedDayList(){ return state.days.slice().sort((a,b)=>a.localeCompare(b)); }

// null when `dateStr` isn't in state.days at all, or sits at either end
// of the list — both cases the day-detail page's arrow just renders
// disabled rather than erroring or wrapping around.
function adjacentDayStr(dateStr, dir){
  const days = sortedDayList();
  const idx = days.indexOf(dateStr);
  if(idx === -1) return null;
  const target = days[idx + dir];
  return target === undefined ? null : target;
}

// Pure navigation (openDay() itself isn't undo-tracked either) — moving
// to an adjacent day you've already logged isn't a content change, same
// reasoning switchTab()/toggleLocation() already lean on elsewhere.
function goToAdjacentDay(dir){
  const target = adjacentDayStr(selectedDay, dir);
  if(!target) return;
  openDay(target);
}

function toggleMonthGroup(key){
  if(expandedMonths.has(key)) expandedMonths.delete(key); else expandedMonths.add(key);
  renderDaily();
}

function renderDaily(){
  const el = document.getElementById('dailyView');
  if(taskDetailId && !state.tasks.find(t=>t.id===taskDetailId)) taskDetailId = null;
  if(selectedDay && taskDetailId){
    el.innerHTML = renderTaskDetailPage(taskDetailId, selectedDay);
  } else {
    el.innerHTML = selectedDay ? renderDayDetail(selectedDay) : renderDayList();
  }
}

// Large "which day is this" label shown centered atop a day's detail page
// — distinct from the h2 (which always shows the full weekday+date). Today
// and yesterday/tomorrow are unambiguous by name; 2-7 days out only reads
// as a weekday, since "in 5 days" doesn't have a name people reach for;
// beyond that window (or more than a day in the past) there's nothing
// clarifying to say, so it renders nothing at all.
function dayHeaderTag(dateStr){
  const diffDays = Math.round((new Date(dateStr+'T00:00:00') - new Date(todayStr()+'T00:00:00')) / 86400000);
  if(diffDays === 0) return { text:'Today', today:true };
  if(diffDays === 1) return { text:'Tomorrow', today:false };
  if(diffDays === -1) return { text:'Yesterday', today:false };
  if(diffDays >= 2 && diffDays <= 7) return { text: new Date(dateStr+'T00:00:00').toLocaleDateString('en-US', { weekday:'long' }), today:false };
  return null;
}

function renderDayList(){
  const days = state.days.slice().sort((a,b)=> b.localeCompare(a));
  let html = `
    <div class="adddayrow">
      <button class="addday" onclick="addDay()">+ Add a Day</button>
      <button class="pickdatebtn" onclick="togglePicker()">${pickerOpen ? 'Cancel' : 'Pick a date…'}</button>
    </div>
    ${pickerOpen ? `
    <div class="pickerwrap">
      <input type="date" id="pickDateInput" value="${todayStr()}">
      <button class="pullbtn" onclick="confirmPickDate()">Add this day</button>
    </div>` : ''}
  `;

  if(days.length===0){
    html += `<div class="empty">No days logged yet. Add today and start a priority list.</div>`;
    return html;
  }

  const curKey = monthKey(todayStr());
  const currentDays = days.filter(d=>monthKey(d)===curKey);
  const pastDays = days.filter(d=>monthKey(d)!==curKey);
  const pastGroups = {};
  pastDays.forEach(d=>{ const k=monthKey(d); (pastGroups[k]=pastGroups[k]||[]).push(d); });
  const pastKeys = Object.keys(pastGroups).sort((a,b)=>b.localeCompare(a));

  html += `<div class="daylistlabel">This Month</div>`;
  html += currentDays.length
    ? currentDays.map(dayItemHtml).join('')
    : `<div class="empty" style="padding:14px 4px;">Nothing logged yet this month.</div>`;

  pastKeys.forEach(k=>{
    const open = expandedMonths.has(k);
    html += `
      <div class="monthgroup">
        <button class="monthhead" onclick="toggleMonthGroup('${k}')">
          <span>${monthLabel(k)}</span>
          <span class="count">${pastGroups[k].length} day${pastGroups[k].length===1?'':'s'} ${open?'▾':'▸'}</span>
        </button>
        ${open ? `<div class="monthbody">${pastGroups[k].map(dayItemHtml).join('')}</div>` : ''}
      </div>`;
  });

  return html;
}

function dayItemHtml(dateStr){
  const { total, done } = dayItemsSummary(dateStr);
  const ratio = total ? `<span class="badge subcount">${done}/${total}</span>` : `<span class="badge due">Empty</span>`;
  const isToday = dateStr === todayStr();
  return `
    <button class="dayitem" onclick="openDay('${dateStr}')">
      <span class="daydate">${dayLabel(dateStr)}${isToday ? '<span class="todaytag">Today</span>' : ''}</span>
      ${ratio}
    </button>`;
}

// A step or a whole checklist is a candidate to add to a day the same
// way a whole task is: not done, and — if due-dated — due today,
// overdue, or due within 3 days (a dateless task/step stays eligible
// unconditionally). Scoped to one category at a time since both picker
// styles browse category-first.
function dayCandidateTasks(dateStr, categoryId){
  return state.tasks.filter(t=>
    t.category===categoryId && t.status!=='done' && !isChecklistCategory(t.category) &&
    (!t.dueDate || isDueWithinDays(t.dueDate, 3))
  );
}

function toggleDayAdd(){
  dayAddOpen = !dayAddOpen;
  renderDaily();
}

function toggleDayTreeNode(key){
  if(dayTreeExpanded.has(key)) dayTreeExpanded.delete(key); else dayTreeExpanded.add(key);
  renderDaily();
}

// The three toggle* functions below are the only way anything gets
// added to or removed from a day through the tree picker — each wraps
// an existing mutator (which already does its own pushUndo/render/
// queueSave) so the tree can treat "add" and "remove" as one flip of
// the same switch rather than two different code paths, and so a row
// never has to disappear from the tree just because it's already
// planned — it stays put and picks up the "added" mark/flash instead.
// dayTreeFlashKey is set just before the mutator runs (so the render()
// inside it picks up the flash class for this one pass) and cleared
// shortly after — see the flashtoggle CSS and the comment on
// dayTreeFlashKey's declaration above for why the timeout matters.
async function toggleDayTreeTask(taskId, dateStr){
  const t = state.tasks.find(t=>t.id===taskId);
  if(!t) return;
  const key = 'task:'+taskId;
  dayTreeFlashKey = key;
  if((t.plannedDates||[]).includes(dateStr)) await unplanTaskFromDay(taskId, dateStr);
  else await planTaskForDay(taskId, dateStr);
  setTimeout(()=>{ if(dayTreeFlashKey===key) dayTreeFlashKey = null; }, 700);
}

async function toggleDayTreeSub(taskId, subId, dateStr){
  const t = state.tasks.find(t=>t.id===taskId);
  const s = t && (t.subtasks||[]).find(s=>s.id===subId);
  if(!s) return;
  const key = 'sub:'+subId;
  dayTreeFlashKey = key;
  if((s.plannedDates||[]).includes(dateStr)) await unplanSubtaskFromDay(taskId, subId, dateStr);
  else await pullSubtaskToDay(taskId, subId, dateStr);
  setTimeout(()=>{ if(dayTreeFlashKey===key) dayTreeFlashKey = null; }, 700);
}

async function toggleDayTreeChecklist(listId, dateStr){
  const t = state.tasks.find(t=>t.id===listId);
  if(!t) return;
  const key = 'cklist:'+listId;
  dayTreeFlashKey = key;
  if((t.plannedDates||[]).includes(dateStr)) await unplanTaskFromDay(listId, dateStr);
  else await planTaskForDay(listId, dateStr);
  setTimeout(()=>{ if(dayTreeFlashKey===key) dayTreeFlashKey = null; }, 700);
}

function dayTreeTaskHtml(t, dateStr){
  const key = 'task:'+t.id;
  const open = dayTreeExpanded.has(key);
  const subs = t.subtasks || [];
  const alreadyWhole = (t.plannedDates||[]).includes(dateStr);
  const flash = dayTreeFlashKey===key ? ' flashtoggle' : '';
  return `
    <div class="daytreenode sub">
      <div class="daytreetaskrow${flash}">
        <button class="daytreelabel" onclick="toggleDayTreeNode('${key}')">${subs.length ? (open?'▾':'▸') : '·'} ${escapeHtml(t.title)}</button>
        ${alreadyWhole ? `<span class="daytreemark" title="On today's list">✓</span>` : ''}
        <button class="daytreeleaf whole ${alreadyWhole?'added':''}" onclick="toggleDayTreeTask('${t.id}','${dateStr}')">${alreadyWhole?'Added':'+ Whole task'}</button>
      </div>
      ${open && subs.length ? `<div class="daytreechildren">
        ${subs.map(s=>daySubLeafHtml(t, s, dateStr)).join('')}
      </div>` : ''}
    </div>`;
}

function daySubLeafHtml(t, s, dateStr){
  const planned = (s.plannedDates||[]).includes(dateStr);
  const key = 'sub:'+s.id;
  const flash = dayTreeFlashKey===key ? ' flashtoggle' : '';
  return `
    <div class="daytreeleafrow${flash}">
      <button class="daytreeleaf" onclick="toggleDayTreeSub('${t.id}','${s.id}','${dateStr}')">${planned ? '<span class="daytreemark">✓</span> ' : ''}${escapeHtml(s.text)}</button>
      <button class="daytreeaddbtn ${planned?'added':''}" onclick="toggleDayTreeSub('${t.id}','${s.id}','${dateStr}')">${planned?'Added':'+ Add'}</button>
    </div>`;
}

// showListDates (Settings → Dev Settings) reuses the same .listdate class
// checklistListRowHtml() uses for a list's created-date — always rendered,
// just hidden by CSS unless that dev toggle is on, same idiom.
function dayTreeChecklistLeafHtml(t, dateStr){
  const planned = (t.plannedDates||[]).includes(dateStr);
  const key = 'cklist:'+t.id;
  const flash = dayTreeFlashKey===key ? ' flashtoggle' : '';
  return `
    <div class="daytreeleafrow${flash}">
      <button class="daytreeleaf" onclick="toggleDayTreeChecklist('${t.id}','${dateStr}')">${planned ? '<span class="daytreemark">✓</span> ' : ''}${escapeHtml(t.title)}<span class="listdate">${fmtDate(t.createdAt)}</span></button>
      <button class="daytreeaddbtn ${planned?'added':''}" onclick="toggleDayTreeChecklist('${t.id}','${dateStr}')">${planned?'Added':'+ Add'}</button>
    </div>`;
}

function renderAddToDayPicker(dateStr){
  if(!dayAddOpen){
    return `<button class="pullbtn dayaddtoggle" onclick="toggleDayAdd()">+ Add to this day</button>`;
  }
  const taskCatsHtml = standardCategoryEntries().map(([k,v])=>{
    const key = 'cat:'+k;
    const open = dayTreeExpanded.has(key);
    const tasks = dayCandidateTasks(dateStr, k);
    return `
      <div class="daytreenode">
        <button class="daytreelabel daytreecat" onclick="toggleDayTreeNode('${key}')">
          <span class="daytreetriangle">${open?'▾':'▸'}</span>${categoryDotHtml(v, 'dot')}${escapeHtml(v.label)}
        </button>
        ${open ? `<div class="daytreechildren">
          ${tasks.length ? tasks.map(t=>dayTreeTaskHtml(t, dateStr)).join('') : `<div class="empty" style="padding:4px 0;">Nothing eligible here.</div>`}
        </div>` : ''}
      </div>`;
  }).join('');

  const checklistCatsHtml = Object.entries(CATEGORIES).filter(([,v])=>v.type==='checklist').map(([k,v])=>{
    const key = 'cklist:'+k;
    const open = dayTreeExpanded.has(key);
    // A completed list has nothing left to add to a day, same reasoning
    // dayCandidateTasks already applies to standard tasks.
    const lists = checklistLists(k).filter(t=>t.status!=='done');
    return `
      <div class="daytreenode">
        <button class="daytreelabel daytreecat" onclick="toggleDayTreeNode('${key}')">
          <span class="daytreetriangle">${open?'▾':'▸'}</span>${categoryDotHtml(v, 'dot')}${escapeHtml(v.label)}
        </button>
        ${open ? `<div class="daytreechildren">
          ${lists.length ? lists.map(t=>dayTreeChecklistLeafHtml(t, dateStr)).join('') : `<div class="empty" style="padding:4px 0;">No lists here.</div>`}
        </div>` : ''}
      </div>`;
  }).join('');

  return `
    <div class="dayaddpanel">
      <div class="dayaddhead">
        <div class="daylistlabel" style="margin:0;">Add to this day</div>
        <button class="dayaddclose" onclick="toggleDayAdd()" title="Close">×</button>
      </div>
      ${taskCatsHtml}
      <div class="daytreesection">Checklists</div>
      ${checklistCatsHtml}
    </div>
  `;
}

// A step planned onto a day, shown "TASK > STEP" with the step's own
// small square .subcheck — deliberately a different shape from a whole
// task's big .check or a checklist's round .checkcircle, so a step-daily
// reads at a glance as a lighter-weight item than either.
// `nested` is true when this step's parent task is also planned whole
// onto the same day — renderDayDetail groups it directly under the
// parent's own row in that case (see the nestedByParent grouping there),
// so the "TASK > " prefix would be redundant and it gets an indent
// instead. An "orphan" step (parent not itself on this day) stays flat
// with the prefix, same as before, since there's no parent row nearby to
// read it as nested under.
function daySubtaskRowHtml(task, sub, dateStr, nested){
  const nextDate = addDaysToDateStr(dateStr, 1);
  const onTomorrow = (sub.plannedDates||[]).includes(nextDate);
  // Matches the invisible-when-not-draggable spacer taskRowHtml reserves
  // for its own .draghandle, so an orphan step's checkbox lines up under
  // a whole task's — see the .checkwrap.daysub / .draghandle comment in
  // <style>. Skipped when nested: indentation already reads as "under its
  // parent" without also needing to sit on the same checkbox column.
  const draggableMain = sortMode === 'default';
  const spacer = (!nested && draggableMain)
    ? `<span class="draghandle" style="visibility:hidden" aria-hidden="true">⠿</span>`
    : '';
  // Always "TASK > step", nested or not — an orphan step (parent not on
  // this day) and a nested one (parent's own row sitting right above it)
  // used to read differently depending on which day you were looking at,
  // which was the actual complaint: the same step could show as bare
  // "step" on one day and "TASK > step" on another. Nesting still gets
  // its indent (below) as an *additional* cue, it just isn't the only one.
  const label = `<span class="daysubparent">${escapeHtml(task.title)} &gt; </span>${escapeHtml(sub.text)}`;
  return `
  <li class="task ${nested ? 'daysubnested' : ''}">
    <div class="row" onclick="openTaskDetailFromDay('${task.id}')">
      ${spacer}
      <div class="checkwrap daysub" onclick="event.stopPropagation()">
        <div class="subcheck ${sub.done?'done':''}" onclick="toggleSubtask('${task.id}','${sub.id}')"></div>
      </div>
      <div class="title ${sub.done?'done':''}">${label}</div>
      <button class="movetmrw" ${onTomorrow?'disabled':''} onclick="event.stopPropagation(); moveSubtaskToTomorrow('${task.id}','${sub.id}','${dateStr}')" title="${onTomorrow ? 'Already planned for tomorrow' : 'Also plan for tomorrow'}">→</button>
      <button class="dayremove" onclick="event.stopPropagation(); unplanSubtaskFromDay('${task.id}','${sub.id}','${dateStr}')" title="Remove from this day">×</button>
    </div>
  </li>`;
}

function dayChecklistRowHtml(t, dateStr){
  return `
  <li class="task">
    <div class="row" onclick="openChecklistListFromDay('${t.id}','${dateStr}')">
      ${checklistCheckcircleHtml(t)}
      <div class="title ${t.status==='done'?'done':''}">${escapeHtml(t.title)}</div>
      <button class="dayremove" onclick="event.stopPropagation(); unplanTaskFromDay('${t.id}','${dateStr}')" title="Remove from this day">×</button>
    </div>
  </li>`;
}

function renderDayDetail(dateStr){
  const allTasks = standardTasksForDay(dateStr);
  const sorted = applySortMode(allTasks);
  const subItems = subDailyItemsForDay(dateStr);
  const checklistItems = checklistDailyItemsForDay(dateStr);
  const { total, done } = dayItemsSummary(dateStr);
  // What moveIncompleteToTomorrow() actually moves is unfinished standard
  // tasks and steps — this count has to match that exactly, not the
  // unified day total, or the button's label would promise more than it
  // delivers.
  const unfinishedTasks = allTasks.filter(t=>t.status!=='done');
  const unfinishedSubs = subItems.filter(x=>!x.sub.done);
  const unfinishedCount = unfinishedTasks.length + unfinishedSubs.length;
  const isPast = dateStr < todayStr();
  const nextDate = addDaysToDateStr(dateStr, 1);
  const headerTag = dayHeaderTag(dateStr);
  // For the prev/next arrows flanking the h2 below — null when this day
  // sits at either end of your logged days (see adjacentDayStr()), which
  // just renders as a disabled arrow rather than wrapping or erroring.
  const prevDayStr = adjacentDayStr(dateStr, -1);
  const nextDayStr = adjacentDayStr(dateStr, 1);

  // Whole tasks and steps share one list — a step planned onto a day is
  // just as much "on today's list" as a whole task is, so there's no
  // separate "Steps" section splitting them apart. Checklists stay their
  // own group below: a whole named list is a different enough kind of
  // thing (opens into its own page, has no due date/priority) that
  // lumping it in with tasks/steps would be more confusing than helpful.
  // Every task shows, including completed ones — completed just render
  // crossed out, so you can see the whole day's shape at a glance.
  //
  // A step whose parent task is *also* planned whole onto this day
  // renders directly under that task's own row (nested, no "TASK > "
  // prefix — see daySubtaskRowHtml) instead of out in the flat list, so
  // the day reads as an actual outline rather than every step floating
  // independently next to its own task. A step whose parent isn't itself
  // on this day (only the step was pulled in) has no row to nest under,
  // so it stays a flat "TASK > step" row same as before.
  const sortedIds = new Set(sorted.map(t=>t.id));
  const nestedSteps = {};
  const orphanSteps = [];
  subItems.forEach(x=>{
    if(sortedIds.has(x.task.id)) (nestedSteps[x.task.id] = nestedSteps[x.task.id] || []).push(x);
    else orphanSteps.push(x);
  });
  const mainCount = sorted.length + subItems.length;
  const mainListHtml = mainCount ? `
    <ul class="tasks">${
      sorted.map(t => taskRowHtml(t, true, true, dateStr) +
        (nestedSteps[t.id] ? nestedSteps[t.id].map(x=>daySubtaskRowHtml(x.task, x.sub, dateStr, true)).join('') : '')
      ).join('') +
      orphanSteps.map(x=>daySubtaskRowHtml(x.task, x.sub, dateStr, false)).join('') +
      dropEndHtml(sorted)
    }</ul>
  ` : '';
  // Only claim "nothing planned" when the day is truly empty across all
  // three kinds of item — a day with only a checklist planned (no tasks,
  // no steps) shouldn't say nothing's planned right above that checklist.
  const emptyMsg = total ? '' : `<div class="empty">Nothing planned for this day yet.</div>`;
  const checklistsBlock = checklistItems.length ? `
    <div class="daylistlabel">Checklists</div>
    <ul class="tasks">${checklistItems.map(t=>dayChecklistRowHtml(t, dateStr)).join('')}</ul>
  ` : '';

  return `
    <div class="stackedpage">
      ${pageTagHtml('closeDay()', 'All Days')}
      ${headerTag ? `<div class="dayherorow"><span class="dayhero ${headerTag.today?'today':''}">${headerTag.text}</span></div>` : ''}
      <div class="daydetailhead">
        <div class="daynav">
          <button class="navarrow" ${prevDayStr ? `onclick="goToAdjacentDay(-1)"` : 'disabled'} title="Previous day">‹</button>
          <h2>${dayLabel(dateStr)}</h2>
          <button class="navarrow" ${nextDayStr ? `onclick="goToAdjacentDay(1)"` : 'disabled'} title="Next day">›</button>
        </div>
        <div class="daydetailheadright">
          <div class="dayprogress">${total ? `${done} of ${total} done` : 'Nothing planned yet'}</div>
          ${unfinishedCount>0 && dateStr<=todayStr() ? `<button class="pullbtn" onclick="moveIncompleteToTomorrow('${dateStr}')">Move ${unfinishedCount} incomplete → ${fmtDate(nextDate)}</button>` : ''}
        </div>
      </div>
      ${isPast ? `<div class="lockednote"><span>🔒 This day has passed</span></div>` : ''}
      <div class="quickadd">
        <input type="text" id="dayQuickInput" placeholder="Add a new task for this day…" onkeydown="if(event.key==='Enter') addDayTask('${dateStr}')">
        <select id="dayQuickCategory">
          ${standardCategoryEntries().map(([k,v])=>`<option value="${k}" ${k==='personal'?'selected':''}>${v.label}</option>`).join('')}
        </select>
        <button class="addbtn" onclick="addDayTask('${dateStr}')">+</button>
      </div>
      ${renderAddToDayPicker(dateStr)}
      <div class="sortrow">
        <label class="fieldlabel">SORT</label>
        <select onchange="setSortMode(this.value)">${sortModeOptionsHtml(true)}</select>
      </div>
      ${emptyMsg}
      ${mainListHtml}
      ${checklistsBlock}
    </div>
  `;
}

// ---------- Checklist category type ----------
// A checklist category's "tasks" are named lists (still plain state.tasks
// entries — same id/category/status/createdAt shape as everything else,
// which is what lets the Claude digest, undo, and save/load all keep
// working on them for free) whose subtasks array holds "items" instead of
// steps. Two-level drill-down modeled directly on the Daily tab: an
// overview of all lists in the category, and a single list's own detail
// view — selectedListId plays the same role selectedDay does there.
// Deliberately minimal: no due date, priority, timeframe, or notes: those
// fields still exist on the task object (every task has them) but are
// simply never shown or set for a checklist list, matching the "just a
// name and items" brief.

function renderChecklist(){
  const el = document.getElementById('checklistView');
  // Guards against a stale selectedListId left over from a different
  // checklist category (only one global "currently open list" exists,
  // same as selectedDay) — falls back to the overview rather than
  // showing another category's list under this tab's header.
  if(selectedListId){
    const t = state.tasks.find(t=>t.id===selectedListId);
    if(!t || t.category !== activeTab) selectedListId = null;
  }
  if(checklistPendingOpen){
    el.innerHTML = renderChecklistPending(activeTab);
  } else if(selectedListId){
    el.innerHTML = renderChecklistDetail(selectedListId);
  } else {
    el.innerHTML = renderChecklistOverview(activeTab);
  }
}

function checklistLists(categoryId){
  return sortTasks(state.tasks.filter(t=>t.category===categoryId));
}

// A list marked done overrides its items' individual done flags for
// "pending" purposes — once the whole list is checked off complete,
// leftover unchecked items inside it shouldn't keep counting toward (or
// showing up in) the cross-list pending view.
function checklistPendingItems(t){
  if(t.status === 'done') return [];
  return (t.subtasks || []).filter(s=>!s.done);
}

function renderChecklistOverview(categoryId){
  const cat = CATEGORIES[categoryId];
  const lists = checklistLists(categoryId);
  const visible = lists.filter(t => showDone || t.status!=='done');
  const doneCount = lists.filter(t=>t.status==='done').length;
  const pendingTotal = lists.reduce((sum,t)=>sum+checklistPendingItems(t).length, 0);
  return `
    ${pendingTotal ? pageTagHtml(`openChecklistPending('${categoryId}')`, `Pending ${pendingTotal}`, true) : ''}
    <div class="quickadd">
      <input type="text" id="checklistQuickInput" placeholder="Name a new list…"
        onkeydown="if(event.key==='Enter') addChecklistList('${categoryId}')">
      <button class="addbtn" onclick="addChecklistList('${categoryId}')">+</button>
    </div>
    <ul class="tasks">
      ${visible.length ? visible.map(t=>checklistListRowHtml(t)).join('') : `<div class="empty">${cat ? `No lists in ${escapeHtml(cat.label)} yet.` : 'No lists yet.'} Add one above.</div>`}
    </ul>
    <div class="footer-row"><button onclick="toggleShowDone()">${showDone ? `Hide completed (${doneCount})` : `Show completed (${doneCount})`}</button></div>
  `;
}

// There are always exactly this many peg slots spaced evenly around the
// circle, regardless of item count — a 3-item list only fills the first
// 3 slots and leaves the rest of the ring bare, rather than stretching
// those 3 pegs to fill the whole circle. This is also the point past
// which it switches to a smooth progress ring instead, since much
// beyond this many discrete slots stops reading as separate pegs.
const CHECKLIST_PEG_LIMIT = 12;
const PEG_SLOT_DEG = 360 / CHECKLIST_PEG_LIMIT;
// Both the first peg slot and the progress ring's 0% point start here:
// top-left rather than dead center-top. Kept as a multiple of
// PEG_SLOT_DEG (30°) on purpose — since 90° (the gap between the four
// cardinal directions) is exactly 3 slots, that's what guarantees the
// slots nearest top/right/bottom/left land exactly on those axes
// instead of sitting at an off-angle. -25 (nearer the "25° left of top"
// originally asked for) would have thrown that off.
const PEG_START_DEG = -30;

// At or under the threshold: one fixed-size .peg per item, in list
// order, at slot i's angle — so an item's peg always sits at the same
// slot and never resizes or moves as items are added elsewhere in the
// list, it just adds one more peg at the next slot. Past the threshold,
// a single smooth conic-gradient sweep instead (same start angle, via
// conic-gradient's `from`), since that many discrete slots would read as
// clutter rather than countable pegs.
function checklistProgressHtml(subs){
  if(!subs.length) return '';
  const done = subs.filter(s=>s.done).length;
  const total = subs.length;
  if(total <= CHECKLIST_PEG_LIMIT){
    // translateZ(0) alongside the rotate is a no-op visually, but it's
    // there specifically so every pegpivot gets promoted to its own
    // GPU-composited layer the same way, regardless of angle. Without
    // it, rotate(0deg) — which a peg lands on exactly whenever a slot
    // falls on a cardinal axis — can get treated by the browser as an
    // identity transform and rendered via the plain CPU layout/paint
    // path instead, snapped to a different sub-pixel grid than its
    // genuinely-rotated siblings. That mismatch is invisible at 100%
    // zoom but shows up as that one peg being a slightly different
    // size at other browser zoom levels, since layout-snapped and
    // compositor-positioned elements round fractional device pixels
    // differently once the CSS-px-to-device-px ratio isn't 1:1.
    return subs.map((s,i)=>{
      const angle = PEG_START_DEG + i*PEG_SLOT_DEG;
      return `<span class="pegpivot ${s.done?'filled':''}" style="transform:rotate(${angle}deg) translateZ(0)"><span class="peg"></span></span>`;
    }).join('');
  }
  const pct = Math.round(done/total*100);
  return `<div class="progressring" style="background: conic-gradient(from ${PEG_START_DEG}deg, var(--ink) ${pct}%, var(--line) 0)"></div>`;
}

// Shared by the small icon next to each row in the overview and the
// large header atop a list's own detail page (.checklistheader scales
// this same markup up via CSS transform) — one definition means the two
// can never drift out of sync with each other.
function checklistCheckcircleHtml(t){
  const subs = t.subtasks || [];
  const done = subs.filter(s=>s.done).length;
  const total = subs.length;
  return `<div class="checkcircle-wrap" title="${total ? `${done}/${total} items` : ''}">
    ${checklistProgressHtml(subs)}
    <div class="checkcircle ${t.status==='done'?'done':''}" onclick="event.stopPropagation(); toggleStatus('${t.id}')"></div>
  </div>`;
}

function checklistListRowHtml(t){
  return `
  <li class="task" onclick="openChecklistList('${t.id}')">
    <div class="row">
      ${checklistCheckcircleHtml(t)}
      <div class="title ${t.status==='done'?'done':''}">${escapeHtml(t.title)}<span class="listdate">${fmtDate(t.createdAt)}</span></div>
    </div>
  </li>`;
}

function renderChecklistDetail(taskId){
  const t = state.tasks.find(t=>t.id===taskId);
  const cat = CATEGORIES[t.category];
  const subs = t.subtasks || [];
  // Opened from a day's Checklists section (see openChecklistListFromDay)
  // — the back tag should return there, not to this list's own category
  // overview, and say so rather than showing a label ("Lists") that no
  // longer matches where closeChecklistList() is actually about to go.
  const backLabel = checklistReturnDay ? 'Daily' : (cat ? cat.label : 'Lists');
  return `
    <div class="stackedpage">
      ${pageTagHtml('closeChecklistList()', backLabel)}
      <div class="checklistheader">${checklistCheckcircleHtml(t)}</div>
      <input type="text" class="titleedit checklisttitle" value="${escapeHtml(t.title)}"
        onblur="updateTitle('${t.id}', this.value)"
        onkeydown="if(event.key==='Enter'){ event.preventDefault(); this.blur(); }">
      <div class="taskmeta checklistmeta">Created ${fmtDate(t.createdAt)}</div>
      <div class="subwrap">
        ${subs.map(s=>`
          <div class="subrow ${t.status==='done'?'listdone':''}" ondragover="subDragOver(event)" ondrop="subDrop(event,'${t.id}','${s.id}')">
            <span class="draghandle sub" draggable="true" ondragstart="subDragStart(event,'${t.id}','${s.id}')" ondragend="subDragEnd()" title="Drag to reorder">⠿</span>
            <div class="subcheck circle ${s.done?'done':''}" onclick="toggleSubtask('${t.id}','${s.id}')"></div>
            <div class="subtext ${s.done?'done':''}" onclick="startEditSubtask(this,'${t.id}','${s.id}')">${escapeHtml(s.text)}</div>
            <button class="subdel" onclick="deleteSubtask('${t.id}','${s.id}')">×</button>
          </div>`).join('')}
        ${subDropEndHtml(t.id, subs)}
        <input type="text" class="subadd" placeholder="+ add an item, enter to save" onkeydown="if(event.key==='Enter'){ addSubtask('${t.id}', this.value); }">
      </div>
      <div class="footer-row"><button class="remove" onclick="deleteChecklistList('${t.id}')">Delete list</button></div>
    </div>
  `;
}

// Flat "what's still left" across every list in the category — the
// explicit ask was a way to see all pending items at once without
// opening each list one by one. Grouped by list (not a single flat pile)
// so an item still has context for which list it's from.
function renderChecklistPending(categoryId){
  const cat = CATEGORIES[categoryId];
  const groups = checklistLists(categoryId)
    .map(t => ({ list: t, pending: checklistPendingItems(t) }))
    .filter(g => g.pending.length);
  return `
    <div class="stackedpage">
      ${pageTagHtml('closeChecklistPending()', cat ? cat.label : 'Lists')}
      <div class="daylistlabel">All pending items</div>
      ${groups.length ? groups.map(g => `
        <div class="pendinggroup">
          <div class="sublabel">${escapeHtml(g.list.title)}</div>
          ${g.pending.map(s=>`
            <div class="subrow">
              <div class="subcheck circle" onclick="toggleSubtask('${g.list.id}','${s.id}')"></div>
              <div class="subtext" onclick="openChecklistList('${g.list.id}')">${escapeHtml(s.text)}</div>
            </div>`).join('')}
        </div>`).join('') : `<div class="empty">Nothing pending — everything's checked off.</div>`}
    </div>
  `;
}

// returnDay is optional — only openChecklistListFromDay passes it. Every
// other call site (the normal overview row click) omits it, which resets
// checklistReturnDay to null even if some earlier visit had left it set,
// so "opened from Daily" can never leak into an unrelated later open.
function openChecklistList(id, returnDay){
  checklistReturnDay = returnDay || null;
  selectedListId = id;
  render();
}
function closeChecklistList(){
  selectedListId = null;
  if(checklistReturnDay){
    const d = checklistReturnDay;
    checklistReturnDay = null;
    selectedDay = d;
    switchTab('daily');
    return;
  }
  render();
}
function openChecklistPending(categoryId){ checklistPendingOpen = true; render(); }
function closeChecklistPending(){ checklistPendingOpen = false; render(); }

async function addChecklistList(categoryId){
  const input = document.getElementById('checklistQuickInput');
  const title = input.value.trim();
  if(!title) return;
  pushUndo(`Added list "${title}"`);
  state.tasks.unshift({
    id: newId('task'), title, category: categoryId, status:'open', urgent:false, dueDate:'',
    notes:'', subtasks:[], plannedDates:[], timeframe:'', priority:0, completedAt:'', createdAt: todayStr()
  });
  render();
  // render() just rebuilt #checklistQuickInput from scratch (same
  // reason addSubtask() needs focusVisibleSubadd()) — refocus it so
  // adding several lists in a row doesn't drop focus after each Enter.
  document.getElementById('checklistQuickInput')?.focus();
  queueSave();
}

async function deleteChecklistList(id){
  const t = state.tasks.find(t=>t.id===id);
  pushUndo(`Deleted list "${t ? t.title : ''}"`);
  state.tasks = state.tasks.filter(t=>t.id!==id);
  selectedListId = null;
  render();
  queueSave();
}

async function addDayTask(dateStr){
  const input = document.getElementById('dayQuickInput');
  const title = input.value.trim();
  if(!title) return;
  const category = document.getElementById('dayQuickCategory').value;
  pushUndo(`Added "${title}"`);
  await ensureDay(dateStr);
  state.tasks.unshift({
    id: newId('task'),
    title, category, status:'open', urgent:false, dueDate:'', notes:'', subtasks:[], plannedDates:[dateStr], createdAt: todayStr(),
    timeframe:'', priority:0, completedAt:''
  });
  render();
  queueSave();
}

// Shared by both "add to day" picker styles (cascade and tree) — plans a
// whole task (or a whole checklist, since a checklist list is just a
// plain state.tasks entry too) onto a specific day. Additive: a task
// already planned on some other day keeps that day too, rather than
// getting bumped off it — plannedDates is an array specifically so a
// task/checklist can sit on any number of dailies at once (see the
// migration note in normalizeState()). Idempotent against a day it's
// already on, so re-clicking an "Added" tree row can't duplicate the date.
async function planTaskForDay(taskId, dateStr){
  const t = state.tasks.find(t=>t.id===taskId);
  if(!t) return;
  if(!t.plannedDates) t.plannedDates = [];
  if(t.plannedDates.includes(dateStr)) return;
  pushUndo(`Added "${t.title}" to day`);
  t.plannedDates.push(dateStr);
  await ensureDay(dateStr);
  render();
  queueSave();
}

async function unplanTaskFromDay(taskId, dateStr){
  const t = state.tasks.find(t=>t.id===taskId);
  if(!t) return;
  const idx = (t.plannedDates||[]).indexOf(dateStr);
  if(idx===-1) return;
  pushUndo(`Removed "${t.title}" from day`);
  t.plannedDates.splice(idx, 1);
  render();
  reopen(taskId);
  queueSave();
}

// Plans a single step onto a day independently of its parent task's own
// plannedDates — same idea as planTaskForDay, one level down.
async function pullSubtaskToDay(taskId, subId, dateStr){
  const t = state.tasks.find(t=>t.id===taskId);
  const s = t && (t.subtasks||[]).find(s=>s.id===subId);
  if(!s) return;
  if(!s.plannedDates) s.plannedDates = [];
  if(s.plannedDates.includes(dateStr)) return;
  pushUndo(`Added step "${s.text}" to day`);
  s.plannedDates.push(dateStr);
  await ensureDay(dateStr);
  render();
  queueSave();
}

async function unplanSubtaskFromDay(taskId, subId, dateStr){
  const t = state.tasks.find(t=>t.id===taskId);
  const s = t && (t.subtasks||[]).find(s=>s.id===subId);
  if(!s) return;
  const idx = (s.plannedDates||[]).indexOf(dateStr);
  if(idx===-1) return;
  pushUndo(`Removed step "${s.text}" from day`);
  s.plannedDates.splice(idx, 1);
  render();
  queueSave();
}

// Same copy-forward semantics as moveIncompleteToTomorrow, one item at a
// time — keeps the item on the day it started on and additionally plans
// it onto tomorrow, rather than pulling it off today (that's a different
// action the project owner didn't want here). Idempotent: a no-op once
// tomorrow's date is already in plannedDates, so the button can safely be
// left enabled without risking a duplicate — see the taskRowHtml/
// daySubtaskRowHtml render sites for where it's disabled once already added.
async function moveTaskToTomorrow(taskId, dateStr){
  const t = state.tasks.find(t=>t.id===taskId);
  if(!t) return;
  const nextDate = addDaysToDateStr(dateStr, 1);
  if(!t.plannedDates) t.plannedDates = [];
  if(t.plannedDates.includes(nextDate)) return;
  pushUndo(`Also planned "${t.title}" for ${fmtDate(nextDate)}`);
  t.plannedDates.push(nextDate);
  await ensureDay(nextDate);
  render();
  queueSave();
}

async function moveSubtaskToTomorrow(taskId, subId, dateStr){
  const t = state.tasks.find(t=>t.id===taskId);
  const s = t && (t.subtasks||[]).find(s=>s.id===subId);
  if(!s) return;
  const nextDate = addDaysToDateStr(dateStr, 1);
  if(!s.plannedDates) s.plannedDates = [];
  if(s.plannedDates.includes(nextDate)) return;
  pushUndo(`Also planned step "${s.text}" for ${fmtDate(nextDate)}`);
  s.plannedDates.push(nextDate);
  await ensureDay(nextDate);
  render();
  queueSave();
}

// A checklist row inside the Daily view opens into the checklist detail
// page, but that page only ever shows while its own category tab is
// active (see render()'s isChecklist branch) — switching tabs first is
// what actually makes it visible, openChecklistList() alone would just
// set selectedListId behind the still-showing Daily view.
function openChecklistListFromDay(taskId, dateStr){
  const t = state.tasks.find(t=>t.id===taskId);
  if(!t) return;
  switchTab(t.category);
  openChecklistList(taskId, dateStr);
}

// The compact replacement for the old "Plan for Day" date picker — one
// tap, toggles specifically *today's* membership in plannedDates. A task
// already planned on some other day keeps that day too (see the note on
// planTaskForDay) — this button only ever adds/removes today, it never
// touches any other day the task is already planned for.
async function toggleTaskToday(id){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  if(!t.plannedDates) t.plannedDates = [];
  const today = todayStr();
  const idx = t.plannedDates.indexOf(today);
  const willPlan = idx === -1;
  pushUndo(willPlan ? `Added "${t.title}" to today` : `Removed "${t.title}" from today`);
  if(willPlan) t.plannedDates.push(today); else t.plannedDates.splice(idx, 1);
  if(willPlan) await ensureDay(today);
  render();
  reopen(id);
  queueSave();
}

// Setting timeframe to "today" also plans the task for today's Daily list
// — one-way only. Changing the timeframe away from "today" later doesn't
// auto-unplan it, since the task may since have been deliberately kept on
// that day's list for reasons unrelated to this field; use the existing
// Unplan button for that.
async function updateTimeframe(id, val){
  const t = state.tasks.find(t=>t.id===id);
  if(!t || val === t.timeframe) return;
  pushUndo(`Set timeframe for "${t.title}"`);
  t.timeframe = val;
  if(val === 'today'){
    if(!t.plannedDates) t.plannedDates = [];
    if(!t.plannedDates.includes(todayStr())) t.plannedDates.push(todayStr());
    await ensureDay(todayStr());
  }
  render();
  reopen(id);
  queueSave();
}

async function updatePriority(id, val){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  const p = parseInt(val, 10) || 0;
  if(p === t.priority) return;
  pushUndo(`Set priority for "${t.title}"`);
  t.priority = p;
  render();
  reopen(id);
  queueSave();
}

function startEditSubtask(el, taskId, subId){
  const t = state.tasks.find(t=>t.id===taskId);
  const s = t && (t.subtasks||[]).find(s=>s.id===subId);
  if(!s) return;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'subedit';
  input.value = s.text;
  el.replaceWith(input);
  input.focus();
  input.select();
  let committed = false;
  const commit = async () => {
    if(committed) return;
    committed = true;
    const val = input.value.trim();
    if(val && val !== s.text){
      pushUndo(`Renamed step to "${val}"`);
      s.text = val;
      queueSave();
    }
    render();
    reopen(taskId);
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); input.blur(); } });
}

// Same swap-in-a-text-input trick as startEditSubtask(), but the typed
// value goes through parseNaturalDate() rather than being saved as-is.
// An empty input clears the date; a non-empty value that fails to parse
// just reverts to whatever was there before — silently guessing wrong
// would be worse than making the user retype it.
function startEditSubtaskDate(el, taskId, subId){
  const t = state.tasks.find(t=>t.id===taskId);
  const s = t && (t.subtasks||[]).find(s=>s.id===subId);
  if(!s) return;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'subdateedit';
  input.value = s.dueDate ? fmtDateShort(s.dueDate) : '';
  input.placeholder = 'today, tmrw, 9/1, tue…';
  el.replaceWith(input);
  input.focus();
  input.select();
  let committed = false;
  const commit = async () => {
    if(committed) return;
    committed = true;
    const raw = input.value.trim();
    if(!raw){
      if(s.dueDate) await updateSubtaskDueDate(taskId, subId, '');
      else { render(); reopen(taskId); }
      return;
    }
    const parsed = parseNaturalDate(raw);
    if(parsed) await updateSubtaskDueDate(taskId, subId, parsed);
    else { render(); reopen(taskId); } // unparseable — revert, don't save
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); input.blur(); } });
}

// Same auto-plan-onto-its-due-day behavior as updateDueDate — see the
// comment there.
async function updateSubtaskDueDate(taskId, subId, dueDate){
  const t = state.tasks.find(t=>t.id===taskId);
  const s = t && (t.subtasks||[]).find(s=>s.id===subId);
  if(!s) return;
  pushUndo(dueDate ? `Dated step "${s.text}"` : `Cleared date for step "${s.text}"`);
  s.dueDate = dueDate;
  if(dueDate && isDueWithinDays(dueDate, 3)){
    if(!s.plannedDates) s.plannedDates = [];
    if(!s.plannedDates.includes(dueDate)){
      s.plannedDates.push(dueDate);
      await ensureDay(dueDate);
    }
  }
  render();
  reopen(taskId);
  queueSave();
}

async function toggleSubtaskToday(taskId, subId){
  const t = state.tasks.find(t=>t.id===taskId);
  const s = t && (t.subtasks||[]).find(s=>s.id===subId);
  if(!s) return;
  if(!s.plannedDates) s.plannedDates = [];
  const today = todayStr();
  const idx = s.plannedDates.indexOf(today);
  const willPlan = idx === -1;
  pushUndo(willPlan ? `Added step "${s.text}" to today` : `Removed step "${s.text}" from today`);
  if(willPlan) s.plannedDates.push(today); else s.plannedDates.splice(idx, 1);
  if(willPlan) await ensureDay(today);
  render();
  reopen(taskId);
  queueSave();
}

async function addTask(){
  const input = document.getElementById('quickInput');
  const title = input.value.trim();
  if(!title) return;
  const category = activeTab==='all' ? document.getElementById('quickCategory').value : activeTab;
  const timeframe = document.getElementById('quickTimeframe').value;
  const priority = parseInt(document.getElementById('quickPriority').value, 10) || 0;
  pushUndo(`Added "${title}"`);
  if(timeframe === 'today') await ensureDay(todayStr());
  state.tasks.unshift({
    id: newId('task'),
    title, category, status:'open', urgent: urgentDraft, dueDate:'', notes:'', subtasks: [],
    plannedDates: timeframe==='today' ? [todayStr()] : [],
    timeframe, priority, completedAt:'',
    createdAt: todayStr()
  });
  input.value = '';
  urgentDraft = false;
  document.getElementById('urgentToggle').classList.remove('on');
  document.getElementById('quickTimeframe').value = '';
  document.getElementById('quickPriority').value = '0';
  render();
  queueSave();
}

// Completing a task stamps completedAt; reopening it clears that stamp
// entirely rather than keeping a history of past completions — the undo
// stack is already this app's history mechanism for "what did this used
// to be," so a second, per-field log would just be redundant bookkeeping.
async function toggleStatus(id){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  const willBeDone = t.status !== 'done';
  pushUndo(willBeDone ? `Completed "${t.title}"` : `Reopened "${t.title}"`);
  t.status = willBeDone ? 'done' : 'open';
  t.completedAt = willBeDone ? todayStr() : '';
  render();
  queueSave();
}

async function toggleUrgent(id){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  const willBeUrgent = !t.urgent;
  pushUndo(willBeUrgent ? `Flagged "${t.title}" urgent` : `Unflagged "${t.title}"`);
  t.urgent = willBeUrgent;
  render();
  reopen(id);
  queueSave();
}

// Setting a due date within isDueWithinDays' 3-day/overdue window also
// plans the task onto that due date's daily — same window the "Add to
// this day" tree already uses to decide what's eligible to pull in, just
// applied automatically instead of waiting for a manual tree add.
// ensureDay() creates that day if it doesn't exist yet. One-way, same as
// updateTimeframe's "today" plan: pushing the due date back out past the
// window later doesn't retroactively unplan it.
async function updateDueDate(id, val){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  if(val === t.dueDate) return;
  pushUndo(`Changed due date for "${t.title}"`);
  t.dueDate = val;
  if(val && isDueWithinDays(val, 3)){
    if(!t.plannedDates) t.plannedDates = [];
    if(!t.plannedDates.includes(val)){
      t.plannedDates.push(val);
      await ensureDay(val);
    }
  }
  render();
  reopen(id);
  queueSave();
}

function reopen(id){
  expandedTaskIds.add(id);
  const exp = document.getElementById('exp-' + id);
  if(exp) exp.classList.add('open');
}

async function updateTitle(id, val){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  const newVal = val.trim();
  if(newVal && newVal !== t.title){
    pushUndo(`Renamed task to "${newVal}"`);
    t.title = newVal;
    queueSave();
  }
  render();
  reopen(id);
}

async function updateCategory(id, val){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  if(val === t.category) return;
  const label = (CATEGORIES[val] || FALLBACK_CATEGORY).label;
  pushUndo(`Moved "${t.title}" to ${label}`);
  t.category = val;
  render();
  reopen(id);
  queueSave();
}

// render() rebuilds the relevant view's whole innerHTML on every
// mutation, which destroys and recreates the "add a step/item" input
// rather than just clearing it in place — so the freshly-typed-into
// input loses focus after every single Enter unless something
// explicitly refocuses whichever new .subadd render() just created.
// Scoped to the currently visible one (offsetParent is null for a
// display:none element) since a hidden task's own .subadd can still be
// in the DOM even when it's not the one the user was just typing into.
function focusVisibleSubadd(){
  for(const el of document.querySelectorAll('.subadd')){
    if(el.offsetParent !== null){ el.focus(); return; }
  }
}

async function addSubtask(taskId, text){
  const val = (text||'').trim();
  if(!val) return;
  const t = state.tasks.find(t=>t.id===taskId);
  if(!t) return;
  pushUndo(`Added step to "${t.title}"`);
  if(!t.subtasks) t.subtasks = [];
  t.subtasks.push({ id: newId('sub'), text: val, done:false, dueDate:'', plannedDates:[] });
  render();
  reopen(taskId);
  focusVisibleSubadd();
  queueSave();
}

async function toggleSubtask(taskId, subId){
  const t = state.tasks.find(t=>t.id===taskId);
  if(!t) return;
  const s = (t.subtasks||[]).find(s=>s.id===subId);
  if(!s) return;
  pushUndo(s.done ? `Unchecked step in "${t.title}"` : `Checked step in "${t.title}"`);
  s.done = !s.done;
  render();
  reopen(taskId);
  queueSave();
}

async function deleteSubtask(taskId, subId){
  const t = state.tasks.find(t=>t.id===taskId);
  if(!t) return;
  pushUndo(`Deleted step from "${t.title}"`);
  t.subtasks = (t.subtasks||[]).filter(s=>s.id!==subId);
  render();
  reopen(taskId);
  queueSave();
}

async function updateNotes(id, val){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  if(val === t.notes) return;
  pushUndo(`Edited notes for "${t.title}"`);
  t.notes = val;
  queueSave();
}

async function deleteTask(id){
  const t = state.tasks.find(t=>t.id===id);
  pushUndo(`Deleted "${t ? t.title : 'task'}"`);
  state.tasks = state.tasks.filter(t=>t.id!==id);
  render();
  queueSave();
}

function toggleExpand(evt, id){
  if(expandedTaskIds.has(id)) expandedTaskIds.delete(id); else expandedTaskIds.add(id);
  const exp = document.getElementById('exp-' + id);
  exp.classList.toggle('open');
}

async function toggleLocation(){
  if(!state.locationEnabled || state.locations.length < 2) return;
  const idx = state.locations.findIndex(l=>l.id===state.location);
  state.location = state.locations[(idx + 1) % state.locations.length].id;
  if(!visibleTabs().includes(activeTab)) activeTab = 'all';
  render();
  queueSave();
}

function toggleAuthMode(){
  authMode = authMode === 'signin' ? 'signup' : 'signin';
  document.getElementById('authSubmitBtn').textContent = authMode === 'signin' ? 'Sign In' : 'Create Account';
  document.getElementById('authModeToggle').textContent =
    authMode === 'signin' ? 'Need an account? Create one' : 'Already have an account? Sign in';
  document.getElementById('authError').textContent = '';
}

async function submitAuth(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const errEl = document.getElementById('authError');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'Enter an email and password.'; return; }
  const endpoint = authMode === 'signin'
    ? `${SUPABASE_URL}/auth/v1/token?grant_type=password`
    : `${SUPABASE_URL}/auth/v1/signup`;
  try{
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if(!res.ok){ errEl.textContent = data.error_description || data.msg || 'Something went wrong.'; return; }
    if(!data.access_token){
      errEl.textContent = 'Check your email to confirm your account, then sign in.';
      return;
    }
    saveSession({
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: Date.now() + data.expires_in * 1000,
      user_id: data.user.id,
      email: data.user.email
    });
    await enterApp();
  }catch(e){
    errEl.textContent = 'Network error — try again.';
  }
}

function signOut(){
  saveSession(null);
  appEntered = false;
  stopAutoRefresh();
  localOnlyMode = false;
  settingsOpen = false;
  claudeView = null;
  selectedListId = null;
  checklistPendingOpen = false;
  pendingDeleteCategoryId = null;
  pendingDeleteLocationId = null;
  openCategoryPickerId = null;
  uiColorPickerOpen = false;
  customColorOpen = false;
  catWheelCancelDrag();
  undoStack = [];
  redoStack = [];
  expandedTaskIds = new Set();
  devPanelOpen = false;
  applyThemeObject(defaultTheme()); // login screen always shows the classic look
  document.getElementById('authEmail').value = '';
  document.getElementById('authPassword').value = '';
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('authShell').style.display = '';
  const devPanel = document.getElementById('devPanel');
  if(devPanel){ devPanel.style.display = 'none'; devPanel.classList.remove('open'); }
}

function continueLocally(){
  localOnlyMode = true;
  enterApp();
}

async function enterApp(){
  // Undo history is scoped to one login session — it should never let you
  // undo into a different account's data, or across a page reload.
  undoStack = [];
  redoStack = [];
  expandedTaskIds = new Set();
  claudeView = null;
  selectedListId = null;
  checklistPendingOpen = false;
  document.getElementById('authShell').style.display = 'none';
  document.getElementById('appShell').style.display = '';
  const signOutRow = document.getElementById('signOutRow');
  if(signOutRow){
    signOutRow.style.display = (window.storage || !session) ? 'none' : '';
    document.getElementById('authEmailLabel').textContent = session ? session.email : '';
  }
  const refreshBtn = document.getElementById('refreshBtn');
  if(refreshBtn) refreshBtn.style.display = (localOnlyMode || window.storage) ? 'none' : '';
  await loadState();
  // Restore whichever tab was active before the last reload/sign-in, rather
  // than always landing on "All" — visibleTabs() guards against a stale id
  // (a deleted category, or a tab left over from a different account on
  // this device) by falling back to whatever activeTab already is ('all').
  const lastTab = localStorage.getItem('ledger-last-tab');
  if(lastTab && visibleTabs().includes(lastTab)) activeTab = lastTab;
  applyTheme();
  applyDevSettings();
  render();
  appEntered = true;
  startAutoRefresh();
  // A `?claude=1` (or `?claude=full`) URL lets an agent (e.g. the Claude
  // Chrome extension) navigate straight to the plain-text view instead of
  // clicking through Settings, as long as it's using a browser session
  // that's already signed in here.
  const claudeParam = new URLSearchParams(location.search).get('claude');
  if(claudeParam) openClaudeView(claudeParam);
}

// ---------- Calendar category type ----------
// A calendar category's whole "content" is a month grid over the exact
// same state.days/plannedDates data the Daily tab lists day-by-day — see
// isCalendarCategory()'s comment in 01-categories-theme.js for why this
// is a category type rather than a second fixed tab. Nothing here owns
// or duplicates any data; every number on the grid comes straight from
// dayItemsSummary(), the same function Daily's own day-list/day-detail
// already use, so the two views can never disagree about what's on a
// given day.

// Which month is currently browsed — transient UI state, not persisted
// (same idiom as pickerOpen/expandedMonths), so it always starts back on
// the current month on a fresh load. Deliberately NOT reset by
// switchTab(): coming back to a calendar tab after a detour to some day's
// detail page should still show whatever month you were last looking at.
let calendarViewMonth = null;

function calendarMonth(){
  if(!calendarViewMonth) calendarViewMonth = monthKey(todayStr());
  return calendarViewMonth;
}

function shiftMonthKey(key, n){
  const [y, m] = key.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function calendarShiftMonth(delta){
  calendarViewMonth = shiftMonthKey(calendarMonth(), delta);
  renderCalendar();
}

function calendarJumpToday(){
  calendarViewMonth = monthKey(todayStr());
  renderCalendar();
}

// One cell per calendar day in the visible month, padded with blank
// leading/trailing cells so the grid always fills complete weeks (a
// ragged final row reads as a bug, not a design choice). Every day's
// total/done comes from dayItemsSummary() regardless of whether that
// date happens to be in state.days yet — a date with nothing planned
// just comes back {total:0, done:0}, no separate "does this day exist"
// branch needed.
function calendarMonthCells(monthKeyStr){
  const [y, m] = monthKeyStr.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const startWeekday = new Date(y, m - 1, 1).getDay();
  const today = todayStr();
  const cells = [];
  for(let i = 0; i < startWeekday; i++) cells.push({ blank: true });
  for(let d = 1; d <= daysInMonth; d++){
    const dateStr = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const { total, done } = dayItemsSummary(dateStr);
    cells.push({ blank: false, dateStr, dayNum: d, isToday: dateStr === today, total, done });
  }
  while(cells.length % 7 !== 0) cells.push({ blank: true });
  return cells;
}

function calendarMonthSummary(monthKeyStr){
  const [y, m] = monthKeyStr.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  let total = 0, done = 0;
  for(let d = 1; d <= daysInMonth; d++){
    const dateStr = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const s = dayItemsSummary(dateStr);
    total += s.total; done += s.done;
  }
  return { total, done };
}

const CALENDAR_WEEKDAY_LABELS = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

function renderCalendar(){
  const el = document.getElementById('calendarView');
  const monthKeyStr = calendarMonth();
  const cells = calendarMonthCells(monthKeyStr);
  const summary = calendarMonthSummary(monthKeyStr);
  const todayOpen = tabOpenCount('daily');
  // A compact page tag, same component the checklist overview's "Pending"
  // trigger uses — matched purely by sharing the .pagetag.compact class,
  // so it automatically picks up whatever dev pendingTagStyle/
  // pendingTagColor is set, no calendar-specific wiring needed (this is
  // the "linked dev options" the tag styling was asked for). Doubles as
  // a genuine "jump to today" shortcut, which a month grid benefits from
  // more than a single overview list does — you can be several months
  // away from today after browsing.
  el.innerHTML = `
    ${pageTagHtml(`openCalendarDay('${todayStr()}')`, todayOpen > 0 ? `Today · ${todayOpen}` : 'Today', true)}
    <div class="calnav">
      <button class="navarrow" onclick="calendarShiftMonth(-1)" title="Previous month">‹</button>
      <button class="calmonthlabel" onclick="calendarJumpToday()" title="Jump to the current month">${monthLabel(monthKeyStr)}</button>
      <button class="navarrow" onclick="calendarShiftMonth(1)" title="Next month">›</button>
    </div>
    <div class="calsummary">${summary.total ? `${summary.done} of ${summary.total} done this month` : 'Nothing planned this month yet'}</div>
    <div class="calweekdays">${CALENDAR_WEEKDAY_LABELS.map(d => `<span>${d}</span>`).join('')}</div>
    <div class="calgrid">
      ${cells.map(c => c.blank
        ? `<div class="calcell calblank"></div>`
        : `<button class="calcell ${c.isToday ? 'today' : ''} ${c.total ? 'hasdata' : ''}" onclick="openCalendarDay('${c.dateStr}')">
             <span class="caldatenum">${c.dayNum}</span>
             ${c.total ? `<span class="calratio">${c.done}/${c.total}</span>` : ''}
           </button>`
      ).join('')}
    </div>
  `;
}

// Clicking any date — whether or not it already has a state.days entry —
// jumps straight into that day's own detail page, same page Daily's own
// day list opens. Mirrors addDay()/confirmPickDate()'s "only pushUndo if
// this actually creates a new day" rule: ensureDay() itself is a no-op
// (and ends up not calling queueSave()) for a date already in state.days,
// so tracking an undo step for that case would record a change that
// never happened. Actually switching tabs to 'daily' (rather than
// building a calendar-local day-detail path) is deliberate — it's what
// the prev/next day arrows, "move incomplete to tomorrow", and every
// other piece of the day-detail page already assume they're running
// under, so reusing it here for free is both less code and exactly what
// "opens up the Page for the Daily" describes.
async function openCalendarDay(dateStr){
  if(!state.days.includes(dateStr)) pushUndo('Added a day');
  await ensureDay(dateStr);
  switchTab('daily');
  openDay(dateStr);
}
// Esc: close whatever's most local first (a task's expanded detail, then
// the Settings panel), and only fall back to jumping to the All tab if
// neither of those was open. Cmd/Ctrl+Z / Shift+Z (or Ctrl+Y) drive
// undo/redo, but only when focus isn't in a text field — typing needs its
// own native undo, not this app's content-level one.
document.addEventListener('keydown', (e) => {
  const appShell = document.getElementById('appShell');
  if(!appShell || appShell.style.display === 'none') return;

  if(e.key === 'Escape'){
    if(claudeView){ closeClaudeView(); return; }
    if(settingsOpen){ toggleSettings(); return; }
    if(checklistPendingOpen){ closeChecklistPending(); return; }
    if(selectedListId){ closeChecklistList(); return; }
    if(taskDetailId){ closeTaskDetail(); return; }
    const openExpand = document.querySelector('.expand.open');
    if(openExpand){
      expandedTaskIds.delete(openExpand.id.replace('exp-', ''));
      openExpand.classList.remove('open');
      return;
    }
    if(activeTab !== 'all'){ switchTab('all'); }
    return;
  }

  const target = document.activeElement;
  const inField = target && ['INPUT','TEXTAREA','SELECT'].includes(target.tagName);
  if(inField) return;

  const meta = e.metaKey || e.ctrlKey;
  if(meta && e.key.toLowerCase()==='z'){
    e.preventDefault();
    if(e.shiftKey) redo(); else undo();
  } else if(meta && e.key.toLowerCase()==='y'){
    e.preventDefault();
    redo();
  }
});

// Resizing the window can change how tabs wrap into rows even with no
// state change (nothing else calls render() in that case), which would
// leave renderTabRowLines()'s shelf lines stale — so re-measure on resize.
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderTabRowLines, 120);
});

// saveState() now retries indefinitely rather than dropping a failed save,
// but that only helps while the tab stays open — closing it mid-retry
// would still lose the edit silently. This is the last line of defense:
// the browser's native "leave site?" prompt, gated on unsavedChanges so it
// only appears when there's actually something not yet confirmed saved.
window.addEventListener('beforeunload', (e) => {
  if(!unsavedChanges) return;
  e.preventDefault();
  e.returnValue = '';
});

// Dev-only bypass: ?localdev=1 skips straight past the login screen into
// local-only mode (localStorage, same as clicking "Continue without an
// account"). Gated to localhost/file:// so it can never do anything on
// the real hosted site — it's purely a shortcut for testing this file
// directly, not a feature for real users.
function isLocalDevHost(){
  return location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:';
}

(async function init(){
  if(window.storage){ await enterApp(); return; }
  if(isLocalDevHost() && new URLSearchParams(location.search).has('localdev')){
    localOnlyMode = true;
    await enterApp();
    return;
  }
  session = loadSession();
  if(session && await ensureFreshSession()){ await enterApp(); return; }
  document.getElementById('authShell').style.display = '';
})();
</script>
</body>
</html>
