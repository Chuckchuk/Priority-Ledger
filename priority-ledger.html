let session = null; // { access_token, refresh_token, expires_at, user_id, email }
let localOnlyMode = false; // explicit opt-out of an account, chosen on the auth screen
let authMode = 'signin';
// Set by init() when the page loads with a #access_token&type=recovery
// hash (a password-recovery email link, forwarded through welcome.html) —
// { access_token, refresh_token, expires_in }. Non-null is what tells
// enterApp()'s caller to show #resetShell instead of the normal sign-in
// form; cleared once submitPasswordReset() succeeds.
let recoverySession = null;

function loadSession(){
  const raw = localStorage.getItem('ledger-auth');
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}

function saveSession(s){
  session = s;
  if(s) localStorage.setItem('ledger-auth', JSON.stringify(s));
  else localStorage.removeItem('ledger-auth');
}

// Refreshes the Supabase session if the access token is expired or about to
// be — auth tokens are short-lived, so this runs before every storage call
// while logged in. Returns null (and clears the stored session) if the
// refresh token itself is no longer valid, which sends the user back to login.
async function ensureFreshSession(){
  if(!session) return null;
  if(Date.now() < session.expires_at - 60000) return session;
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    });
    if(!res.ok) throw new Error('refresh failed');
    const data = await res.json();
    const fresh = {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: Date.now() + data.expires_in * 1000,
      user_id: data.user.id,
      email: data.user.email
    };
    saveSession(fresh);
    return fresh;
  }catch(e){
    saveSession(null);
    return null;
  }
}

// Forces a re-login when a Supabase session can't be refreshed mid-use —
// storage must never silently drop to localStorage in this case, or a task
// added believing it's synced to the cloud would quietly stop being so.
function forceReauth(){
  saveSession(null);
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('authShell').style.display = '';
  const errEl = document.getElementById('authError');
  if(errEl) errEl.textContent = 'Your session expired — please sign in again.';
}

// Tracks the server's updated_at for whatever we last actually loaded or
// saved — lets refreshFromServer() ask "has anything changed?" with a
// request for just this one column (a few bytes) instead of pulling the
// whole state blob on every poll. Only meaningful for the Supabase path;
// stays null in window.storage/localOnlyMode, which refreshFromServer()
// never polls anyway.
let lastKnownUpdatedAt = null;

// Storage adapter — tries sources in order, all behind the same
// storage.get/storage.set contract:
//   1. window.storage — the real Claude.ai artifact storage, present only
//      when this file is pasted into a claude.ai conversation as an artifact.
//   2. localStorage — ONLY when localOnlyMode was explicitly chosen on the
//      auth screen, for local testing without a Supabase account.
//   3. Supabase — the hosted app's durable, per-user cloud storage, used
//      whenever someone is logged in. If the session can't be refreshed,
//      this forces a re-login rather than silently falling back to
//      localStorage, so data never "goes local" without the user knowing.
const storage = {
  async get(key){
    if(window.storage) return window.storage.get(key);
    if(localOnlyMode){
      const raw = localStorage.getItem('ledger-local:' + key);
      if(raw === null){ throw new Error('not found'); }
      return { key, value: raw, shared: false };
    }
    const s = await ensureFreshSession();
    if(!s){ forceReauth(); throw new Error('session expired'); }
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/ledger_state?user_id=eq.${s.user_id}&select=data,updated_at`,
      { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${s.access_token}` } }
    );
    if(!res.ok) throw new Error('supabase get failed: ' + res.status);
    const rows = await res.json();
    if(!rows.length){ throw new Error('not found'); }
    // updated_at comes back for free alongside data in this same request —
    // stashing it here means refreshFromServer()'s cheap poll always has
    // an up-to-date baseline to compare against after any full load.
    lastKnownUpdatedAt = rows[0].updated_at;
    return { key, value: JSON.stringify(rows[0].data), shared: false };
  },
  async set(key, value){
    if(window.storage) return window.storage.set(key, value);
    if(localOnlyMode){
      localStorage.setItem('ledger-local:' + key, value);
      return { key, value, shared: false };
    }
    const s = await ensureFreshSession();
    if(!s){ forceReauth(); throw new Error('session expired'); }
    const nowIso = new Date().toISOString();
    const res = await fetch(`${SUPABASE_URL}/rest/v1/ledger_state`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${s.access_token}`,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({ user_id: s.user_id, data: JSON.parse(value), updated_at: nowIso })
    });
    if(!res.ok) throw new Error('supabase set failed: ' + res.status);
    // Keeps the lightweight refresh check from mistaking our own save for
    // a change made elsewhere — without this, the very next poll would
    // see its own updated_at bump as "different" and do a full fetch for
    // no reason.
    lastKnownUpdatedAt = nowIso;
    return { key, value, shared: false };
  }
};

function todayStr(){ return new Date().toISOString().slice(0,10); }

// A brand new account's task list starts with a few illustrative examples
// instead of a blank "Nothing here yet." everywhere — shows what a task
// (and, for Lists, a checklist with a couple of steps) actually looks
// like without making anyone type one first, and doubles as a quick
// sanity check while testing: fresh accounts land with real content
// already sitting in a few different tabs. None carry a due date on
// purpose — they're only here to look at, not to imply an actual
// deadline. Uses the same shape addTask()/addChecklistList()/addSubtask()
// build (see 16-task-crud.js) rather than a trimmed-down one, so nothing
// downstream has to special-case an example task as different from a
// real one.
function defaultTasks(){
  const mk = (title, category, extra) => ({
    id: newId('task'), title, category, status:'open', urgent:false, dueDate:'', notes:'',
    subtasks: [], plannedDates: [], timeframe:'', priority:0, completedAt:'', createdAt: todayStr(),
    ...extra
  });
  // Titled "<Template>: <Name>" from the start, and linked to a template
  // (seeded alongside it — see defaultState() below) rather than a plain
  // "Packing list" — per the explicit ask: a bare-titled example list
  // would demonstrate the wrong convention for a feature whose whole
  // point is that every real list ends up "<Template>: <Name>" shaped.
  const list = mk('Packing list: Madrid Trip', 'lists', { templateId: newId('tpl') });
  list.subtasks = [
    { id:newId('sub'), text:'Passport', done:false, dueDate:'', plannedDates:[] },
    { id:newId('sub'), text:'Phone charger', done:false, dueDate:'', plannedDates:[] },
    { id:newId('sub'), text:'Toothbrush', done:true, dueDate:'', plannedDates:[] }
  ];
  return [
    // High priority + a short timeframe, with wording that reads as
    // urgent on its own — so a fresh account has at least one example of
    // what that combination actually looks like (the overlap tab bar's
    // "!" flag included) without needing a due date to explain why.
    mk("Call the client back — they're waiting", 'work', { priority:3, timeframe:'short' }),
    // One step cancelled (not just done) — a fresh account otherwise has
    // no way to discover that steps/tasks can be marked cancelled at all
    // (it's a right-click/long-press menu item, not a button — see
    // markSubtaskCancelled(), 16-task-crud.js), per the explicit ask to
    // demonstrate it up front.
    mk("Reply to that email you've been putting off", 'work', { subtasks: [
      { id:newId('sub'), text:'Draft a reply', done:false, dueDate:'', plannedDates:[] },
      { id:newId('sub'), text:'Follow up about the old proposal', done:true, cancelled:true, dueDate:'', plannedDates:[] }
    ] }),
    mk('Fix the squeaky door', 'household'),
    mk('Book a dentist appointment', 'personal'),
    list
  ];
}

function defaultState(){
  const tasks = defaultTasks();
  // The example "Packing list: Madrid Trip" list (defaultTasks() above)
  // is seeded already linked to a templateId — build the matching
  // template entry from its own items here, so a fresh account's
  // Templates view isn't empty either. Keeps the id-generation for that
  // link in the one place (defaultTasks()) rather than duplicating it.
  const list = tasks.find(t => t.category === 'lists' && t.templateId);
  const checklistTemplates = list ? [{
    id: list.templateId,
    name: 'Packing list',
    items: list.subtasks.map(s => s.text),
    createdAt: todayStr()
  }] : [];
  return {
    location: 'home',
    days: [],
    tasks,
    categories: defaultCategories(),
    locations: defaultLocations(),
    locationEnabled: true,
    theme: defaultTheme(),
    advancedTaskFields: true,
    devSettings: defaultDevSettings(),
    trash: [],
    checklistTemplates,
    // User-saved color templates (Desk & Ledger / UI Colors) and single
    // saved icon colors — separate from the fixed DESK_PAPER_PRESETS/
    // UI_COLOR_PRESETS/CATEGORY_PALETTE arrays in 01-categories-theme.js,
    // which are shipped defaults nobody can edit or delete. See
    // dualColorCustomHtml()/confirmSaveDualColorTemplate() and
    // categoryPickerHtml()/saveCurrentCategoryColorToCustom() in
    // 09-settings.js for where these are written.
    customDeskPresets: [],
    customUiPresets: [],
    customCategoryColors: []
  };
}

// How long a deleted task or checklist list sticks around in
// state.trash (Settings → Recently Deleted) before purgeOldTrash()
// removes it for good — per the explicit ask, prompted by losing a task
// with no way to get it back. A full timestamp (not just a date string,
// the way most of this app's other dates work) since "about 2 days"
// means a real ~48-hour window, not "however much of today plus today
// minus 2" a date-only comparison would give.
const TRASH_RETENTION_MS = 2 * 24 * 60 * 60 * 1000;
// Called on every load (see normalizeState()) and every time the
// Recently Deleted section itself renders (trashSectionHtml(),
// 09-settings.js) — cheap enough to just always re-check rather than
// scheduling a timer, and the second call site is what keeps a
// long-running session (app left open across the 2-day mark) accurate
// without needing a reload to notice.
function purgeOldTrash(){
  if(!Array.isArray(state.trash)){ state.trash = []; return; }
  const cutoff = Date.now() - TRASH_RETENTION_MS;
  const before = state.trash.length;
  state.trash = state.trash.filter(entry => new Date(entry.deletedAt).getTime() > cutoff);
  if(state.trash.length !== before) queueSave();
}

function normalizeState(){
  if(!Array.isArray(state.days)) state.days = [];
  if(!Array.isArray(state.trash)) state.trash = [];
  purgeOldTrash();
  if(!Array.isArray(state.checklistTemplates)) state.checklistTemplates = [];
  if(!Array.isArray(state.customDeskPresets)) state.customDeskPresets = [];
  if(!Array.isArray(state.customUiPresets)) state.customUiPresets = [];
  if(!Array.isArray(state.customCategoryColors)) state.customCategoryColors = [];
  // Accounts saved before tabs became editable won't have a categories
  // array yet — seed it with the same set they've always seen so nothing
  // about their existing tasks' categories changes. Same idea for
  // locations, added alongside per-tab location editing, and theme,
  // added alongside custom colors/texture.
  if(!Array.isArray(state.categories) || !state.categories.length) state.categories = defaultCategories();
  // Accounts saved before category types existed only ever had the
  // 'standard' behavior, so that's the correct backfill.
  state.categories.forEach(c => { if(!c.type) c.type = 'standard'; });
  // 'calendar' was a short-lived third category type (a whole addable
  // tab) — the calendarTabTypeEnabled dev setting that gated it, and the
  // renderCalendar()/isCalendarCategory() code path itself, are both gone
  // now (the real way to reach a calendar view is the "Calendar" tag on
  // Daily's own day list). Any account that had actually created one
  // falls back to 'standard' rather than pointing at a type nothing
  // renders any more.
  state.categories.forEach(c => { if(c.type === 'calendar') c.type = 'standard'; });
  // 'ring' (a hollow-circle icon) was replaced outright by 'hexagon' — a
  // filled shape, not just a filled-in circle, since a solid circle would
  // have only duplicated 'dot' — see CATEGORY_ICON_GLYPHS' own comment in
  // 01-categories-theme.js. Any account that had a category actually set
  // to 'ring' picks up the new icon automatically rather than pointing at
  // a glyph that no longer exists.
  state.categories.forEach(c => { if(c.icon === 'ring') c.icon = 'hexagon'; });
  if(!Array.isArray(state.locations) || !state.locations.length) state.locations = defaultLocations();
  if(typeof state.locationEnabled !== 'boolean') state.locationEnabled = true;
  if(!state.theme) state.theme = defaultTheme();
  // Migrate the short-lived single-choice `texture: 'flat'|'grain'|'pages'`
  // shape (texture used to be exclusive) to the current independent
  // grain/pages booleans (now layerable).
  if(state.theme.texture !== undefined){
    state.theme.grain = state.theme.texture === 'grain';
    state.theme.pages = state.theme.texture === 'pages';
    delete state.theme.texture;
  }
  if(typeof state.theme.gradient !== 'boolean') state.theme.gradient = false;
  if(typeof state.theme.grain !== 'boolean') state.theme.grain = false;
  if(typeof state.theme.pages !== 'boolean') state.theme.pages = false;
  if(typeof state.theme.leather !== 'boolean') state.theme.leather = false;
  const uiPresetIsCustom = state.theme.uiPreset === 'custom' && !!state.theme.customUi;
  if(typeof state.theme.uiPreset !== 'string' || (!uiPresetIsCustom && !UI_COLOR_PRESETS.some(p=>p.id===state.theme.uiPreset))) state.theme.uiPreset = 'rust';
  if(typeof state.advancedTaskFields !== 'boolean') state.advancedTaskFields = true;
  if(!state.devSettings) state.devSettings = defaultDevSettings();
  if(typeof state.devSettings.tagSeam !== 'boolean') state.devSettings.tagSeam = false;
  if(typeof state.devSettings.pendingTagStyle !== 'string') state.devSettings.pendingTagStyle = 'default';
  // 'cornerpeek' was removed as a pendingTagStyle option — any account
  // that had it selected falls back to 'default' rather than pointing at
  // a style nothing renders any more.
  if(state.devSettings.pendingTagStyle === 'cornerpeek') state.devSettings.pendingTagStyle = 'default';
  if(typeof state.devSettings.showListDates !== 'boolean') state.devSettings.showListDates = false;
  if(typeof state.devSettings.sidePanelEnabled !== 'boolean') state.devSettings.sidePanelEnabled = false;
  if(typeof state.devSettings.leatherInsetPreset !== 'string') state.devSettings.leatherInsetPreset = 'classic';
  if(typeof state.devSettings.stackedPageInsetPreset !== 'string') state.devSettings.stackedPageInsetPreset = 'leftheavy';
  if(typeof state.devSettings.mobileUiPreviewOnDesktop !== 'boolean') state.devSettings.mobileUiPreviewOnDesktop = false;
  // 'default' (the old always-visible inline row) is no longer a valid
  // value — see the quickAddMobileStyle comment above — so an account
  // saved before this change migrates to the new floor behavior's own
  // default, same as a genuinely missing/malformed value would.
  if(typeof state.devSettings.quickAddMobileStyle !== 'string' || state.devSettings.quickAddMobileStyle === 'default') state.devSettings.quickAddMobileStyle = 'bottomsheet';
  if(typeof state.devSettings.quickAddTriggerPosition !== 'string') state.devSettings.quickAddTriggerPosition = 'bottom';
  if(typeof state.devSettings.taskRowMobileStyle !== 'string') state.devSettings.taskRowMobileStyle = 'default';
  if(typeof state.devSettings.taskDetailMobileStyle !== 'string') state.devSettings.taskDetailMobileStyle = 'default';
  if(typeof state.devSettings.floatingAddButton !== 'boolean') state.devSettings.floatingAddButton = false;
  if(typeof state.devSettings.tabBarMobileStyle !== 'string') state.devSettings.tabBarMobileStyle = 'default';
  if(typeof state.devSettings.tabBarDesktopStyle !== 'string') state.devSettings.tabBarDesktopStyle = 'default';
  if(typeof state.devSettings.overlapSubtags !== 'boolean') state.devSettings.overlapSubtags = false;
  if(typeof state.devSettings.overlapHoverMode !== 'string') state.devSettings.overlapHoverMode = 'default';
  if(typeof state.devSettings.overlapRankStagger !== 'boolean') state.devSettings.overlapRankStagger = false;
  if(typeof state.devSettings.sidetabsAppearance !== 'string') state.devSettings.sidetabsAppearance = 'color';
  // 'textured' was removed (a plain noise-filter overlay, not a real
  // material texture — didn't hold up). Only ever reachable by an account
  // that had it selected before the removal, so falling it back to the
  // plain colored look is the same "point at something that still
  // renders" idea as the calendar-type migration above.
  if(state.devSettings.sidetabsAppearance === 'textured') state.devSettings.sidetabsAppearance = 'color';
  if(typeof state.devSettings.sidetabsShape !== 'string') state.devSettings.sidetabsShape = 'pagetab';
  if(typeof state.devSettings.settingsRowMobileStyle !== 'string') state.devSettings.settingsRowMobileStyle = 'default';
  if(typeof state.devSettings.fieldPickerStyle !== 'string') state.devSettings.fieldPickerStyle = 'default';
  if(typeof state.devSettings.taskLongPressMode !== 'string') state.devSettings.taskLongPressMode = 'detail';
  if(typeof state.devSettings.stickyTabBar !== 'boolean') state.devSettings.stickyTabBar = false;
  if(typeof state.devSettings.checkGuideAnimationStyle !== 'string') state.devSettings.checkGuideAnimationStyle = 'radialping';
  // 'spin' (a rotating conic-gradient square behind the checkbox) was
  // replaced by 'wiggle' (the checkbox itself rotating back and forth) —
  // the old style just didn't read as a shake-to-get-attention nudge, and
  // being a hardcoded square it couldn't work for the checklist's round
  // .checkcircle either. An account with 'spin' already picked migrates
  // to its direct replacement rather than silently landing on whatever
  // the new default happens to be.
  if(state.devSettings.checkGuideAnimationStyle === 'spin') state.devSettings.checkGuideAnimationStyle = 'wiggle';
  if(typeof state.devSettings.developmentMode !== 'boolean') state.devSettings.developmentMode = false;
  if(typeof state.devSettings.categoryLabelStyle !== 'string') state.devSettings.categoryLabelStyle = 'tab';
  if(typeof state.devSettings.expandGroupingStyle !== 'string') state.devSettings.expandGroupingStyle = 'rail';
  if(typeof state.devSettings.taskDetailActionsPosition !== 'string') state.devSettings.taskDetailActionsPosition = 'side';
  state.tasks.forEach(t=>{
    if(t.subtasks===undefined) t.subtasks = [];
    // plannedDate (one day, exclusive) migrated to plannedDates (an array)
    // so a task can sit on more than one day's list at once — see the
    // note on planTaskForDay() for why exclusivity was actually a bug.
    if(t.plannedDates===undefined) t.plannedDates = t.plannedDate ? [t.plannedDate] : [];
    delete t.plannedDate;
    // Steps didn't used to carry their own dates — dueDate (typed/parsed,
    // informational) and plannedDates (which days' lists this step is on,
    // independent of the parent task's own plannedDates) both default to
    // "unset" for every pre-existing step.
    (t.subtasks||[]).forEach(s=>{
      if(s.dueDate===undefined) s.dueDate = '';
      if(s.plannedDates===undefined) s.plannedDates = s.plannedDate ? [s.plannedDate] : [];
      delete s.plannedDate;
    });
    // Bookkeeping (createdAt already existed) plus the optional advanced
    // fields — timeframe/priority default to "unset" rather than any
    // particular value, and completedAt is only ever set by toggleStatus().
    if(t.timeframe===undefined) t.timeframe = '';
    if(t.priority===undefined) t.priority = 0;
    if(t.completedAt===undefined) t.completedAt = '';
    // timeframeManual: whether the current t.timeframe came from an
    // explicit pick (updateTimeframe(), 14-task-actions.js) rather than
    // being auto-derived from the due date (deriveTimeframeFromDueDate(),
    // 05-dates-sort.js) — protects a deliberate choice from later being
    // silently overwritten when the due date changes. Pre-existing tasks
    // predate this flag entirely, so there's no real record of which way
    // any of them got their value; defaulting to "manual" whenever a
    // timeframe is already set is the safe reading — it means this
    // feature only ever starts auto-filling *forward* from here, never
    // reaches back and starts rewriting an established task's already-set
    // field the first time this ships. A task with no timeframe yet has
    // nothing to protect either way, so it defaults to auto-eligible.
    if(typeof t.timeframeManual !== 'boolean') t.timeframeManual = !!t.timeframe;
  });
  rebuildCategoriesIndex();
}

async function loadState(){
  // Retry once before giving up — a single failed request (e.g. a network
  // blip) should never be mistaken for "no saved data" and wipe the ledger.
  for(let attempt=0; attempt<2; attempt++){
    try{
      const res = await storage.get('tracker-state', false);
      if(res && res.value){ state = JSON.parse(res.value); normalizeState(); return; }
      break; // request succeeded and genuinely found nothing saved yet
    }catch(e){
      if(attempt===0){ await new Promise(r=>setTimeout(r,500)); continue; }
      console.error('Could not load saved ledger after retry, starting fresh locally', e);
    }
  }
  // Use the default in memory, but do NOT write it to storage here — only
  // save once you actually interact, so a load failure can never overwrite
  // real saved data with a blank slate.
  state = defaultState();
  normalizeState();
}

// ---------- Cross-device refresh ----------
// There's no realtime subscription and no per-field merge here — storage
// is "replace the whole blob," for saves and for this alike. So this only
// ever pulls in a server copy when there's nothing local it could
// clobber: no unsaved edit in flight, and no field actively focused
// (replacing state re-renders the whole task list via innerHTML, which
// would yank an in-progress, not-yet-blurred keystroke out from under
// someone mid-edit). It's deliberately a simple last-write-wins model,
// same as saving already is — not real conflict resolution. If two
// devices edit within the same window before either refreshes, whichever
// saves last wins, same as it always has.
//
// Bandwidth: most ticks cost a few bytes, not the whole state blob — see
// checkServerUpdatedAt() below, which is exactly why this can afford to
// run every 45s instead of sitting on a longer interval: the overwhelming
// majority of ticks are a single-column REST read that finds nothing new
// and does nothing else. The visibility-change listener already covers
// "I just switched back to this tab" immediately regardless of how long
// the base interval is; this just bounds how stale a *backgrounded* tab
// (one device left open while you edit on another) can silently get.
const REFRESH_INTERVAL_MS = 45000;
let refreshTimer = null;
let refreshInFlight = false;
let appEntered = false; // guards the visibilitychange listener from firing before/after a real login

// Asks for just the updated_at column (a handful of bytes) instead of the
// full data blob, so a poll that finds nothing new — the overwhelmingly
// common case — costs almost nothing. Only the Supabase path has a
// server-side updated_at to compare against; callers already gate out
// window.storage/localOnlyMode before reaching here.
async function checkServerUpdatedAt(){
  const s = await ensureFreshSession();
  if(!s){ forceReauth(); throw new Error('session expired'); }
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/ledger_state?user_id=eq.${s.user_id}&select=updated_at`,
    { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${s.access_token}` } }
  );
  if(!res.ok) throw new Error('supabase updated_at check failed: ' + res.status);
  const rows = await res.json();
  return rows.length ? rows[0].updated_at : null;
}

async function refreshFromServer(manual){
  if(!appEntered || localOnlyMode || window.storage) return; // nothing external to pull from
  if(unsavedChanges || refreshInFlight) return; // don't clobber an in-flight local edit
  if(!manual && document.hidden) return; // only poll while the tab is actually visible
  const active = document.activeElement;
  if(active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName)) return; // don't interrupt an in-progress edit
  refreshInFlight = true;
  const btn = document.getElementById('refreshBtn');
  if(btn) btn.disabled = true;
  try{
    const serverUpdatedAt = await checkServerUpdatedAt();
    if(serverUpdatedAt !== null && serverUpdatedAt === lastKnownUpdatedAt){
      if(manual) showUndoStatus('Already up to date');
      return;
    }
    // Either something changed, or there's nothing to compare against yet
    // (e.g. no row saved so far) — worth the full fetch either way.
    // storage.get() also refreshes lastKnownUpdatedAt as a side effect.
    const res = await storage.get('tracker-state', false);
    if(res && res.value){
      const incoming = res.value;
      if(incoming !== JSON.stringify(state)){
        state = JSON.parse(incoming);
        normalizeState();
        afterStateRestore();
        render();
        showUndoStatus('Refreshed with new changes');
      } else if(manual){
        showUndoStatus('Already up to date');
      }
    }
  }catch(e){
    console.error('Background refresh failed', e);
  }finally{
    refreshInFlight = false;
    if(btn) btn.disabled = false;
  }
}

function startAutoRefresh(){
  stopAutoRefresh();
  if(!localOnlyMode && !window.storage) refreshTimer = setInterval(() => refreshFromServer(false), REFRESH_INTERVAL_MS);
}
function stopAutoRefresh(){
  if(refreshTimer){ clearInterval(refreshTimer); refreshTimer = null; }
}
// Catches "I switched back to this tab" immediately rather than waiting
// for the next interval tick — appEntered/other guards inside
// refreshFromServer() make this a safe no-op before login or on the auth
// screen.
document.addEventListener('visibilitychange', () => {
  if(!document.hidden) refreshFromServer(false);
});

// Resolves after `ms`, or immediately if the browser reports connectivity
// coming back first — so a save that's mid-backoff after a network blip
// doesn't sit out the rest of a long delay once the connection is actually
// usable again.
function delayOrOnline(ms){
  return new Promise(resolve => {
    const timer = setTimeout(finish, ms);
    function finish(){
      clearTimeout(timer);
      window.removeEventListener('online', finish);
      resolve();
    }
    window.addEventListener('online', finish);
  });
}

// Capped exponential backoff — retries get less frequent but never stop
// entirely while offline, since giving up after N tries would mean the
// edit just silently never reaches Supabase.
const SAVE_RETRY_DELAYS_MS = [1000, 2000, 5000, 10000, 20000, 30000];

let unsavedChanges = false;

// Retries a failed save with backoff instead of dropping the edit after
// one attempt — a single network blip used to mean the change only ever
// existed in memory, with nothing but a small, easy-to-miss status line
// as a warning. This keeps trying (and the caller, via queueSave/saveChain,
// keeps later edits queued behind it) until it either succeeds or the
// session itself is gone. A dead session is the one case worth giving up
// on immediately: storage.set() has already called forceReauth() and sent
// the user back to login by the time that error reaches here, retrying
// against it can't succeed, and the pending edit will be superseded by
// loadState() pulling fresh data on the next login anyway.
async function saveState(){
  const statusEl = document.getElementById('saveStatus');
  let attempt = 0;
  while(true){
    if(statusEl) statusEl.textContent = attempt ? `Saving… (retry ${attempt})` : 'Saving…';
    try{
      await storage.set('tracker-state', JSON.stringify(state), false);
      unsavedChanges = false;
      if(statusEl){
        statusEl.textContent = 'Saved';
        setTimeout(()=>{ if(statusEl.textContent==='Saved') statusEl.textContent=''; }, 1500);
      }
      return;
    }catch(e){
      console.error('Storage save failed', e);
      if(e.message === 'session expired'){
        if(statusEl) statusEl.textContent = 'Signed out — sign back in to keep syncing';
        return;
      }
      const delay = SAVE_RETRY_DELAYS_MS[Math.min(attempt, SAVE_RETRY_DELAYS_MS.length - 1)];
      if(statusEl) statusEl.textContent = `Save failed — retrying in ${Math.round(delay/1000)}s`;
      await delayOrOnline(delay);
      attempt++;
    }
  }
}

// Mutations render immediately against in-memory state and queue the actual
// network save behind whatever's still in flight, rather than making the
// tap wait on a Supabase round-trip to feel responsive. Chaining onto
// saveChain (instead of firing saveState() directly) keeps saves in the
// order they were made — without it, two rapid edits could race and the
// slower request could land second and overwrite the newer one with stale
// data.
let saveChain = Promise.resolve();
function queueSave(){
  unsavedChanges = true;
  saveChain = saveChain.then(() => saveState());
  return saveChain;
}

// Undo/redo — whole-state snapshots rather than hand-written inverse
// operations per action. This app's entire content is already one JSON
// blob (`state`), so cloning it before each mutation is cheap and, unlike
// per-action-type inverses, can't drift out of sync with a mutation that
// forgets to update it. Every user-facing content change calls
// pushUndo(label) as its first step (before mutating state); pure
// navigation (switching tabs, toggling which location you're viewing,
// opening a day) is deliberately NOT on the undo stack — undo is for
// content you changed, not where you were looking.
let undoStack = [];
let redoStack = [];
const UNDO_LIMIT = 50;

function pushUndo(label){
  undoStack.push({ label, snapshot: JSON.parse(JSON.stringify(state)) });
  if(undoStack.length > UNDO_LIMIT) undoStack.shift();
  redoStack = [];
}

function showUndoStatus(text){
  const el = document.getElementById('undoStatus');
  if(!el) return;
  el.textContent = text;
  clearTimeout(showUndoStatus._t);
  showUndoStatus._t = setTimeout(()=>{ if(el.textContent===text) el.textContent=''; }, 2500);
}

function refreshUndoButtons(){
  const u = document.getElementById('undoBtn');
  const r = document.getElementById('redoBtn');
  if(u) u.disabled = undoStack.length===0;
  if(r) r.disabled = redoStack.length===0;
}

// Runs after restoring a snapshot, since the restored state may no longer
// match transient UI state that isn't itself part of the undo history
// (e.g. you're viewing a day that undo just un-created).
function afterStateRestore(){
  rebuildCategoriesIndex();
  applyTheme();
  applyDevSettings();
  if(!visibleTabs().includes(activeTab)) activeTab = 'all';
  if(selectedDay && !state.days.includes(selectedDay)) selectedDay = null;
  if(!selectedDay) dayReturnToCalendar = false;
  if(selectedListId && !state.tasks.some(t=>t.id===selectedListId)) selectedListId = null;
  pendingDeleteCategoryId = null;
  closeAllSettingsPopovers();
}

function undo(){
  if(undoStack.length===0) return;
  const entry = undoStack.pop();
  redoStack.push({ label: entry.label, snapshot: JSON.parse(JSON.stringify(state)) });
  state = entry.snapshot;
  afterStateRestore();
  render();
  queueSave();
  showUndoStatus('Undid: ' + entry.label);
}

function redo(){
  if(redoStack.length===0) return;
  const entry = redoStack.pop();
  undoStack.push({ label: entry.label, snapshot: JSON.parse(JSON.stringify(state)) });
  state = entry.snapshot;
  afterStateRestore();
  render();
  queueSave();
  showUndoStatus('Redid: ' + entry.label);
}

// ---------- Shake-to-undo/redo ----------
// Mirrors iOS's own system-level "shake to undo," but a web page can only
// approximate it: iOS 13+ Safari/WKWebView gates the devicemotion event
// itself behind DeviceMotionEvent.requestPermission(), and that call only
// resolves (rather than silently rejecting) when made from inside a real
// user gesture — a tap, never a timer or page-load script. That means an
// iOS web app has no way to listen for a shake before *something* has
// been tapped, and no way to detect "the user just tried to shake" before
// permission exists either — there's nothing to catch it with yet. The
// closest a web page gets is requestShakePermission() below, fired once
// from the very first tap anywhere in the app (see the one-time
// 'pointerdown' listener in 19-bootstrap.js) — so in practice it's live
// within one tap of opening the app, no separate settings toggle or
// visible "enable shake" banner needed. Browsers that never gate this
// (most non-Safari mobile browsers) just start listening immediately,
// same call path, no prompt shown.
let shakeMotionPermissionState = 'unknown'; // 'unknown' | 'granted' | 'denied' | 'unsupported'
let shakeLastMagnitude = null;
let shakePeakTimes = [];
const SHAKE_DELTA_THRESHOLD = 14; // m/s^2 jump between consecutive samples to count as one "peak"
const SHAKE_WINDOW_MS = 1200;     // peaks must all land within this span of each other
const SHAKE_PEAKS_REQUIRED = 3;   // this many qualifying peaks inside the window = a shake
const SHAKE_COOLDOWN_MS = 1500;   // ignore further peaks right after a shake fires, so the tail end of the same shake can't immediately reopen the menu
let shakeCooldownUntil = 0;

function handleDeviceMotion(e){
  const acc = e.accelerationIncludingGravity || e.acceleration;
  if(!acc || acc.x === null) return;
  const magnitude = Math.sqrt((acc.x||0)**2 + (acc.y||0)**2 + (acc.z||0)**2);
  const now = Date.now();
  if(shakeLastMagnitude !== null && now >= shakeCooldownUntil
     && Math.abs(magnitude - shakeLastMagnitude) > SHAKE_DELTA_THRESHOLD){
    shakePeakTimes = shakePeakTimes.filter(t => now - t < SHAKE_WINDOW_MS);
    shakePeakTimes.push(now);
    if(shakePeakTimes.length >= SHAKE_PEAKS_REQUIRED){
      shakePeakTimes = [];
      shakeCooldownUntil = now + SHAKE_COOLDOWN_MS;
      onShakeDetected();
    }
  }
  shakeLastMagnitude = magnitude;
}

function startShakeListening(){
  if(shakeMotionPermissionState === 'granted') return; // already listening
  shakeMotionPermissionState = 'granted';
  window.addEventListener('devicemotion', handleDeviceMotion);
}

// Called from the one-time first-tap listener in 19-bootstrap.js. Safe to
// call more than once (e.g. a stray second registration) — it only acts
// while the state is still 'unknown', so a definite answer either way
// sticks rather than re-prompting.
function requestShakePermission(){
  if(shakeMotionPermissionState !== 'unknown') return;
  if(typeof DeviceMotionEvent === 'undefined'){ shakeMotionPermissionState = 'unsupported'; return; }
  if(typeof DeviceMotionEvent.requestPermission !== 'function'){ startShakeListening(); return; }
  DeviceMotionEvent.requestPermission().then(result => {
    if(result === 'granted') startShakeListening();
    else shakeMotionPermissionState = 'denied';
  }).catch(() => { shakeMotionPermissionState = 'denied'; });
}

let shakeUndoOpen = false;

function onShakeDetected(){
  if(shakeUndoOpen) return;
  const appShell = document.getElementById('appShell');
  if(!appShell || appShell.style.display === 'none') return; // not signed in yet
  openShakeUndoMenu();
}

function shakeUndoMenuHtml(){
  const undoLabel = undoStack.length ? undoStack[undoStack.length-1].label : null;
  const redoLabel = redoStack.length ? redoStack[redoStack.length-1].label : null;
  return `
    <div class="shakeundo-title">Undo or redo?</div>
    <div class="shakeundo-actions">
      <button ${undoLabel ? '' : 'disabled'} onclick="shakeUndoAction(undo)">Undo${undoLabel ? ': ' + escapeHtml(undoLabel) : ''}</button>
      <button ${redoLabel ? '' : 'disabled'} onclick="shakeUndoAction(redo)">Redo${redoLabel ? ': ' + escapeHtml(redoLabel) : ''}</button>
    </div>
  `;
}

// Nothing to undo AND nothing to redo (e.g. a brand-new account, or right
// after signing in with no edits yet this session) — a shake in that
// state has nothing useful to offer, so it's a silent no-op rather than
// popping an empty-looking menu.
function openShakeUndoMenu(){
  if(undoStack.length === 0 && redoStack.length === 0) return;
  shakeUndoOpen = true;
  document.body.classList.add('shakeundo-open');
  document.getElementById('shakeUndoBody').innerHTML = shakeUndoMenuHtml();
  if(navigator.vibrate) navigator.vibrate(30);
}

function closeShakeUndoMenu(){
  shakeUndoOpen = false;
  document.body.classList.remove('shakeundo-open');
}

function shakeUndoAction(fn){
  closeShakeUndoMenu();
  fn();
}

function isOverdue(t){
  return t.dueDate && t.status !== 'done' && new Date(t.dueDate) < new Date(todayStr());
}

// Used to decide whether a due task is worth surfacing in a day's "pull
// in an existing task" list — due today, already overdue (no lower
// bound: overdue is exactly the case you'd most want to catch up on),
// or due within the next `days`. A task due further out than that isn't
// urgent enough yet to clutter a specific day's plan.
function isDueWithinDays(dueDate, days){
  const diffMs = new Date(dueDate) - new Date(todayStr());
  return diffMs / 86400000 <= days;
}

// Whether a task/step's plannedDates includes today or any day still to
// come — the pin button's pressed ("on") look reads this instead of a
// plain .length check, so a task pinned to a day that's since passed
// doesn't keep looking pressed once that day is gone. Plain string
// comparison works since plannedDates are always YYYY-MM-DD, same
// lexicographic-order trick isPast/isOverdue already lean on elsewhere.
function hasCurrentPlan(plannedDates){
  const today = todayStr();
  return (plannedDates||[]).some(d => d >= today);
}

// Maps a due date to the Timeframe value it implies, per the project
// owner's own thresholds — used by updateDueDate() (16-task-crud.js) to
// auto-fill an unset (or previously auto-set) Timeframe field whenever
// the due date changes. Deliberately returns null (no opinion, leave
// Timeframe alone) for two cases: no due date at all, and the 2-week-to-
// a-month gap, which the project owner explicitly asked to leave
// ambiguous rather than guessing which side of "short-ish project" vs
// "long-ish but not quite Long" a task in that range falls on. Overdue
// dates fold into the <=1 bucket alongside today/tomorrow — none of
// those found a mention in the original ask, and treating "already due"
// as anything less urgent than "due tomorrow" would be a stranger
// reading than folding it in here.
function deriveTimeframeFromDueDate(dueDate){
  if(!dueDate) return null;
  const days = daysBetween(todayStr(), dueDate);
  if(days <= 1) return 'short';   // overdue, today, or tomorrow
  if(days <= 13) return 'medium'; // "within a week or two"
  if(days <= 30) return null;     // 2 weeks to a month — left ambiguous on purpose
  return 'long';                  // over a month out
}

function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

// Discreet display format for a step's own date — M/D/YY, distinct from
// fmtDate()'s "Sep 1" used everywhere else, per the explicit ask for
// mm/dd/yy-style step dates.
function fmtDateShort(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  const yy = String(dt.getFullYear()).slice(-2);
  return `${dt.getMonth()+1}/${dt.getDate()}/${yy}`;
}

// Full weekday/month/day/year form for a task's own due date on the full
// detail page (.datefield.taskdate) — per the explicit ask, "9/2/26" read
// as too terse for the one date field that page gives a whole boxed row
// of its own; every other date field in the app (a step's own date,
// badges) stays on fmtDate()/fmtDateShort()'s compact forms.
function fmtDateFull(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
}

// Full weekday/month/day form for the masthead's own subheader (distinct
// from fmtDate()'s compact "Sep 1" used on task badges) — replaced a
// rotating decorative tagline the project owner found more filler than
// useful.
function fmtTodayHeader(){
  const dt = new Date(todayStr()+'T00:00:00');
  return dt.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
}

const WEEKDAY_NAMES = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const MONTH_NAMES = ['january','february','march','april','may','june','july','august','september','october','november','december'];

// Every word/phrase that currently means "today" — this app doesn't
// track a time of day yet, so "tonight," "this evening," and a bare
// "morning" all collapse to the same plain date today does. If time-of-
// day tracking ever gets added, this is the list to split apart: each of
// these would need to carry its own approximate time instead of just
// resolving to todayStr() the way they all do now. Not attempting to
// detect an actual clock time (e.g. "2pm") at all — there's nowhere to
// put one yet, so parsing one now would just be silently thrown away.
const TODAY_WORDS = ['today','tday','2day','tonight','tonite','morning','afternoon','evening','night','this morning','this afternoon','this evening'];

// Rudimentary natural-language date detection for steps — deliberately
// covers only the handful of shorthands actually asked for (today/
// tomorrow, weekday names, M/D[/YY], "Month Day") rather than a general
// date-parsing library. Returns '' rather than guessing when nothing
// matches, so a typo never silently saves the wrong date.
function parseNaturalDate(raw){
  const str = (raw||'').trim().toLowerCase().replace(/\b(\d+)(st|nd|rd|th)\b/,'$1');
  if(!str) return '';
  const today = new Date(todayStr()+'T00:00:00');
  if(TODAY_WORDS.includes(str)) return todayStr();
  if(str==='tomorrow' || str==='tmrw' || str==='tmr' || str==='tmrrw') return addDaysToDateStr(todayStr(), 1);
  if(str==='yesterday') return addDaysToDateStr(todayStr(), -1);

  for(let i=0;i<WEEKDAY_NAMES.length;i++){
    const name = WEEKDAY_NAMES[i];
    if(str===name || str===name.slice(0,3)){
      let delta = (i - today.getDay() + 7) % 7; // today itself counts as a match
      return addDaysToDateStr(todayStr(), delta);
    }
  }

  let m = str.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
  if(m){
    const month = parseInt(m[1],10), day = parseInt(m[2],10);
    if(month>=1 && month<=12 && day>=1 && day<=31){
      let year;
      if(m[3]){
        year = parseInt(m[3],10);
        if(m[3].length===2) year += 2000;
      } else {
        year = today.getFullYear();
      }
      let iso = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      if(!m[3] && isDueWithinDays(iso, -30)) iso = `${year+1}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      return iso;
    }
  }

  m = str.match(/^([a-z]+)\.?\s+(\d{1,2})(?:,?\s+(\d{4}))?$/);
  if(m){
    // Prefix match (not just the strict 3-letter abbreviation) so common
    // 4-letter forms like "sept" or "jan." also resolve — month names are
    // distinct enough at 3+ characters that this can't collide.
    const monthIdx = MONTH_NAMES.findIndex(name => name===m[1] || (m[1].length>=3 && name.startsWith(m[1])));
    const day = parseInt(m[2],10);
    if(monthIdx>=0 && day>=1 && day<=31){
      const year = m[3] ? parseInt(m[3],10) : today.getFullYear();
      let iso = `${year}-${String(monthIdx+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      if(!m[3] && isDueWithinDays(iso, -30)) iso = `${year+1}-${String(monthIdx+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      return iso;
    }
  }

  return '';
}

// A task mid-completingTaskIds' linger (see its own comment,
// 02-storage-state.js) sorts as though it were still open — otherwise it
// would jump straight to the bottom of the list the instant its status
// flips to 'done', before the celebration animation and collapse ever get
// a chance to play in its original spot.
function isDoneForSort(t){
  return t.status==='done' && !completingTaskIds.has(t.id);
}

function sortTasks(list){
  return list.slice().sort((a,b)=>{
    if(isDoneForSort(a) !== isDoneForSort(b)) return isDoneForSort(a) ? 1 : -1;
    if(a.urgent !== b.urgent) return a.urgent ? -1 : 1;
    // Priority slots in between the urgent flag and due date — tasks that
    // never set it (the default, 0) tie here and fall through to due date
    // exactly as before, so this is a no-op for anyone not using the field.
    const ap = a.priority||0, bp = b.priority||0;
    if(ap !== bp) return bp - ap;
    const ad = a.dueDate ? new Date(a.dueDate).getTime() : Infinity;
    const bd = b.dueDate ? new Date(b.dueDate).getTime() : Infinity;
    if(ad !== bd) return ad - bd;
    return new Date(b.createdAt) - new Date(a.createdAt);
  });
}

function daysBetween(a, b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }

// ---------- Sort modes ----------
// state.tasks' own array order IS "My Order" — dragging a task in
// 'default' mode splices it to a new spot in that array directly (see
// reorderTask() below), so there's no separate manual-order field to
// store or migrate; the order that's always been there just becomes a
// first-class, always-available view. Every other mode is a single sort
// key layered on top of the same "done sinks to the bottom" rule that
// sortTasks() already enforced, so switching modes never hides anything,
// just re-orders it. Ties fall back to array order since Array#sort is
// spec-guaranteed stable — that's what keeps 'default' mode a pure
// reflection of array order with only the done/open split imposed on it.
let sortMode = 'default';
const SORT_MODE_LABELS = { default:'My Order', mixed:'Mixed', timeframe:'Timeframe', newest:'Newest First', timestamp:'Oldest First', priority:'Priority', category:'Category' };
const TIMEFRAME_ORDER = { urgent:0, today:1, short:2, medium:3, long:4, '':5 };

function setSortMode(val){
  sortMode = val;
  render();
}

function applySortMode(list){
  const doneLast = (a,b) => isDoneForSort(a) !== isDoneForSort(b) ? (isDoneForSort(a)?1:-1) : 0;
  switch(sortMode){
    case 'mixed': return sortTasks(list);
    case 'timeframe': return list.slice().sort((a,b)=> doneLast(a,b) || (TIMEFRAME_ORDER[a.timeframe||''] - TIMEFRAME_ORDER[b.timeframe||'']));
    case 'timestamp': return list.slice().sort((a,b)=> doneLast(a,b) || (new Date(a.createdAt) - new Date(b.createdAt)));
    case 'newest': return list.slice().sort((a,b)=> doneLast(a,b) || (new Date(b.createdAt) - new Date(a.createdAt)));
    case 'priority': return list.slice().sort((a,b)=> doneLast(a,b) || ((b.priority||0) - (a.priority||0)));
    case 'category': {
      const order = state.categories.map(c=>c.id);
      return list.slice().sort((a,b)=> doneLast(a,b) || (order.indexOf(a.category) - order.indexOf(b.category)));
    }
    default: return list.slice().sort(doneLast);
  }
}

// `includeCategory` gates the "Category" option — meaningful only where a
// list can mix multiple categories at once (the "All" tab, Daily's day
// detail). Inside a single category tab every visible task already shares
// that one category, so sorting "by category" is a silent no-op — omit
// the option there rather than offer a sort that does nothing.
function sortModeOptionsHtml(includeCategory){
  return Object.entries(SORT_MODE_LABELS)
    .filter(([k])=> includeCategory || k !== 'category')
    .map(([k,label])=>`<option value="${k}" ${sortMode===k?'selected':''}>${label}</option>`).join('');
}

function visibleTabs(){
  return tabOrder().filter(key => key==='all' || key==='daily' || !state.locationEnabled || CATEGORIES[key].locations.includes(state.location));
}

function currentLocation(){
  return state.locations.find(l=>l.id===state.location) || state.locations[0];
}

function hashStr(s){
  let h = 0;
  for(let i=0; i<s.length; i++) h = (h*31 + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}

function renderLocBadge(){
  const badge = document.getElementById('locBadge');
  badge.style.display = state.locationEnabled ? '' : 'none';
  if(state.locationEnabled) badge.textContent = currentLocation().label;
  // The subheader used to list which tabs the current location was
  // hiding, then a rotating decorative tagline — neither carried its
  // weight (a warning nobody needed, then filler text). Today's date is
  // useful regardless of tab or location state, so it lives here now.
  document.getElementById('statusLine').textContent = fmtTodayHeader();
}

// A checklist tab's count is pending *items* across all its lists, not a
// count of not-done lists — "how much is still left to get" is the more
// useful number for that kind of tab. "All" excludes checklist-owned
// tasks entirely, matching what renderList() actually shows there.
function tabOpenCount(key){
  if(key==='daily'){
    const s = dayItemsSummary(todayStr());
    return s.total - s.done;
  }
  if(key==='all'){
    return state.tasks.filter(t=>{
      if(t.status==='done') return false;
      const cat = CATEGORIES[t.category];
      return !cat || cat.type !== 'checklist';
    }).length;
  }
  if(isChecklistCategory(key)){
    // checklistPendingItems() (13-checklist.js) is the canonical "how many
    // items in this list still count as pending" answer — it already
    // knows a list marked done retires ALL its items from pending
    // regardless of their own individual done flags (see its own comment).
    // This used to re-count !s.done items directly instead, which ignored
    // the list's own status entirely: completing a whole checklist left
    // its still-unchecked items counting toward this tab's badge forever.
    return state.tasks.filter(t=>t.category===key).reduce((sum,t)=>sum+checklistPendingItems(t).length, 0);
  }
  return state.tasks.filter(t => t.category===key && t.status!=='done').length;
}

// Feeds both the overlapSubtags "!" badge and (via tabImportanceRank())
// overlapHoverMode's "fixed order" ranking — a category counts as urgent
// if it has any not-done task that's overdue or High priority. A
// checklist tab has no such fields on its own "tasks" (a checklist's
// task is a whole list — see isChecklistCategory()), so it's never urgent
// by this measure; 'all'/'daily' aren't a single category either and are
// excluded the same way.
function tabHasUrgentTask(key){
  if(key==='all' || key==='daily' || isChecklistCategory(key)) return false;
  return state.tasks.some(t => t.category===key && t.status!=='done' && (isOverdue(t) || t.priority===3));
}

// overlapHoverMode's 'push' variant (see devSettingsFieldsHtml() in
// 01-categories-theme.js) replaces position-based stacking (later tab
// always on top, see --tabidx below) with a FIXED order by how much is
// going on in each category — open task count, with any urgent (overdue/
// High priority) task counting for a lot more than sheer volume — so the
// same tab is always on top no matter which one you last hovered. Ties
// (most commonly every tab tied at zero) fall back to the original
// position, both so the result is deterministic and so an all-empty
// board still fans out sensibly. Returns a key->rank map, 1 = bottom of
// the stack, length(keys) = top.
function tabImportanceRank(keys){
  const scored = keys.map((k, idx) => ({
    k, idx,
    score: tabOpenCount(k) + (tabHasUrgentTask(k) ? 1000 : 0)
  }));
  scored.sort((a,b) => a.score - b.score || a.idx - b.idx);
  const rank = {};
  scored.forEach((item, i) => { rank[item.k] = i + 1; });
  return rank;
}

// overlapSubtags (see devSettingsFieldsHtml()) trades a tab's own inline
// dot+count for a small flag-shaped tag peeking out from behind it — the
// category's own icon glyph plus its open count, plus a "!" when
// tabHasUrgentTask() is true — so it only ever appears when there's
// actually something to say, unlike the always-on inline count it
// replaces (which shows "0" just as prominently as anything else).
// Skipped entirely for a tab with nothing open, and for 'all'/'daily' (no
// single category icon to show). The markup here is just content — its
// pennant shape, "behind the tab" z-index trick, and position all live in
// the .tabsubtag rules in <style>.
function tabSubtagHtml(key, openCount){
  if(key==='all' || key==='daily' || openCount<=0) return '';
  const cat = CATEGORIES[key];
  if(!cat) return '';
  const icon = categoryDotHtml(cat, 'dot');
  // Two independent flags, not one flag with the "!" tucked into a
  // corner of it — the project owner asked for the urgent marker to be
  // its own separate tag, sitting further out at the tab's left edge
  // than the count flag (which stays put where it's always been — see
  // the .tabsubtag/.tabsubtag-urgent rules in <style> for the actual
  // positions). tabHasUrgentTask() can only be true alongside openCount>0
  // (an overdue/High task is itself still open), so no separate guard is
  // needed for it here.
  const countFlag = `<div class="tabsubtag tabsubtag-count">${icon}<span class="tabsubtag-num">${openCount}</span></div>`;
  const urgentFlag = tabHasUrgentTask(key) ? `<div class="tabsubtag tabsubtag-urgent">!</div>` : '';
  return countFlag + urgentFlag;
}

function renderTabs(){
  const wrap = document.getElementById('tabs');
  const keys = visibleTabs();
  const dev = state.devSettings || {};
  // tabBarDesktopStyle is a desktop-only look (see the body:not(.mobileui-
  // active)[data-tabbar-desktop=…] selectors in <style>) — mirrored here
  // so subtagsOn/pushMode never touch the markup on a phone-ish viewport,
  // where the matching CSS wouldn't be applied to make sense of it either
  // (a shown dot/count is better than an unstyled orphan badge).
  const overlapStyle = dev.tabBarDesktopStyle === 'overlap' && !mobileUiActive();
  const subtagsOn = overlapStyle && !!dev.overlapSubtags;
  const pushMode = overlapStyle && dev.overlapHoverMode === 'push';
  const staggerOn = overlapStyle && !!dev.overlapRankStagger;
  const importanceRank = pushMode ? tabImportanceRank(keys) : null;
  wrap.innerHTML = keys.map((key, idx)=>{
    const openCount = tabOpenCount(key);
    const dot = (subtagsOn || key==='all' || key==='daily') ? '' : categoryDotHtml(CATEGORIES[key], 'dot');
    const label = key==='all' ? 'All' : key==='daily' ? 'Daily' : CATEGORIES[key].label;
    const countHtml = subtagsOn ? '' : `<span class="count">${openCount}</span>`;
    const subtagHtml = subtagsOn ? tabSubtagHtml(key, openCount) : '';
    // --tabhex/--tabtext/--tabedge are only ever read by the EXPERIMENTAL
    // tabBarDesktopStyle "indextabs"/"overlap" looks (see the
    // body:not(.mobileui-active)[data-tabbar-desktop=…] rules in <style>)
    // — harmless to always set, same reasoning as --page-transform
    // elsewhere. --tabtext picks readable text (dark ink vs. cream,
    // reusing the same relLuminance() call the theme itself uses to
    // derive --ink from --paper) since a category's own hex runs the
    // full range from pale gold to near-black; --tabedge is that hex
    // darkened via shadeHex() for "overlap"'s accent border, the same
    // multiplicative-darken helper --desk-dark is built from. 'all'/
    // 'daily' have no category color of their own, so they get none of
    // these three and fall back to <style>'s var(--primary)-based
    // defaults instead. --tabidx (1-based) is "overlap"'s default
    // stacking order — later tabs sit on top of earlier ones until
    // hovered, like a fanned-out stack of index cards — UNLESS
    // overlapHoverMode's 'push' variant is on, in which case it's instead
    // a fixed rank by tabImportanceRank() so the stacking order holds
    // still regardless of hover (see computeOverlapPush() below). --tab-
    // jitter is a small per-tab pseudo-random resting-height offset
    // (hashStr()'d off the tab's own id so it's stable across renders,
    // not truly random — see the .tab transform rules in <style>), there
    // purely so a row of same-height pills reads a little more like a
    // hand-fanned stack of index cards and a little less like a UI
    // component; onmouseenter/leave are only wired up in push mode — the
    // default look still does its lift/reorder in pure CSS via :hover.
    const cat = (key!=='all' && key!=='daily') ? CATEGORIES[key] : null;
    const tabidx = importanceRank ? importanceRank[key] : idx+1;
    const jitter = tabJitterPx(key);
    // --tab-angle is only ever read by .tab.active's own transform (see
    // <style>) — a small stable per-category tilt (same hashStr() idiom as
    // --tab-jitter) so the selected tab reads as a real dog-eared page
    // tucked in slightly crooked, rather than a perfectly square chip.
    // Harmless to set on every tab, same reasoning as --tabidx elsewhere.
    const angle = tabAngleDeg(key);
    // overlapRankStagger (see devSettingsFieldsHtml()): a tab further back
    // in the stack (lower tabidx, whether that's ranked by position or by
    // importance) sits a little higher at rest — proportional to how far
    // back it is, capped at OVERLAP_STAGGER_MAX — so its own label has a
    // better chance of peeking above whichever tab is currently covering
    // it, instead of a covered tab being unreadable until you interact
    // with it. 0 (no offset) for the frontmost tab either way.
    const stagger = staggerOn ? -((keys.length - tabidx) / Math.max(1, keys.length - 1)) * OVERLAP_STAGGER_MAX : 0;
    const hexStyle = cat
      ? ` style="--tabhex:${cat.hex};--tabtext:${relLuminance(cat.hex) > 0.5 ? '#2A2318' : '#F1EAD9'};--tabedge:${shadeHex(cat.hex, -0.25)};--tabidx:${tabidx};--tab-jitter:${jitter}px;--tab-angle:${angle}deg;--tab-stagger:${stagger}px"`
      : ` style="--tabidx:${tabidx};--tab-jitter:${jitter}px;--tab-angle:${angle}deg;--tab-stagger:${stagger}px"`;
    const hoverAttrs = pushMode ? ` onmouseenter="overlapTabHoverStart(${idx})" onmouseleave="overlapTabHoverEnd(${idx})"` : '';
    // Re-clicking the tab you're already on now has to actually do
    // something (return to that tab's own master view out of whatever
    // drilldown it might be sitting on — see switchTab()'s own comment),
    // so overlap style's active tab can't skip the onclick the way an
    // earlier pass here did purely to dodge a cosmetic issue: rebuilding
    // every .tab element from scratch re-runs solveGapOverlaps()/
    // computeOverlapPush() against fresh DOM, which occasionally lands a
    // hair's width off the previous pass (sub-pixel measurement noise)
    // that the transform transition then visibly animates through as a
    // small "pulse" on the neighbors. A working return-to-master-view is
    // worth that trade — if the pulse turns out to actually be
    // noticeable in practice, that's a rendering-smoothness bug to chase
    // down on its own terms, not a reason to leave the click dead again.
    // Every tab, "Daily" included, uses the same plain switchTab() —
    // "go to today" belongs on the masthead's dedicated shortcut button
    // instead (#dailyShortcutBtn, goToDailyToday(), see 11-daily-core.js),
    // per the project owner's own correction. This tab landing wherever
    // Daily was last left (the day list, a specific day, the calendar) is
    // exactly the point: it's the tab that remembers, the shortcut button
    // is the one that always means "today."
    const clickAttr = ` onclick="switchTab('${key}')"`;
    return `<button class="tab ${activeTab===key?'active':''}" data-key="${key}"${hexStyle}${hoverAttrs}${clickAttr}>${dot}<span class="tablabel">${label}</span> ${countHtml}${subtagHtml}</button>`;
  }).join('');
  renderTabRowLines();
  updateTabScrollFade();
  layoutOverlapTabs();
  layoutSidetabsPeek();
}

// ---------- tabBarDesktopStyle "sidetabs": peeking index-tab column ----------
// Called at the end of renderTabs() (mirrors layoutOverlapTabs() just
// above) — a no-op for every other tabBarDesktopStyle, on the Mobile UI Lab
// viewport (neither applies), and for the 'classic'/'classicband'
// appearances, which are the ORIGINAL sidetabs layout (a plain column of
// full-width tabs in normal flex flow beside .leathercover — see the
// body:not(.mobileui-active)[data-tabbar-desktop="sidetabs"][data-
// sidetabs-appearance="classic"] rules in <style>) and never use this
// peeking mechanism at all.
// The clones below DO need one real measurement per tab now (unlike an
// earlier fixed-width pass): a category name has to actually be readable
// once poking out from behind the page, so each tab's own visible "poke"
// width is sized to its own label instead of one guessed constant for
// every tab. Only the TUCK (how far past #appCard's edge it reaches, see
// SIDETAB_TUCK/SIDETAB_TUCK_ACTIVE) stays fixed — see the width/marginLeft
// math below.
const SIDETAB_TUCK = 12;         // px past #appCard's edge every resting tab tucks
const SIDETAB_TUCK_ACTIVE = 18;  // the active tab gets to tuck a bit deeper — its
                                  // own mask-image fade (.tab.active in <style>) is
                                  // what makes that safe to do without it reading
                                  // as covering page content
const SIDETAB_MIN_POKE = 58;     // floor so a short label ("ALL") doesn't shrink
                                  // the tab down to an unreadably small nub
const SIDETAB_MAX_POKE = 112;    // ceiling on how wide a single-line label can push
                                  // a tab — past this it wraps to a second line
                                  // instead (see .two-line in <style>), and past
                                  // that it ellipsizes rather than growing forever
const SIDETAB_HEIGHT_2LINE = 60; // vs. the base 44px — see .sidetabspeek .tab.two-line
// How many px of EXTRA left padding each shape needs — see the comment in
// layoutSidetabsPeek() below on why: clip-path polygon points outside an
// element's own 0..width box (this Browser environment's own limitation,
// confirmed by testing a plain isolated div — a mainstream desktop browser
// renders these fine, but this one silently drops the point and leaves the
// edge flat) don't paint. Every OUTWARD-pointing shape here places its
// point at a NEGATIVE x offset (protruding left past the tab's own edge),
// which never rendered until padded/shifted in-bounds like this. invertedv
// is the different case — a genuine concave notch (a bookmark's own V-cut
// ribbon tail is the mental model, per the project owner) cutting INWARD
// rather than protruding — but it still gets a few px of extra room here:
// "the label should come further out when using this setting" was the
// project owner's own preferred fix once the notch needed to be deep
// enough for a properly wide, same-angle gilded border (see that shape's
// own rule in <style>) rather than the too-thin, mismatched-angle version
// a first pass at this shipped with.
// Padding the box by the same amount the point(s) protrude and shifting
// the whole polygon over by that amount keeps every vertex non-negative
// while the tab's own on-screen position (and thus how far it visually
// pokes out) stays exactly the same — see the .sidetabspeek
// .tab[data-shape="…"] rules in <style> for the actual shifted polygons.
const SIDETAB_SHAPE_EXTRA = { pagetab:14, arrows:20, invertedv:6, sawtooth:7, jagged:13, flat:0 };
function layoutSidetabsPeek(){
  const peek = document.getElementById('sidetabsPeek');
  if(!peek) return;
  const dev = state.devSettings || {};
  const appearance = dev.sidetabsAppearance || 'color';
  const isClassicLayout = appearance === 'classic' || appearance === 'classicband';
  if(mobileUiActive() || dev.tabBarDesktopStyle !== 'sidetabs' || isClassicLayout){
    peek.innerHTML = '';
    return;
  }
  const wrap = document.getElementById('tabs');
  if(!wrap) return;
  const shapeSetting = dev.sidetabsShape || 'pagetab';
  peek.innerHTML = '';
  Array.from(wrap.querySelectorAll('.tab')).forEach(t=>{
    const clone = t.cloneNode(true);
    // Set directly on every clone (not just for 'random'/'iconstyle')
    // rather than leaving <style> to key shape off the dev-setting value
    // on body — keeps the CSS down to one selector shape (.tab[data-
    // shape="…"]) instead of two parallel ones for "fixed" vs "resolved
    // per tab" cases.
    const shape = resolveSidetabShape(t.dataset.key, shapeSetting);
    clone.dataset.shape = shape;
    clone.style.pointerEvents = 'auto';
    // Measure this clone's own natural (unwrapped) content width before
    // pinning it to a fixed px width below — max-content plus nowrap on
    // the label makes getBoundingClientRect() report how wide it actually
    // wants to be, independent of whatever the shared .sidetabspeek .tab
    // rule's own width:84px fallback says.
    clone.style.width = 'max-content';
    const label = clone.querySelector('.tablabel');
    if(label) label.style.whiteSpace = 'nowrap';
    peek.appendChild(clone);
    // Must happen after appending (needs a real computed style to add to)
    // and before measuring below, so the extra room is baked into the
    // natural-width measurement instead of tacked on after — see
    // SIDETAB_SHAPE_EXTRA above.
    const extra = SIDETAB_SHAPE_EXTRA[shape] || 0;
    if(extra){
      const basePad = parseFloat(getComputedStyle(clone).paddingLeft) || 0;
      clone.style.paddingLeft = (basePad + extra) + 'px';
    }
    const natural = clone.getBoundingClientRect().width;
    // Past SIDETAB_MAX_POKE, stop growing the tab for a long label and
    // wrap it onto a second line instead (.two-line — see <style> for the
    // -webkit-line-clamp:2 that does the actual wrapping/measuring). A
    // label that's STILL too long even wrapped to two lines (one
    // pathologically long word, in practice) gets ellipsized by that same
    // line-clamp rather than a third case to handle here.
    const poke = Math.min(SIDETAB_MAX_POKE, Math.max(SIDETAB_MIN_POKE, natural));
    const twoLine = natural > SIDETAB_MAX_POKE;
    if(twoLine){
      clone.classList.add('two-line');
      clone.style.height = SIDETAB_HEIGHT_2LINE + 'px';
      if(label) label.style.whiteSpace = '';
    }
    const tuck = clone.classList.contains('active') ? SIDETAB_TUCK_ACTIVE : SIDETAB_TUCK;
    clone.style.width = (poke + tuck) + 'px';
    clone.style.marginLeft = -poke + 'px';
  });
}

// Shapes eligible for 'random'/'iconstyle' — jagged is deliberately
// excluded from both (per the project owner's own callout: it's the one
// "crazy" shape, not meant to show up unpredictably or get assigned to a
// category that never asked for it).
const SIDETAB_SHAPES_PICKABLE = ['pagetab', 'invertedv', 'arrows', 'sawtooth'];
// 'iconstyle' maps each category's own chosen icon glyph (CATEGORY_ICON_
// GLYPHS, 01-categories-theme.js — Settings lets a category pick one) to a
// shape that echoes it: a literal flag reads as a little pennant (pagetab,
// the same silhouette .pagetag uses elsewhere); sharp icons (star/diamond)
// get the sharp outward arrow; rounder/plainer ones split between the
// softer invertedv and the more geometric sawtooth. This is an editorial
// pairing, not a derived one — there's no principled way to compute it, so
// treat this table as the place to retune it if a specific pairing reads
// wrong once you see it.
const SIDETAB_ICON_SHAPE_MAP = {
  flag:'pagetab', dot:'pagetab',
  star:'arrows', diamond:'arrows',
  house:'invertedv', ring:'invertedv',
  square:'sawtooth', check:'sawtooth'
};
function resolveSidetabShape(key, setting){
  if(setting !== 'random' && setting !== 'iconstyle') return setting;
  if(setting === 'iconstyle'){
    const cat = (key!=='all' && key!=='daily') ? CATEGORIES[key] : null;
    const icon = cat ? (cat.icon || 'dot') : 'dot';
    return SIDETAB_ICON_SHAPE_MAP[icon] || 'pagetab';
  }
  // 'random', stable per tab — same hashStr()-off-the-tab's-own-key idiom
  // as tabJitterPx()/tabAngleDeg() above, so it doesn't reshuffle on every
  // unrelated render.
  return SIDETAB_SHAPES_PICKABLE[hashStr('sidetabshape:'+key) % SIDETAB_SHAPES_PICKABLE.length];
}

// The stable per-tab jitter overlapStyle's resting transform reads (see
// renderTabs() above and the .tab transform rules in <style>) — hashStr()
// off the tab's own id/key so it's the same on every render (no reshuffle
// mid-session) rather than a fresh Math.random() each time, which would
// make the row visibly shiver on every unrelated re-render.
const TAB_JITTER_RANGE = 3; // px each way
function tabJitterPx(key){
  return (hashStr('jitter:'+key) % (TAB_JITTER_RANGE*2+1)) - TAB_JITTER_RANGE;
}

// Same stable-hash idiom as tabJitterPx(), for .tab.active's small resting
// tilt (see the rotate() in that rule in <style>) — a distinct hash salt
// ('angle:' vs 'jitter:') so a tab's height jitter and its tilt-when-
// selected don't end up correlated just because they're hashed off the
// same id.
const TAB_ANGLE_RANGE = 2.5; // degrees each way
function tabAngleDeg(key){
  const steps = 20;
  const raw = (hashStr('angle:'+key) % (steps*2+1)) - steps;
  return (raw / steps) * TAB_ANGLE_RANGE;
}

// ---------- tabBarDesktopStyle "overlap": scrunch, wrap-avoidance, and
// the page-connect nudge ----------
// overlapNaturalRects caches each tab's own settled {left,width} (post
// scrunch, pre any hover/active push) so computeOverlapPush() below always
// has a stable, un-pushed baseline to push away from and clamp against —
// without it, a push computed on top of an already-pushed position would
// compound every time it's recalculated instead of resetting cleanly.
// overlapHoveredIdx tracks which tab (by index into visibleTabs(), the
// same order renderTabs() renders in) is currently under the pointer, so
// a stale overlapTabHoverEnd() from a tab that's since been re-rendered
// away can't clobber a newer hover.
let overlapNaturalRects = null;
let overlapHoveredIdx = null;
// Captured by captureOverlapTabFlip() (called from switchTab(), before it
// reassigns the activeTab global and re-renders) and consumed once by
// layoutOverlapTabs() right after it builds the new #tabConnector clone —
// see both for why a plain CSS transition never had a chance to animate
// this on its own: renderTabs() rebuilds every <button> from scratch on
// every render, and the visible "active" tab is actually a freshly
// re-cloned copy in #tabConnector each time too (see the .tabconnector
// comment in <style>), so neither the outgoing nor incoming element that's
// on screen ever survives from one render to the next for a transition to
// play across. This holds the two before/after screen rects a FLIP
// (First-Last-Invert-Play) needs to fake that continuity instead.
let overlapFlipPending = null;

// Shifts `el` to visually start at `fromRect` (a getBoundingClientRect()
// snapshot from just before el's current styling took effect) and lets it
// transition back to wherever it actually belongs, using .tab's own
// existing `transition: transform` (see <style>) rather than adding a
// second animation system. !important is required to outrank .tab.active's
// own !important transform rule — harmless on the resting-tab case below,
// which has no !important to begin with. Pure translate (no attempt to
// also fake the rotation/scale delta) is enough here: browsers interpolate
// a translate-only start against a rotated/matrix end by decomposing both
// into matrices, which reads as a smooth arc rather than a jump-cut, and
// keeping this to one transform function avoids composing it with
// whatever var()-driven transform the element's class already carries.
// The double rAF (not a synchronous forced-reflow-then-remove, which was
// tried first and silently never animated anything) is load-bearing: `el`
// is very often a brand-new node (the #tabConnector clone is rebuilt from
// scratch every render — see layoutOverlapTabs()) with no style change
// event in its history yet for a transition to key off, so even a forced
// layout read mid-task can't manufacture one — the browser needs an actual
// completed rendering update in between to register the start transform as
// a real "before" frame. One rAF alone can still land before that paint
// commits; two reliably lands after it.
function flipFromRect(el, fromRect){
  if(!el || !fromRect) return;
  const toRect = el.getBoundingClientRect();
  const dx = fromRect.left - toRect.left;
  const dy = fromRect.top - toRect.top;
  if(!dx && !dy) return;
  el.style.setProperty('transform', `translate(${dx}px, ${dy}px)`, 'important');
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      el.style.removeProperty('transform');
    });
  });
}

// Called from switchTab() (08-render-core.js) before it changes activeTab
// or re-renders — the last moment the outgoing tab's on-screen stand-in
// (its #tabConnector clone, not the real element, which sits
// visibility:hidden while active) and the incoming tab's current resting-
// or-hovered position are both still on screen to measure.
function captureOverlapTabFlip(nextKey){
  const dev = state.devSettings || {};
  if(mobileUiActive() || dev.tabBarDesktopStyle !== 'overlap') return;
  if(nextKey === activeTab) return;
  const wrap = document.getElementById('tabs');
  if(!wrap) return;
  const nextEl = wrap.querySelector(`.tab[data-key="${nextKey}"]`);
  const connectorClone = document.querySelector('#tabConnector .tab');
  const prevEl = wrap.querySelector(`.tab[data-key="${activeTab}"]`);
  overlapFlipPending = {
    prevKey: activeTab,
    prevRect: (connectorClone || prevEl) ? (connectorClone || prevEl).getBoundingClientRect() : null,
    nextRect: nextEl ? nextEl.getBoundingClientRect() : null
  };
}
// One-line-vs-two-line sizing decisions, keyed by "tab key::label text" and
// persisted across renders (never reset — see layoutOverlapTabs()) rather
// than re-measured fresh every time. A borderline-length label like "House
// Upkeep" sits right at OVERLAP_MAX_LABEL_WIDTH's edge, and re-running the
// same shrink/wrap measurement on a freshly rebuilt element occasionally
// landed a sub-pixel's width on the other side of that edge than last
// time — not a real change, but enough to flip which font-size/wrap
// decision it got, which then visibly "pulsed" on screen even though
// nothing about that tab's content or its neighbors had changed. Caching
// the decision the first time makes it stable by construction: same key
// and label always gets the same answer, every render, forever (until the
// label itself changes, which changes the cache key).
let overlapSizeCache = {};

const OVERLAP_MAX_LABEL_WIDTH = 92;  // soft width budget tried before allowing a real 2nd line — kept
                                      // tight on purpose (a category name isn't a sentence) so one long
                                      // name wraps to 2 lines instead of ballooning into a tab twice
                                      // anyone else's width; see the .two-line lift in <style>.
const OVERLAP_MIN_FONT_PX = 8.5;     // floor for the "shrink to fit one line" attempt below that
const OVERLAP_BASE_OVERLAP = 16;     // default -margin-left between tabs, matches the old hardcoded value
const OVERLAP_REVEAL_COMFORT = 24;   // comfortable px of a tab's own width left peeking out at rest
const OVERLAP_REVEAL_HARD = 10;      // relaxed floor tried once comfort alone can't make everything fit
const OVERLAP_REVEAL_ABSOLUTE = 3;   // last-resort floor — "never fully hides a tab" loses to "must fit" past this
const OVERLAP_MIN_HPAD = 5;          // floor for the secondary lever (horizontal padding) below
const OVERLAP_MAX_PRESSURE = 400;    // solveGapOverlaps()'s search ceiling — plenty for any realistic tab count
const OVERLAP_PUSH1_SLACK = 6;       // px of deliberate residual overlap computeOverlapPush() leaves an
                                      // immediate neighbor with, rather than clearing it completely — lands
                                      // in the neighbor's own --tab-hpad padding, not its label text
const OVERLAP_PUSH2_FRACTION = 0.4;  // how much of a distance-2 tab's own edge gap it gets pushed by —
                                      // noticeably less than a distance-1 neighbor's push, per the ask
const OVERLAP_STAGGER_MAX = 6;       // overlapRankStagger's max lift for the very back-most tab — kept well
                                      // under .active's own dedicated lift (see the .tab.active rule in
                                      // <style>) so "selected always highest" still holds even stacked with
                                      // the worst-case jitter + two-line bonus a resting tab can also have.
const OVERLAP_CONNECT_MIN = 7;       // px the active tab's tail must overlap #appCard's top edge by, at minimum —
                                      // enough to read as "the page is open here," not a flap resting on top,
                                      // without the deeper 14-30px band this started at, which read as the
                                      // clone dipping distractingly far into the card
const OVERLAP_CONNECT_MAX = 16;      // ...and at most, so a 2-3 line label doesn't dip too far into the card

// Solves each gap's own overlap independently, capped by that ONE gap's
// two neighboring tab widths — not a single value derived from the
// narrowest tab anywhere in the row — so scrunching a wide tab further
// never comes at a narrow neighbor's expense. `floor` is how many px of a
// tab's own width must stay peeking out past its neighbor's overlap;
// layoutOverlapTabs() tries OVERLAP_REVEAL_COMFORT first and only relaxes
// it if that alone can't fit the row. Works by walking a single shared
// "pressure" up from the default spacing, capping each gap's actual
// overlap at min(pressure, the two neighbors' widths minus floor) — so
// pressure only ever *adds* overlap where a gap can actually afford it.
function solveGapOverlaps(widths, available, floor){
  const n = widths.length;
  const gaps = new Array(Math.max(0, n - 1)).fill(0);
  if(n <= 1) return { gaps, displayed: widths[0] || 0 };
  let displayed = widths.reduce((a,b)=>a+b, 0);
  for(let pressure = OVERLAP_BASE_OVERLAP; pressure <= OVERLAP_MAX_PRESSURE; pressure++){
    displayed = widths[0];
    for(let i = 1; i < n; i++){
