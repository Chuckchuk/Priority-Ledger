async function addDayTask(dateStr){
  const input = document.getElementById('dayQuickInput');
  const title = input.value.trim();
  if(!title) return;
  const category = document.getElementById('dayQuickCategory').value;
  pushUndo(`Added "${title}"`);
  await ensureDay(dateStr);
  state.tasks.unshift({
    id: newId('task'),
    title, category, status:'open', urgent:false, dueDate:'', notes:'', subtasks:[], plannedDates:[dateStr], createdAt: todayStr(),
    timeframe:'', priority:0, completedAt:''
  });
  render();
  queueSave();
}

// Shared by both "add to day" picker styles (cascade and tree) — plans a
// whole task (or a whole checklist, since a checklist list is just a
// plain state.tasks entry too) onto a specific day. Additive: a task
// already planned on some other day keeps that day too, rather than
// getting bumped off it — plannedDates is an array specifically so a
// task/checklist can sit on any number of dailies at once (see the
// migration note in normalizeState()). Idempotent against a day it's
// already on, so re-clicking an "Added" tree row can't duplicate the date.
async function planTaskForDay(taskId, dateStr){
  const t = state.tasks.find(t=>t.id===taskId);
  if(!t) return;
  if(!t.plannedDates) t.plannedDates = [];
  if(t.plannedDates.includes(dateStr)) return;
  pushUndo(`Added "${t.title}" to day`);
  t.plannedDates.push(dateStr);
  await ensureDay(dateStr);
  render();
  queueSave();
}

async function unplanTaskFromDay(taskId, dateStr){
  const t = state.tasks.find(t=>t.id===taskId);
  if(!t) return;
  const idx = (t.plannedDates||[]).indexOf(dateStr);
  if(idx===-1) return;
  pushUndo(`Removed "${t.title}" from day`);
  t.plannedDates.splice(idx, 1);
  render();
  reopen(taskId);
  queueSave();
}

// Plans a single step onto a day independently of its parent task's own
// plannedDates — same idea as planTaskForDay, one level down.
async function pullSubtaskToDay(taskId, subId, dateStr){
  const t = state.tasks.find(t=>t.id===taskId);
  const s = t && (t.subtasks||[]).find(s=>s.id===subId);
  if(!s) return;
  if(!s.plannedDates) s.plannedDates = [];
  if(s.plannedDates.includes(dateStr)) return;
  pushUndo(`Added step "${s.text}" to day`);
  s.plannedDates.push(dateStr);
  await ensureDay(dateStr);
  render();
  queueSave();
}

async function unplanSubtaskFromDay(taskId, subId, dateStr){
  const t = state.tasks.find(t=>t.id===taskId);
  const s = t && (t.subtasks||[]).find(s=>s.id===subId);
  if(!s) return;
  const idx = (s.plannedDates||[]).indexOf(dateStr);
  if(idx===-1) return;
  pushUndo(`Removed step "${s.text}" from day`);
  s.plannedDates.splice(idx, 1);
  render();
  queueSave();
}

// Same copy-forward semantics as moveIncompleteToTomorrow, one item at a
// time — keeps the item on the day it started on and additionally plans
// it onto tomorrow, rather than pulling it off today (that's a different
// action the project owner didn't want here). Idempotent: a no-op once
// tomorrow's date is already in plannedDates, so the button can safely be
// left enabled without risking a duplicate — see the taskRowHtml/
// daySubtaskRowHtml render sites for where it's disabled once already added.
async function moveTaskToTomorrow(taskId, dateStr){
  const t = state.tasks.find(t=>t.id===taskId);
  if(!t) return;
  const nextDate = addDaysToDateStr(dateStr, 1);
  if(!t.plannedDates) t.plannedDates = [];
  if(t.plannedDates.includes(nextDate)) return;
  pushUndo(`Also planned "${t.title}" for ${fmtDate(nextDate)}`);
  t.plannedDates.push(nextDate);
  await ensureDay(nextDate);
  render();
  queueSave();
}

async function moveSubtaskToTomorrow(taskId, subId, dateStr){
  const t = state.tasks.find(t=>t.id===taskId);
  const s = t && (t.subtasks||[]).find(s=>s.id===subId);
  if(!s) return;
  const nextDate = addDaysToDateStr(dateStr, 1);
  if(!s.plannedDates) s.plannedDates = [];
  if(s.plannedDates.includes(nextDate)) return;
  pushUndo(`Also planned step "${s.text}" for ${fmtDate(nextDate)}`);
  s.plannedDates.push(nextDate);
  await ensureDay(nextDate);
  render();
  queueSave();
}

// A checklist row inside the Daily view opens into the checklist detail
// page, but that page only ever shows while its own category tab is
// active (see render()'s isChecklist branch) — switching tabs first is
// what actually makes it visible, openChecklistList() alone would just
// set selectedListId behind the still-showing Daily view.
function openChecklistListFromDay(taskId, dateStr){
  const t = state.tasks.find(t=>t.id===taskId);
  if(!t) return;
  switchTab(t.category);
  openChecklistList(taskId, dateStr);
}

// The compact replacement for the old "Plan for Day" date picker — one
// tap, toggles specifically *today's* membership in plannedDates. A task
// already planned on some other day keeps that day too (see the note on
// planTaskForDay) — this button only ever adds/removes today, it never
// touches any other day the task is already planned for.
async function toggleTaskToday(id){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  if(!t.plannedDates) t.plannedDates = [];
  const today = todayStr();
  const idx = t.plannedDates.indexOf(today);
  const willPlan = idx === -1;
  pushUndo(willPlan ? `Added "${t.title}" to today` : `Removed "${t.title}" from today`);
  if(willPlan) t.plannedDates.push(today); else t.plannedDates.splice(idx, 1);
  if(willPlan) await ensureDay(today);
  render();
  reopen(id);
  queueSave();
}

// Setting timeframe to "today" also plans the task for today's Daily list
// — one-way only. Changing the timeframe away from "today" later doesn't
// auto-unplan it, since the task may since have been deliberately kept on
// that day's list for reasons unrelated to this field; use the existing
// Unplan button for that.
// timeframeManual tracks whether this field's current value came from an
// explicit pick here vs. being auto-derived from the due date (see
// deriveTimeframeFromDueDate() in 05-dates-sort.js and its use in
// updateDueDate(), 16-task-crud.js) — this is the only place that flag
// ever gets set. Any real pick sets it true, which is what stops a later
// due-date change from silently overwriting a deliberate choice; picking
// back to "None" resets it to false instead of leaving it permanently
// "manual" with nothing in it to protect, so a cleared field re-opts
// into auto-tracking on the next due-date change rather than staying
// inert forever.
async function updateTimeframe(id, val){
  const t = state.tasks.find(t=>t.id===id);
  if(!t || val === t.timeframe) return;
  pushUndo(`Set timeframe for "${t.title}"`);
  t.timeframe = val;
  t.timeframeManual = val !== '';
  if(val === 'today'){
    if(!t.plannedDates) t.plannedDates = [];
    if(!t.plannedDates.includes(todayStr())) t.plannedDates.push(todayStr());
    await ensureDay(todayStr());
  }
  render();
  reopen(id);
  queueSave();
}

async function updatePriority(id, val){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  const p = parseInt(val, 10) || 0;
  if(p === t.priority) return;
  pushUndo(`Set priority for "${t.title}"`);
  t.priority = p;
  render();
  reopen(id);
  queueSave();
}

function startEditSubtask(el, taskId, subId){
  const t = state.tasks.find(t=>t.id===taskId);
  const s = t && (t.subtasks||[]).find(s=>s.id===subId);
  if(!s) return;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'subedit';
  input.value = s.text;
  el.replaceWith(input);
  input.focus();
  input.select();
  let committed = false;
  const commit = async () => {
    if(committed) return;
    committed = true;
    const val = input.value.trim();
    if(val && val !== s.text){
      pushUndo(`Renamed step to "${val}"`);
      s.text = val;
      queueSave();
    }
    render();
    reopen(taskId);
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); input.blur(); } });
}

// Same swap-in-a-text-input trick as startEditSubtask(), but the typed
// value goes through parseNaturalDate() rather than being saved as-is.
// An empty input clears the date; a non-empty value that fails to parse
// just reverts to whatever was there before — silently guessing wrong
// would be worse than making the user retype it.
function startEditSubtaskDate(el, taskId, subId){
  const t = state.tasks.find(t=>t.id===taskId);
  const s = t && (t.subtasks||[]).find(s=>s.id===subId);
  if(!s) return;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'datefieldedit';
  input.value = s.dueDate ? fmtDateShort(s.dueDate) : '';
  input.placeholder = 'today, tmrw, 9/1, tue…';
  el.replaceWith(input);
  input.focus();
  input.select();
  let committed = false;
  const commit = async () => {
    if(committed) return;
    committed = true;
    const raw = input.value.trim();
    if(!raw){
      if(s.dueDate) await updateSubtaskDueDate(taskId, subId, '');
      else { render(); reopen(taskId); }
      return;
    }
    const parsed = parseNaturalDate(raw);
    if(parsed) await updateSubtaskDueDate(taskId, subId, parsed);
    else { render(); reopen(taskId); } // unparseable — revert, don't save
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); input.blur(); } });
}

// Same auto-plan-onto-its-due-day behavior as updateDueDate — see the
// comment there.
async function updateSubtaskDueDate(taskId, subId, dueDate){
  const t = state.tasks.find(t=>t.id===taskId);
  const s = t && (t.subtasks||[]).find(s=>s.id===subId);
  if(!s) return;
  pushUndo(dueDate ? `Dated step "${s.text}"` : `Cleared date for step "${s.text}"`);
  s.dueDate = dueDate;
  if(dueDate && isDueWithinDays(dueDate, 3)){
    if(!s.plannedDates) s.plannedDates = [];
    if(!s.plannedDates.includes(dueDate)){
      s.plannedDates.push(dueDate);
      await ensureDay(dueDate);
    }
  }
  render();
  reopen(taskId);
  queueSave();
}

async function toggleSubtaskToday(taskId, subId){
  const t = state.tasks.find(t=>t.id===taskId);
  const s = t && (t.subtasks||[]).find(s=>s.id===subId);
  if(!s) return;
  if(!s.plannedDates) s.plannedDates = [];
  const today = todayStr();
  const idx = s.plannedDates.indexOf(today);
  const willPlan = idx === -1;
  pushUndo(willPlan ? `Added step "${s.text}" to today` : `Removed step "${s.text}" from today`);
  if(willPlan) s.plannedDates.push(today); else s.plannedDates.splice(idx, 1);
  if(willPlan) await ensureDay(today);
  render();
  reopen(taskId);
  queueSave();
}

async function submitFabAdd(){

    createdAt: todayStr()

async function addTask(){
  const input = document.getElementById('quickInput');

  const timeframe = document.getElementById('quickTimeframe').value;

// One-shot: the id of a task whose .check should play the "just
// completed" celebration burst (see the check-celebrate CSS in <style>
// and its use in taskRowHtml()/renderTaskDetailPage(), 08-render-core.js)
// on the very next render only. Set right before that render() call and
// cleared immediately after, so a later, unrelated render() (a background
// refresh, another edit) never replays it — a real DOM flag can't survive
// render() anyway, since render() rebuilds the relevant view's whole
// innerHTML from scratch.
let celebrateCheckTaskId = null;

// Completing a task stamps completedAt; reopening it clears that stamp
// entirely rather than keeping a history of past completions — the undo
// stack is already this app's history mechanism for "what did this used
// to be," so a second, per-field log would just be redundant bookkeeping.
async function toggleStatus(id){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  const willBeDone = t.status !== 'done';
  pushUndo(willBeDone ? `Completed "${t.title}"` : `Reopened "${t.title}"`);
  t.status = willBeDone ? 'done' : 'open';
  t.completedAt = willBeDone ? todayStr() : '';
  // Reopening a cancelled task (this checkbox is its only way back to
  // open) clears the flag too — "open and still marked cancelled" isn't
  // a real state, and t.cancelled only ever means anything alongside
  // status==='done' anyway (see markTaskCancelled() below).
  if(!willBeDone) t.cancelled = false;
  celebrateCheckTaskId = willBeDone ? id : null;
  // Completing a task lingers in place for a beat — see scheduleTaskLeave()
  // below — so there's actually time to see the celebration play before
  // the row moves, rather than an instant re-sort/vanish. Applies whether
  // or not completed tasks are currently shown: with showDone off the row
  // leaves the list for good once it collapses; with it on, the row still
  // collapses in its original spot and then reappears at its now-sorted
  // position (the bottom, among the other completed tasks) instead of
  // teleporting straight there. Reopening skips this entirely — nothing
  // to animate away, so it renders immediately like every other edit.
  const willLinger = willBeDone;
  if(willLinger) completingTaskIds.add(id);
  else completingTaskIds.delete(id);
  render();
  celebrateCheckTaskId = null;
  queueSave();
  if(willLinger) scheduleTaskLeave(id);
}

// Reached only from the right-click/long-press menu (taskContextMenuHtml(),
// 08-render-core.js) — deliberately no dedicated button anywhere else,
// per the explicit ask. Functionally identical to completing a task
// (status:'done', same completingTaskIds linger + scheduleTaskLeave(),
// same sort/sub-total/Show-Completed treatment — everything that reads
// status==='done' can't tell the difference), with t.cancelled the one
// extra bit that only ever changes how it's *drawn* (checkGuideClass()/
// an X instead of a check, red strike-through — see taskRowHtml()'s own
// comment). No celebration burst (celebrateCheckTaskId stays untouched)
// — that's this app's one deliberate "you did it" moment, and cancelling
// something isn't that.
async function markTaskCancelled(id){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  pushUndo(`Marked "${t.title}" cancelled`);
  t.status = 'done';
  t.cancelled = true;
  t.completedAt = todayStr();
  completingTaskIds.add(id);
  render();
  queueSave();
  scheduleTaskLeave(id);
}

// How long the just-checked row lingers, fully visible (checkmark,
// strikethrough title, the celebration burst), before it starts actually
// leaving — roughly the celebration burst's own duration
// (check-celebrate-burst in <style>) plus a small buffer so it doesn't
// read as cut off.
const TASK_COMPLETE_LINGER_MS = 650;
// How long the row's own collapse (max-height/opacity/padding/border, all
// animated together — see .task-leaving in <style>) takes once it
// starts. Kept a touch above that rule's own longest transition so the
// final render() below never fires mid-animation.
const TASK_LEAVE_COLLAPSE_MS = 280;

// Fires TASK_COMPLETE_LINGER_MS after a task is marked done (see
// toggleStatus() above). Rather than a second render() removing (or
// re-sorting) the row outright, this measures the row's own current
// height and animates it down to 0 directly on its real DOM node — a
// genuine layout collapse, not just a fade, so the rows below it slide up
// to close the gap as a natural side effect of that collapse instead of
// needing a separate "slide up" animation of their own. Only once the
// collapse has actually finished does completingTaskIds let go and a real
// render() reflect the task's real, now-sorted position for good — with
// showDone off that means it's gone from the list entirely; with it on,
// it reappears at the bottom among the other completed tasks, in the
// same spot it would've landed in immediately before this existed. Either
// way, by the time that render() runs the row is already visually
// flattened to nothing, so the swap itself is invisible.
function scheduleTaskLeave(id){
  setTimeout(() => {
    // The task may have been reopened or deleted in the meantime (undo, a
    // second click) — either means there's nothing left to animate away,
    // so just drop the now-pointless linger entry and let the next
    // render() reflect reality normally instead of forcing a collapse
    // that no longer applies. Unlike an earlier version of this, showDone
    // being on is no longer one of these bail-out cases — see toggleStatus()'s
    // own comment for why completing now lingers either way.
    const t = state.tasks.find(t=>t.id===id);
    if(!t || t.status !== 'done'){ completingTaskIds.delete(id); return; }
    const row = document.querySelector(`li.task[data-task-id="${id}"]`);
    if(!row){ completingTaskIds.delete(id); render(); return; }
    row.style.maxHeight = row.scrollHeight + 'px';
    row.style.overflow = 'hidden';
    // A separate frame from the height-lock above — the transition
    // .task-leaving declares needs a real "before" value already painted
    // to interpolate away from, not the same frame it's applied in.
    requestAnimationFrame(() => {
      row.classList.add('task-leaving');
      row.style.maxHeight = '0px';
    });
    setTimeout(() => {
      completingTaskIds.delete(id);
      render();
    }, TASK_LEAVE_COLLAPSE_MS);
  }, TASK_COMPLETE_LINGER_MS);
}

async function toggleUrgent(id){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  const willBeUrgent = !t.urgent;
  pushUndo(willBeUrgent ? `Flagged "${t.title}" urgent` : `Unflagged "${t.title}"`);
  t.urgent = willBeUrgent;
  render();
  reopen(id);
  queueSave();
}

// Setting a due date within isDueWithinDays' 3-day/overdue window also
// plans the task onto that due date's daily — same window the "Add to
// this day" tree already uses to decide what's eligible to pull in, just
// applied automatically instead of waiting for a manual tree add.
// ensureDay() creates that day if it doesn't exist yet. One-way, same as
// updateTimeframe's "today" plan: pushing the due date back out past the
// window later doesn't retroactively unplan it.
//
// One-shot, same idiom as celebrateCheckTaskId just below — which task's
// Timeframe field (see taskAdvancedFieldsRowHtml(), 08-render-core.js)
// should flash on the very next render, and which of the two flashes:
// 'auto' (the due-date change just filled/updated Timeframe for you) or
// 'conflict' (the due date implied a different Timeframe than what's
// there, but a manual pick is protecting it, so nothing actually
// changed). Set right before the render() call below and cleared
// immediately after, for the same reason celebrateCheckTaskId is —
// render() rebuilds the relevant view from scratch each time, so a DOM
// class alone can't survive it, and a later unrelated render() must
// never replay a flash that isn't its own.
let timeframeFlashTaskId = null;
let timeframeFlashKind = null; // 'auto' | 'conflict'
async function updateDueDate(id, val){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  if(val === t.dueDate) return;
  pushUndo(`Changed due date for "${t.title}"`);
  t.dueDate = val;
  if(val && isDueWithinDays(val, 3)){
    if(!t.plannedDates) t.plannedDates = [];
    if(!t.plannedDates.includes(val)){
      t.plannedDates.push(val);
      await ensureDay(val);
    }
  }
  // See deriveTimeframeFromDueDate()'s own comment (05-dates-sort.js) for
  // the actual thresholds/ambiguous-zone reasoning. Only ever fires when
  // the derived value would be a real *change* from the current one —
  // re-deriving the same value the field already holds isn't worth
  // flashing over, auto or manual either way.
  timeframeFlashTaskId = null;
  timeframeFlashKind = null;
  const derivedTimeframe = deriveTimeframeFromDueDate(val);
  if(derivedTimeframe && derivedTimeframe !== t.timeframe){
    if(!t.timeframeManual){
      t.timeframe = derivedTimeframe;
      timeframeFlashTaskId = id;
      timeframeFlashKind = 'auto';
    } else {
      timeframeFlashTaskId = id;
      timeframeFlashKind = 'conflict';
    }
  }
  render();
  reopen(id);
  timeframeFlashTaskId = null;
  timeframeFlashKind = null;
  queueSave();
}

function reopen(id){
  expandedTaskIds.add(id);
  const exp = document.getElementById('exp-' + id);
  if(exp) exp.classList.add('open');
}

async function updateTitle(id, val){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  const newVal = val.trim();
  if(newVal && newVal !== t.title){
    pushUndo(`Renamed task to "${newVal}"`);
    t.title = newVal;
    queueSave();
  }
  render();
  reopen(id);
}

async function updateCategory(id, val){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  if(val === t.category) return;
  const label = (CATEGORIES[val] || FALLBACK_CATEGORY).label;
  pushUndo(`Moved "${t.title}" to ${label}`);
  t.category = val;
  render();
  reopen(id);
  queueSave();
}

// render() rebuilds the relevant view's whole innerHTML on every
// mutation, which destroys and recreates the "add a step/item" input
// rather than just clearing it in place — so the freshly-typed-into
// input loses focus after every single Enter unless something
// explicitly refocuses whichever new .subadd render() just created.
// Scoped to the currently visible one (offsetParent is null for a
// display:none element) since a hidden task's own .subadd can still be
// in the DOM even when it's not the one the user was just typing into.
function focusVisibleSubadd(){
  for(const el of document.querySelectorAll('.subadd')){
    if(el.offsetParent !== null){ el.focus(); return; }
  }
}

async function addSubtask(taskId, text){
  const val = (text||'').trim();
  if(!val) return;
  const t = state.tasks.find(t=>t.id===taskId);
  if(!t) return;
  pushUndo(`Added step to "${t.title}"`);
  if(!t.subtasks) t.subtasks = [];
  t.subtasks.push({ id: newId('sub'), text: val, done:false, dueDate:'', plannedDates:[] });
  render();
  reopen(taskId);
  focusVisibleSubadd();
  queueSave();
}

async function toggleSubtask(taskId, subId){
  const t = state.tasks.find(t=>t.id===taskId);
  if(!t) return;
  const s = (t.subtasks||[]).find(s=>s.id===subId);
  if(!s) return;
  pushUndo(s.done ? `Unchecked step in "${t.title}"` : `Checked step in "${t.title}"`);
  s.done = !s.done;
  // Same reasoning as toggleStatus()'s own reopen case — unchecking a
  // cancelled step is its only way back to not-done, so it stops being
  // "cancelled" at the same time rather than leaving that flag orphaned.
  if(!s.done) s.cancelled = false;
  render();
  reopen(taskId);
  queueSave();
}
// Reached only from a step's own right-click/long-press menu
// (subtaskContextMenuHtml() etc., 08-render-core.js) — same "identical
// functionality to complete, different only in how it's drawn" idea as
// markTaskCancelled() above, just one level down: s.done is what every
// existing consumer (subProgressHtml()'s pip fill, checkGuideClass()'s
// "all steps done" check, etc.) already reads, so setting it true here
// is all the functional side needs; s.cancelled only changes rendering.
async function markSubtaskCancelled(taskId, subId){
  const t = state.tasks.find(t=>t.id===taskId);
  if(!t) return;
  const s = (t.subtasks||[]).find(s=>s.id===subId);
  if(!s) return;
  pushUndo(`Marked a step in "${t.title}" cancelled`);
  s.done = true;
  s.cancelled = true;
  render();
  reopen(taskId);
  queueSave();
}

async function deleteSubtask(taskId, subId){
  const t = state.tasks.find(t=>t.id===taskId);
  if(!t) return;
  pushUndo(`Deleted step from "${t.title}"`);
  t.subtasks = (t.subtasks||[]).filter(s=>s.id!==subId);
  render();
  reopen(taskId);
  queueSave();
}

async function updateNotes(id, val){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  if(val === t.notes) return;
  pushUndo(`Edited notes for "${t.title}"`);
  t.notes = val;
  queueSave();
}

// Shared by deleteTask() and deleteChecklistList() (13-checklist.js) — a
// checklist "list" is a plain task object under the hood, so both kinds
// of delete land in the same state.trash array (see purgeOldTrash(),
// 02-storage-state.js) and Recently Deleted (trashSectionHtml(),
// 09-settings.js) doesn't need to know or care which one it's looking
// at. Called *after* the item has already been spliced out of
// state.tasks by the caller — this only handles archiving it.
function moveTaskToTrash(t){
  if(!Array.isArray(state.trash)) state.trash = [];
  state.trash.unshift({ task: t, deletedAt: new Date().toISOString() });
}
async function deleteTask(id){
  const idx = state.tasks.findIndex(t=>t.id===id);
  if(idx === -1) return;
  const t = state.tasks[idx];
  pushUndo(`Deleted "${t.title}"`);
  state.tasks.splice(idx, 1);
  moveTaskToTrash(t);
  render();
  queueSave();
}
// Restore/permanent-delete both live here rather than 09-settings.js
// (where Recently Deleted actually renders) — same reasoning as every
// other *action* function in this app sitting apart from the render
// function that calls it.
async function restoreFromTrash(id){
  const idx = (state.trash||[]).findIndex(e=>e.task.id===id);
  if(idx === -1) return;
  const entry = state.trash[idx];
  pushUndo(`Restored "${entry.task.title}"`);
  state.trash.splice(idx, 1);
  state.tasks.push(entry.task);
  render();
  queueSave();
}
async function permanentlyDeleteFromTrash(id){
  const idx = (state.trash||[]).findIndex(e=>e.task.id===id);
  if(idx === -1) return;
  pushUndo(`Permanently deleted "${state.trash[idx].task.title}"`);
  state.trash.splice(idx, 1);
  render();
  queueSave();
}

function toggleExpand(evt, id){
  if(expandedTaskIds.has(id)) expandedTaskIds.delete(id); else expandedTaskIds.add(id);
  const exp = document.getElementById('exp-' + id);
  exp.classList.toggle('open');
}

async function toggleLocation(){
  if(!state.locationEnabled || state.locations.length < 2) return;
  const idx = state.locations.findIndex(l=>l.id===state.location);
  state.location = state.locations[(idx + 1) % state.locations.length].id;
  if(!visibleTabs().includes(activeTab)) activeTab = 'all';
  render();
  queueSave();
}

// ---- Auth error/feedback system ----
// Centralizes "show this error to the person" for all three auth forms
// (sign-in/sign-up, forgot-password, set-new-password) so the mapping
// from a raw Supabase/network failure to plain language lives in one
// place instead of being copied at each call site.

const AUTH_FETCH_TIMEOUT_MS = 15000;

// Wraps fetch with a hard timeout. A stalled connection otherwise never
// resolves or rejects at all — no error, no success, just silence, which
// is exactly what "I hit sign in and nothing happened" looks like from
// the outside. Past AUTH_FETCH_TIMEOUT_MS this aborts, and the caller's
// catch block sees a plain AbortError, same shape as any other network
// failure.
async function authFetch(url, opts){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), AUTH_FETCH_TIMEOUT_MS);
  try{
    return await fetch(url, { ...opts, signal: controller.signal });
  }finally{
    clearTimeout(timer);
  }
}

// Maps a Supabase GoTrue error body to a specific, plain-language
// message. Matched by substring against GoTrue's own message text rather
// than an error_code field, since error_code isn't present on every
// GoTrue version/endpoint but the wording has been stable. Falls back to
// GoTrue's own raw text (still better than a generic "something went
// wrong") when nothing here matches.
function humanizeAuthError(data, status){
  const raw = (data && (data.error_description || data.msg || data.error || data.message)) || '';
  const m = raw.toLowerCase();
  if(m.includes('invalid login credentials')) return "That email or password isn't right.";
  if(m.includes('email not confirmed')) return "You haven't confirmed this email yet — check your inbox for the confirmation link.";
  if(m.includes('already registered') || m.includes('already exists')) return 'An account with that email already exists — try signing in instead.';
  if(m.includes('rate limit')) return 'Too many attempts — wait a few minutes and try again.';
  if(m.includes('invalid email') || m.includes('unable to validate email')) return "That doesn't look like a valid email address.";
  if(m.includes('password')) return raw; // Supabase's own wording (e.g. minimum length) is already specific and actionable
  if(status === 429) return 'Too many attempts — wait a few minutes and try again.';
  if(status >= 500) return "Something's wrong on the server right now — try again in a moment.";
  return raw || 'Something went wrong. Please try again.';
}

// Same idea for a fetch that never got a response at all.
function humanizeAuthNetworkError(e){
  if(e && e.name === 'AbortError') return "That's taking too long — check your connection and try again.";
  return "Can't reach the server — check your internet connection and try again.";
}

// Puts a message on screen for one of the three auth forms. A real error
// (not an informational next-step like "check your email") shakes the
// form and outlines whichever fields the message is about — see the CSS
// comment on .authform input.autherr-field for why the outline is a
// separate class from the shake. Omit fieldIds for a form-level failure
// (network/timeout/server) that isn't any one field's fault.
function authFeedback(errElId, formEl, message, { isError = true, fieldIds = [] } = {}){
  const errEl = document.getElementById(errElId);
  errEl.textContent = message;
  errEl.classList.remove('err', 'info');
  errEl.classList.add(isError ? 'err' : 'info');
  formEl.querySelectorAll('input.autherr-field').forEach(el => el.classList.remove('autherr-field'));
  if(isError){
    fieldIds.forEach(id => document.getElementById(id).classList.add('autherr-field'));
    // Remove, force a reflow, then re-add — a class that's already
    // present doesn't restart a CSS animation, so without this a second
    // failure in a row wouldn't shake again.
    formEl.classList.remove('authshake');
    void formEl.offsetWidth;
    formEl.classList.add('authshake');
  }
}

function clearAuthFeedback(errElId, formEl){
  const errEl = document.getElementById(errElId);
  errEl.textContent = '';
  errEl.classList.remove('err', 'info');
  formEl.querySelectorAll('input.autherr-field').forEach(el => el.classList.remove('autherr-field'));
}

// Disables the submit button and swaps its label for the duration of an
// in-flight auth request, restoring both afterward regardless of outcome
// — the visible "something is happening" state that keeps a slow request
// from reading as the button having done nothing.
async function withAuthBusy(btnId, busyLabel, fn){
  const btn = document.getElementById(btnId);
  if(btn.disabled) return; // already mid-request — ignore a double Enter/click
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = busyLabel;
  try{
    await fn();
  }finally{
    btn.disabled = false;
    btn.textContent = original;
  }
}

function toggleAuthMode(){
  authMode = authMode === 'signin' ? 'signup' : 'signin';
  document.getElementById('authSubmitBtn').textContent = authMode === 'signin' ? 'Sign In' : 'Create Account';
  document.getElementById('authModeToggle').textContent =
    authMode === 'signin' ? 'Need an account? Create one' : 'Already have an account? Sign in';
  // Same field either way (see authForm in shell-body.html) — the
  // autocomplete hint is what tells Safari/iCloud Keychain whether to
  // offer an existing saved password (signing in) or treat whatever gets
  // typed as a new credential worth saving (signing up), rather than
  // trying to match it against an old one.
  document.getElementById('authPassword').setAttribute('autocomplete', authMode === 'signin' ? 'current-password' : 'new-password');
  clearAuthFeedback('authError', document.querySelector('#authShell .authform'));
  // Only makes sense while signing in — a brand-new account has no
  // password to forget yet.
  document.getElementById('forgotPasswordRow').style.display = authMode === 'signin' ? '' : 'none';
}

// A dedicated view rather than reusing #authEmail — the sign-in field
// might be empty, might hold an email the person is only *trying* (not
// the account they actually forgot the password to), and reusing it made
// it easy to fire off a reset without realizing which address it'd go to.
function showForgotPassword(){
  document.getElementById('forgotEmail').value = document.getElementById('authEmail').value.trim();
  clearAuthFeedback('forgotError', document.querySelector('#forgotShell .authform'));
  document.getElementById('authShell').style.display = 'none';
  document.getElementById('forgotShell').style.display = '';
  updateForgotSubmitState();
}

function hideForgotPassword(){
  clearTimeout(forgotCooldownTimer);
  document.getElementById('forgotShell').style.display = 'none';
  document.getElementById('authShell').style.display = '';
}

// Supabase's own send limit is a single quota shared across the whole
// project, not per-user — a client-side, per-browser cooldown can't
// enforce that globally, and isn't trying to. What it stops is someone
// mashing this exact button while troubleshooting ("did it send? let me
// try again") and burning through several slots of that shared quota in
// a few seconds, which is exactly what happened here once already.
const PASSWORD_RESET_COOLDOWN_MS = 60000;
let forgotCooldownTimer = null;

function forgotCooldownRemainingMs(){
  const last = Number(localStorage.getItem('ledger-last-reset-request') || 0);
  return Math.max(0, PASSWORD_RESET_COOLDOWN_MS - (Date.now() - last));
}

function updateForgotSubmitState(){
  const btn = document.getElementById('forgotSubmitBtn');
  const remaining = forgotCooldownRemainingMs();
  clearTimeout(forgotCooldownTimer);
  if(remaining > 0){
    btn.disabled = true;
    btn.textContent = `Resend in ${Math.ceil(remaining / 1000)}s`;
    forgotCooldownTimer = setTimeout(updateForgotSubmitState, 1000);
  }else{
    btn.disabled = false;
    btn.textContent = 'Send reset link';
  }
}

// Supabase's /recover endpoint returns 200 whether or not the email
// actually belongs to an account (avoids leaking which emails are
// registered), so the success message here is deliberately generic rather
// than confirming an email was sent to a real account.
async function requestPasswordReset(){
  if(forgotCooldownRemainingMs() > 0) return; // the disabled button already guards this; a queued Enter keypress is the one other way in
  const email = document.getElementById('forgotEmail').value.trim();
  const formEl = document.querySelector('#forgotShell .authform');
  if(!email){ authFeedback('forgotError', formEl, 'Enter an email above.', { fieldIds: ['forgotEmail'] }); return; }
  localStorage.setItem('ledger-last-reset-request', String(Date.now()));
  updateForgotSubmitState();
  try{
    const res = await authFetch(`${SUPABASE_URL}/auth/v1/recover?redirect_to=${encodeURIComponent(AUTH_REDIRECT_URL)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ email })
    });
    if(!res.ok){
      const data = await res.json().catch(() => ({}));
      authFeedback('forgotError', formEl, humanizeAuthError(data, res.status), { fieldIds: ['forgotEmail'] });
      return;
    }
    authFeedback('forgotError', formEl, 'If that email has an account, a reset link is on its way.', { isError: false });
  }catch(e){
    authFeedback('forgotError', formEl, humanizeAuthNetworkError(e), {});
  }
}

// Handles the #resetShell form init() shows when the page loads with a
// password-recovery hash (see init() in 19-bootstrap.js). The recovery
// link's access_token is itself a valid session token, so a successful
// password change logs the user straight in rather than sending them back
// to the sign-in form to re-enter the password they just set.
async function submitPasswordReset(){
  const pw = document.getElementById('resetPassword').value;
  const pw2 = document.getElementById('resetPasswordConfirm').value;
  const formEl = document.querySelector('#resetShell .authform');
  if(!pw || pw.length < 6){ authFeedback('resetError', formEl, 'Password must be at least 6 characters.', { fieldIds: ['resetPassword'] }); return; }
  if(pw !== pw2){ authFeedback('resetError', formEl, "Passwords don't match.", { fieldIds: ['resetPassword', 'resetPasswordConfirm'] }); return; }
  await withAuthBusy('resetSubmitBtn', 'Saving…', async () => {
    try{
      const res = await authFetch(`${SUPABASE_URL}/auth/v1/user`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${recoverySession.access_token}`
        },
        body: JSON.stringify({ password: pw })
      });
      const data = await res.json().catch(() => ({}));
      if(!res.ok){ authFeedback('resetError', formEl, humanizeAuthError(data, res.status), { fieldIds: ['resetPassword'] }); return; }
      history.replaceState(null, '', location.pathname + location.search);
      saveSession({
        access_token: recoverySession.access_token,
        refresh_token: recoverySession.refresh_token,
        expires_at: Date.now() + recoverySession.expires_in * 1000,
        user_id: data.id,
        email: data.email
      });
      recoverySession = null;
      document.getElementById('resetShell').style.display = 'none';
      await enterApp();
    }catch(e){
      authFeedback('resetError', formEl, humanizeAuthNetworkError(e), {});
    }
  });
}

async function submitAuth(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const formEl = document.querySelector('#authShell .authform');
  if(!email || !password){
    authFeedback('authError', formEl, 'Enter both an email and a password.', {
      fieldIds: [!email && 'authEmail', !password && 'authPassword'].filter(Boolean)
    });
    return;
  }
  const endpoint = authMode === 'signin'
    ? `${SUPABASE_URL}/auth/v1/token?grant_type=password`
    : `${SUPABASE_URL}/auth/v1/signup?redirect_to=${encodeURIComponent(AUTH_REDIRECT_URL)}`;
  await withAuthBusy('authSubmitBtn', authMode === 'signin' ? 'Signing in…' : 'Creating account…', async () => {
    try{
      const res = await authFetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json().catch(() => ({}));
      if(!res.ok){
        authFeedback('authError', formEl, humanizeAuthError(data, res.status), { fieldIds: ['authEmail', 'authPassword'] });
        return;
      }
      if(!data.access_token){
        authFeedback('authError', formEl, 'Check your email to confirm your account, then sign in.', { isError: false });
        return;
      }
      saveSession({
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        expires_at: Date.now() + data.expires_in * 1000,
        user_id: data.user.id,
        email: data.user.email
      });
      await enterApp();
    }catch(e){
      authFeedback('authError', formEl, humanizeAuthNetworkError(e), {});
    }
  });
}

function signOut(){
  saveSession(null);
  appEntered = false;
  stopAutoRefresh();
  localOnlyMode = false;
  settingsOpen = false;
  claudeView = null;
  selectedListId = null;
  checklistPendingOpen = false;
  dailyCalendarOpen = false;
  dayReturnToCalendar = false;
  pendingDeleteCategoryId = null;
  closeShareMenu();
  shareImportId = null;
  shareImportData = null;
  closeAllSettingsPopovers();
  undoStack = [];
  redoStack = [];
  expandedTaskIds = new Set();
  devPanelOpen = false;
  applyThemeObject(defaultTheme()); // login screen always shows the classic look
  document.getElementById('authEmail').value = '';
  document.getElementById('authPassword').value = '';
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('authShell').style.display = '';
  const devPanel = document.getElementById('devPanel');
  if(devPanel){ devPanel.style.display = 'none'; devPanel.classList.remove('open'); }
}

function continueLocally(){
  localOnlyMode = true;
  enterApp();
}

async function enterApp(){
  // Undo history is scoped to one login session — it should never let you
  // undo into a different account's data, or across a page reload.
  undoStack = [];
  redoStack = [];
  expandedTaskIds = new Set();
  claudeView = null;
  selectedListId = null;
  checklistPendingOpen = false;
  dailyCalendarOpen = false;
  dayReturnToCalendar = false;
  document.getElementById('authShell').style.display = 'none';
  document.getElementById('appShell').style.display = '';
  const signOutBtn = document.getElementById('signOutBtn');
  if(signOutBtn){
    signOutBtn.style.display = (window.storage || !session) ? 'none' : '';
    signOutBtn.title = session ? `Sign out (${session.email})` : 'Sign out';
  }
  const refreshBtn = document.getElementById('refreshBtn');
  if(refreshBtn) refreshBtn.style.display = (localOnlyMode || window.storage) ? 'none' : '';
  await loadState();
  // Restore whichever tab was active before the last reload/sign-in, rather
  // than always landing on "All" — visibleTabs() guards against a stale id
  // (a deleted category, or a tab left over from a different account on
  // this device) by falling back to whatever activeTab already is ('all').
  const lastTab = localStorage.getItem('ledger-last-tab');
  if(lastTab && visibleTabs().includes(lastTab)) activeTab = lastTab;
  applyTheme();
  applyDevSettings();
  render();
  appEntered = true;
  startAutoRefresh();
  // A `?claude=1` (or `?claude=full`) URL lets an agent (e.g. the Claude
  // Chrome extension) navigate straight to the plain-text view instead of
  // clicking through Settings, as long as it's using a browser session
  // that's already signed in here.
  const claudeParam = new URLSearchParams(location.search).get('claude');
  if(claudeParam) openClaudeView(claudeParam);
  // A ?share=<id> link opened with a session available (either already
  // signed in, or just signed in from the standalone share page's own
  // CTA — see showShareAuthPrompt(), 19-sharing.js) shows the "add this
  // to a category" import dialog once the real app is up.
  if(pendingShareId){
    const shareId = pendingShareId;
    pendingShareId = null;
    openShareImportDialog(shareId);
  }
}

// ---------- Calendar view ----------
// A month grid over the exact same state.days/plannedDates data the
// Daily tab lists day-by-day. Nothing here owns or duplicates any data —
// every number on the grid comes straight from dayItemsSummary(), the
// same function Daily's own day-list/day-detail already use, so the two
// views can never disagree about what's on a given day.
//
// Reached via renderDailyCalendar() — a compact "Calendar" tag on Daily's
// own day list (see renderDayList() in 11-daily-core.js). Deliberately
// NOT wrapped in .stackedpage, and its own tag back to the day list is
// compact too (a "Daily" tag, same component as "Calendar"/"Pending") —
// the day list and the calendar are two peer views of the one Daily tab,
// not a page and a drilldown on top of it, so neither should read as
// "stacked over" the other. (An earlier pass also offered 'calendar' as
// its own addable category type, a whole second tab — that path is gone
// now; this compact-tag link was always the one actually used.)

// Which month is currently browsed — transient UI state, not persisted
// (same idiom as expandedMonths), so it always starts back on
// the current month on a fresh load. Deliberately NOT reset when the
// calendar view closes: reopening it (either entry point) should still
// show whatever month you were last looking at.
let calendarViewMonth = null;

function calendarMonth(){
  if(!calendarViewMonth) calendarViewMonth = monthKey(todayStr());
  return calendarViewMonth;
}

function shiftMonthKey(key, n){
  const [y, m] = key.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function calendarShiftMonth(delta){
  calendarViewMonth = shiftMonthKey(calendarMonth(), delta);
  renderDaily();
}

function calendarJumpToday(){
  calendarViewMonth = monthKey(todayStr());
  renderDaily();
}

// One cell per calendar day in the visible month, padded with blank
// leading/trailing cells so the grid always fills complete weeks (a
// ragged final row reads as a bug, not a design choice). Every day's
// total/done comes from dayItemsSummary() regardless of whether that
// date happens to be in state.days yet — a date with nothing planned
// just comes back {total:0, done:0}. `exists` is tracked separately
// (state.days.includes(dateStr)) specifically so an already-logged-but-
// empty day can still be told apart from one that's never been touched —
// clicking either currently creates the day via ensureDay() (see
// openCalendarDay() below), which was the exact ambiguity that made
// clicking around "just to check" feel like it was cluttering the Daily
// list by accident.
function calendarMonthCells(monthKeyStr){
  const [y, m] = monthKeyStr.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const startWeekday = new Date(y, m - 1, 1).getDay();
  const today = todayStr();
  const cells = [];
  for(let i = 0; i < startWeekday; i++) cells.push({ blank: true });
  for(let d = 1; d <= daysInMonth; d++){
    const dateStr = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const { total, done } = dayItemsSummary(dateStr);
    cells.push({ blank: false, dateStr, dayNum: d, isToday: dateStr === today, exists: state.days.includes(dateStr), total, done, cats: dayCategoryIds(dateStr) });
  }
  while(cells.length % 7 !== 0) cells.push({ blank: true });
  return cells;
}

function calendarMonthSummary(monthKeyStr){
  const [y, m] = monthKeyStr.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  let total = 0, done = 0;
  for(let d = 1; d <= daysInMonth; d++){
    const dateStr = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const s = dayItemsSummary(dateStr);
    total += s.total; done += s.done;
  }
  return { total, done };
}

const CALENDAR_WEEKDAY_LABELS = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

// Small category-color chips shown above each calendar cell's date — the
// "+ category color dots, above the date" calendarCellStyle was the
// project owner's confirmed choice (an "icons-below" glyph variant used
// to exist alongside it as a dev-only alternative; removed once dots-top
// won). Capped at CALENDAR_CELL_CAT_CAP with a "+N" overflow chip rather
// than wrapping unbounded — a calendar cell is a fixed aspect-ratio:1 box
// (see .calcell in <style>), so more chips than fit would spill past the
// cell's own edges on a narrow (phone-width) card instead of growing it;
// .calcell's own overflow:hidden is the last-resort backstop if this cap
// is ever raised too far.
const CALENDAR_CELL_CAT_CAP = 3;
function calendarCatChipsHtml(cats){
  if(!cats.length) return '';
  const shown = cats.slice(0, CALENDAR_CELL_CAT_CAP);
  const overflow = cats.length - shown.length;
  const chips = shown.map(c => `<span class="calcatchip dot" style="background:${c.hex}"></span>`).join('');
  const overflowHtml = overflow > 0 ? `<span class="calcatchip more">+${overflow}</span>` : '';
  return `<span class="calcatchips">${chips}${overflowHtml}</span>`;
}

function calendarBodyHtml(monthKeyStr){
  const cells = calendarMonthCells(monthKeyStr);
  const summary = calendarMonthSummary(monthKeyStr);
  return `
    <div class="calnav">
      <button class="navarrow" onclick="calendarShiftMonth(-1)" title="Previous month">‹</button>
      <button class="calmonthlabel" onclick="calendarJumpToday()" title="Jump to the current month"><span class="herotext">${monthLabel(monthKeyStr)}</span></button>
      <button class="navarrow" onclick="calendarShiftMonth(1)" title="Next month">›</button>
    </div>
    <div class="calsummary">${summary.total ? `${summary.done} of ${summary.total} done this month` : 'Nothing planned this month yet'}</div>
    <div class="calweekdays">${CALENDAR_WEEKDAY_LABELS.map(d => `<span>${d}</span>`).join('')}</div>
    <div class="calgrid">
      ${cells.map(c => c.blank
        ? `<div class="calcell calblank"></div>`
        : `<button class="calcell ${c.isToday ? 'today' : ''} ${c.exists ? 'exists' : ''}" onclick="openCalendarDay('${c.dateStr}')" title="${c.exists ? 'This day is already logged' : 'Not logged yet'}">
             ${calendarCatChipsHtml(c.cats)}
             <span class="caldatenum">${c.dayNum}</span>
             ${c.total ? `<span class="calratio">${c.done}/${c.total}</span>` : (c.exists ? `<span class="calratio calexistsdot">·</span>` : '')}
           </button>`
      ).join('')}
    </div>
  `;
}

// The normal (and, since the 'calendar' category-type path was removed,
// only) way to reach a calendar view — a compact "Calendar" tag on
// Daily's own day list (renderDayList() in 11-daily-core.js), mirroring
// the checklist overview's "Pending" trigger. Its own tag back to the day
// list is compact too (no .stackedpage) — see the file-header comment
// above for why: the day list and this are peer views of the same Daily
// tab, so both link to each other the same small way, rather than one
// treating the other as a "back" destination out of a drilldown.
function renderDailyCalendar(){
  return `
    ${pageTagHtml('closeDailyCalendar()', 'Daily', true)}
    ${calendarBodyHtml(calendarMonth())}
  `;
}

function openDailyCalendar(){
  dailyCalendarOpen = true;
  setDailyLastView('calendar');
  renderDaily();
}
function closeDailyCalendar(){
  dailyCalendarOpen = false;
  setDailyLastView('list');
  renderDaily();
}

// Clicking any date — whether or not it already has a state.days entry —
// jumps straight into that day's own detail page, same page Daily's own
// day list opens. Mirrors addDay()/addDayByText()'s "only pushUndo if
// this actually creates a new day" rule: ensureDay() itself is a no-op
// (and ends up not calling queueSave()) for a date already in state.days,
// so tracking an undo step for that case would record a change that
// never happened. switchTab('daily') runs before openDay() — not
// clearing dailyCalendarOpen itself first the way this used to (openDay()
// now always does that on its own, see its own comment for why trusting
// a caller to have done it first was exactly what broke this) — and
// openDay(dateStr, true) marks the day as reached from the calendar (see
// dayReturnToCalendar in 02-storage-state.js) so its own back tag — and
// Esc — return to the calendar instead of the plain day list.
async function openCalendarDay(dateStr){
  if(!state.days.includes(dateStr)) pushUndo('Added a day');
  await ensureDay(dateStr);
  switchTab('daily');
  openDay(dateStr, true);
}
// ---------- Sharing: Supabase REST + RPC calls ----------
// A "share" is metadata only — shared_items rows are just { owner_id,
// item_id }, never a content snapshot — stored server-side via the
// authenticated owner's own session, same fetch idiom storage.get/set()
// use in 02-storage-state.js. See supabase/shared_items.sql for the
// table/RLS/RPC this depends on (run by hand in the Supabase dashboard;
// this repo has no tracked migrations).
//
// A checklist "list" is a plain task under the hood (see 13-checklist.js's
// own top comment) — sharing a task and sharing a checklist are the exact
// same operation here, keyed off the same task id, with `isChecklist`
// (derived server-side from the source category's type) only affecting
// how the recipient's views choose to render it.
//
// Re-opening Share on the same task reuses its existing non-revoked row
// rather than minting a new link every time, so there's only ever one
// "the" link for a given task at once, until it's explicitly revoked.
async function getOrCreateShareId(taskId){
  if(window.storage || localOnlyMode) return null;
  const s = await ensureFreshSession();
  if(!s) return null;
  const headers = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${s.access_token}` };
  const existing = await fetch(
    `${SUPABASE_URL}/rest/v1/shared_items?owner_id=eq.${s.user_id}&item_id=eq.${taskId}&revoked=eq.false&select=id&limit=1`,
    { headers }
  );
  if(existing.ok){
    const rows = await existing.json();
    if(rows.length) return rows[0].id;
  }
  const created = await fetch(`${SUPABASE_URL}/rest/v1/shared_items`, {
    method: 'POST',
    headers: { ...headers, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
    body: JSON.stringify({ owner_id: s.user_id, item_id: taskId })
  });
  if(!created.ok) return null;
  const rows2 = await created.json();
  return rows2.length ? rows2[0].id : null;
}

async function revokeShareForTask(taskId){
  if(window.storage || localOnlyMode) return false;
  const s = await ensureFreshSession();
  if(!s) return false;
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/shared_items?owner_id=eq.${s.user_id}&item_id=eq.${taskId}&revoked=eq.false`,
    {
      method: 'PATCH',
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${s.access_token}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ revoked: true })
    }
  );
  return res.ok;
}

// Anonymous, unauthenticated read — get_shared_item() itself is the only
// access check (it runs security definer, see supabase/shared_items.sql),
// so this never sends a viewer's own Authorization token even if they
// happen to be signed in — opening someone else's link shouldn't need to
// prove who you are just to preview it. Returns null (not an error) for
// a revoked/missing share or a since-deleted task — callers treat that
// as "no longer available."
async function fetchSharedItem(shareId){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_shared_item`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_share_id: shareId })
  });
  if(!res.ok) throw new Error('rpc failed: ' + res.status);
  return res.json();
}

// ---------- Per-viewer offline cache ----------
// Keyed by share id in this browser's own localStorage — not part of the
// app's synced state, just a stale-while-revalidate fallback for when
// fetchSharedItem() can't reach the network. The link stays "live" (see
// fetchSharedItemWithFallback() below, which always tries the network
// first): this cache only ever fills in when a fetch actually fails, not
// merely because it's slow, and there's nothing to fall back to on a
// browser's very first, offline visit to a link — that's a real
// limitation, not a bug, see the "Sharing" section of CLAUDE.md.
function cacheSharedItem(shareId, data){
  try{ localStorage.setItem('ledger-share-cache:' + shareId, JSON.stringify({ data, cachedAt: Date.now() })); }catch(e){}
}
function getCachedSharedItem(shareId){
  try{
    const raw = localStorage.getItem('ledger-share-cache:' + shareId);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function fetchSharedItemWithFallback(shareId){
  try{
    const data = await fetchSharedItem(shareId);
    if(data) cacheSharedItem(shareId, data);
    return { data, stale: false };
  }catch(e){
    const cached = getCachedSharedItem(shareId);
    if(cached) return { data: cached.data, stale: true };
    throw e;
  }
}

// ---------- Share button ----------
// One button, reused by both a standard task's detail page and a
// checklist's own detail page (renderTaskDetailPage() in 08-render-core.js,
// renderChecklistDetail() in 13-checklist.js) — sharing either is the same
// operation under the hood (see the top-of-file comment above), so one
// definition keeps the two from drifting apart.
function shareButtonHtml(taskId){
  return `<button class="sharebtn flagbtn" onclick="event.stopPropagation(); openShareMenu(this,'${taskId}')" title="Share">⇪</button>`;
}

let shareMenuTaskId = null;
let shareMenuLoading = false;
let shareMenuLink = null;
let shareMenuError = null;

function closeShareMenu(){
  shareMenuTaskId = null;
  shareMenuLoading = false;
  shareMenuLink = null;
  shareMenuError = null;
  const el = document.getElementById('shareMenu');
  if(el) el.classList.remove('open');
}

function openShareMenu(el, taskId){
  shareMenuTaskId = taskId;
  shareMenuLoading = true;
  shareMenuLink = null;
  shareMenuError = null;
  positionShareMenu(el);
  renderShareMenu();
  if(window.storage || localOnlyMode){
    shareMenuLoading = false;
    renderShareMenu();
    return;
  }
  getOrCreateShareId(taskId).then(id => {
    if(shareMenuTaskId !== taskId) return; // closed, or switched tasks, before this resolved
    shareMenuLoading = false;
    if(id) shareMenuLink = `${location.origin}${location.pathname}?share=${id}`;
    else shareMenuError = "Couldn't create a link — try again.";
    renderShareMenu();
  });
}

// Anchored under the button, same trick openCategoryMoveMenu() uses
// (08-render-core.js) — placed at its bounding rect, then clamped back
// on screen a frame later once the menu's own real size is known.
function positionShareMenu(el){
  const menu = document.getElementById('shareMenu');
  const r = el.getBoundingClientRect();
  menu.style.left = r.right + 'px';
  menu.style.top = (r.bottom + 6) + 'px';
  menu.classList.add('open');
  requestAnimationFrame(() => {
    const mr = menu.getBoundingClientRect();
    if(mr.right > window.innerWidth) menu.style.left = Math.max(8, window.innerWidth - mr.width - 8) + 'px';
    if(mr.bottom > window.innerHeight) menu.style.top = Math.max(8, r.top - mr.height - 6) + 'px';
  });
}

function renderShareMenu(){
  const menu = document.getElementById('shareMenu');
  if(!menu || !shareMenuTaskId) return;
  const t = state.tasks.find(x=>x.id===shareMenuTaskId);
  if(!t){ closeShareMenu(); return; }
  const noAccount = window.storage || localOnlyMode;
  const canSystemShare = !!navigator.share;
  menu.innerHTML = `
    <div class="ctxmenu-label">Share "${escapeHtml(t.title)}"</div>
    ${noAccount ? `
      <div class="sharemenu-note">Sign in with an account to get a shareable link — export still works below.</div>
    ` : shareMenuLoading ? `
      <div class="sharemenu-note">Creating link…</div>
    ` : shareMenuError ? `
      <div class="sharemenu-note">${escapeHtml(shareMenuError)}</div>
    ` : shareMenuLink ? `
      <div class="sharemenu-linkrow">
        <input type="text" readonly value="${escapeHtml(shareMenuLink)}" onclick="this.select()">
        <button onclick="shareCopyLink()">Copy</button>
      </div>
      ${canSystemShare ? `<button onclick="shareViaSystemSheet('${t.id}')">Send to friends…</button>` : ''}
    ` : ''}
    <div class="ctxmenu-sep"></div>
    <button onclick="shareExportJson('${t.id}')">Export as file (.json)</button>
    <button onclick="shareExportText('${t.id}')">Export for Notes app (.txt)</button>
    ${(!noAccount && shareMenuLink) ? `
      <div class="ctxmenu-sep"></div>
      <button class="ctxmenu-danger" onclick="shareStopSharing('${t.id}')">Stop sharing</button>
    ` : ''}
  `;
}

function shareCopyLink(){
  if(shareMenuLink && navigator.clipboard) navigator.clipboard.writeText(shareMenuLink).catch(()=>{});
}

function shareViaSystemSheet(taskId){
  const t = state.tasks.find(x=>x.id===taskId);
  if(!t || !shareMenuLink || !navigator.share) return;
  navigator.share({ title: t.title, url: shareMenuLink }).catch(()=>{});
}

async function shareStopSharing(taskId){
  const ok = await revokeShareForTask(taskId);
  if(shareMenuTaskId !== taskId) return; // menu moved on before this resolved
  if(ok){ shareMenuLink = null; shareMenuError = 'Link removed.'; }
  renderShareMenu();
}

// ---------- File exports ----------
// Both formats strip the same recipient-irrelevant fields the live RPC
// does (see get_shared_item() in supabase/shared_items.sql) —
// timeframe/priority/urgent/plannedDates describe the *sharer's* own
// daily planning, not something to hand to someone else. Purely local:
// no network round-trip, works offline and for localOnlyMode/window.storage
// alike, unlike the link-based actions above.
function shareExportSnapshot(t){
  const cat = CATEGORIES[t.category];
  return {
    title: t.title,
    notes: t.notes || '',
    dueDate: t.dueDate || '',
    status: t.status,
    createdAt: t.createdAt,
    isChecklist: !!(cat && cat.type === 'checklist'),
    subtasks: (t.subtasks || []).map(s => ({ text: s.text, done: !!s.done }))
  };
}

function shareDownloadBlob(filename, content, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function shareSafeFilename(title){
  return (title || 'shared-item').trim().replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'shared-item';
}

function shareExportJson(taskId){
  const t = state.tasks.find(x=>x.id===taskId);
  if(!t) return;
  shareDownloadBlob(shareSafeFilename(t.title) + '.json', JSON.stringify(shareExportSnapshot(t), null, 2), 'application/json');
}

// Plain text, Markdown-checklist style — there's no single cross-platform
// "notes app" format, but Apple Notes/Google Keep/Samsung Notes all take
// pasted or imported plain text, so that's the actual common denominator
// rather than targeting any one app specifically.
function shareBuildText(t){
  const snapshot = shareExportSnapshot(t);
  const lines = [snapshot.title, ''];
  if(snapshot.dueDate) lines.push(`Due: ${fmtDate(snapshot.dueDate)}`, '');
  if(snapshot.notes) lines.push(snapshot.notes, '');
  snapshot.subtasks.forEach(s => lines.push(`- [${s.done ? 'x' : ' '}] ${s.text}`));
  return lines.join('\n').trim() + '\n';
}

function shareExportText(taskId){
  const t = state.tasks.find(x=>x.id===taskId);
  if(!t) return;
  shareDownloadBlob(shareSafeFilename(t.title) + '.txt', shareBuildText(t), 'text/plain');
}

// ---------- Opening a share link ----------
// Set from the URL's ?share= param at boot (see init() in
// 20-bootstrap.js) and consumed exactly once: either here, by
// showShareStandalone() when no session is available, or by
// openShareImportDialog(), called from the end of enterApp()
// (17-auth-ui.js) once a session IS available — whichever happens first
// wins, and logging in from the standalone page's own CTA re-arms it
// (showShareAuthPrompt()) so the import dialog still fires once that
// login's enterApp() call completes.
let pendingShareId = null;

async function showShareStandalone(shareId){
  document.getElementById('authShell').style.display = 'none';
  const shell = document.getElementById('shareShell');
  shell.style.display = '';
  shell.innerHTML = `<div class="masthead"><h1>The Ledger</h1><div class="tagline">shared with you</div></div><div class="card"><div class="sharemenu-note">Loading…</div></div>`;
  let result;
  try{
    result = await fetchSharedItemWithFallback(shareId);
  }catch(e){
    renderShareStandaloneError("Can't load this — you're offline and haven't seen this link before.");
    return;
  }
  if(!result.data){
    renderShareStandaloneError('This shared item is no longer available.');
    return;
  }
  renderShareStandaloneContent(shareId, result.data, result.stale);
}

function renderShareStandaloneError(msg){
  const shell = document.getElementById('shareShell');
  shell.innerHTML = `
    <div class="masthead"><h1>The Ledger</h1><div class="tagline">shared with you</div></div>
    <div class="card">
      <div class="sharemenu-note">${escapeHtml(msg)}</div>
      <div class="footer-row"><button onclick="location.href = location.pathname">Open The Ledger</button></div>
    </div>`;
}

// Reuses the real detail pages' own visual language (the big checkbox,
// .bigtitle-style centered title, .taskmeta) rather than a generic card,
// per the explicit ask to make this read as "the detail page" and not a
// stripped-down summary — every piece here is the same class a real
// .check/.checkcircle/.subrow/.subcheck already carries, just without
// the onclick handlers (this view is read-only, there's nothing for a
// tap to do). .sharedbadge deliberately echoes .categorylabel's own
// geometry (top:14px; right:-6px, same tab-shaped pill) — the one spot
// a real detail page always shows *something* in that corner, so
// putting an unmissable "Shared" pill there instead of a category name
// is what makes this unmistakably not the viewer's own task, even
// though everything else now looks exactly like their own detail page
// would. A task with no subtasks omits the items section entirely
// (matches how little emphasis the real pages give an empty steps list)
// — only an actually-empty *checklist* gets a (subtle, .empty-styled)
// callout, since a shared list with zero items is worth noting; a
// zero-subtask task is just the ordinary common case.
function renderShareStandaloneContent(shareId, data, stale){
  const shell = document.getElementById('shareShell');
  const done = data.status === 'done';
  const items = data.subtasks || [];
  const checkHtml = data.isChecklist
    ? `<div class="checkcircle-wrap sharecheck"><div class="checkcircle ${done?'done':''}"></div></div>`
    : `<div class="checkwrap sharecheck"><div class="check ${done?'done':''}"></div></div>`;
  const itemsHtml = items.length
    ? `<div class="subwrap">${items.map(s => `
        <div class="subrow readonly">
          <div class="subcheck ${data.isChecklist ? 'circle' : ''} ${s.done ? 'done' : ''}"></div>
          <div class="subtext ${s.done ? 'done' : ''}">${escapeHtml(s.text)}</div>
        </div>`).join('')}</div>`
    : (data.isChecklist ? `<div class="empty">This list is empty.</div>` : '');
  shell.innerHTML = `
    <div class="masthead"><h1>The Ledger</h1><div class="tagline">shared with you</div></div>
    <div class="card">
      ${stale ? `<div class="sharemenu-note">Offline — showing the last version we saw.</div>` : ''}
      <div class="sharedbadge">Shared</div>
      ${checkHtml}
      <div class="sharestandalone-title ${done ? 'done' : ''}">${escapeHtml(data.title)}</div>
      ${data.dueDate ? `<div class="taskmeta checklistmeta">Due ${fmtDate(data.dueDate)}</div>` : ''}
      ${data.notes ? `<div class="sharestandalone-notes">${escapeHtml(data.notes)}</div>` : ''}
      ${itemsHtml}
      <div class="footer-row"><button onclick="showShareAuthPrompt('${shareId}')">Sign in to add this to your Ledger</button></div>
    </div>`;
}

function showShareAuthPrompt(shareId){
  pendingShareId = shareId;
  document.getElementById('shareShell').style.display = 'none';
  document.getElementById('authShell').style.display = '';
}

// ---------- Import dialog (logged-in) ----------
// A centered modal rather than an anchored popover, since this opens
// right at boot with no button to anchor to. Its category list reuses
// .ctxmenu's own styling (.ctxmenu-embedded in <style> just strips the
// fixed positioning/shadow it normally carries as a standalone popover)
// so it matches the .categorylabel "Move to" menu's look, per the
// explicit ask to keep this feeling like the same category picker rather
// than a new one-off control. Only offers categories whose type matches
// the shared item (standard vs. checklist) — a checklist's "items" don't
// map onto a standard task's due-date/priority fields or vice versa, same
// restriction standardCategoryEntries() already applies elsewhere.
let shareImportId = null;
let shareImportData = null;

async function openShareImportDialog(shareId){
  shareImportId = shareId;
  shareImportData = null;
  renderShareImportModal();
  let result;
  try{
    result = await fetchSharedItemWithFallback(shareId);
  }catch(e){
    if(shareImportId === shareId) renderShareImportModal('offline');
    return;
  }
  if(shareImportId !== shareId) return; // dismissed while loading
  if(!result.data){ renderShareImportModal('gone'); return; }
  shareImportData = result.data;
  renderShareImportModal();
}

function closeShareImportDialog(){
  shareImportId = null;
  shareImportData = null;
  const el = document.getElementById('shareImportModal');
  if(el){ el.classList.remove('open'); el.innerHTML = ''; }
  // The share id was only ever in the URL to trigger this dialog once —
  // drop it so a later reload doesn't reopen it.
  if(history.replaceState) history.replaceState(null, '', location.pathname);
}

function renderShareImportModal(status){
  const el = document.getElementById('shareImportModal');
  if(!shareImportId){ el.classList.remove('open'); el.innerHTML = ''; return; }
  el.classList.add('open');
  let body;
  if(status === 'offline'){
    body = `<div class="sharemenu-note">Can't load this shared item — you're offline.</div>`;
  } else if(status === 'gone'){
    body = `<div class="sharemenu-note">This shared item is no longer available.</div>`;
  } else if(!shareImportData){
    body = `<div class="sharemenu-note">Loading…</div>`;
  } else {
    const d = shareImportData;
    const entries = Object.entries(CATEGORIES).filter(([,v]) => (v.type === 'checklist') === !!d.isChecklist);
    const count = (d.subtasks || []).length;
    body = `
      <div class="shareimport-preview">
        <div class="sharestandalone-title">${escapeHtml(d.title)}</div>
        ${count ? `<div class="taskmeta">${count} item${count===1?'':'s'}</div>` : ''}
      </div>
      <div class="ctxmenu ctxmenu-embedded open">
        <div class="ctxmenu-label">Add to</div>
        ${entries.length ? entries.map(([k,v]) => `
          <button onclick="confirmShareImport('${k}')">${categoryDotHtml(v,'cdot')} ${escapeHtml(v.label)}</button>
        `).join('') : `<div class="ctxmenu-label">No matching tabs to add to</div>`}
      </div>`;
  }
  el.innerHTML = `
    <div class="shareimport-scrim" onclick="closeShareImportDialog()"></div>
    <div class="shareimport-card">
      <div class="shareimport-heading">Someone shared this with you</div>
      ${body}
      <div class="footer-row"><button onclick="closeShareImportDialog()">Not now</button></div>
    </div>`;
}

function confirmShareImport(categoryId){
  const d = shareImportData;
  if(!d) return;
  pushUndo(`Added shared "${d.title}"`);
  state.tasks.push({
    id: newId('task'), title: d.title, category: categoryId, status: d.status === 'done' ? 'done' : 'open',
    urgent: false, dueDate: d.dueDate || '', notes: d.notes || '',
    subtasks: (d.subtasks || []).map(s => ({ id: newId('sub'), text: s.text, done: !!s.done, dueDate: '', plannedDates: [] })),
    plannedDates: [], timeframe: '', priority: 0, completedAt: '', createdAt: todayStr(),
    // Permanent provenance marker, not just an import-time flag — see the
    // "Shared" badge (taskRowHtml()/checklistListRowHtml(), the inline
    // .sharedbadge on renderTaskDetailPage()/renderChecklistDetail()) and
    // the "Shared N" compact tag on the All tab (renderSharedItemsPage()
    // below), both of which key off this field indefinitely so it stays
    // findable long after the import itself.
    sharedImport: true
  });
  closeShareImportDialog();
  render();
  queueSave();
}

// ---------- "Shared" tracking (badges + the All-tab compact tag) ----------
function sharedImportedTasks(){
  return state.tasks.filter(t => t.sharedImport);
}

// Renders whichever row style matches the item's own category type — a
// shared-imported checklist still lists like a checklist, a shared task
// still lists like a task, same as everywhere else in the app.
function sharedItemRowHtml(t){
  const cat = CATEGORIES[t.category];
  return (cat && cat.type === 'checklist') ? checklistListRowHtml(t) : taskRowHtml(t, true, false);
}

let sharedItemsOpen = false;
function openSharedItems(){ sharedItemsOpen = true; render(); }
function closeSharedItems(){ sharedItemsOpen = false; render(); }

// Reached via the compact "Shared N" tag on the All tab (see renderList()
// in 08-render-core.js) — a filtered cross-category view, not a peer of
// All the way Daily/Calendar are peers of each other, so it gets a real
// .stackedpage + full back tag rather than the Daily/Calendar exception
// (same reasoning as the checklist "Pending" view, the closest existing
// precedent for a compact tag opening a drilldown rather than a
// symmetric peer view).
function renderSharedItemsPage(){
  const items = sortTasks(sharedImportedTasks());
  return `
    <div class="stackedpage">
      ${pageTagHtml('closeSharedItems()', 'All')}
      <div class="shareimport-heading">Shared with you</div>
      <ul class="tasks">
        ${items.length ? items.map(sharedItemRowHtml).join('') : '<div class="empty">Nothing shared yet.</div>'}
      </ul>
    </div>`;
}
// Esc: close whatever's most local first — a Settings popover (a
// category's color/icon picker incl. its own custom-wheel sub-view, or
// UI Colors/Desk & Ledger incl. either one's own "Custom" tile sub-view —
// see closeAllSettingsPopovers() in 09-settings.js) beats the Settings panel
// itself beats a task's expanded detail beats an open day (closeDay(),
// which returns to the calendar instead of the plain day list when the
// day was reached that way — see dayReturnToCalendar in
// 02-storage-state.js) beats the calendar view itself, and only falls
// back to jumping to the All tab if none of those was open. Whenever a
// color wheel specifically is the thing that's open (customColorOpen for
// a category's own wheel, dualColorCustomOpen for UI Colors/Desk &
// Ledger's "Custom" tile), Enter and Escape stop being the same action:
// Enter commits — literally calls the same confirm*() function the
// wheel's own "Done" button does — and Escape cancels back to the
// preset/swatch row, same as its own "‹" back link, rather than either
// one just closing the whole popover outright. Checked before the
// inField guard below, since the wheel's own hex field is itself a text
// input and needs both keys to reach here too; its own onkeydown already
// calls the same confirm function for Enter (no stopPropagation), so by
// the time this runs for that path the color's already committed and
// confirm*()'s own no-op-if-nothing-changed guard keeps a second call
// from doing anything. Cmd/Ctrl+Z / Shift+Z (or Ctrl+Y) drive undo/redo,
// but only when focus isn't in a text field — typing needs its own
// native undo, not this app's content-level one.
document.addEventListener('keydown', (e) => {
  const appShell = document.getElementById('appShell');
  if(!appShell || appShell.style.display === 'none') return;

  const popoverOpen = openCategoryPickerId || uiColorPickerOpen || deskPaperPickerOpen || locationEditorOpenId || customSelectOpenKey;

  if(e.key === 'Escape' || e.key === 'Enter'){
    if(customColorOpen && openCategoryPickerId){
      if(e.key === 'Enter') confirmCustomColor(openCategoryPickerId);
      else closeCustomColor();
      return;
    }
    if(dualColorCustomOpen){
      if(e.key === 'Enter') confirmDualColorCustom();
      else closeDualColorCustom();
      return;
    }
    if(popoverOpen){ closeAllSettingsPopovers(); render(); return; }
    if(e.key !== 'Escape') return; // Enter has nothing else to do app-wide
    // Shake-to-undo's own menu (04-undo.js) floats above literally
    // everything, same reasoning as the Mobile UI Lab overlays checked
    // right below — it can pop up over any screen in the app.
    if(shakeUndoOpen){ closeShakeUndoMenu(); return; }
    // Mobile UI Lab overlays (see 01-categories-theme.js/16-task-crud.js) —
    // both float above literally everything else including Settings, so
    // they're checked before any of it.
    if(fabAddOpen){ closeFabAdd(); return; }
    if(shareImportId){ closeShareImportDialog(); return; }
    if(shareMenuTaskId){ closeShareMenu(); return; }
    if(ctxMenuTaskId || ctxMenuDayStr || ctxMenuMoveTaskId){ closeCtxMenu(); return; }
    if(taskSettingsOpenId){ closeTaskSettingsSheet(); return; }
    if(quickAddOpen){ toggleQuickAddSheet(false); return; }
    if(claudeView){ closeClaudeView(); return; }
    if(settingsOpen){ toggleSettings(); return; }
    if(checklistPendingOpen){ closeChecklistPending(); return; }
    if(checklistTemplatesOpen){ closeChecklistTemplates(); return; }
    if(selectedListId){ closeChecklistList(); return; }
    if(genericTaskDetailId){ closeGenericTaskDetail(); return; }
    if(sharedItemsOpen){ closeSharedItems(); return; }
    if(taskDetailId){ closeTaskDetail(); return; }
    if(selectedDay){ closeDay(); return; }
    if(dailyCalendarOpen){ closeDailyCalendar(); return; }
    const openExpand = document.querySelector('.expand.open');
    if(openExpand){
      expandedTaskIds.delete(openExpand.id.replace('exp-', ''));
      openExpand.classList.remove('open');
      return;
    }
    if(activeTab !== 'all'){ switchTab('all'); }
    return;
  }

  const target = document.activeElement;
  const inField = target && ['INPUT','TEXTAREA','SELECT'].includes(target.tagName);
  if(inField) return;

  // Left/right steps to the adjacent logged day, mirroring the .navarrow
  // pair in .daynavrow — gated on that row actually being on screen
  // (rather than enumerating every overlay flag — settingsOpen, taskDetailId,
  // selectedListId, dailyCalendarOpen, etc. — that could otherwise be
  // hiding the day-detail page even while selectedDay is still set from
  // before) so the keys only ever act on the day you're actually looking
  // at. goToAdjacentDay() itself already no-ops at either end of your
  // logged days, same as clicking a disabled arrow would.
  if(e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
    if(document.querySelector('.daynavrow')){
      goToAdjacentDay(e.key === 'ArrowLeft' ? -1 : 1);
      return;
    }
  }

  const meta = e.metaKey || e.ctrlKey;
  if(meta && e.key.toLowerCase()==='z'){
    e.preventDefault();
    if(e.shiftKey) redo(); else undo();
  } else if(meta && e.key.toLowerCase()==='y'){
    e.preventDefault();
    redo();
  }
});

// ---------- Swipe navigation (touch) ----------
// A left/right finger drag steps between days (Daily) or months
// (Calendar), mirroring the ArrowLeft/ArrowRight handling above; a
// rightward drag on any drilldown page triggers that page's own .pagetag
// "back" action, mirroring a tap on the tag itself. classifySwipeZone()
// below is the single place that decides which (if either) a given touch
// belongs to.

let swipeGesture = null; // { mode:'day'|'month'|'back', card, backTag?, label?, labelText?, incomingEl?, incomingDir?, startX, startY, startT, lastX, axis:null|'x'|'y' }

const SWIPE_AXIS_PX = 10;      // movement before committing to horizontal vs. vertical
const SWIPE_COMMIT_PX = 90;    // drag distance that commits the action on release
const SWIPE_COMMIT_VPX = 0.55; // px/ms — a fast short flick commits even under that distance
const SWIPE_DIAL_OFFSET_PX = 46; // fallback when text-width measurement isn't available

// .herotext is `position:absolute; inset:0`, so its own offsetWidth is
// always just the (much wider) label container's width, not the text's —
// measuring that gave every incoming label the same huge starting offset
// regardless of how short its word was, and for two short words centered
// in one wide box a too-small gap read as them overlapping. Canvas
// measureText() gives the actual rendered glyph width instead, so the
// gap in swipeApplyDialDrag() below can be sized to the words themselves.
function swipeTextWidth(text, font){
  const ctx = swipeTextWidth._ctx || (swipeTextWidth._ctx = document.createElement('canvas').getContext('2d'));
  ctx.font = font;
