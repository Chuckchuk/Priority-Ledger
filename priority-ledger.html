    --stitch-radius: 1px 1px 8px 8px;

    --leather-pad-right: 8px;
    --leather-pad-bottom: 10px;
    --leather-pad-left: 22px;
    --leather-radius: 1px 1px 10px 10px;
    --stitch-inset: 1px 3px 4px 9px;
    --stitch-radius: 1px 1px 7px 7px;
  }
  body[data-leather-inset="slim"]{

    --leather-pad-right: 6px;
    --leather-pad-bottom: 7px;
    --leather-pad-left: 8px;
    --leather-radius: 1px 1px 7px 7px;
    --stitch-inset: 1px 2px 3px 3px;
    --stitch-radius: 1px 1px 5px 5px;
  }
  /* Ribbon bookmark — an actual element (not a third pseudo-element;
     .leathercover's ::before/::after are already the noise and the
     stitching border), living in the cover's right-hand margin. `right`
     reads --leather-pad-right so it re-centers itself in that margin
     across every "Inner page size" preset above rather than needing its
     own per-preset override; at the thinner presets that centers it
     partway *under* #appCard instead of clear of it, which — since
     #appCard's own z-index:1 already paints above .leathercover's
     children — just tucks more of the ribbon out of sight behind the
     page, the same way a real ribbon would disappear under a book's
     front cover. Sized/positioned only under .leather-on; the bare
     .bookmark stays display:none the rest of the time so it's inert
     markup when leather is off. Runs the full height of the cover plus a
     bit more (calc(100% + 26px)) so the cut point hangs visibly past the
     bottom edge, like a ribbon marking a page deeper in the book. The
     V-notch is cut with fixed px offsets, not percentages, so its depth
     stays constant regardless of how tall the cover ends up (a %-based
     notch on an element this much taller than it is wide would carve a
     notch many times deeper than the ribbon is wide). */
  .bookmark{ display:none; }
  .leathercover.leather-on .bookmark{
    display:block;
    position:absolute;
    top:0; right: calc((var(--leather-pad-right) - 14px) / 2);
    width:14px;
    height:calc(100% + 26px);
    background: linear-gradient(90deg, #7a2330, #9c3a44 45%, #6d1f2a);
    box-shadow: 0 3px 8px rgba(0,0,0,0.35);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 16px), 50% 100%, 0 calc(100% - 16px));
    pointer-events: none;
  }

  .daybtn.on{ background: var(--primary); color:white; border-color: var(--primary); }

  /* Drag reordering is scoped to this small handle rather than the whole
     row — the row already has its own click-to-expand and a checkbox
     right next to where a handle would sit, so making the entire row a
     drag source risked turning an ordinary tap into an accidental drag. */
  .draghandle{
    cursor: grab; color: var(--ink-soft); font-size:0.9rem; line-height:1;

    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .check.done{ background: var(--ink); border-color: var(--ink); }
  .check.done::after{ content:'✓'; color: var(--card-bg); font-size:12px; }
  /* grid, not flex, for the N-equal-columns layout — flexbox's flex:1
     rounds each item's fractional share of the 18px bar independently,
     and tends to dump the leftover remainder pixel onto the last
     item(s), which reads as inconsistent sizing between the first few
     pips and the last few (worse at non-100% browser zoom, since that
     rescales the already-fractional division against a new pixel
     grid). CSS Grid's `fr` unit distributes that same remainder more
     evenly across tracks instead of concentrating it at one end.
     grid-auto-columns (not a hardcoded grid-template-columns) is what
     lets this still work without knowing the pip count in advance —
     one auto column per child, all sized equally. */
  .substack{ width:18px; height:5px; display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:1.5px; flex-shrink:0; }
  .subpip{ min-width:0; background: var(--card-bg-dim); border:1px solid var(--ink-soft); border-radius:1px; opacity:0.55; }
  .subpip.filled{ background: var(--ink); border-color: var(--ink); opacity:1; }
  .substack.bar{ gap:0; background: var(--card-bg-dim); border:1px solid var(--ink-soft); border-radius:2px; overflow:hidden; }
  .substack.bar .subfill{ height:100%; background: var(--ink); }
  /* Checklist-category list rows: a round checkbox (vs. the square .check
     used everywhere else) with its items shown around it — as fixed-size
     boxy pegs at or under the peg threshold, or a progress ring past it
     — rather than the linear .substack used under a standard task.
     .checkcircle-wrap is a fixed-size box regardless of item count —
     pegs/ring sit absolutely inside it — so rows stay column-aligned the
     same way .checkwrap does for .check. */
  .checkcircle-wrap{ position:relative; width:34px; height:34px; flex-shrink:0; }
  .checkcircle{
    position:absolute; top:50%; left:50%; transform: translate(-50%,-50%); z-index:1;
    width:18px; height:18px; border:1.5px solid var(--ink-soft); border-radius:50%;
    display:flex; align-items:center; justify-content:center; cursor:pointer; background: var(--card-bg);
  }
  .checkcircle.done{ background: var(--ink); border-color: var(--ink); }
  .checkcircle.done::after{ content:'✓'; color: var(--card-bg); font-size:10px; }
  /* Each peg is a genuine fixed-size rectangle (not a conic-gradient arc
     slice — those are wedges, wider at the outer edge than the inner
     one, which read as "trapezoids" rather than boxes) positioned at the
     container's center and rotated around it — transform-origin sits
     back at that center point, so at rotate(0) it points straight up at
     a fixed radius, and swinging it to a given item's slot is just
     varying the rotation angle. Size and radius never change with item
     count, only how many slots (up to CHECKLIST_PEG_LIMIT) are filled in
     — that's what keeps a 3-item list's pegs the same size as a
     12-item list's instead of stretching to fill the ring. */
  /* .pegpivot is a zero-size point placed exactly on the container's
     center (top/left:50% of an even-pixel box lands on a whole pixel,
     no fraction involved) and rotated — a plain, un-overridden
     transform-origin ("50% 50%" of a 0×0 box is just that same point)
     is what actually rotates around it, rather than a .peg carrying
     both a fractional margin AND a fractional transform-origin that
     have to cancel out exactly. .peg itself is a static, unrotated
     offset inside its already-rotated pivot, so it only needs a single
     centering fraction (half its own width) instead of two independent
     ones that could drift apart under different rounding. */
  /* At this spacing, adjacent pegs' corners slightly overlap — two
     concerns that come with that: an unfilled peg must never paint
     over a filled one at that seam, and two overlapping unfilled pegs
     must not visibly darken where they overlap. z-index handles the
     first (each .pegpivot carries a transform, which gives it its own
     stacking context, so the ordering has to be set on the pivot
     itself — setting it on the inner .peg would only reorder within
     that one pivot's context, not against sibling pivots). Dropping
     opacity handles the second: .peg's colors are fully opaque solid
     fills, not a translucent tint over the card, so two overlapping
     unfilled pegs blend into the exact same flat color instead of
     stacking into something darker. */
  .pegpivot{ position:absolute; top:50%; left:50%; width:0; height:0; z-index:1; }
  .pegpivot.filled{ z-index:2; }
  /* An unfilled peg's softer look used to come from opacity:0.6 — reverted
     for overlap reasons (two translucent pegs stacking visibly darkened
     where they touched), but the muted color itself is worth keeping.
     color-mix() bakes the same "60% peg color over the card" result into
     a flat, fully-opaque color instead, so two unfilled pegs overlapping
     still blend into that one flat color rather than compounding into
     something darker. Plain fallback declared first, same reasoning as
     .stackedpage's background: color-mix()-unsupporting browsers just
     keep the (slightly less soft, but still fine) flat --card-bg-dim. */
  .peg{
    position:absolute; top:-14px; left:-3px; width:6px; height:5px;
    background: var(--card-bg-dim);
    background: color-mix(in srgb, var(--card-bg-dim) 60%, var(--card-bg) 40%);
    border: 1px solid var(--ink-soft);
    border-color: color-mix(in srgb, var(--ink-soft) 60%, var(--card-bg) 40%);
    border-radius:1px;
  }
  .pegpivot.filled .peg{ background: var(--ink); border-color: var(--ink); }
  /* Past the peg threshold, a conic-gradient ring takes over — the
     opaque .checkcircle sitting centered on top of it (same z-index
     trick as above) masks the middle, leaving only the outer ring
     visible, so no separate donut-cutout element is needed. inset:5px
     (not 0) keeps the visible band thin (~3px against the 18px
     .checkcircle) — inset:0 was the "way too thick" original version. */
  .progressring{ position:absolute; inset:5px; border-radius:50%; }
  .cdot{ width:13px; height:13px; margin-top:4px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; font-size:0.86rem; line-height:1; }

  /* EXPERIMENTAL — fieldPickerStyle (Settings → Dev Settings), replacing
     a plain <select> for Timeframe/Priority — see fieldPickerHtml() in
     08-render-core.js. .fieldpicker itself is only the quick-add bar's
     static container (shell-body.html); the task-detail expand-row hosts
     .fieldbuttons/.fieldprogress directly with no extra wrapper. */
  .fieldpicker{ flex:1 1 150px; min-width:120px; }
  /* ---- 'buttons': a row of small pill buttons, one per step ---- */
  .fieldbuttons{ display:flex; flex-wrap:wrap; gap:5px; }
  .fieldbtn{
    font-family:'IBM Plex Mono', monospace; font-size:0.62rem; text-transform:uppercase; letter-spacing:0.03em;
    padding:6px 10px; border-radius:999px; border:1px solid var(--line); background: var(--card-bg-dim);
    color: var(--ink-soft); cursor:pointer; transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .fieldbtn.active{ background: var(--primary); border-color: var(--primary); color:white; }
  /* The one step that's "maxed out" (Urgent / High) gets a little life of
     its own once it's actually selected — a soft, repeating ring pulse
     rather than anything that moves or resizes, so it reads as "this
     matters" without being distracting to work next to. Respects
     prefers-reduced-motion (see the guard near the end of this file). */
  .fieldbtn.active.atmax{ background: var(--estate); border-color: var(--estate); animation: fieldpulse 1.8s ease-in-out infinite; }
  /* ---- 'progress': a filled track + one clickable dot per step ---- */
  .fieldprogress{ display:flex; flex-direction:column; gap:2px; min-width:130px; }
  .fieldprogresstrack{
    position:relative; height:6px; border-radius:3px; background: var(--card-bg-dim);
    border:1px solid var(--line); margin:11px 7px 9px;
  }
  .fieldprogressfill{
    position:absolute; top:-1px; bottom:-1px; left:-1px; border-radius:3px;
    background: linear-gradient(90deg, var(--primary-light), var(--primary));
    transition: width .25s cubic-bezier(.3,.8,.4,1);
  }
  .fieldprogress.atmax .fieldprogressfill{ background: linear-gradient(90deg, var(--primary), var(--estate)); animation: fieldglow 1.8s ease-in-out infinite; }
  .fieldprogressdot{
    position:absolute; top:50%; width:13px; height:13px; border-radius:50%; padding:0; cursor:pointer;
    transform:translate(-50%,-50%); background: var(--card-bg); border:2px solid var(--line);
  }
  .fieldprogressdot.filled{ border-color: var(--primary); }
  .fieldprogressdot.current{ background: var(--primary); border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 28%, transparent); }
  .fieldprogress.atmax .fieldprogressdot.current{ background: var(--estate); border-color: var(--estate); animation: fielddotpulse 1.8s ease-in-out infinite; }
  .fieldprogresslabel{
    font-family:'IBM Plex Mono', monospace; font-size:0.62rem; text-transform:uppercase; letter-spacing:0.04em;
    color: var(--ink-soft); text-align:center;
  }
  .fieldprogress.atmax .fieldprogresslabel{ color: var(--estate); font-weight:700; }
  /* Soft brightness pulse on the fill and a gently expanding-and-fading
     ring on the current dot/button — two different animations because a
     ring pulse on the whole progress *fill* (a wide bar, not a small
     circle) would just read as a rectangle flashing, not a "glow". */
  @keyframes fieldglow{ 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.4); } }
  @keyframes fielddotpulse{

  }

    .fieldbtn.active.atmax, .fieldprogress.atmax .fieldprogressfill, .fieldprogress.atmax .fieldprogressdot.current{
      animation:none !important;
    }
  }
  .empty{ font-family:'Fraunces', serif; font-style:italic; color: var(--ink-soft); text-align:center; padding: 26px 10px; font-size:1rem; }
  .footer-row{ display:flex; justify-content:center; padding: 12px 0 4px; }
  .footer-row button{ background:none; border:none; font-family:'IBM Plex Mono', monospace; font-size:0.68rem; text-transform:uppercase; color: var(--ink-soft); cursor:pointer; letter-spacing:0.05em; }
  .subwrap{ margin-top:10px; }
  .sublabel{ font-family:'IBM Plex Mono', monospace; font-size:0.64rem; letter-spacing:0.06em; text-transform:uppercase; color: var(--ink-soft); margin-bottom:6px; }
  .pendinggroup{ margin-bottom:16px; }
  .subrow{ display:flex; align-items:center; gap:8px; padding:3px 0; }
  .subrow.dragging{ opacity:0.4; }
  .subrow.dragover{ border-top: 2px solid var(--primary); }
  /* Once a checklist's own list is marked complete, every item in it
     reads as done too, whether or not that specific item was ever
     individually checked off — dims the whole row (checkbox included,
     not just text) rather than only styling .subtext, and doesn't touch
     the item's actual `done` flag, so un-completing the list restores
     each item's real individual state exactly as it was. */
  .subrow.listdone{ opacity:0.5; }
  .subrow.listdone .subtext{ text-decoration: line-through; }
  .subdropend{ height:10px; }
  .subdropend.dragover{ border-top: 2px solid var(--primary); }
  .draghandle.sub{ font-size:0.78rem; }
  .subcheck{
    width:14px; height:14px; border:1.5px solid var(--ink-soft); border-radius:3px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    position:relative;
  }
  /* Invisible hit-area expansion — the visible box stays exactly 14px
     (the whole point was keeping it visually smaller than a task's own
     .check, just easier to actually tap), but an unpainted ::before
     extends the real clickable region past the drawn edges. A click
     landing on a pseudo-element still resolves to the element it belongs
     to, so this needs no JS. Biased toward top/right/bottom, where taps
     were most often landing just outside the box; left is left almost
     alone since that side wasn't reported as a problem. Uses ::before
     (not ::after, which the done checkmark below already owns) so the
     two can't collide. */
  .subcheck::before{ content:''; position:absolute; top:-7px; right:-9px; bottom:-7px; left:-3px; }
  .subcheck.done{ background: var(--ink); border-color: var(--ink); }
  .subcheck.done::after{ content:'✓'; color: var(--card-bg); font-size:9px; }
  /* Checklist items only (not a standard task's subtasks, which stay
     square to match its own square .check) — round to match .checkcircle,
     the checklist category's own circular checkbox language. */
  .subcheck.circle{ border-radius:50%; }
  .subtext{ flex:1; font-size:0.84rem; }
  .subtext.done{ text-decoration:line-through; color: var(--ink-soft); }
  .subdel{ background:none; border:none; color: var(--ink-soft); cursor:pointer; font-size:0.85rem; flex-shrink:0; }
  /* .movetmrw ("move to tomorrow") / .dayremove ("remove from this day")
     — the pair of small action buttons on a Daily row. Given a real
     border/box (unlike the plain-text .subdel used for step/item delete
     elsewhere) specifically so the arrow and × read as two distinct
     tappable buttons sitting side by side, not stray punctuation next to
     the row. .movetmrw goes further and gets a disabled state — once
     tomorrow's date is already in the item's plannedDates (see
     taskRowHtml/daySubtaskRowHtml), re-adding it would be a no-op, so the
     button fades out and stops accepting clicks rather than sitting there
     implying there's still something to do. */
  .movetmrw, .dayremove{
    display:flex; align-items:center; justify-content:center;
    width:22px; height:22px; flex-shrink:0; padding:0; line-height:1;
    font-size:0.78rem; cursor:pointer; border-radius:5px;
    background:none; border:1px solid var(--line); color: var(--ink-soft);
  }
  .movetmrw:hover{ border-color: var(--primary); color: var(--primary); }
  .dayremove:hover{ border-color: var(--estate); color: var(--estate); }
  .movetmrw:disabled{ opacity:0.35; cursor:default; }
  .movetmrw:disabled:hover{ border-color: var(--line); color: var(--ink-soft); }
  /* A step's own optional date — discreet by design, per the ask: a
     small muted pill rather than a full date input. Empty state gets a
     dashed underline (echoing .subadd's own placeholder-as-invitation
     look) so it still reads as clickable even with no value to show. */
  .subdate{
    font-family:'IBM Plex Mono', monospace; font-size:0.62rem; color: var(--ink-soft);
    cursor:pointer; flex-shrink:0; padding:3px 2px; border-bottom:1px dashed transparent;
  }
  .subdate.empty{ opacity:0.65; border-bottom-color: var(--ink-soft); }
  .subdateedit{
    width:120px; border:none; border-bottom:1.5px solid var(--ink-soft); background:transparent;
    font-family:'IBM Plex Mono', monospace; font-size:0.68rem; padding:3px 2px; color:var(--ink); outline:none; flex-shrink:0;
  }
  /* A step planned onto a day, shown "TASK > step" (see daySubtaskRowHtml)
     — the task half stays muted so the step itself reads as the subject. */
  .daysubparent{ color: var(--ink-soft); }
  /* Fixes a step row's .subcheck (14px) to center under a task row's
     .check (18px) instead of drifting left of it — width matches .check's
     own so .checkwrap's existing align-items:center does the centering,
     same trick as .checklistheader scaling reusing shared markup. */
  .checkwrap.daysub{ width:18px; }
  /* Groups a step directly under its own parent task's row when that
     task is also planned whole onto the same day (see renderDayDetail's
     nestedSteps grouping) — indented past the checkbox column rather
     than sharing its alignment, so nesting reads as "under," not just
     "another row at the same level." The step still carries the full
     "TASK > step" label regardless (see daySubtaskRowHtml) — indentation
     is a second, reinforcing cue, not the only one, since relying on
     indent alone read as ambiguous on its own. The left border gives that
     cue a visible anchor line rather than just empty space. */
  .daysubnested{ margin-left:34px; padding-left:10px; border-left:2px solid var(--line); }
  .subadd{
    width:100%; border:none; border-bottom:1px dashed var(--line); background:transparent;
    font-family:'IBM Plex Sans',sans-serif; font-size:0.84rem; padding:6px 2px; color:var(--ink); outline:none; margin-top:2px;
  }
  .subadd::placeholder{ color: var(--ink-soft); opacity:0.7; }
  .badge.subcount{ background: var(--card-bg-dim); color: var(--ink-soft); border:1px solid var(--line); }
  .savestatus{
    text-align:center; font-family:'IBM Plex Mono', monospace; font-size:0.62rem;
    color: rgba(241,234,217,0.5); margin-top:12px; letter-spacing:0.06em; text-transform:uppercase; height:14px;
  }
  .undoRow{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:16px; }
  .undobtn{
    width:30px; height:30px; border-radius:50%; border:1px solid rgba(241,234,217,0.25);
    background: rgba(241,234,217,0.08); color: rgba(241,234,217,0.75);
    font-size:0.95rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition: transform .15s ease;
  }
  .undobtn:hover:not(:disabled){ transform: scale(1.08); }
  .undobtn:disabled{ opacity:0.25; cursor:not-allowed; }
  .undostatus{
    font-family:'IBM Plex Mono', monospace; font-size:0.62rem; color: rgba(241,234,217,0.65);
    letter-spacing:0.04em; text-transform:uppercase; min-width:130px; text-align:center;
  }
  .fieldlabel{ font-family:'IBM Plex Mono',monospace; font-size:0.68rem; color:var(--ink-soft); }
  .taskmeta{
    font-family:'IBM Plex Mono', monospace; font-size:0.62rem; color: var(--ink-soft);
    margin-top:10px; letter-spacing:0.03em;
  }
  /* Goes with .checklisttitle above — a tiny faded subheader centered
     under the (now centered, header-sized) checklist title, rather than
     the small left-aligned meta line under a standard task's title. */
  .taskmeta.checklistmeta{ text-align:center; margin-top:2px; opacity:0.75; }
  .subedit{
    flex:1; border:none; border-bottom:1px dashed var(--ink-soft); background:transparent;
    font-family:'IBM Plex Sans',sans-serif; font-size:0.84rem; padding:0 0 2px; color:var(--ink); outline:none;
  }
  .addday{
    width:100%; text-align:left; font-family:'IBM Plex Mono', monospace; font-size:0.72rem; text-transform:uppercase;
    letter-spacing:0.05em; padding:11px 14px; border-radius:8px; border:1px dashed var(--primary);
    background: color-mix(in srgb, var(--primary) 8%, transparent); color: var(--primary); cursor:pointer; margin-bottom:16px;
  }
  .adddayrow{ display:flex; gap:8px; margin-bottom:16px; }
  .adddayrow .addday{ flex:1; width:auto; margin-bottom:0; }
  /* Replaces the old "Pick a date…" toggle button + native <input
     type=date> + separate "Add this day" button — a single always-
     visible text field, parsed via parseNaturalDate() on Enter (see
     addDayByText() in 11-daily-core.js), same idea as a step's own due-
     date field. Dashed border echoes that old toggle button's look
     rather than .quickadd's solid-underline style, so it still reads as
     "secondary, optional" next to the quick-add button beside it — the
     same visual language, just carried by the one control that's left
     instead of two. flex:1 (not a fixed width) is what lets it take the
     whole row on its own once showQuickAddBtn hides the button. */
  .dayaddtext{
    flex:1; min-width:140px; font-family:'IBM Plex Mono', monospace; font-size:0.75rem;
    border:1px dashed var(--line); border-radius:8px; padding:11px 12px;
    background:var(--card-bg-dim); color:var(--ink); outline:none;
  }
  .dayaddtext::placeholder{ color: var(--ink-soft); opacity:0.8; }
  .lockednote{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-family:'IBM Plex Mono', monospace; font-size:0.68rem;
    color: var(--ink-soft); background: var(--card-bg-dim); border-radius:6px; padding:10px 12px; margin-bottom:14px; letter-spacing:0.03em;
  }
  /* Left/right day navigation shares one fixed-width row with the
     optional large "which day is this" label (see dayHeaderTag()) instead
     of the arrows sitting right next to the date text the way they used
     to — a longer weekday name pushed the right arrow further right, so
     its position depended on which day you happened to be looking at.
     Grid's two fixed-width outer columns pin both arrows to the same spot
     regardless of what's (or isn't — most days don't get a hero label at
     all) in the middle column; min-height keeps the row's own height
     steady across both cases so the arrows don't shift vertically either.
     "Further out" than sitting flush against the label, but not all the
     way to the page's own edges — still reads as one row at a glance. */
  .daynavrow{
    display:grid; grid-template-columns: 34px 1fr 34px; align-items:center;
    gap:10px; margin:2px 0 10px; min-height:34px;
  }
  .daynavrow .navarrow{ justify-self:center; }
  /* Plain text for Yesterday/Tomorrow/a weekday name; Today gets its own
     larger, Primary-colored treatment so it's unmistakable at a glance
     which day you're looking at, echoing .todaytag's Primary accent used
     for "today" everywhere else. Empty (no text at all) on the many days
     outside dayHeaderTag()'s window — the grid cell still reserves its
     row space either way. */
  .dayhero{
    font-family:'Fraunces', serif; font-weight:600; font-size:1.15rem;
    color:var(--ink-soft); letter-spacing:0.02em; text-align:center;
  }
  .dayhero.today{ font-size:1.9rem; font-weight:700; color:var(--primary); }
  .daylistlabel{ font-family:'IBM Plex Mono', monospace; font-size:0.64rem; letter-spacing:0.06em; text-transform:uppercase; color: var(--ink-soft); margin: 4px 0 6px; }
  .dayitem{
    width:100%; display:flex; justify-content:space-between; align-items:center; text-align:left;
    border:none; background:none; border-bottom:1px dashed var(--line); padding:11px 4px; cursor:pointer;
    font-family:'IBM Plex Sans',sans-serif; font-size:0.92rem; color:var(--ink);
  }
  .todaytag{
    font-family:'IBM Plex Mono', monospace; font-size:0.58rem; text-transform:uppercase; background:var(--primary);
    color:white; padding:2px 6px; border-radius:4px; margin-left:8px; letter-spacing:0.04em;
  }
  .monthgroup{ margin-bottom:4px; }
  .monthhead{
    width:100%; display:flex; justify-content:space-between; align-items:center; text-align:left;
    border:none; background: var(--card-bg-dim); border-radius:6px; padding:10px 12px; cursor:pointer;
    font-family:'IBM Plex Mono', monospace; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink); margin-bottom:4px;
  }
  .monthhead .count{ color: var(--ink-soft); opacity:1; }
  .monthbody{ padding-left:6px; margin-bottom:6px; }
  .backbtn{
    background:none; border:none; font-family:'IBM Plex Mono', monospace; font-size:0.68rem; text-transform:uppercase;
    color: var(--ink-soft); cursor:pointer; letter-spacing:0.05em; padding:0; margin-bottom:14px;
  }
  /* ---- Reusable "stacked page" pattern ----
     A general-purpose pair for any view that should read as a distinct
     sheet layered on top of whatever's beneath it, with its own tagged
     way back, rather than a plain content swap within the same surface.
     First used for the checklist list-detail/pending views, now also
     Settings — reach for these two again (rather than inventing a new
     one-off look) any time a future feature needs the same "opened a
     page on top of this" feel: a drilldown, a modal-like panel, etc.

     .stackedpage: a slightly different tint than plain --card-bg (the
     second `background` line is the enhancement; color-mix()-
     unsupporting browsers just keep the --card-bg fallback above it,
     since an invalid declaration can't override the valid one before
     it) plus its own shadow, a thin border for definition, and
     fully-rounded corners (vs. .card's squared "dog-ear" top corner(s))
     is what sells it as a separate sheet rather than a re-skinned
     version of the same card. Not every view needs this — the plain
     Claude-digest view stays on .backbtn's plain text link instead;
     reach for .stackedpage specifically when the "opened a page on top"
     feeling is wanted, as Daily's day-detail, its per-task detail page,
     the checklist views, and Settings all do. */
  .stackedpage{
    background: var(--card-bg);
    background: color-mix(in srgb, var(--card-bg) 95%, white 5%);
    border-radius: var(--stackpage-radius);
    border: 1px solid var(--line);
    box-shadow: 0 10px 22px rgba(0,0,0,0.18), 0 2px 6px rgba(0,0,0,0.08);
    /* Extra padding-top reserves flow space for .pagetag below, which is
       taken out of flow (position:absolute) so it can jut past the
       page's own left edge instead of being confined to it. Bigger than
       the tag alone needs, so the header content below has some visible
       breathing room under the tag rather than butting right up against it. */
    padding: 54px 14px 10px;
    margin: var(--stackpage-margin-top) var(--stackpage-margin-right) var(--stackpage-margin-bottom) var(--stackpage-margin-left);
    position: relative;
  }
  /* EXPERIMENTAL — Dev Settings' "Stacked-page size" (state.devSettings.
     stackedPageInsetPreset, applied via document.body.dataset.
     stackedpageInset in applyDevSettings()). "classic" needs no override,
     same as leatherInsetPreset above. --stackpage-radius shrinks with the
     margins in each one for the same reason --leather-radius does: a
     rounding noticeably bigger than the frame it's cut from reads as the
     page's corner overlapping #appCard's rather than sitting inside it —
     "leftheavy" and "slim" give their bottom-right corner specifically
     a little more than the other three for the opposite reason: at a
     frame that thin, a *smaller* stackedpage radius than #appCard's own
     (2px 2px 10px 10px, see #appCard below) reads as a visible seam
     between two different curves right where they're closest together.
     "slim" matches #appCard's bottom-right radius (10px) exactly, since
     its frame is thin enough there to be barely more than a hairline;
     "leftheavy" only nudges it up slightly (7px, still short of 10px) —
     its frame has a bit more breathing room on that side than "slim"'s
     does, so the mismatch was smaller to begin with and didn't need a
     full match to stop reading as a seam. */
  body[data-stackedpage-inset="roomier"]{
    --stackpage-margin-top: -14px;
    --stackpage-margin-right: -14px;
    --stackpage-margin-bottom: -6px;
    --stackpage-margin-left: -12px;
    --stackpage-radius: 8px;
  }
  body[data-stackedpage-inset="leftheavy"]{
    /* Top pushed from -19px to -21px (frame: 3px -> 1px) per the project
       owner's explicit "take out even more margin from the top" — see
       the design-direction note on --stackpage-margin-top above. */
    --stackpage-margin-top: -21px;
    --stackpage-margin-right: -16px;
    --stackpage-margin-bottom: -8px;
    --stackpage-margin-left: -8px;
    --stackpage-radius: 5px 5px 7px 5px;
  }
  body[data-stackedpage-inset="slim"]{
    --stackpage-margin-top: -20px;
    --stackpage-margin-right: -19px;
    --stackpage-margin-bottom: -11px;
    --stackpage-margin-left: -13px;
    --stackpage-radius: 3px 3px 10px 3px;
  }
  /* .pagetag: a flag/tag shape instead of .backbtn's plain text, to go
     with the "stacked page" look above — positioned to hang off the
     page's top edge (position:absolute against .stackedpage, left in
     negative territory) like a bookmark tab, rather than sitting fully
     inside the page's own padding. .pagetagtip is a rounded square
     rotated 45° — a simple rounded-triangle "arrow" tip, no SVG or
     hand-drawn clip-path needed — positioned so its center sits exactly
     at .pagetaglabel's flat left edge: the right half lands under
     .pagetaglabel (lower z-index, so it's hidden behind its opaque
     background) and only the left-pointing corner shows, which is what
     actually crosses the page's edge and reads as "jutting out" rather
     than just the tag's ordinary left margin. Works equally for a
     "back" action (checklist detail/pending, Settings) or a forward
     one (the checklist overview's pending-items trigger below) — the
     shape doesn't imply a direction on its own, the label text does. */
  .pagetag{
    position:absolute; top:14px; left:-6px; z-index:3;
    display:flex; align-items:center; border:none; background:none; cursor:pointer; padding:0;
  }
  .pagetagtip{
    position:absolute; left:-8px; top:50%; width:16px; height:16px; z-index:1;
    background: var(--primary); border-radius:5px; transform: translateY(-50%) rotate(45deg);
  }
  .pagetaglabel{
    position:relative; z-index:2; background: var(--primary); color:white;
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em;
    padding:6px 14px 6px 18px; border-radius:0 9px 9px 0;
  }
  /* .pagetag.compact: a smaller variant for a tag that isn't anchored
     to a .stackedpage — e.g. the checklist overview's "see all pending
     items" trigger, which hangs off #appCard itself (the nearest
     positioned ancestor of #checklistView, same trick .locbadge uses
     against .masthead) rather than a page, and shouldn't be as visually
     loud as an actual page's own back tag. Only `top` needs overriding
     here (not `left`) since a compact tag's shallower host has less
     padding above it than a .stackedpage's reserved 46px. */
  .pagetag.compact{ top:2px; }
  .pagetag.compact .pagetagtip{ width:13px; height:13px; left:-6.5px; }
  .pagetag.compact .pagetaglabel{ font-size:0.6rem; padding:5px 10px 5px 11px; }
  /* The pending-items tag is the one place in the app that's Secondary-
     colored by default, not Primary — see the --primary/--secondary note
     in :root above. Every style variant below (jetout/sidebar/booktab/
     cornerpeek) relies on this base rule rather than repeating its own
     background, so they can't drift out of sync with each other; the
     data-pending-tag-color dev overrides below win over this regardless,
     since an attribute-selector rule always out-specifies this plain
     two-class one. */
  .pagetag.compact .pagetagtip, .pagetag.compact .pagetaglabel{ background: var(--secondary); }
  /* EXPERIMENTAL — Settings → Dev Settings (see defaultDevSettings() /
     applyDevSettings() in <script>). Two alternate looks for where the
     .pagetagtip meets .pagetaglabel, toggled independently so the
     project owner can compare them (including together) before
     deciding whether either is worth keeping for real. Safe to delete
     this whole block (and its Dev Settings entry) if neither survives. */
  body.devtag-seam .pagetaglabel{
    box-shadow: inset 4px 0 5px -3px rgba(0,0,0,0.45);
  }
  /* Softer than a first pass: thinner (1px, not 1.5) and --ink-soft
     rather than --ink, so it reads as a light pencil outline instead of
     a hard, dark border. */
  body.devtag-outline .pagetagtip{ border: 1px solid var(--ink-soft); }
  body.devtag-outline .pagetaglabel{ border: 1px solid var(--ink-soft); border-left: none; }
  /* EXPERIMENTAL — three alternate looks for the checklist overview's
     "pending items" trigger specifically (.pagetag.compact), picked via
     a <select> rather than checkboxes since they're mutually exclusive
     redesigns of the same element, not independently layerable — see
     body[data-pending-tag-style] below and setDevPendingTagStyle() in
     <script>. "default" (the plain compact page tag) needs no rule
     here since it's just the normal .pagetag.compact look with nothing
     added. */
  body[data-pending-tag-style="jetout"] .pagetag.compact{ left:-18px; }
  /* "sidebar": drops the diamond tip entirely and turns the label into
     a vertical strip running down from near the top of the card, text
     rotated to read top-to-bottom — a different affordance ("a strip
     along the edge") rather than a variation on the tag shape. */
  body[data-pending-tag-style="sidebar"] .pagetag.compact{ top:40px; }
  body[data-pending-tag-style="sidebar"] .pagetag.compact .pagetagtip{ display:none; }
  body[data-pending-tag-style="sidebar"] .pagetag.compact .pagetaglabel{
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    padding: 14px 6px;
    border-radius: 6px;
  }
  /* "booktab": rooted to the card's top-LEFT corner (not the right — a
     phone-width card has almost no free margin on either side, roughly
     14-20px at this app's actual breakpoints, so there's no side where a
     tag can jut out far; putting it on the left instead just matches
     where the default/jetout tags already live) and deliberately allowed
     to ride up into the tab row above rather than staying clear of it —
     real book/journal index tabs overlap each other in exactly this way,
     and there's more free vertical room to borrow from the tab row than
     there is horizontal room past the card's edge. Fill comes from the
     base .pagetag.compact rule above (--secondary) like every other
     style variant — no background of its own here. `top:-7px` (not
     deeper) is tuned against the actual tab pill's own box: its label
     text bottoms out ~168px from viewport top at this layout with ~11px
     of empty padding below it before the pill's own bottom edge — -7px
     lands the tag's top inside that empty padding band, so it still
     visibly rides up into the pill but never covers any of its label
     text. Don't push this deeper without re-measuring; the pill's text
     baseline is the hard limit, not a number to eyeball. */
  body[data-pending-tag-style="booktab"] .pagetag.compact{ top:-7px; left:-14px; right:auto; }
  body[data-pending-tag-style="booktab"] .pagetag.compact .pagetagtip{ display:none; }
  body[data-pending-tag-style="booktab"] .pagetag.compact .pagetaglabel{
    border-radius: 8px 8px 8px 0;
    padding: 8px 14px 8px 12px;
    box-shadow: -2px 3px 8px rgba(0,0,0,0.3);
  }
  /* "cornerpeek": stays clear of the tab row (top:56px, same lane
     jetout/sidebar already use) rather than overlapping it like booktab
     does. No diamond tip at all — plain squared-off corners on the label
     itself (border-radius:0, overriding the base .pagetaglabel's rounded
     right corners) reads more like an actual index tab card than the
     tip's pointed wedge does. Same base-rule --secondary fill as booktab
     above (see the pendingTagColor swatches below for override options),
     for the same reason. */
  body[data-pending-tag-style="cornerpeek"] .pagetag.compact{ top:56px; left:-14px; right:auto; }
  body[data-pending-tag-style="cornerpeek"] .pagetag.compact .pagetagtip{ display:none; }
  body[data-pending-tag-style="cornerpeek"] .pagetag.compact .pagetaglabel{
    border-radius: 0;
    padding: 9px 14px;
    box-shadow: -2px 3px 7px rgba(0,0,0,0.28);
  }
  /* Checklist overview only: a touch more breathing room between the
     "Name a new list…" quickadd row and the first list row below it —
     scoped to #checklistView (not a blanket change to .quickadd's own
     margin, which is shared with every other tab's add-task row) since
     it only matters here, where the "cornerpeek" pending tag sits right
     in that gap and read as cramped against both neighbors without it. */
  #checklistView .quickadd{ margin-bottom: 22px; }
  /* EXPERIMENTAL — pendingTagColor: a dev-only OVERRIDE on top of the
     real Secondary color (Settings → Appearance → UI Colors), for
     quickly A/B-testing a color regardless of whichever preset someone's
     actually chosen. "theme" (the default — see defaultDevSettings() in
     02-storage-state.js) means "no override," so the base
     .pagetag.compact rule above (--secondary) shows through untouched;
     it deliberately has no rule here for that reason. Every other option
     is a fixed color, "brass" included — it now means "match Primary"
     specifically (not literally brass), for whenever someone wants the
     pending tag to blend back in with the rest of the UI regardless of
     what Secondary is set to. Placed after every style block above and
     matched on `data-pending-tag-color` alone (not chained to
     `data-pending-tag-style`) so it always wins the cascade at equal
     specificity, regardless of which style rule ran before it — see
     setDevPendingTagColor() in <script>. */
  body[data-pending-tag-color="brass"] .pagetag.compact .pagetagtip,
  body[data-pending-tag-color="brass"] .pagetag.compact .pagetaglabel{ background: var(--primary); }
  body[data-pending-tag-color="rust"] .pagetag.compact .pagetagtip,
  body[data-pending-tag-color="rust"] .pagetag.compact .pagetaglabel{ background: var(--estate); }
  body[data-pending-tag-color="forest"] .pagetag.compact .pagetagtip,
  body[data-pending-tag-color="forest"] .pagetag.compact .pagetaglabel{ background: var(--family); }
  body[data-pending-tag-color="slate"] .pagetag.compact .pagetagtip,
  body[data-pending-tag-color="slate"] .pagetag.compact .pagetaglabel{ background: var(--projects); }
  body[data-pending-tag-color="charcoal"] .pagetag.compact .pagetagtip,
  body[data-pending-tag-color="charcoal"] .pagetag.compact .pagetaglabel{ background: var(--ink); }
  /* The large "header" version of a list's own progress indicator atop
     its detail page (see renderChecklistDetail()) — same .checkcircle-
     wrap/.checkcircle/.peg/.progressring markup and JS as the small one
     next to each row in the overview, just visually scaled up via
     transform rather than duplicated at a second set of sizes, so the
     two can never drift out of sync with each other. .checklistheader
     gives it an explicit box (rather than relying on the transform's
     visual overflow) sized to actually fit the scaled-up result, so it
     reserves real flow space instead of overlapping neighboring
     content. Margin is negative on purpose (not just tight) — the
     title right below should sit close enough to read as this header's
     own caption sitting almost on top of it, not a separate block. */
  .checklistheader{
    display:flex; align-items:center; justify-content:center;
    height:78px; margin: 4px 0 -8px;
  }
  .checklistheader .checkcircle-wrap{ transform: scale(2.2); }
  /* Header atop the full-page task detail opened from Daily (see
     renderTaskDetailPage) — just the completion check and category dot,
     since the title/fields below (taskExpandFieldsHtml) carry the rest;
     no separate title line here the way .checklistheader has one, since
     the title is itself an editable field right underneath. */
  .taskdetailhead{ display:flex; align-items:center; gap:8px; margin:4px 0 10px; }
  /* A row, not a stack — the date on the left, progress + the "move
     incomplete" button (when there's something to move) on the right.
     That button used to sit on its own full-width row underneath
     everything else in the header, which was one more vertical block
     between opening a day and actually seeing its tasks; sharing the
     date's row instead of adding a row of its own is the fix. Wraps on
     narrow widths rather than clipping. */
  .daydetailhead{ margin-bottom:14px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px; flex-wrap:wrap; }

     first thing in render()) and lives outside .shell entirely, so it
     stays on screen — and stays open, see devPanelOpen in
     02-storage-state.js — no matter what view is showing underneath.
     Desktop-only on purpose (see the media query below): there's no room
     for a fixed left-edge strip on a narrow or touch screen, and this is a
     Claude Code development aid, not a real end-user feature. */
  .devpanel{
    position:fixed; top:50%; left:0; transform:translateY(-50%);
    display:flex; align-items:stretch; z-index:200;
  }
  .devpaneltab{
    writing-mode: vertical-rl; text-orientation: mixed;
    font-family:'IBM Plex Mono', monospace; font-size:0.66rem; letter-spacing:0.08em;
    text-transform:uppercase; color: var(--primary-light); background: var(--desk-dark);
    border:1px solid var(--primary); border-left:none; border-radius:0 8px 8px 0;
    padding:14px 6px; cursor:pointer;
  }
  .devpaneltab:hover{ color:white; }
  .devpanelbody{
    width:0; max-height:80vh; overflow:hidden; opacity:0;
    background: var(--card-bg); border:1px solid transparent; border-left:none;
    border-radius:0 8px 8px 0; transition: width .15s ease, opacity .15s ease;
  }
  /* .open is toggled only by toggleDevPanel() — never by renderDevPanel(),
     which only replaces #devPanelBody's innerHTML. That split is what lets
     flipping a checkbox re-render the panel's contents without ever
     touching this class, so the panel can't auto-collapse on a change. */
  .devpanel.open .devpanelbody{
    width:210px; opacity:1; overflow-y:auto; padding:14px 12px;
    border-color: var(--primary);
  }
  .devpanellabel{
    font-family:'IBM Plex Mono', monospace; font-size:0.62rem; letter-spacing:0.06em; text-transform:uppercase;
    color: var(--ink-soft); margin: 0 0 12px;
  }
  .devpanelfield{ margin-bottom:12px; }
  .devpanelcaption{
    display:block; font-family:'IBM Plex Mono', monospace; font-size:0.6rem;
    letter-spacing:0.04em; text-transform:uppercase; color: var(--ink-soft); margin-bottom:4px;
  }
  .devpanelrow{
    display:flex; align-items:flex-start; gap:6px; cursor:pointer;
    font-family:'IBM Plex Mono', monospace; font-size:0.62rem; line-height:1.35;
    letter-spacing:0.02em; color: var(--ink-soft); margin-bottom:12px;
  }
  .devpanelrow input{ cursor:pointer; margin-top:2px; flex-shrink:0; }
  .devpanelselect{
    display:block; width:100%; font-family:'IBM Plex Mono', monospace; font-size:0.62rem;
    background: var(--card-bg-dim); border:1px solid var(--line); border-radius:5px;
    color: var(--ink); padding:4px;
  }
  @media (max-width:1250px), (pointer:coarse){
    .devpanel{ display:none !important; }
  }
  /* Plain, semantic text output for the Claude-readable view — no
     decorative markup to strip, just a monospace block a page-reading
     tool can grab in one pass. */
  .claudepre{
    white-space: pre-wrap; word-break: break-word; margin:0;
    font-family:'IBM Plex Mono', monospace; font-size:0.76rem; line-height:1.55;
    background: var(--card-bg-dim); border:1px solid var(--line); border-radius:8px;
    padding:14px; max-height:65vh; overflow:auto; color:var(--ink);
  }
  .claudeviewrow{ display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  /* ---------- Calendar view ---------- */
  /* Shared by both entry points — the "Calendar" tag on Daily's own day
     list (the normal path, see renderDailyCalendar() in 18-calendar.js)
     and the optional dev-only 'calendar' category type (renderCalendar()
     there). */
  /* Same idea as .daynavrow above, reusing .navarrow — see the comment
     there for why the two share one button style instead of each
     defining a near-identical one. */
  .calnav{ display:flex; align-items:center; justify-content:center; gap:16px; margin:2px 0 10px; }
  .calmonthlabel{
    font-family:'Fraunces', serif; font-style:italic; font-weight:500; font-size:1.15rem; color:var(--ink);
    background:none; border:none; cursor:pointer; padding:0; min-width:150px; text-align:center;
  }
  .calsummary{
    text-align:center; font-family:'IBM Plex Mono', monospace; font-size:0.68rem; text-transform:uppercase;
    letter-spacing:0.05em; color:var(--ink-soft); margin-bottom:12px;
  }
  .calweekdays{
    display:grid; grid-template-columns:repeat(7,1fr); text-align:center; margin-bottom:4px;
    font-family:'IBM Plex Mono', monospace; font-size:0.62rem; text-transform:uppercase; color:var(--ink-soft); letter-spacing:0.04em;
  }
  .calgrid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  /* Every cell (blank or real) is a fixed-ratio box via aspect-ratio, not
     a hardcoded height — that's what keeps the grid looking like an
     actual calendar (square-ish cells) at any card width, phone included,
     rather than a fixed pixel height that either wastes space on a wide
     card or gets cramped on a narrow one. */
  .calcell{
    aspect-ratio:1; border-radius:6px; border:1px solid var(--line); background: var(--card-bg-dim);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    cursor:pointer; padding:2px; font-family:'IBM Plex Sans',sans-serif; color:var(--ink);
    /* Backstop for the EXPERIMENTAL calendarCellStyle category-chip
       variants below (and CALENDAR_CELL_CAT_CAP, its own primary defense)
       — a fixed aspect-ratio:1 box can't grow to fit more content, so
       anything that doesn't fit should clip rather than spill past the
       cell's own edges into its neighbors, especially on a phone-width
       card where cells are smallest. */
    overflow:hidden;
  }
  .calcell.calblank{ border:none; background:none; cursor:default; }
  .caldatenum{ font-size:0.8rem; }
  /* Any day already in state.days gets a slightly stronger card-bg tint
     (barely — the border below carries most of the signal), whether or
     not it actually has anything planned — clicking a cell creates the
     day (see openCalendarDay()), so an already-logged-but-empty day needs
     to look different from an untouched one, or there's no way to tell
     "nothing here yet" from "I checked, it's just empty" without
     clicking through. .calexistsdot (a plain middle dot, standing in for
     the ratio text a day with actual items shows) is what carries that
     distinction for the empty case specifically. */
  .calcell.exists{ background: color-mix(in srgb, var(--card-bg-dim) 80%, var(--primary) 20%); }
  .calratio{
    font-family:'IBM Plex Mono', monospace; font-size:0.58rem; color:var(--ink-soft); letter-spacing:0.02em;
  }
  .calratio.calexistsdot{ opacity:0.55; }
  /* Today gets the same Primary-accent treatment .dayhero.today/.todaytag
     use elsewhere for "today," not a new one-off color, so "today" reads
     the same wherever it shows up in the app. border-width:3px (up from
     an original 2px) so it reads clearly even at a phone-width card's
     smaller cell size. */
  .calcell.today{ border-color:var(--primary); border-width:3px; }
  .calcell.today .caldatenum{ color:var(--primary); font-weight:700; }
  /* EXPERIMENTAL — Settings → Dev Settings → "Calendar: ornate border on
     today's cell". CSS's own border-style:double draws two parallel
     lines with a gap between them from a single border declaration — no
     pseudo-elements or extra box-shadow layers needed for the "engraved
     picture-frame" look, and it needs border-width:4px (double needs a
     little more room than a solid border to read as two distinct lines
     rather than one thick blur). Independent of calendarCellStyle above;
     either can be on with either. */
  body.devtoday-ornate .calcell.today{ border-style:double; border-width:4px; }
  /* EXPERIMENTAL — Settings → Dev Settings → "Calendar cell info". Chips
     row for a cell's dayCategoryIds() (11-daily-core.js) — either plain
     color dots ('dots-top', above the date number) or colored category
     icon glyphs ('icons-below', under the ratio/dot). Sized deliberately
     tiny (see the comment on CALENDAR_CELL_CAT_CAP in 18-calendar.js for
     why the count itself is capped) — this is the piece that actually
     has to survive a phone-width card's smallest cells without forcing
     .calcell's overflow:hidden backstop to kick in under normal use. */
  .calcatchips{ display:flex; align-items:center; justify-content:center; gap:2px; line-height:1; }
  .calcatchip.dot{ width:5px; height:5px; border-radius:50%; flex-shrink:0; }
  .calcatchip.icon{ font-size:0.55rem; flex-shrink:0; }
  .calcatchip.more{ font-family:'IBM Plex Mono', monospace; font-size:0.5rem; color:var(--ink-soft); flex-shrink:0; }
  @media (max-width:480px){
    .masthead h1{ font-size:1.9rem; }
    .card{ padding: 18px 14px 10px; }
    .locbadge{ width:44px; height:44px; top:-2px; }
  }

  /* ================= Mobile UI Lab (EXPERIMENTAL) =================
     2026-08 mobile-friendliness pass — see the long comment on
     defaultDevSettings() in 02-storage-state.js for what each dev
     setting means and why they're all gated behind mobileUiActive()
     (01-categories-theme.js) rather than a plain viewport media query.
     body.mobileui-active is that gate's own CSS mirror, toggled by
     refreshMobileUiActive() on load, on every dev-setting change, and on
     resize — everything below keys off it plus one of the
     body[data-quickadd-mode]/[data-taskrow-mobile]/[data-taskdetail-mobile]
     attributes or body.fab-on, so a variant picked in Settings has zero
     effect on desktop unless "Preview on desktop" is also checked. */

  /* ---- quickAddMobileStyle: the "+ Add Task" trigger + sheet ---- */
  .quickaddtrigger{
    display:none; width:100%; align-items:center; justify-content:center; gap:8px;
    padding:14px; margin-bottom:16px; border:none; border-radius:10px; cursor:pointer;
    background: radial-gradient(circle at 30% 20%, var(--primary-light), var(--primary) 75%);
    color:#fff; font-family:'IBM Plex Mono', monospace; font-size:0.78rem;
    text-transform:uppercase; letter-spacing:0.06em;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.4);
  }
  body.mobileui-active[data-quickadd-mode="topsheet"] .quickaddtrigger,
  body.mobileui-active[data-quickadd-mode="bottomsheet"] .quickaddtrigger,
  body.mobileui-active[data-quickadd-mode="inline"] .quickaddtrigger{ display:flex; }
  /* Grabber + close row — only meaningful once #quickAddBar itself has
     left the document's normal flow to float as a sheet (topsheet/
     bottomsheet); "inline" just expands in place right below its own
     trigger, so re-tapping that same trigger is already how it closes. */
  .quickaddsheethead{ display:none; }
  body.mobileui-active[data-quickadd-mode="topsheet"] .quickaddsheethead,
  body.mobileui-active[data-quickadd-mode="bottomsheet"] .quickaddsheethead{
    display:flex; align-items:center; justify-content:center; position:relative; margin-bottom:6px;
  }
  .quickaddsheetgrabber{ width:36px; height:4px; border-radius:2px; background:var(--ink-soft); opacity:0.4; }
  .quickaddsheetclose{
    position:absolute; right:0; top:-6px; background:none; border:none;
    color:var(--ink-soft); font-size:1.3rem; line-height:1; cursor:pointer; padding:6px;
  }
  .quickaddscrim{ display:none; }
  body.mobileui-active.quickadd-open[data-quickadd-mode="topsheet"] .quickaddscrim,
  body.mobileui-active.quickadd-open[data-quickadd-mode="bottomsheet"] .quickaddscrim{
    display:block; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:55;
  }
  /* topsheet/bottomsheet: #quickAddBar leaves the document flow entirely
     and floats "just above everything" — tabs included — per the
     project owner's own framing of the ask. Column layout + full-width
     fields (below) replace the cramped inline flex-wrap row for exactly
     as long as the sheet is open. */
  body.mobileui-active[data-quickadd-mode="topsheet"] #quickAddBar,
  body.mobileui-active[data-quickadd-mode="bottomsheet"] #quickAddBar{
    position:fixed; left:12px; right:12px; z-index:60; max-width:480px; margin:0 auto;
    flex-direction:column; align-items:stretch; gap:12px;
    background: var(--card-bg); padding:18px 16px 20px; box-shadow:0 12px 32px rgba(0,0,0,0.35);
    transition: transform .28s cubic-bezier(.2,.8,.3,1), opacity .2s ease;
  }
  body.mobileui-active[data-quickadd-mode="topsheet"] #quickAddBar{
    top:12px; border-radius:14px 14px 20px 20px; transform:translateY(-140%);
  }
  body.mobileui-active[data-quickadd-mode="bottomsheet"] #quickAddBar{
    bottom:12px; border-radius:20px 20px 14px 14px; transform:translateY(140%);
  }
  body.mobileui-active[data-quickadd-mode="topsheet"]:not(.quickadd-open) #quickAddBar,
  body.mobileui-active[data-quickadd-mode="bottomsheet"]:not(.quickadd-open) #quickAddBar{
    opacity:0; pointer-events:none;
  }
  body.mobileui-active.quickadd-open[data-quickadd-mode="topsheet"] #quickAddBar,
  body.mobileui-active.quickadd-open[data-quickadd-mode="bottomsheet"] #quickAddBar{
    transform:translateY(0); opacity:1;
  }
  /* inline: no overlay at all — the bar stays a normal-flow sibling of
     the tab bar/task list and expands open right under its own trigger,
     pushing everything below it down rather than covering anything. */
  body.mobileui-active[data-quickadd-mode="inline"] #quickAddBar{
    flex-direction:column; align-items:stretch; gap:12px;
    max-height:0; overflow:hidden; opacity:0; margin-bottom:0; padding:0;
    transition: max-height .25s ease, opacity .2s ease, margin-bottom .25s ease;
  }
  body.mobileui-active.quickadd-open[data-quickadd-mode="inline"] #quickAddBar{
    max-height:320px; opacity:1; margin-bottom:16px;
  }
  body.mobileui-active[data-quickadd-mode="topsheet"] #quickAddBar input[type=text],
  body.mobileui-active[data-quickadd-mode="topsheet"] #quickAddBar select,
  body.mobileui-active[data-quickadd-mode="bottomsheet"] #quickAddBar input[type=text],
  body.mobileui-active[data-quickadd-mode="bottomsheet"] #quickAddBar select,
  body.mobileui-active[data-quickadd-mode="inline"] #quickAddBar input[type=text],
  body.mobileui-active[data-quickadd-mode="inline"] #quickAddBar select{
    width:100%; font-size:1.05rem; padding:11px 8px;
  }

  /* ---- floatingAddButton: the always-reachable (+) and its own
     lightweight "quick capture" sheet (openFabAdd() in 16-task-crud.js).
     Lives outside #appCard/.leathercover in shell-body.html so it keeps
     working no matter which tab or overlay is on screen underneath it. ---- */
  .fabaddbtn{
    display:none; position:fixed; right:20px; bottom:24px; z-index:70;
    width:56px; height:56px; border-radius:50%; border:none; cursor:pointer;
    background: radial-gradient(circle at 35% 30%, var(--primary-light), var(--primary) 70%);
    color:#fff; font-size:1.7rem; line-height:1;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.4);
  }
  body.mobileui-active.fab-on .fabaddbtn{ display:flex; align-items:center; justify-content:center; }
  .fabaddscrim{ display:none; }
  body.fab-open .fabaddscrim{ display:block; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:65; }
  .fabaddsheet{
    display:flex; flex-direction:column; gap:12px;
    position:fixed; left:12px; right:12px; bottom:12px; z-index:70; max-width:480px; margin:0 auto;
    background: var(--card-bg); padding:18px 16px 20px; border-radius:20px 20px 14px 14px;
    box-shadow:0 12px 32px rgba(0,0,0,0.35);
    transform:translateY(140%); opacity:0; pointer-events:none;
    transition: transform .28s cubic-bezier(.2,.8,.3,1), opacity .2s ease;
  }
  body.fab-open .fabaddsheet{ transform:translateY(0); opacity:1; pointer-events:auto; }
  .fabaddsheet input[type=text], .fabaddsheet select{ width:100%; font-size:1.05rem; padding:11px 8px; }

  /* ---- taskLongPressMode 'split': the long-press settings sheet ----
     Reuses .fabaddsheet/.fabaddscrim's own hidden-by-default base rules
     above (same bottom-sheet mechanics as the FAB's quick-capture sheet)
     — only the *shown* state is gated by a different body class, since
     the FAB sheet and this one are independent and either can be open
     without the other. .tasksettingssheet adds the taller/scrollable
     override this one needs — a task's full management fields (title,
     category, due, flags, timeframe/priority, notes) run taller than the
     FAB's plain title+category. */
  body.tasksettings-open #taskSettingsScrim{ display:block; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:65; }
  body.tasksettings-open #taskSettingsSheet{ transform:translateY(0); opacity:1; pointer-events:auto; }
  .tasksettingssheet{ max-height:80vh; overflow-y:auto; }
  .tasksettingssheet .expand-row{ margin-top:0; }
  .tasksettingssheet textarea{
    width:100%; min-height:52px; font-family:'IBM Plex Sans',sans-serif; font-size:0.85rem;
    border:1px solid var(--line); border-radius:6px; background: var(--card-bg-dim); padding:8px; resize:vertical; color:var(--ink);
  }

  /* ---- taskRowMobileStyle: reflowing a task row's title vs. its badges ---- */
  /* stacked: .titlewrap (wrapping .title+.meta, see the base rule above)
     switches from a side-by-side row to a column — the title takes the
     row's full width on its own line, and the priority/timeframe/due
     badges drop to a second, wrapping line right below it instead of
     competing with the title for space on one line. */
  body.mobileui-active[data-taskrow-mobile="stacked"] .titlewrap{
    flex-direction:column; align-items:flex-start; gap:3px;
  }
  body.mobileui-active[data-taskrow-mobile="stacked"] .meta{ flex-wrap:wrap; }
  /* minimal: reclaims width by dropping the two lowest-value elements on
     a phone — the drag handle (touch drag-reorder is marginal to begin
     with) and the category dot (redundant once you're already inside
     that category's own tab; "All" still shows it, since there the dot
     is the only thing saying which category a row belongs to). Scoped to
     .row's own direct children so this can't also hit a subtask row's
     .draghandle.sub or a task-detail-page header's .cdot. */
  body.mobileui-active[data-taskrow-mobile="minimal"] .row > .draghandle,
  body.mobileui-active[data-taskrow-mobile="minimal"] .row > .cdot{ display:none; }

  /* ---- taskDetailMobileStyle: the expand-row's category/due/actions ---- */
  /* stacked: every field (and the .expandactions group) gets its own
     full-width line instead of wrapping wherever it happens to fit. */
  body.mobileui-active[data-taskdetail-mobile="stacked"] .expand-row{
    flex-direction:column; align-items:stretch; gap:8px;
  }
  body.mobileui-active[data-taskdetail-mobile="stacked"] .expand-row .catselect,
  body.mobileui-active[data-taskdetail-mobile="stacked"] .expand-row input[type=date]{
    width:100%;
  }
  body.mobileui-active[data-taskdetail-mobile="stacked"] .expandactions{
    display:flex; gap:10px; justify-content:space-between; align-items:center; margin-top:2px;
  }
  body.mobileui-active[data-taskdetail-mobile="stacked"] .expandactions .remove{ margin-left:0; }
  /* grouped: category + due date sit in an even two-column grid (their
     text labels dropped — the field itself is self-explanatory once it's
     not crammed against three other things), with the action buttons in
     their own evenly-spaced row underneath. A middle ground between the
     cramped default and fully-stacked. */
  body.mobileui-active[data-taskdetail-mobile="grouped"] .expand-row{
    display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; align-items:center;
  }
  body.mobileui-active[data-taskdetail-mobile="grouped"] .expand-row .fieldlabel{ display:none; }
  body.mobileui-active[data-taskdetail-mobile="grouped"] .expand-row .catselect,
  body.mobileui-active[data-taskdetail-mobile="grouped"] .expand-row input[type=date]{
    width:100%;
  }
  body.mobileui-active[data-taskdetail-mobile="grouped"] .expandactions{
    grid-column:1 / -1; display:flex; justify-content:space-around; align-items:center; margin-top:4px;
  }
  body.mobileui-active[data-taskdetail-mobile="grouped"] .expandactions .remove{ margin-left:0; }

  /* ---- tabBarMobileStyle / tabBarDesktopStyle ----
     .appmain/.tabswrap (see shell-body.html) are plain unstyled wrappers
     in every mode but 'sidetabs' below — nothing here changes the
     default look. tabBarMobileStyle is gated by mobileui-active like the
     rest of this lab; tabBarDesktopStyle is gated the opposite way
     (body:not(.mobileui-active)) so it can never activate at phone width
     regardless of what's selected — see the comment on
     defaultDevSettings() in 02-storage-state.js. */

  /* scroll: one row, no wrap — scrolls sideways instead, with scroll-snap
     and a trailing fade hinting more tabs are off-screen. Scrollbar
     hidden since the fade + snap already communicate "more content"
     without needing a visible track on top of it. */
  body.mobileui-active[data-tabbar-mobile="scroll"] .tabs{
    flex-wrap:nowrap; overflow-x:auto; scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  body.mobileui-active[data-tabbar-mobile="scroll"] .tabs::-webkit-scrollbar{ display:none; }
  body.mobileui-active[data-tabbar-mobile="scroll"] .tab{ flex-shrink:0; scroll-snap-align:start; }
  .tabswrap{ position:relative; }
  .tabswrap::before, .tabswrap::after{ content:none; }
  /* Both fades exist (content:'') at all times once scroll mode is on,
     permanently at opacity:0, and only the .fade-left/.fade-right classes
     updateTabScrollFade() (06-tabs-render.js) toggles on scroll/resize/
     re-render flip them to opacity:1 — right hints "more tabs past the
     edge" only while that's actually true (never past the last tab), and
     left mirrors it once you've scrolled away from the first tab at all.
     Crossfading opacity on an always-present pseudo-element (rather than
     the content:none/'' toggle above, which pops the box in and out of
     existence with nothing to animate between) is what makes this a
     smooth fade instead of a hard flicker at the scroll extremes. Toned
     down from an earlier, harsher pass — 24px/0.32 reads as a soft hint,
     not a hard edge. */
  body.mobileui-active[data-tabbar-mobile="scroll"] .tabswrap::before{
    content:''; position:absolute; top:0; left:0; bottom:1px; width:24px;
    background:linear-gradient(to left, transparent, rgba(0,0,0,0.32));
    border-radius:10px 0 0 0; pointer-events:none;
    opacity:0; transition: opacity .3s ease;
  }
  body.mobileui-active[data-tabbar-mobile="scroll"] .tabswrap::after{
    content:''; position:absolute; top:0; right:0; bottom:1px; width:24px;
    background:linear-gradient(to right, transparent, rgba(0,0,0,0.32));
    border-radius:0 10px 0 0; pointer-events:none;
    opacity:0; transition: opacity .3s ease;
  }
  body.mobileui-active[data-tabbar-mobile="scroll"] .tabswrap.fade-left::before{ opacity:1; }
  body.mobileui-active[data-tabbar-mobile="scroll"] .tabswrap.fade-right::after{ opacity:1; }

  /* sidetabs: #appMain becomes a row so #tabswrap (now a fixed-width
     column) sits to the left of .leathercover instead of above it. Every
     label stays fully visible all the time — the whole point of this
     option versus a hover/tap-to-reveal collapse. */
  body:not(.mobileui-active)[data-tabbar-desktop="sidetabs"] .appmain{
    display:flex; align-items:stretch; gap:0;
  }
  body:not(.mobileui-active)[data-tabbar-desktop="sidetabs"] .tabswrap{
    width:168px; flex-shrink:0;
  }
  body:not(.mobileui-active)[data-tabbar-desktop="sidetabs"] .tabs{
    flex-direction:column; flex-wrap:nowrap; height:100%; gap:4px;
    padding:10px; border-radius:10px 0 0 10px; border-right:none; border-bottom:1px solid rgba(241,234,217,0.16);
  }
  body:not(.mobileui-active)[data-tabbar-desktop="sidetabs"] .tab{
    border-radius:7px 0 0 7px; justify-content:flex-start; width:100%; padding:11px 16px;
  }
  body:not(.mobileui-active)[data-tabbar-desktop="sidetabs"] .leathercover{ flex:1; min-width:0; }

  /* indextabs: pure restyle of the existing horizontal row — no wrap/
     click behavior changes. Each tab's own category color (--tabhex, set
     inline by renderTabs() in 06-tabs-render.js) becomes a top accent
     border instead of only showing up in the small dot glyph, and a
     3-step stagger + stronger shadow sells "protruding book-index tab"
     instead of "flat pill". 'all'/'daily' have no category color, so
     they fall back to var(--primary). */
  body:not(.mobileui-active)[data-tabbar-desktop="indextabs"] .tab{
    border-radius:7px 7px 0 0; border-top:3px solid var(--tabhex, var(--primary));
    box-shadow:0 2px 5px rgba(0,0,0,0.25);
  }
  body:not(.mobileui-active)[data-tabbar-desktop="indextabs"] .tab:nth-child(3n+2){ margin-top:4px; }
  body:not(.mobileui-active)[data-tabbar-desktop="indextabs"] .tab:nth-child(3n+3){ margin-top:8px; }

  /* overlap: a more extreme take on indextabs — tabs try to stay on one
     line (flex-wrap:nowrap, a negative margin so each one overlaps the
     previous rather than wrapping to a 2nd row once they don't all fit)
     rather than the plain translucent shelf every other tabBarDesktopStyle
     keeps: fully colored in the category's own hex (--tabhex, set inline
     by renderTabs() in 06-tabs-render.js) with a darker edge accent
     (--tabedge) along the *top*, so each reads as a solid book-index tab
     rather than a pill on a shelf. The translucent .tabs shelf background/
     border is explicitly cleared here (background/border:none) — it read
     as a dirty smear behind fully-opaque colored tabs instead of the
     "continuous surface" it's meant to suggest elsewhere, so this mode
     goes bare instead: just the tabs themselves sitting on the desk.

     Every tab is taller than its visible label needs — TAB_TAIL_PX
     (26px) of that height is a plain colored "tail" below the label,
     which .tabs' own matching negative margin-bottom tucks behind
     #appCard (z-index:1 there beats every *resting* tab's negative
     z-index below, see --tabidx). That's what makes a resting tab read
     as nestled behind the current page rather than a chip floating in
     open space above it: the tail is always there, just hidden behind
     the page except for whatever isn't covered. align-items:flex-start
     on .tabs (overriding its default stretch) is required for this — an
     .active tab's shorter tail (see below) would otherwise get stretched
     to match its taller siblings, and a stray floating rectangle would
     show up beneath a hovered tab's own lifted position. */
  body:not(.mobileui-active)[data-tabbar-desktop="overlap"] .tabs{
    background:none; border:none; flex-wrap:nowrap; gap:0; padding:8px 8px 0;
    align-items:flex-start; margin-bottom:-26px;
  }
  body:not(.mobileui-active)[data-tabbar-desktop="overlap"] .tab{
    position:relative; margin-left:-16px; z-index:calc(var(--tabidx, 1) - 100);
    background: var(--tabhex, var(--primary)); color: var(--tabtext, white);
    border-radius:8px 8px 0 0; align-items:flex-start;
    padding:9px 14px 37px;
    border-top:3px solid var(--tabedge, color-mix(in srgb, var(--primary) 70%, black));
    box-shadow:0 -1px 5px rgba(0,0,0,0.3);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  body:not(.mobileui-active)[data-tabbar-desktop="overlap"] .tab:first-child{ margin-left:0; }
  body:not(.mobileui-active)[data-tabbar-desktop="overlap"] .tab .count{ color:inherit; opacity:0.8; }
  /* !important on z-index/transform here is load-bearing, not decorative
     — both rules need to outrank the inline --tabidx-driven stacking
     order above (an inline style otherwise beats a plain class rule
     regardless of source order), which is exactly the point: hovering
     any tab must always win, and the active tab must always sit above
     its plain (non-hovered) neighbors, no matter where either falls in
     the fan. Both also now outrank #appCard's own z-index:1 — on
     purpose, so a raised tab's tail (still there underneath it) drapes
     forward over the page's top edge instead of staying tucked behind
     it, the "you can tell this is the one you're looking at/reaching
     for" cue the resting state doesn't have. */
  body:not(.mobileui-active)[data-tabbar-desktop="overlap"] .tab:hover{
    transform:translateY(-8px); z-index:999 !important;
    box-shadow:0 5px 16px rgba(0,0,0,0.4);
  }
  /* .active gets a much shorter tail (15px padding-bottom vs. 37px) —
     "a little overlap" onto the page rather than the same long drape a
     hover gets, since this one is meant to look settled/permanent, not
     mid-gesture. */
  body:not(.mobileui-active)[data-tabbar-desktop="overlap"] .tab.active{
    background: var(--card-bg); color: var(--ink); font-weight:500;
    padding-bottom:15px;
    border-top-color: var(--tabedge, var(--primary));
    transform:translateY(-4px); z-index:500 !important;
    box-shadow:0 2px 9px rgba(0,0,0,0.35);
  }
  /* The shadow "the pages are on top of the tab" asked for — appended to
     #appCard's own base box-shadow (not replacing it) so both still show.
     A shadow on #appCard with a *negative* vertical offset paints just
     above the card's own top edge; since #appCard's z-index beats every
     resting tab, that shadow falls squarely on the tail poking out from
     underneath, reading as the page's edge casting a shadow onto
     whatever's tucked behind it. */
  body:not(.mobileui-active)[data-tabbar-desktop="overlap"] #appCard{
    box-shadow: 0 24px 55px rgba(0,0,0,0.4), 0 -10px 14px -6px rgba(0,0,0,0.5);
  }

  /* ---- settingsRowMobileStyle: separating identity from management ----
     grouped: .catdeletewrap (see renderSettings() in 09-settings.js)
     drops to its own right-aligned line instead of wrapping inline next
     to the label — .catedit (flex:1) gets the whole top line (move
     buttons + color/icon + label) to itself instead of splitting it with
     Delete, and the resting Delete button is deliberately muted (quiet
     until you actually reach for it) so it stops reading at the same
     visual weight as the label you're editing. Only the plain "Delete"
     trigger is muted this way — once tapped, .catdeleteconfirm/.catcancel
     (siblings inside the same wrap) keep their normal, more prominent
     styling, since a live confirm step should never be quiet. */
  body.mobileui-active[data-settingsrow-mobile="grouped"] .catdeletewrap{
    display:flex; flex-basis:100%; flex-wrap:wrap; justify-content:flex-end; margin-top:4px;
  }
  body.mobileui-active[data-settingsrow-mobile="grouped"] .catdeletewrap .catdelete{
    opacity:0.5; border-color:transparent; background:none;
  }
  body.mobileui-active[data-settingsrow-mobile="grouped"] .catdeletewrap .catdelete:not(:disabled):hover,
  body.mobileui-active[data-settingsrow-mobile="grouped"] .catdeletewrap .catdelete:not(:disabled):active{
    opacity:1; border-color:var(--line); background:var(--card-bg-dim);
  }
</style>
</head>
<body>

  <!-- Mobile UI Lab (floatingAddButton) — sits outside .leathercover/#appCard
       on purpose so it stays reachable regardless of which tab/overlay is

       (display:none) unless mobileui-active AND the dev setting is on. -->

  <!-- taskLongPressMode 'split' (see openTaskSettingsSheet() in 08-render-
       core.js) — one shared sheet reused for whichever task was long-

       body class (.tasksettings-open) since either can be open without
