// ---------- Claude view ----------
// A plain-text view meant to be read by an agent (e.g. the Claude Chrome
// extension) via its page-text tools, instead of screenshotting the
// visual ledger. Pure navigation like switchTab/toggleSettings, so it's
// not on the undo stack and isn't itself state — it just renders a text
// snapshot of the current in-memory `state` on demand.

function openClaudeView(mode){
  claudeView = mode === 'full' ? 'full' : 'digest';
  settingsOpen = false;
  pendingDeleteCategoryId = null;
  closeAllSettingsPopovers();
  render();
}

// The only way into the Claude view is the "Open Claude-readable view"
// button inside Settings (or the ?claude= URL param, which a page-reading
// agent wouldn't be clicking a tag or pressing Esc from anyway) — so
// closing it, whether via the page tag or Esc, goes back to Settings
// rather than whatever category tab happened to be active underneath.
function closeClaudeView(){
  claudeView = null;
  settingsOpen = true;
  render();
}

function toggleClaudeViewMode(){
  claudeView = claudeView === 'full' ? 'digest' : 'full';
  render();
}

// One line per task, plain enough for an LLM to parse without any markup:
// a checkbox-style status, urgent flag, due date (flagged if overdue),
// step progress, then notes and each subtask step on their own indented
// lines so nothing stays hidden the way it does in the collapsed UI.
function claudeTaskLine(t, withCategory){
  const cat = CATEGORIES[t.category] || FALLBACK_CATEGORY;
  const bits = ['-', t.urgent ? '[URGENT]' : '[ ]', t.title];
  if(withCategory) bits.push(`(${cat.label})`);
  if(t.priority) bits.push(`priority:${PRIORITY_LABELS[t.priority].toLowerCase()}`);
  if(t.timeframe) bits.push(`timeframe:${t.timeframe}`);
  if(t.dueDate) bits.push(isOverdue(t) ? `— OVERDUE ${fmtDate(t.dueDate)}` : `— due ${fmtDate(t.dueDate)}`);
  if(t.subtasks && t.subtasks.length){
    const done = t.subtasks.filter(s=>s.done).length;
    bits.push(`(${done}/${t.subtasks.length} steps)`);
  }
  // Age is the whole point of this digest for a "what's been sitting
  // around" read — every open line gets one, not just old ones, so an LLM
  // can compare across the list without guessing at missing data.
  const age = daysBetween(t.createdAt, todayStr());
  bits.push(`(open ${age}d)`);
  let line = bits.join(' ');
  if(t.notes && t.notes.trim()) line += `\n    note: ${t.notes.trim().replace(/\s*\n\s*/g,' ')}`;
  (t.subtasks||[]).forEach(s=>{ line += `\n    · [${s.done?'x':' '}] ${s.text}`; });
  return line;
}

// Curated for "what should I work on next" — open tasks only, grouped by
// tab in the same order the tabs themselves appear, plus today's and any
// upcoming Daily plans. Ignores the location filter deliberately: an
// agent reading this wants the whole picture, not just what's visible
// while standing in one location.
function claudeDigestText(){
  const lines = ['THE LEDGER — Claude priority digest', `Generated ${new Date().toLocaleString()}`];
  if(state.locationEnabled) lines.push(`Currently at: ${currentLocation().label}`);
  lines.push('');
  const knownIds = new Set(state.categories.map(c=>c.id));
  state.categories.forEach(c=>{
    const open = sortTasks(state.tasks.filter(t=>t.category===c.id && t.status!=='done'));
    const locNote = state.locationEnabled
      ? ` (${c.locations.map(id=>(state.locations.find(l=>l.id===id)||{label:id}).label).join(', ')})`
      : '';
    lines.push(`== ${c.label}${locNote} — ${open.length} open ==`);
    lines.push(open.length ? open.map(t=>claudeTaskLine(t)).join('\n') : '(nothing open)');
    lines.push('');
  });
  const orphaned = sortTasks(state.tasks.filter(t=>!knownIds.has(t.category) && t.status!=='done'));
  if(orphaned.length){
    lines.push(`== Uncategorized — ${orphaned.length} open ==`);
    lines.push(orphaned.map(t=>claudeTaskLine(t)).join('\n'));
    lines.push('');
  }
  lines.push('== Daily plan ==');
  const today = todayStr();
  const todayTasks = sortTasks(tasksForDay(today).filter(t=>t.status!=='done'));
  lines.push(`-- Today, ${dayLabel(today)} --`);
  lines.push(todayTasks.length ? todayTasks.map(t=>claudeTaskLine(t, true)).join('\n') : '(nothing planned)');
  state.days.filter(d=>d>today).sort().forEach(d=>{
    const dt = sortTasks(tasksForDay(d).filter(t=>t.status!=='done'));
    if(!dt.length) return;
    lines.push('');
    lines.push(`-- ${dayLabel(d)} --`);
    lines.push(dt.map(t=>claudeTaskLine(t, true)).join('\n'));
  });
  return lines.join('\n');
}

// Complete, structured, and trivial for an LLM to parse — the entire
// state object as-is, not a curated subset like the digest above.
function claudeFullDumpText(){
  return JSON.stringify(state, null, 2);
}

function renderClaudeView(){
  const el = document.getElementById('claudeView');
  const text = claudeView === 'full' ? claudeFullDumpText() : claudeDigestText();
  el.innerHTML = `
    <div class="stackedpage">
      ${pageTagHtml('closeClaudeView()', 'Back')}
      <div class="daylistlabel">Claude-readable ${claudeView==='full' ? 'raw data (JSON)' : 'priority digest'}</div>
      <div class="lockednote">Point your assistant here directly by adding <b>?claude=1</b> (digest) or <b>?claude=full</b> (raw data) to this page's URL — it can read the text below without screenshotting the app.</div>
      <div class="claudeviewrow">
        <button class="pullbtn" onclick="toggleClaudeViewMode()">${claudeView==='full' ? 'Show digest' : 'Show full raw data'}</button>
        <button class="pullbtn" onclick="copyClaudeView(this)">Copy to clipboard</button>
      </div>
      <pre class="claudepre" id="claudeViewText">${escapeHtml(text)}</pre>
    </div>
  `;
}

async function copyClaudeView(btn){
  const text = document.getElementById('claudeViewText').textContent;
  try{
    await navigator.clipboard.writeText(text);
    const original = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(()=>{ if(btn.textContent==='Copied!') btn.textContent = original; }, 1500);
  }catch(e){
    console.error('Clipboard copy failed', e);
  }
}

// ---------- Daily tab ----------

function monthKey(dateStr){ return dateStr.slice(0,7); }

function newId(prefix){ return prefix + '-' + Date.now() + '-' + Math.random().toString(36).slice(2,8); }

function addDaysToDateStr(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}

// Whether Daily's own calendar view (opened via the "Calendar" tag on
// renderDayList(), see openDailyCalendar()/renderDailyCalendar() in
// 18-calendar.js) is showing in place of the day list — transient UI
// state, not persisted, same idiom as dayAddOpen just below. Deliberately
// NOT reset by openDay()/closeDay(): opening a date from the calendar
// itself sets this back to false (see openCalendarDay()) as part of the
// same navigation, so there's no window where both would be true at once.
let dailyCalendarOpen = false;

// Which of Daily's two peer master views — the day list or the calendar —
// is "home" right now, independent of whatever you're currently drilled
// into. dailyCalendarOpen alone can't answer this: it only means "the
// calendar grid is the literal thing on screen this instant," which is
// already false the moment you open a specific day from it
// (openCalendarDay() explicitly clears it before opening the day). Without
// a separate, more durable tracker, switchTab() away and back — or a page
// reload — had nothing left to tell it a day mid-view was ever reached via
// the calendar in the first place, and always fell back to the plain day
// list. setDailyLastView() (called from openDailyCalendar()/
// closeDailyCalendar() and openDay()'s own fromCalendar branch) is the
// single place this updates; switchTab() reads it to restore
// dailyCalendarOpen whenever you land back on the Daily tab. Persisted to
// plain localStorage (like ledger-last-tab) rather than synced state —
// this is a per-device UI preference, not ledger data — and restored in
// enterApp() (17-auth-ui.js) the same way.
let dailyLastView = localStorage.getItem('ledger-daily-view') === 'calendar' ? 'calendar' : 'list';
function setDailyLastView(view){
  dailyLastView = view;
  localStorage.setItem('ledger-daily-view', view);
}

// "Add to this day" tree picker state — transient UI state, not
// persisted, same idiom as expandedMonths above. Reset by
// resetDayAddPicker() whenever a day is opened or closed.
let dayAddOpen = false;
let dayTreeExpanded = new Set(); // open nodes, keyed 'cat:<id>' / 'task:<id>' / 'cklist:<id>'
// Which row (if any) just got toggled on/off the day, keyed the same way
// as dayTreeExpanded — read at render time to apply a one-shot fade
// animation, then cleared shortly after so an unrelated later re-render
// (which recreates the row's DOM node from scratch) doesn't replay it.
let dayTreeFlashKey = null;

// Which task's full-page detail view (opened from clicking a task or step
// within Daily — see openTaskDetailFromDay()) is showing on top of the
// current day's detail, if any. Transient UI state, reset the same places
// dayAddOpen/dayTreeExpanded are.
let taskDetailId = null;

function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('en-US', { month:'long', year:'numeric' });
}

function dayLabel(dateStr){
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { weekday:'long', month:'short', day:'numeric' });
}

function tasksForDay(dateStr){
  return state.tasks.filter(t=>(t.plannedDates||[]).includes(dateStr));
}

// Of the whole tasks planned onto a day, the checklist lists among them
// render as checklist rows (dayChecklistRowHtml), not standard task rows
// — taskRowHtml doesn't know how to show a checklist's items/fields.
function standardTasksForDay(dateStr){
  return tasksForDay(dateStr).filter(t=>!isChecklistCategory(t.category));
}
function checklistDailyItemsForDay(dateStr){
  return tasksForDay(dateStr).filter(t=>isChecklistCategory(t.category));
}

// Steps planned onto a day independently of their parent task's own
// plannedDates — {task, sub} pairs. Checklist items aren't part of this;
// a checklist is planned onto a day as a whole list, same as a task.
function subDailyItemsForDay(dateStr){
  const out = [];
  state.tasks.forEach(t=>{
    if(isChecklistCategory(t.category)) return;
    (t.subtasks||[]).forEach(s=>{
      if((s.plannedDates||[]).includes(dateStr)) out.push({ task:t, sub:s });
    });
  });
  return out;
}

// A day's standard tasks/steps reduced to the actual countable/movable
// "leaf units" — what dayItemsSummary()'s total/done counts, and what
// moveIncompleteToTomorrow()/moveDayUnfinishedToToday() actually move.
// Naively counting every whole task *and* every step separately double-
// counts a task that has its own steps planned the same day — a task
// with 2 steps (one done, one not) would read as "2 unfinished" (the
// task plus the open step) instead of the 1 real thing still open. The
// rule: a standard task with steps also planned on this same day isn't
// its own unit while any of those steps is still open — each step is the
// unit instead. Once every one of those steps is done, the parent's own
// checkbox becomes the one remaining unit — a finished step list with an
// unchecked parent is "one thing left to close out" (the checkbox
// itself), not zero and not a phantom extra alongside already-finished
// steps. This mirrors how the project owner actually uses the app: a
// task with steps is a container, the steps are the real work, *unless*
// it has none, in which case the task itself is the actionable thing —
// so a task only ever counts as its own unit when it has no open-step
// competition for the same day. A step whose parent isn't planned whole
// on this day (an "orphan" step, no row to nest under — see
// daySubtaskRowHtml's `nested` param) always counts on its own, since
// there's no parent unit it could conflict with.
function dayLeafUnits(dateStr){
  const tasks = standardTasksForDay(dateStr);
  const subs = subDailyItemsForDay(dateStr);
  const byParent = {};
  subs.forEach(x=>{ (byParent[x.task.id] = byParent[x.task.id] || []).push(x); });
  const taskIds = new Set(tasks.map(t=>t.id));

  const units = [];
  tasks.forEach(t=>{
    const kids = byParent[t.id];
    if(!kids || !kids.length || kids.every(x=>x.sub.done)){
      units.push({ kind:'task', task:t, done: t.status==='done' });
    } else {
      kids.forEach(x=>units.push({ kind:'sub', task:x.task, sub:x.sub, done: x.sub.done }));
    }
  });
  subs.forEach(x=>{
    if(!taskIds.has(x.task.id)) units.push({ kind:'sub', task:x.task, sub:x.sub, done: x.sub.done });
  });
  return units;
}

// Unified "how much is on this day, how much of it's done" across all
// three kinds of daily item — used by the day-list ratio badge, the
// day-detail header, and the Daily tab's badge count, so all three agree
// once steps/checklists can be planned onto a day too.
function dayItemsSummary(dateStr){
  const units = dayLeafUnits(dateStr);
  const lists = checklistDailyItemsForDay(dateStr);
  return {
    total: units.length + lists.length,
    done: units.filter(u=>u.done).length + lists.filter(t=>t.status==='done').length
  };
}

// Distinct categories touching a day, in state.categories' own display
// order (not task-insertion order, so the same category always shows in
// the same relative position regardless of which of its tasks happens to
// be first) — feeds the Calendar's category-color chips (see
// calendarCatChipsHtml() in 18-calendar.js). A step's own category is its
// parent task's, same as everywhere else steps are treated as belonging
// to that task rather than tracked separately.
function dayCategoryIds(dateStr){
  const ids = new Set();
  standardTasksForDay(dateStr).forEach(t=>ids.add(t.category));
  checklistDailyItemsForDay(dateStr).forEach(t=>ids.add(t.category));
  subDailyItemsForDay(dateStr).forEach(x=>ids.add(x.task.category));
  return state.categories.filter(c=>ids.has(c.id));
}

async function ensureDay(dateStr){
  if(!state.days.includes(dateStr)){
    state.days.unshift(dateStr);
    queueSave();
  }
}

// Today, or the next day after that not yet in state.days — what the
// quick-add button in renderDayList() targets and labels itself after
// (see showQuickAddBtn/quickAddLabel there), shared here so the two can
// never disagree about which day is next.
function nextOpenDay(){
  let d = todayStr();
  while(state.days.includes(d)) d = addDaysToDateStr(d, 1);
  return d;
}

async function addDay(){
  const dateStr = nextOpenDay();
  pushUndo('Added a day');
  await ensureDay(dateStr);
  selectedDay = dateStr;
  render();
}

// The masthead's own "Today" shortcut (#dailyShortcutBtn, top of the
// screen next to the settings gear — see shell-body.html), not the
// "Daily" tab itself: the tab uses the plain switchTab('daily') every
// other tab does, landing wherever Daily was last left (the day list, a
// specific day, the calendar view); this button always jumps straight to
// today's own day-detail page regardless. switchTab() still runs first
// for everything else it does (closing Settings/the Claude view/overlays,
// resetting per-tab UI state); dailyCalendarOpen is cleared explicitly
// since openDay() alone wouldn't override it — renderDaily() checks that
// before selectedDay. Mirrors openCalendarDay()'s "only pushUndo if this
// actually creates a new day" rule, not addDay()'s unconditional one,
// since unlike addDay() (which only ever targets a day that doesn't exist
// yet) today may already be logged.
async function goToDailyToday(){
  switchTab('daily');
  dailyCalendarOpen = false;
  const today = todayStr();
  if(!state.days.includes(today)) pushUndo('Added a day');
  await ensureDay(today);
  openDay(today);
}

// Replaces the old "Pick a date…" toggle + native <input type=date> +
// separate "Add this day" button with a single always-visible text field,
// parsed the same way a step's own due date is (see parseNaturalDate() in
// 05-dates-sort.js and startEditSubtaskDate() in 15-subtask-edit.js) —
// "tmrw", "tue", "9/1" all work, not just a literal calendar click.
// The Calendar view (openDailyCalendar()) is the click-through-a-grid
// alternative now, so this doesn't need to also cover that case itself.
// Unparseable input is left in the field rather than cleared or guessed
// at, same reasoning the subtask date editor already uses — the field
// simply isn't cleared because render() never runs to replace it.
async function addDayByText(){
  const input = document.getElementById('dayAddTextInput');
  const raw = input ? input.value.trim() : '';
  if(!raw) return;
  const parsed = parseNaturalDate(raw);
  if(!parsed) return;
  if(!state.days.includes(parsed)) pushUndo('Added a day');
  await ensureDay(parsed);
  selectedDay = parsed;
  render();
}

// Replaces the old whole-day reschedule + "copy unfinished as new tasks"
// pair — the project owner found the "Move this Day To" date-picker
// distracting and wanted it gone, with the copy-forward behavior kept but
// changed to actually carry the *same* task/step forward (via the
// plannedDates array — see the migration note in normalizeState()) rather
// than minting duplicate task objects. An item already carrying tomorrow's
// date is skipped, so mashing this button repeatedly can't pile up
// duplicate entries on tomorrow's list the way the old copy did.
// Shared by moveIncompleteToTomorrow() and moveDayUnfinishedToToday() —
// copies every unfinished leaf unit (see dayLeafUnits()) from `dateStr`
// onto `targetDate`, additively (plannedDates gains targetDate, dateStr's
// own entry is untouched) and idempotently (a unit already carrying
// targetDate is skipped, so re-running this can't pile up duplicates).
// Checklist lists are excluded — a whole named list doesn't have the
// "incomplete" urgency a standard task/step does, same reasoning the old
// single-day cascade this replaced used.
async function copyDayUnfinishedTo(dateStr, targetDate, undoLabel){
  const unfinished = dayLeafUnits(dateStr).filter(u=>!u.done);
  if(unfinished.length===0) return false;
  pushUndo(undoLabel);
  await ensureDay(targetDate);
  unfinished.forEach(u=>{
    const obj = u.kind==='task' ? u.task : u.sub;
    if(!obj.plannedDates) obj.plannedDates = [];
    if(!obj.plannedDates.includes(targetDate)) obj.plannedDates.push(targetDate);
  });
  render();
  queueSave();
  return true;
}

async function moveIncompleteToTomorrow(dateStr){
  await copyDayUnfinishedTo(dateStr, addDaysToDateStr(dateStr, 1), 'Moved incomplete items to tomorrow');
}

// The day-list's own per-past-day "N unfinished" marker (see
// dayItemHtml()) — copies that day's unfinished leaf units onto *today*
// specifically, regardless of how far in the past the day is, rather than
// one day forward the way moveIncompleteToTomorrow() does. Same copy
// (not remove) semantics as that function: the original day keeps its
// full history, today just also picks up whatever's still open.
async function moveDayUnfinishedToToday(dateStr){
  await copyDayUnfinishedTo(dateStr, todayStr(), 'Moved unfinished items to today');
}

function resetDayAddPicker(){
  dayAddOpen = false;
  dayTreeExpanded = new Set();
  dayTreeFlashKey = null;
  taskDetailId = null;
}

// `fromCalendar` is optional — only openCalendarDay() (and goToAdjacentDay(),
// threading the already-open day's own value through) ever pass it.
// Every other call site (the plain day-list row, "+ Add a Day", the date
// picker) omits it, which resets dayReturnToCalendar to false even if an
// earlier day had left it true, so "opened from the calendar" can never
// leak into an unrelated later day the way checklistReturnDay guards
// against the same thing for checklist lists.
function openDay(dateStr, fromCalendar){
  selectedDay = dateStr;
  dayReturnToCalendar = !!fromCalendar;
  setDailyLastView(fromCalendar ? 'calendar' : 'list');
  // Always false here, regardless of whatever it was set to a moment ago —
  // opening a specific day always means the day *detail* is what should
  // render, never the grid (renderDaily() checks dailyCalendarOpen before
  // selectedDay), and this can't safely assume a caller already cleared
  // it. openCalendarDay() used to rely on exactly that assumption (setting
  // dailyCalendarOpen = false itself, one line before calling
  // switchTab('daily')) — but switchTab() now restores dailyCalendarOpen
  // from dailyLastView on every call (see its own comment), and
  // dailyLastView is still 'calendar' at that point (this call hasn't run
  // yet to update it), so that switchTab() call was clobbering the false
  // right back to true before this function ever got a chance to run —
  // new days opened from the calendar were creating the day correctly but
  // landing back on the calendar grid instead of the day itself. Owning
  // this line here instead of trusting the caller closes that gap for
  // good, regardless of what any future caller does or doesn't clear
  // first.
  dailyCalendarOpen = false;
  resetDayAddPicker();
  render();
}
function closeDay(){
  selectedDay = null;
  resetDayAddPicker();
  if(dayReturnToCalendar){
    dayReturnToCalendar = false;
    dailyCalendarOpen = true;
    setDailyLastView('calendar');
  }
  render();
}

// Reached from the day-context-menu (see dayContextMenuHtml() in
// 08-render-core.js) — removes the day itself from state.days and un-plans
// every task/step that had it in their own plannedDates (their
// plannedDates just loses that one date; the task/step itself, and any
// other days it's still planned on, are untouched). Without this cleanup
// a deleted day would leave orphaned dates behind that ensureDay() would
// silently resurrect the moment anything referencing them got touched
// again. Checklist lists go through the same plannedDates field as
// standard tasks (see tasksForDay()), so the one loop below already
// covers them too — no separate pass needed. Closes the day-detail page
// first if you were looking at the very day being deleted (same as
// clicking "All Days"/Esc would), rather than leaving it open on a day
// that no longer exists.
async function deleteDay(dateStr){
  pushUndo(`Deleted ${dayLabel(dateStr)}`);
  state.tasks.forEach(task=>{
    if(task.plannedDates && task.plannedDates.includes(dateStr)){
      task.plannedDates = task.plannedDates.filter(d=>d!==dateStr);
    }
    (task.subtasks||[]).forEach(s=>{
      if(s.plannedDates && s.plannedDates.includes(dateStr)){
        s.plannedDates = s.plannedDates.filter(d=>d!==dateStr);
      }
    });
  });
  state.days = state.days.filter(d=>d!==dateStr);
  if(selectedDay === dateStr) closeDay(); else render();
  queueSave();
}

// Chronological, not state.days' own insertion order (state.days.unshift()
// in ensureDay() means the array itself is newest-first) — "previous"/
// "next" on a day-detail page should mean the closest earlier/later day
// you've actually logged, matching what the left/right arrows visually
// promise, not whichever day happened to be added most recently.
function sortedDayList(){ return state.days.slice().sort((a,b)=>a.localeCompare(b)); }

// null when `dateStr` isn't in state.days at all, or sits at either end
// of the list — both cases the day-detail page's arrow just renders
// disabled rather than erroring or wrapping around.
function adjacentDayStr(dateStr, dir){
  const days = sortedDayList();
  const idx = days.indexOf(dateStr);
  if(idx === -1) return null;
  const target = days[idx + dir];
  return target === undefined ? null : target;
}

// Pure navigation (openDay() itself isn't undo-tracked either) — moving
// to an adjacent day you've already logged isn't a content change, same
// reasoning switchTab()/toggleLocation() already lean on elsewhere.
function goToAdjacentDay(dir){
  const target = adjacentDayStr(selectedDay, dir);
  if(!target) return;
  openDay(target, dayReturnToCalendar);
}

function toggleMonthGroup(key){
  if(expandedMonths.has(key)) expandedMonths.delete(key); else expandedMonths.add(key);
  renderDaily();
}

function renderDaily(){
  const el = document.getElementById('dailyView');
  if(taskDetailId && !state.tasks.find(t=>t.id===taskDetailId)) taskDetailId = null;
  if(dailyCalendarOpen){
    el.innerHTML = renderDailyCalendar();
  } else if(selectedDay && taskDetailId){
    el.innerHTML = renderTaskDetailPage(taskDetailId, 'closeTaskDetail()', 'Daily');
  } else {
    el.innerHTML = selectedDay ? renderDayDetail(selectedDay) : renderDayList();
  }
}

// Spells out small numbers ("Two Weeks", not "2 Weeks") for the coarser
// bands of dayHeaderTag() below — exact counts (8-13 days) stay digits,
// since "Nine Days" doesn't read any better than "9 Days" and would need
// a much longer word list.
const DAY_TAG_NUMBER_WORDS = ['Zero','One','Two','Three','Four','Five','Six'];
function dayTagNumberWord(n){
  return DAY_TAG_NUMBER_WORDS[n] || String(n);
}

// Large "which day is this" label shown centered atop a day's detail
// page — distinct from the h2 (which always shows the full weekday+date).
// Graduated from exact (today/tomorrow/yesterday, a weekday name) to
// increasingly rounded the further out a date is, on both sides of today:
//   0/±1 day     Today / Tomorrow / Yesterday
//   2-6 days     a weekday name — "Friday" / "Last Monday"
//   7 days       One Week / Last Week — a bare weekday would just repeat
//                today's own, which reads oddly ("last Wednesday" when
//                today already is Wednesday)
//   8-13 days    exact day count — "9 Days" / "9 Days Ago"
//   14-27 days   rounded to the nearest week — "Two Weeks" / "Three Weeks Ago"
//   ~1-6 months  rounded to the nearest ~30-day month — "Next Month" /
//                "Two Months Away" / "Three Months Ago"
//   beyond that  nothing — a date far enough out that a rounded label
//                stops being useful context, same as the original 7-day
//                cutoff this replaces.
function dayHeaderTag(dateStr){
  const diffDays = Math.round((new Date(dateStr+'T00:00:00') - new Date(todayStr()+'T00:00:00')) / 86400000);
  if(diffDays === 0) return { text:'Today', today:true };
  if(diffDays === 1) return { text:'Tomorrow', today:false };
  if(diffDays === -1) return { text:'Yesterday', today:false };

  const future = diffDays > 0;
  const abs = Math.abs(diffDays);
  const weekday = () => new Date(dateStr+'T00:00:00').toLocaleDateString('en-US', { weekday:'long' });

  if(abs <= 6) return { text: future ? weekday() : `Last ${weekday()}`, today:false };
  if(abs === 7) return { text: future ? 'One Week' : 'Last Week', today:false };
  if(abs <= 13) return { text: future ? `${abs} Days` : `${abs} Days Ago`, today:false };
  if(abs < 28){
    const w = dayTagNumberWord(Math.round(abs / 7));
    return { text: future ? `${w} Weeks` : `${w} Weeks Ago`, today:false };
  }
  const months = Math.round(abs / 30);
  if(months >= 1 && months <= 6){
    if(months === 1) return { text: future ? 'Next Month' : 'Last Month', today:false };
    const w = dayTagNumberWord(months);
    return { text: future ? `${w} Months Away` : `${w} Months Ago`, today:false };
  }
  return null;
}

function renderDayList(){
  const days = state.days.slice().sort((a,b)=> b.localeCompare(a));
  // Compact page tag, same component the checklist overview's "Pending"
  // trigger uses — see openDailyCalendar()/renderDailyCalendar() in
  // 18-calendar.js. Always shown (not gated behind "only if there's
  // something to see," unlike the checklist's Pending count), since a
  // calendar view is useful even for a currently-empty month.
  let html = pageTagHtml('openDailyCalendar()', 'Calendar', true);
  // The quick-add button only ever targets today or tomorrow (see
  // nextOpenDay()) — once both are already logged, it would otherwise
  // silently jump to whatever day comes after tomorrow, which is exactly
  // the "vague, doesn't say what it'll actually do" problem the plain
  // "+ Add a Day" label had. Simplest fix is to just stop offering it
  // past that point rather than trying to keep labeling it accurately
  // for an ever-further-out target — the text field below still covers
  // any day, named or not.
  const quickAddDate = nextOpenDay();
  const quickAddDiffDays = Math.round((new Date(quickAddDate) - new Date(todayStr())) / 86400000);
  const showQuickAddBtn = quickAddDiffDays <= 1;
  const todayMissing = quickAddDiffDays === 0;
  const quickAddLabel = todayMissing ? '+ Add Today' : '+ Add Tomorrow';
  // .solo — once both today and tomorrow are already logged,
  // showQuickAddBtn goes false and this field is the only way left to add
  // a day at all, so it picks up the same Primary treatment the button it
  // just lost would have had (see .dayaddtext.solo in <style>).
  const textField = `<input type="text" class="dayaddtext ${showQuickAddBtn?'':'solo'}" id="dayAddTextInput" placeholder="Add a day… (today, tmrw, 9/1, tue…)" onkeydown="if(event.key==='Enter') addDayByText()">`;
  // Today missing entirely gets its own oversized, attention-grabbing
  // button on a row by itself — sharing a row with the day-text-field the
  // way "+ Add Tomorrow" (today already logged) does would cramp it back
  // down to ordinary-button size. Per the project owner's explicit ask:
  // this is the one state on this page worth interrupting the normal scan
  // for, since every other view in Daily assumes today already exists.
  html += todayMissing ? `
    <div class="addtodayrow"><button class="addday addtodayhero" onclick="addDay()">${quickAddLabel}</button></div>
    <div class="adddayrow">${textField}</div>
  ` : `
    <div class="adddayrow">
      ${showQuickAddBtn ? `<button class="addday" onclick="addDay()">${quickAddLabel}</button>` : ''}
      ${textField}
    </div>
  `;

  if(days.length===0){
    html += `<div class="empty">No days logged yet. Add today and start a priority list.</div>`;
    return html;
  }

  const curKey = monthKey(todayStr());
  const currentDays = days.filter(d=>monthKey(d)===curKey);
  const otherDays = days.filter(d=>monthKey(d)!==curKey);
  const otherGroups = {};
  otherDays.forEach(d=>{ const k=monthKey(d); (otherGroups[k]=otherGroups[k]||[]).push(d); });
  // Descending (newest month first) throughout, same direction days
  // within a single month already sort in — a future month is just a
  // continuation of that same "newest first" order, not a special case,
  // so it has to land *above* "This Month" (closest future month
  // directly above it), not lumped in with past months below just
  // because both used to share one "not the current month" bucket.
  const otherKeys = Object.keys(otherGroups).sort((a,b)=>b.localeCompare(a));
  const futureKeys = otherKeys.filter(k=>k>curKey);
  const pastKeys = otherKeys.filter(k=>k<curKey);

  const monthGroupHtml = (k) => {
    const open = expandedMonths.has(k);
    return `
      <div class="monthgroup">
        <button class="monthhead" onclick="toggleMonthGroup('${k}')">
          <span>${monthLabel(k)}</span>
          <span class="count">${otherGroups[k].length} day${otherGroups[k].length===1?'':'s'} ${open?'▾':'▸'}</span>
        </button>
        ${open ? `<div class="monthbody">${otherGroups[k].map(dayItemHtml).join('')}</div>` : ''}
      </div>`;
  };

  html += futureKeys.map(monthGroupHtml).join('');
  html += `<div class="daylistlabel">This Month</div>`;
  html += currentDays.length
    ? currentDays.map(dayItemHtml).join('')
    : `<div class="empty" style="padding:14px 4px;">Nothing logged yet this month.</div>`;
  html += pastKeys.map(monthGroupHtml).join('');

  return html;
}

function dayItemHtml(dateStr){
  const { total, done } = dayItemsSummary(dateStr);
  const ratio = total ? `<span class="badge subcount">${done}/${total}</span>` : `<span class="badge due">Empty</span>`;
  const isToday = dateStr === todayStr();
  const isPast = dateStr < todayStr();
  // Only worth computing/showing on days that have already happened —
  // dayLeafUnits() is the same leaf-counting rule dayItemsSummary()'s own
  // total/done use (see the comment there), so this count and the ratio
  // badge above it can never disagree about what "1 unfinished" means.
  const unfinishedCount = isPast ? dayLeafUnits(dateStr).filter(u=>!u.done).length : 0;
  // A <button> can't nest another interactive <button> (the "move to
  // today" action), so the row is a wrapping div with .dayitem as the
  // main clickable button and this as a sibling — border-bottom lives on
  // the wrapper now so the divider still spans the whole grouped row
  // whether or not the second line is present.
  return `
    <div class="dayitemgroup">
      <button class="dayitem ${isToday ? 'today' : ''}" onclick="openDay('${dateStr}')" oncontextmenu="return handleDayContextMenu(event,'${dateStr}')">
        <span class="daydate">${dayLabel(dateStr)}${isToday ? '<span class="todaytag">Today</span>' : ''}</span>
        ${ratio}
      </button>
      ${unfinishedCount>0 ? `
      <button class="dayunfinished" onclick="event.stopPropagation(); moveDayUnfinishedToToday('${dateStr}')" title="Copy ${unfinishedCount} unfinished item${unfinishedCount===1?'':'s'} onto today's list">
        ${unfinishedCount} unfinished → Today
      </button>` : ''}
    </div>`;
}

// A step or a whole checklist is a candidate to add to a day the same
// way a whole task is: not done, and — if due-dated — due today,
// overdue, or due within 3 days (a dateless task/step stays eligible
// unconditionally). Scoped to one category at a time since both picker
// styles browse category-first.
function dayCandidateTasks(dateStr, categoryId){
  return state.tasks.filter(t=>
    t.category===categoryId && t.status!=='done' && !isChecklistCategory(t.category) &&
    (!t.dueDate || isDueWithinDays(t.dueDate, 3))
  );
}

function toggleDayAdd(){
  dayAddOpen = !dayAddOpen;
  renderDaily();
}

function toggleDayTreeNode(key){
  if(dayTreeExpanded.has(key)) dayTreeExpanded.delete(key); else dayTreeExpanded.add(key);
  renderDaily();
}

// The three toggle* functions below are the only way anything gets
// added to or removed from a day through the tree picker — each wraps
// an existing mutator (which already does its own pushUndo/render/
// queueSave) so the tree can treat "add" and "remove" as one flip of
// the same switch rather than two different code paths, and so a row
// never has to disappear from the tree just because it's already
// planned — it stays put and picks up the "added" mark/flash instead.
// dayTreeFlashKey is set just before the mutator runs (so the render()
// inside it picks up the flash class for this one pass) and cleared
// shortly after — see the flashtoggle CSS and the comment on
// dayTreeFlashKey's declaration above for why the timeout matters.
async function toggleDayTreeTask(taskId, dateStr){
  const t = state.tasks.find(t=>t.id===taskId);
  if(!t) return;
  const key = 'task:'+taskId;
  dayTreeFlashKey = key;
  if((t.plannedDates||[]).includes(dateStr)) await unplanTaskFromDay(taskId, dateStr);
  else await planTaskForDay(taskId, dateStr);
  setTimeout(()=>{ if(dayTreeFlashKey===key) dayTreeFlashKey = null; }, 700);
}

async function toggleDayTreeSub(taskId, subId, dateStr){
  const t = state.tasks.find(t=>t.id===taskId);
  const s = t && (t.subtasks||[]).find(s=>s.id===subId);
  if(!s) return;
  const key = 'sub:'+subId;
  dayTreeFlashKey = key;
  if((s.plannedDates||[]).includes(dateStr)) await unplanSubtaskFromDay(taskId, subId, dateStr);
  else await pullSubtaskToDay(taskId, subId, dateStr);
  setTimeout(()=>{ if(dayTreeFlashKey===key) dayTreeFlashKey = null; }, 700);
}

async function toggleDayTreeChecklist(listId, dateStr){
  const t = state.tasks.find(t=>t.id===listId);
  if(!t) return;
  const key = 'cklist:'+listId;
  dayTreeFlashKey = key;
  if((t.plannedDates||[]).includes(dateStr)) await unplanTaskFromDay(listId, dateStr);
  else await planTaskForDay(listId, dateStr);
  setTimeout(()=>{ if(dayTreeFlashKey===key) dayTreeFlashKey = null; }, 700);
}

function dayTreeTaskHtml(t, dateStr){
  const key = 'task:'+t.id;
  const open = dayTreeExpanded.has(key);
  const subs = t.subtasks || [];
  const alreadyWhole = (t.plannedDates||[]).includes(dateStr);
  const flash = dayTreeFlashKey===key ? ' flashtoggle' : '';
  return `
    <div class="daytreenode sub">
      <div class="daytreetaskrow${flash}">
        <button class="daytreelabel" onclick="toggleDayTreeNode('${key}')">${subs.length ? (open?'▾':'▸') : '·'} ${escapeHtml(t.title)}</button>
        ${alreadyWhole ? `<span class="daytreemark" title="On today's list">✓</span>` : ''}
        <button class="daytreeleaf whole ${alreadyWhole?'added':''}" onclick="toggleDayTreeTask('${t.id}','${dateStr}')">${alreadyWhole?'Added':'+ Whole task'}</button>
      </div>
      ${open && subs.length ? `<div class="daytreechildren">
        ${subs.map(s=>daySubLeafHtml(t, s, dateStr)).join('')}
      </div>` : ''}
    </div>`;
}

function daySubLeafHtml(t, s, dateStr){
  const planned = (s.plannedDates||[]).includes(dateStr);
  const key = 'sub:'+s.id;
  const flash = dayTreeFlashKey===key ? ' flashtoggle' : '';
  return `
    <div class="daytreeleafrow${flash}">
      <button class="daytreeleaf" onclick="toggleDayTreeSub('${t.id}','${s.id}','${dateStr}')">${planned ? '<span class="daytreemark">✓</span> ' : ''}${escapeHtml(s.text)}</button>
      <button class="daytreeaddbtn ${planned?'added':''}" onclick="toggleDayTreeSub('${t.id}','${s.id}','${dateStr}')">${planned?'Added':'+ Add'}</button>
    </div>`;
}

// showListDates (Settings → Dev Settings) reuses the same .listdate class
// checklistListRowHtml() uses for a list's created-date — always rendered,
// just hidden by CSS unless that dev toggle is on, same idiom.
function dayTreeChecklistLeafHtml(t, dateStr){
  const planned = (t.plannedDates||[]).includes(dateStr);
  const key = 'cklist:'+t.id;
  const flash = dayTreeFlashKey===key ? ' flashtoggle' : '';
  return `
    <div class="daytreeleafrow${flash}">
      <button class="daytreeleaf" onclick="toggleDayTreeChecklist('${t.id}','${dateStr}')">${planned ? '<span class="daytreemark">✓</span> ' : ''}${escapeHtml(t.title)}<span class="listdate">${fmtDate(t.createdAt)}</span></button>
      <button class="daytreeaddbtn ${planned?'added':''}" onclick="toggleDayTreeChecklist('${t.id}','${dateStr}')">${planned?'Added':'+ Add'}</button>
    </div>`;
}

function renderAddToDayPicker(dateStr){
  if(!dayAddOpen){
    return `<button class="pullbtn dayaddtoggle" onclick="toggleDayAdd()">+ Add an existing task to this day</button>`;
  }
  const taskCatsHtml = standardCategoryEntries().map(([k,v])=>{
    const key = 'cat:'+k;
    const open = dayTreeExpanded.has(key);
    const tasks = dayCandidateTasks(dateStr, k);
    return `
      <div class="daytreenode">
        <button class="daytreelabel daytreecat" onclick="toggleDayTreeNode('${key}')">
          <span class="daytreetriangle">${open?'▾':'▸'}</span>${categoryDotHtml(v, 'dot')}${escapeHtml(v.label)}
        </button>
        ${open ? `<div class="daytreechildren">
          ${tasks.length ? tasks.map(t=>dayTreeTaskHtml(t, dateStr)).join('') : `<div class="empty" style="padding:4px 0;">Nothing eligible here.</div>`}
        </div>` : ''}
      </div>`;
  }).join('');

  const checklistCatsHtml = Object.entries(CATEGORIES).filter(([,v])=>v.type==='checklist').map(([k,v])=>{
    const key = 'cklist:'+k;
    const open = dayTreeExpanded.has(key);
    // A completed list has nothing left to add to a day, same reasoning
    // dayCandidateTasks already applies to standard tasks.
    const lists = checklistLists(k).filter(t=>t.status!=='done');
    return `
      <div class="daytreenode">
        <button class="daytreelabel daytreecat" onclick="toggleDayTreeNode('${key}')">
          <span class="daytreetriangle">${open?'▾':'▸'}</span>${categoryDotHtml(v, 'dot')}${escapeHtml(v.label)}
        </button>
        ${open ? `<div class="daytreechildren">
          ${lists.length ? lists.map(t=>dayTreeChecklistLeafHtml(t, dateStr)).join('') : `<div class="empty" style="padding:4px 0;">No lists here.</div>`}
        </div>` : ''}
      </div>`;
  }).join('');

  return `
    <div class="dayaddpanel">
      <div class="dayaddhead">
        <div class="daylistlabel" style="margin:0;">Add to this day</div>
        <button class="dayaddclose" onclick="toggleDayAdd()" title="Close">×</button>
      </div>
      ${taskCatsHtml}
      <div class="daytreesection">Checklists</div>
      ${checklistCatsHtml}
    </div>
  `;
}

// A step planned onto a day, shown "TASK > STEP" with the step's own
// small square .subcheck — deliberately a different shape from a whole
// task's big .check or a checklist's round .checkcircle, so a step-daily
// reads at a glance as a lighter-weight item than either.
// `nested` is true when this step's parent task is also planned whole
// onto the same day — renderDayDetail groups it directly under the
// parent's own row in that case (see the nestedByParent grouping there),
// so the "TASK > " prefix would be redundant and it gets an indent
// instead. An "orphan" step (parent not itself on this day) stays flat
// with the prefix, same as before, since there's no parent row nearby to
// read it as nested under.
function daySubtaskRowHtml(task, sub, dateStr, nested){
  const nextDate = addDaysToDateStr(dateStr, 1);
  const onTomorrow = (sub.plannedDates||[]).includes(nextDate);
  // Matches the invisible-when-not-draggable spacer taskRowHtml reserves
  // for its own .draghandle, so an orphan step's checkbox lines up under
  // a whole task's — see the .checkwrap.daysub / .draghandle comment in
  // <style>. Skipped when nested: indentation already reads as "under its
  // parent" without also needing to sit on the same checkbox column.
  const draggableMain = sortMode === 'default';
  const spacer = (!nested && draggableMain)
    ? `<span class="draghandle" style="visibility:hidden" aria-hidden="true">⠿</span>`
    : '';
  // Always "TASK > step", nested or not — an orphan step (parent not on
  // this day) and a nested one (parent's own row sitting right above it)
  // used to read differently depending on which day you were looking at,
  // which was the actual complaint: the same step could show as bare
  // "step" on one day and "TASK > step" on another. Nesting still gets
  // its indent (below) as an *additional* cue, it just isn't the only one.
  const label = `<span class="daysubparent">${escapeHtml(task.title)} &gt; </span>${escapeHtml(sub.text)}`;
  return `
  <li class="task ${nested ? 'daysubnested' : ''}">
    <div class="row" onclick="openTaskDetailFromDay('${task.id}')">
      ${spacer}
      <div class="checkwrap daysub" onclick="event.stopPropagation()">
        <div class="subcheck ${sub.done?'done':''}" onclick="toggleSubtask('${task.id}','${sub.id}')"></div>
      </div>
      <div class="title ${sub.done?'done':''}">${label}</div>
      <button class="movetmrw" ${onTomorrow?'disabled':''} onclick="event.stopPropagation(); moveSubtaskToTomorrow('${task.id}','${sub.id}','${dateStr}')" title="${onTomorrow ? 'Already planned for tomorrow' : 'Also plan for tomorrow'}">→</button>
      <button class="dayremove" onclick="event.stopPropagation(); unplanSubtaskFromDay('${task.id}','${sub.id}','${dateStr}')" title="Remove from this day">×</button>
    </div>
  </li>`;
}

function dayChecklistRowHtml(t, dateStr){
  return `
  <li class="task">
    <div class="row" onclick="openChecklistListFromDay('${t.id}','${dateStr}')">
      ${checklistCheckcircleHtml(t)}
      <div class="title ${t.status==='done'?'done':''}">${escapeHtml(t.title)}</div>
      <button class="dayremove" onclick="event.stopPropagation(); unplanTaskFromDay('${t.id}','${dateStr}')" title="Remove from this day">×</button>
    </div>
  </li>`;
}

function renderDayDetail(dateStr){
  const allTasks = standardTasksForDay(dateStr);
  const sorted = applySortMode(allTasks);
  const subItems = subDailyItemsForDay(dateStr);
  const checklistItems = checklistDailyItemsForDay(dateStr);
  const { total, done } = dayItemsSummary(dateStr);
  // What moveIncompleteToTomorrow() actually moves is dayLeafUnits()'s
  // unfinished units — this has to match that exactly (task-with-open-
  // steps doesn't double count itself alongside its steps), or the
  // button's label would promise more than it delivers.
  const unfinishedCount = dayLeafUnits(dateStr).filter(u=>!u.done).length;
  const isPast = dateStr < todayStr();
  const nextDate = addDaysToDateStr(dateStr, 1);
  const headerTag = dayHeaderTag(dateStr);
  // For the prev/next arrows flanking the h2 below — null when this day
  // sits at either end of your logged days (see adjacentDayStr()), which
  // just renders as a disabled arrow rather than wrapping or erroring.
  const prevDayStr = adjacentDayStr(dateStr, -1);
  const nextDayStr = adjacentDayStr(dateStr, 1);

  // Whole tasks and steps share one list — a step planned onto a day is
  // just as much "on today's list" as a whole task is, so there's no
  // separate "Steps" section splitting them apart. Checklists stay their
  // own group below: a whole named list is a different enough kind of
  // thing (opens into its own page, has no due date/priority) that
  // lumping it in with tasks/steps would be more confusing than helpful.
  // Every task shows, including completed ones — completed just render
  // crossed out, so you can see the whole day's shape at a glance.
  //
  // A step whose parent task is *also* planned whole onto this day
  // renders directly under that task's own row (nested, no "TASK > "
  // prefix — see daySubtaskRowHtml) instead of out in the flat list, so
  // the day reads as an actual outline rather than every step floating
  // independently next to its own task. A step whose parent isn't itself
  // on this day (only the step was pulled in) has no row to nest under,
  // so it stays a flat "TASK > step" row same as before.
  const sortedIds = new Set(sorted.map(t=>t.id));
  const nestedSteps = {};
  const orphanSteps = [];
  subItems.forEach(x=>{
    if(sortedIds.has(x.task.id)) (nestedSteps[x.task.id] = nestedSteps[x.task.id] || []).push(x);
    else orphanSteps.push(x);
  });
  const mainCount = sorted.length + subItems.length;
  const mainListHtml = mainCount ? `
    <ul class="tasks">${
      sorted.map(t => taskRowHtml(t, true, true, dateStr) +
        (nestedSteps[t.id] ? nestedSteps[t.id].map(x=>daySubtaskRowHtml(x.task, x.sub, dateStr, true)).join('') : '')
      ).join('') +
      orphanSteps.map(x=>daySubtaskRowHtml(x.task, x.sub, dateStr, false)).join('') +
      dropEndHtml(sorted)
    }</ul>
  ` : '';
  // Only claim "nothing planned" when the day is truly empty across all
  // three kinds of item — a day with only a checklist planned (no tasks,
  // no steps) shouldn't say nothing's planned right above that checklist.
  const emptyMsg = total ? '' : `<div class="empty">Nothing planned for this day yet.</div>`;
  const checklistsBlock = checklistItems.length ? `
    <div class="daylistlabel">Checklists</div>
    <ul class="tasks">${checklistItems.map(t=>dayChecklistRowHtml(t, dateStr)).join('')}</ul>
  ` : '';

  return `
    <div class="stackedpage">
      ${pageTagHtml('closeDay()', dayReturnToCalendar ? 'Calendar' : 'All Days')}
      <div class="daynavrow">
        <button class="navarrow" ${prevDayStr ? `onclick="goToAdjacentDay(-1)"` : 'disabled'} title="Previous day">‹</button>
        <span class="dayhero" oncontextmenu="return handleDayContextMenu(event,'${dateStr}')"><span class="herotext ${headerTag && headerTag.today?'today':''}">${headerTag ? headerTag.text : ''}</span></span>
        <button class="navarrow" ${nextDayStr ? `onclick="goToAdjacentDay(1)"` : 'disabled'} title="Next day">›</button>
      </div>
      <div class="daydetailhead">
        <h2>${dayLabel(dateStr)}</h2>
        <div class="daydetailheadright">
          <div class="dayprogress">${total ? `${done} of ${total} done` : 'Nothing planned yet'}</div>
          ${unfinishedCount>0 && dateStr<=todayStr() ? `<button class="pullbtn" onclick="moveIncompleteToTomorrow('${dateStr}')">Move ${unfinishedCount} incomplete → ${fmtDate(nextDate)}</button>` : ''}
        </div>
      </div>
      ${isPast ? `<div class="lockednote"><span>🔒 This day has passed</span></div>` : ''}
      <div class="quickadd">
        <input type="text" id="dayQuickInput" placeholder="Add a new task for this day…" onkeydown="if(event.key==='Enter') addDayTask('${dateStr}')">
        <select id="dayQuickCategory">
          ${standardCategoryEntries().map(([k,v])=>`<option value="${k}" ${k==='personal'?'selected':''}>${v.label}</option>`).join('')}
        </select>
        <button class="addbtn" onclick="addDayTask('${dateStr}')">+</button>
      </div>
      ${renderAddToDayPicker(dateStr)}
      <div class="sortrow">
        <label class="fieldlabel">SORT</label>
        <select onchange="setSortMode(this.value)">${sortModeOptionsHtml(true)}</select>
      </div>
      ${emptyMsg}
      ${mainListHtml}
      ${checklistsBlock}
    </div>
  `;
}

// ---------- Checklist category type ----------
// A checklist category's "tasks" are named lists (still plain state.tasks
// entries — same id/category/status/createdAt shape as everything else,
// which is what lets the Claude digest, undo, and save/load all keep
// working on them for free) whose subtasks array holds "items" instead of
// steps. Two-level drill-down modeled directly on the Daily tab: an
// overview of all lists in the category, and a single list's own detail
// view — selectedListId plays the same role selectedDay does there.
// Deliberately minimal: no due date, priority, timeframe, or notes: those
// fields still exist on the task object (every task has them) but are
// simply never shown or set for a checklist list, matching the "just a
// name and items" brief.

function renderChecklist(){
  const el = document.getElementById('checklistView');
  // Guards against a stale selectedListId left over from a different
  // checklist category (only one global "currently open list" exists,
  // same as selectedDay) — falls back to the overview rather than
  // showing another category's list under this tab's header.
  if(selectedListId){
    const t = state.tasks.find(t=>t.id===selectedListId);
    if(!t || t.category !== activeTab) selectedListId = null;
  }
  if(checklistPendingOpen){
    el.innerHTML = renderChecklistPending(activeTab);
  } else if(checklistTemplatesOpen){
    el.innerHTML = renderChecklistTemplates(activeTab);
  } else if(selectedListId){
    el.innerHTML = renderChecklistDetail(selectedListId);
  } else {
    el.innerHTML = renderChecklistOverview(activeTab);
  }
}

function checklistLists(categoryId){
  return sortTasks(state.tasks.filter(t=>t.category===categoryId));
}

// A list marked done overrides its items' individual done flags for
// "pending" purposes — once the whole list is checked off complete,
// leftover unchecked items inside it shouldn't keep counting toward (or
// showing up in) the cross-list pending view.
function checklistPendingItems(t){
  if(t.status === 'done') return [];
  return (t.subtasks || []).filter(s=>!s.done);
}

function renderChecklistOverview(categoryId){
  const cat = CATEGORIES[categoryId];
  const lists = checklistLists(categoryId);
  // completingTaskIds keeps a just-completed list visible in its original
  // spot through its own linger-then-collapse (see toggleStatus()/
  // scheduleTaskLeave(), 16-task-crud.js) instead of vanishing (or
  // re-sorting to the bottom) the instant its status flips — same
  // categoryVisibleTasks() does for a standard task row.
  const visible = lists.filter(t => showDone || t.status!=='done' || completingTaskIds.has(t.id));
  const doneCount = lists.filter(t=>t.status==='done').length;
  const pendingTotal = lists.reduce((sum,t)=>sum+checklistPendingItems(t).length, 0);
  const templateCount = (state.checklistTemplates||[]).length;
  return `
    ${pendingTotal ? pageTagHtml(`openChecklistPending('${categoryId}')`, `Pending ${pendingTotal}`, true) : ''}
    <div class="quickadd">
      <input type="text" id="checklistQuickInput" placeholder="Name a new list…"
        onkeydown="if(event.key==='Enter') addChecklistList('${categoryId}')">
      <button class="addbtn" onclick="addChecklistList('${categoryId}')">+</button>
    </div>
    <!-- A plain inline link rather than a second .pagetag.compact —
         .pagetag.compact's own top-right corner spot is already spoken
         for by the Pending tag above (both share the exact same CSS
         position, so a second one there would sit right on top of it —
         see .pagetag.compact's own top:2px rule in <style>). Always
         shown, even at 0 templates, since it's also how you'd discover
         the feature exists in the first place — the empty state inside
         explains where "Save as Template" lives. -->
    <div class="checklisttemplateslink">
      <button onclick="openChecklistTemplates('${categoryId}')">Templates${templateCount ? ` (${templateCount})` : ''}</button>
    </div>
    <ul class="tasks">
      ${visible.length ? visible.map(t=>checklistListRowHtml(t)).join('') : `<div class="empty">${cat ? `No lists in ${escapeHtml(cat.label)} yet.` : 'No lists yet.'} Add one above.</div>`}
    </ul>
    <div class="footer-row"><button onclick="toggleShowDone()">${showDone ? `Hide completed (${doneCount})` : `Show completed (${doneCount})`}</button></div>
  `;
}

// There are always exactly this many peg slots spaced evenly around the
// circle, regardless of item count — a 3-item list only fills the first
// 3 slots and leaves the rest of the ring bare, rather than stretching
// those 3 pegs to fill the whole circle (still true after the switch to
// SVG arc pegs — see pegArcPath()'s own comment further down — this was
// never actually the source of the "still inconsistent size" issue
// reported against the SVG version; each peg's shape is computed once
// at angle 0 and only ever rigidly rotated per slot, which can't change
// its size). This is also the point past which it switches to a smooth
// progress ring instead, since much beyond this many discrete slots
// stops reading as separate pegs. Kept at 12 — a checklist's own item
// count runs higher than a task's subtask count typically does, so it
// keeps a roomier cap than the standard-task threshold in
// subProgressHtml() (06-tabs-render.js), which is a completely separate,
// deliberately lower limit (8) for the unrelated linear .substack bar a
// standard task's own subtasks use — the two were briefly conflated into
// one shared "8" during an earlier pass of this feature; the project
// owner's own follow-up split them back into two independent numbers.
const CHECKLIST_PEG_LIMIT = 12;
const PEG_SLOT_DEG = 360 / CHECKLIST_PEG_LIMIT;
// Both the first peg slot and the progress ring's 0% point start here:
// top-left rather than dead center-top. Kept as a multiple of
// PEG_SLOT_DEG (30°) on purpose — since 90° (the gap between the four
// cardinal directions) is exactly 3 slots, that's what guarantees the
// slots nearest top/right/bottom/left land exactly on those axes
// instead of sitting at an off-angle. -25 (nearer the "25° left of top"
// originally asked for) would have thrown that off.
const PEG_START_DEG = -30;

// At or under the threshold: one fixed-size .peg per item, in list
// order, at slot i's angle — so an item's peg always sits at the same
// slot and never resizes or moves as items are added elsewhere in the
// list, it just adds one more peg at the next slot. Past the threshold,
// a single smooth conic-gradient sweep instead (same start angle, via
// conic-gradient's `from`), since that many discrete slots would read as
// clutter rather than countable pegs.
// SVG, not individually rotated/positioned HTML divs — an earlier version
// used a zero-size ".pegpivot" per peg (position:absolute + rotate) with a
// translateZ(0) hack to force every pivot onto its own GPU-composited
// layer, on the theory that a peg landing on rotate(0deg) — any slot on a
// cardinal axis — could otherwise get treated as an identity transform
// and rendered via the plain layout path instead, snapping to a different
// sub-pixel grid than its genuinely-rotated siblings at non-100% browser
// zoom. That turned out not to be the whole story: browser zoom (unlike
// devicePixelRatio) can scale a page by a non-integer factor, and once
// that scaling makes even nominally "whole-pixel" CSS values (this
// container is an even 34px, its center a whole-number 17px) land on
// fractional device pixels, *every* pivot's layout-vs-compositor path can
// round slightly differently from every other, not just the 0° one —
// each HTML element is still its own independent layout/paint unit
// regardless of how many get a compositing layer. SVG shapes don't have
// that problem: every peg here is part of one <svg>, rendered as a
// single vector rasterization pass, so they scale together identically
// under any zoom level instead of each being its own independently-
// rounded box. Same 34×34 viewBox as .checkcircle-wrap's own pixel size
// (1 viewBox unit == 1 CSS px at rest), rotated per-slot around that same
// center point via SVG's own transform="rotate(angle cx cy)" instead of
// a wrapping pivot element — see pegArcPath() below for the peg's own
// shape (an annular arc, not a flat rect, as of the pass that added it).
// A peg's own outer/inner edges follow the ring's curvature (an annular
// arc segment — straight radial sides, curved top/bottom) instead of a
// flat-topped rectangle, per the explicit ask to have them read as part
// of the circle they sit around rather than free-floating little boxes.
// Computed with real trigonometry (not hand-typed path coordinates) so
// the curve is exact regardless of radius/angle, and centered on angle 0
// (straight up) — the caller rotates the whole path to a slot's real
// angle the same way the old <rect> did, since rotating a shape that's
// already correct at angle 0 is simpler and less error-prone than
// re-deriving each slot's own corner points directly.
// cx/cy: ring center. rInner/rOuter: radius the peg's near/far edge sits
// at. halfWidthDeg: half the peg's own angular width.
function pegArcPath(cx, cy, rInner, rOuter, halfWidthDeg){
  const toXY = (r, deg) => {
    const rad = deg * Math.PI / 180;
    return [cx + r * Math.sin(rad), cy - r * Math.cos(rad)];
  };
  const [ox1, oy1] = toXY(rOuter, -halfWidthDeg);
  const [ox2, oy2] = toXY(rOuter, halfWidthDeg);
  const [ix2, iy2] = toXY(rInner, halfWidthDeg);
  const [ix1, iy1] = toXY(rInner, -halfWidthDeg);
  const r3 = n => Math.round(n * 1000) / 1000;
  return `M ${r3(ox1)} ${r3(oy1)} A ${rOuter} ${rOuter} 0 0 1 ${r3(ox2)} ${r3(oy2)} `
       + `L ${r3(ix2)} ${r3(iy2)} A ${rInner} ${rInner} 0 0 0 ${r3(ix1)} ${r3(iy1)} Z`;
}
// Same radial span the old flat peg used (outer edge 14px out from
// center, inner edge 9px out — a 5px-thick band). Half-width widened
// from 12° to 13.5° at the same 30° slot size (CHECKLIST_PEG_LIMIT back
// at 12) — less padding between adjacent pegs, per the explicit ask,
// while keeping each one easily visible: 13.5° half-width is 27° of
// actual peg out of each 30° slot (90% fill) vs. the old 12°-of-30°
// (80% fill) — a bit fuller, not just carried over unchanged.
const PEG_R_OUTER = 14;
const PEG_R_INNER = 9;
const PEG_HALF_WIDTH_DEG = 13.5;
const PEG_PATH_AT_ZERO = pegArcPath(17, 17, PEG_R_INNER, PEG_R_OUTER, PEG_HALF_WIDTH_DEG);

function checklistProgressHtml(subs){
  if(!subs.length) return '';
  const done = subs.filter(s=>s.done).length;
  const total = subs.length;
  if(total <= CHECKLIST_PEG_LIMIT){
    // Painted in "unfilled first, filled last" order (not slot order) so
    // a filled peg always paints over an unfilled neighbor at their
    // slightly-overlapping corners — SVG has no z-index to lean on here
    // the way each pegpivot's own stacking context used to provide, just
    // plain document order, so the order themselves have to carry it.
    // Angle still comes from the peg's real slot index `i`, not its
    // position in this reordered list, so sorting doesn't move anything.
    const ordered = subs.map((s,i)=>({s,i})).sort((a,b)=>(a.s.done?1:0)-(b.s.done?1:0));
    const pegs = ordered.map(({s,i})=>{
      const angle = PEG_START_DEG + i*PEG_SLOT_DEG;
      return `<path class="peg ${s.done?'filled':''}" d="${PEG_PATH_AT_ZERO}" transform="rotate(${angle} 17 17)"></path>`;
    }).join('');
    return `<svg class="pegring" viewBox="0 0 34 34">${pegs}</svg>`;
  }
  const pct = Math.round(done/total*100);
  return `<div class="progressring" style="background: conic-gradient(from ${PEG_START_DEG}deg, var(--ink) ${pct}%, var(--line) 0)"></div>`;
}

// Shared by the small icon next to each row in the overview and the
// large header atop a list's own detail page (.checklistheader scales
// this same markup up via CSS transform) — one definition means the two
// can never drift out of sync with each other. `subtle` threads straight
// through to checkGuideClass() exactly the way taskRowHtml()/
// renderTaskDetailPage() pass it for a standard task's own .check: true
// from the overview row (several rows on screen at once), false from the
// detail header (the one dominant action on that whole page). A
// checklist "list" is a plain task under the hood (see this file's own
// top comment), so checkGuideClass()/checkCelebrateClass()
// (08-render-core.js) work here completely unchanged — they only ever
// read t.status/t.id/subs, nothing task-shaped-specifically.
function checklistCheckcircleHtml(t, subtle){
  const subs = t.subtasks || [];
  const done = subs.filter(s=>s.done).length;
  const total = subs.length;
  return `<div class="checkcircle-wrap" title="${total ? `${done}/${total} items` : ''}">
    ${checklistProgressHtml(subs)}
    <div class="checkcircle ${t.status==='done'?'done':''}${checkGuideClass(t, subs, subtle)}${checkCelebrateClass(t)}" onclick="event.stopPropagation(); toggleStatus('${t.id}')"></div>
  </div>`;
}

function checklistListRowHtml(t){
  return `
  <li class="task" data-task-id="${t.id}" onclick="checklistRowTap(event,'${t.id}')"
    oncontextmenu="return handleChecklistContextMenu(event,'${t.id}')"
    ontouchstart="checklistPressStart(event,'${t.id}')" ontouchmove="checklistPressMove(event)" ontouchend="checklistPressEnd()" ontouchcancel="checklistPressEnd()"
    onmousedown="checklistPressStart(event,'${t.id}')" onmouseup="checklistPressEnd()" onmouseleave="checklistPressEnd()">
    <div class="row">
      ${checklistCheckcircleHtml(t, true)}
      <div class="title ${t.status==='done'?'done':''}">${escapeHtml(t.title)}${t.sharedImport ? ' <span class="badge shared">Shared</span>' : ''}<span class="listdate">${fmtDate(t.createdAt)}</span></div>
    </div>
  </li>`;
}

// ---------- a checklist list's own right-click/long-press menu ----------
// Mirrors the standard task menu (taskContextMenuHtml() etc., in
// 08-render-core.js) — same shared #ctxMenu, same ctxMenuTaskId/
// ctxMenuAction/closeCtxMenu plumbing, since a checklist "list" is a
// plain task object under the hood (see this file's own top comment).
// The item set itself is trimmed to what actually applies here: no
// "Toggle urgent"/"Add to today" (neither is ever surfaced anywhere in
// the checklist UI, so there'd be nothing on screen to confirm the
// change), and no "Edit details" (a plain click already opens this
// list's own — and only — detail view, so a menu entry for the same
// destination would just be a slower duplicate of what tapping the row
// already does, unlike a standard task's menu, where "Edit details"
// genuinely reaches a different view than a plain tap's inline preview).
function checklistContextMenuHtml(t){
  return `
    <button onclick="ctxMenuAction(()=>toggleStatus('${t.id}'))">${t.status==='done' ? 'Reopen' : 'Mark complete'}</button>
    <button onclick="ctxMenuCopyTitle('${t.id}')">Copy title</button>
    <div class="ctxmenu-sep"></div>
    <button class="ctxmenu-danger" onclick="ctxMenuAction(()=>deleteChecklistList('${t.id}'))">Delete</button>
  `;
}
function renderChecklistContextMenu(taskId, x, y){
  const t = state.tasks.find(x2=>x2.id===taskId);
  if(!t) return;
  ctxMenuTaskId = taskId;
  const menu = document.getElementById('ctxMenu');
  menu.innerHTML = checklistContextMenuHtml(t);
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  menu.classList.add('open');
  applyDevElementNames();
  requestAnimationFrame(() => {
    const r = menu.getBoundingClientRect();
    if(r.right > window.innerWidth) menu.style.left = Math.max(8, window.innerWidth - r.width - 8) + 'px';
    if(r.bottom > window.innerHeight) menu.style.top = Math.max(8, window.innerHeight - r.height - 8) + 'px';
  });
}
// Desktop-only, same reasoning as handleTaskContextMenu() (08-render-core.js).
function handleChecklistContextMenu(e, taskId){
  if(mobileUiActive()) return true;
  renderChecklistContextMenu(taskId, e.clientX, e.clientY);
  return false;
}
// Long-press-to-menu on mobile — a smaller, self-contained twin of
// taskPressStart()/taskPressMove()/taskPressEnd() (08-render-core.js)
// rather than reusing those directly: that trio branches on
// taskLongPressMode ('split' opens the settings sheet, 'detail' opens a
// row-anchored menu) — a choice about how a *standard task's* plain tap
// should behave that has no checklist equivalent, since a checklist row
// only ever has the one tap destination (openChecklistList()) regardless
// of that setting. Always on whenever mobileUiActive(), reusing the same
// timing constants (TASK_LONG_PRESS_MS/_TOLERANCE_PX) so a checklist
// list and a standard task feel identical to hold down, just simpler
// underneath since there's only one thing a long-press here could mean.
let checklistPressTimer = null;
let checklistPressRow = null;
let checklistPressStartX = 0, checklistPressStartY = 0;
let checklistLongPressFired = false;
function checklistPressStart(e, taskId){
  if(!mobileUiActive()) return;
  checklistLongPressFired = false;
  const pt = e.touches ? e.touches[0] : e;
  checklistPressStartX = pt.clientX;
  checklistPressStartY = pt.clientY;
  checklistPressRow = e.currentTarget;
  checklistPressRow.classList.add('pressing');
  clearTimeout(checklistPressTimer);
  checklistPressTimer = setTimeout(() => {
    checklistPressTimer = null;
    checklistLongPressFired = true;
    if(checklistPressRow) checklistPressRow.classList.remove('pressing');
    const r = checklistPressRow.getBoundingClientRect();
    renderChecklistContextMenu(taskId, r.left, r.bottom + 6);
  }, TASK_LONG_PRESS_MS);
}
function checklistPressMove(e){
  if(!checklistPressTimer) return;
  const pt = e.touches ? e.touches[0] : e;
  const dx = pt.clientX - checklistPressStartX, dy = pt.clientY - checklistPressStartY;
  if(Math.hypot(dx, dy) > TASK_LONG_PRESS_TOLERANCE_PX){
    clearTimeout(checklistPressTimer);
    checklistPressTimer = null;
    if(checklistPressRow) checklistPressRow.classList.remove('pressing');
  }
}
function checklistPressEnd(){
  clearTimeout(checklistPressTimer);

// Swallows the click a touchend fires right after a long-press already

// pattern taskRowTap() (08-render-core.js) uses for the standard row.

// The <Template>: <Name> title on a list linked to a still-existing
// template splits into a fixed, boxed "<Template>:" label (see
// .templatetitleprefix in <style> for the "little bounding box," per the
// explicit ask) plus a plain input for just the editable <Name> half —
// per the explicit ask to stop the whole "<Template>: <Name>" string
// being freely rewritable, which could silently break the naming
// convention (or drift the list away from the template it's actually
// linked to) with a single careless edit. Falls back to the plain,
// fully-editable title field for a list with no template link, or one
// whose title has since been hand-edited away from starting with
// "<Template>: " (nothing stops that at the character level; this only
// renders the split UI when the title still visibly matches).
function checklistTitleFieldHtml(t){
  const tpl = t.templateId ? (state.checklistTemplates||[]).find(tp=>tp.id===t.templateId) : null;
  const prefix = tpl ? `${tpl.name}: ` : null;
  if(prefix && t.title.startsWith(prefix)){
    const suffix = t.title.slice(prefix.length);
    return `
      <div class="templatetitlerow">
        <span class="templatetitleprefix">${escapeHtml(tpl.name)}:</span>
        <input type="text" class="titleedit bigtitle templatetitlesuffix" value="${escapeHtml(suffix)}"
          onblur="updateTemplatedTitle('${t.id}', this.value)"
          onkeydown="if(event.key==='Enter'){ event.preventDefault(); this.blur(); }">
      </div>`;
  }
  return `<input type="text" class="titleedit bigtitle" value="${escapeHtml(t.title)}"
    onblur="updateTitle('${t.id}', this.value)"
    onkeydown="if(event.key==='Enter'){ event.preventDefault(); this.blur(); }">`;
}
// suffixVal empty falls back to "New List" — same reasoning as
// confirmSaveListAsTemplate()/confirmCreateFromTemplate() below: an
// empty <Name> half would otherwise save as "<Template>: " with nothing
// after the colon, which reads as broken rather than intentional.
async function updateTemplatedTitle(id, suffixVal){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  const tpl = t.templateId ? (state.checklistTemplates||[]).find(tp=>tp.id===t.templateId) : null;
  if(!tpl) return updateTitle(id, suffixVal);
  const suffix = suffixVal.trim() || 'New List';
  await updateTitle(id, `${tpl.name}: ${suffix}`);
}

// Flat "what's still left" across every list in the category — the
// explicit ask was a way to see all pending items at once without
// opening each list one by one. Grouped by list (not a single flat pile)
// so an item still has context for which list it's from.
function renderChecklistPending(categoryId){
  const cat = CATEGORIES[categoryId];
  const groups = checklistLists(categoryId)
    .map(t => ({ list: t, pending: checklistPendingItems(t) }))
    .filter(g => g.pending.length);
  return `
    <div class="stackedpage">
      ${pageTagHtml('closeChecklistPending()', cat ? cat.label : 'Lists')}
      <div class="daylistlabel">All pending items</div>
      ${groups.length ? groups.map(g => `
        <div class="pendinggroup">
          <div class="sublabel">${escapeHtml(g.list.title)}</div>
          ${g.pending.map(s=>`
            <div class="subrow">
              <div class="subcheck circle" onclick="toggleSubtask('${g.list.id}','${s.id}')"></div>
              <div class="subtext" onclick="openChecklistList('${g.list.id}')">${escapeHtml(s.text)}</div>
            </div>`).join('')}
        </div>`).join('') : `<div class="empty">Nothing pending — everything's checked off.</div>`}
    </div>
  `;
}

// returnDay is optional — only openChecklistListFromDay passes it. Every
// other call site (the normal overview row click) omits it, which resets
// checklistReturnDay to null even if some earlier visit had left it set,
// so "opened from Daily" can never leak into an unrelated later open.
function openChecklistList(id, returnDay){
  // renderChecklist() checks checklistPendingOpen before selectedListId
  // (see its own comment), so without clearing this here, opening a list
  // from the pending view — clicking an item's own text, which calls
  // this — set selectedListId but kept rendering the pending view right
  // over it: clicking looked like it did nothing at all, with no visible
  // sign you'd actually left the pending view.
  checklistPendingOpen = false;
  checklistReturnDay = returnDay || null;
  selectedListId = id;
  render();
}
function closeChecklistList(){
  selectedListId = null;
  if(checklistReturnDay){
    const d = checklistReturnDay;
    checklistReturnDay = null;
    selectedDay = d;
    switchTab('daily');
    return;
  }
  render();
}
function openChecklistPending(categoryId){ checklistPendingOpen = true; render(); }
function closeChecklistPending(){ checklistPendingOpen = false; render(); }

async function addChecklistList(categoryId){
  const input = document.getElementById('checklistQuickInput');
  const title = input.value.trim();
  if(!title) return;
  pushUndo(`Added list "${title}"`);
  state.tasks.unshift({
    id: newId('task'), title, category: categoryId, status:'open', urgent:false, dueDate:'',
    notes:'', subtasks:[], plannedDates:[], timeframe:'', priority:0, completedAt:'', createdAt: todayStr()
  });
  render();
  // render() just rebuilt #checklistQuickInput from scratch (same
  // reason addSubtask() needs focusVisibleSubadd()) — refocus it so
  // adding several lists in a row doesn't drop focus after each Enter.

}

async function deleteChecklistList(id){
  const idx = state.tasks.findIndex(t=>t.id===id);
  if(idx === -1) return;
  const t = state.tasks[idx];
  pushUndo(`Deleted list "${t.title}"`);
  state.tasks.splice(idx, 1);
  moveTaskToTrash(t);
  selectedListId = null;
  render();
  queueSave();
}

// ---------- Checklist templates ----------
// A template (state.checklistTemplates: {id, name, items:[text,...],
// createdAt}) is born from a real list, not authored blank — there's no
// separate "new template" editor. "Save as Template" (renderChecklistDetail(),
// its own comment) copies the list's current items (text only — none of
// their done/date state, since a template is always a fresh starting
// point) into a new entry, and links the list back to it via t.templateId
// so the SAME list offers "Update Template" from then on instead of
// spawning a fresh duplicate every time it's saved again.
function openChecklistTemplates(categoryId){
  checklistTemplatesOpen = true;
  checklistTemplateCreateId = null;
  render();
}
function closeChecklistTemplates(){
  checklistTemplatesOpen = false;
  checklistTemplateCreateId = null;
  render();
}
// Expands an inline naming form in the list's own footer (checklistSaveTemplateTaskId
// — see renderChecklistDetail()'s own comment) rather than saving
// straight off the list's current title, per the explicit ask: without
// this, the list you actually built the template from kept its plain
// original title forever, reading as some kind of permanent "master"
// list rather than an ordinary instance — indistinguishable, at a
// glance in the overview, from a mistake or a leftover. Asking for both
// names up front and renaming *this* list to "<Template>: <Name>" in
// the same action is what keeps every list you ever see in the overview
// in the same "<Template>: <Name>" shape once it's linked to a template,
// with no special-cased exception for the original.
function startSaveListAsTemplate(taskId){
  checklistSaveTemplateTaskId = taskId;
  render();
  document.getElementById('templateSaveNameInput')?.focus();
}
function cancelSaveListAsTemplate(){
  checklistSaveTemplateTaskId = null;
  render();
}
async function confirmSaveListAsTemplate(taskId){
  const t = state.tasks.find(t=>t.id===taskId);
  if(!t) return;
  const nameInput = document.getElementById('templateSaveNameInput');
  const specificInput = document.getElementById('templateSaveSpecificInput');
  const templateName = (nameInput ? nameInput.value.trim() : '') || t.title;
  const specific = (specificInput ? specificInput.value.trim() : '') || 'New List';
  pushUndo(`Saved "${templateName}" as a template`);
  if(!Array.isArray(state.checklistTemplates)) state.checklistTemplates = [];
  const tpl = { id: newId('tpl'), name: templateName, items: (t.subtasks||[]).map(s=>s.text), createdAt: todayStr() };
  state.checklistTemplates.push(tpl);
  t.templateId = tpl.id;
  t.title = `${templateName}: ${specific}`;
  checklistSaveTemplateTaskId = null;
  render();
  queueSave();
}
async function updateTemplateFromList(taskId){
  const t = state.tasks.find(t=>t.id===taskId);
  if(!t || !t.templateId) return;
  const tpl = (state.checklistTemplates||[]).find(tp=>tp.id===t.templateId);
  if(!tpl) return;
  pushUndo(`Updated template "${tpl.name}" from "${t.title}"`);
  tpl.items = (t.subtasks||[]).map(s=>s.text);
  render();
  queueSave();
}
// The one footer control that changes shape three ways: the inline
// "Save as Template" naming form while checklistSaveTemplateTaskId
// points at this list, a disabled "Update Template" once its linked
// template's items already match its own (nothing to push), or an
// enabled one otherwise. linkedTemplate guards against a stale
// t.templateId pointing at a template that's since been deleted —
// falls back to "Save as Template" (which re-links it to a fresh one)
// rather than offering "Update" on something that no longer exists.
function checklistTemplateFooterHtml(t){
  if(checklistSaveTemplateTaskId === t.id){
    return `
      <div class="templatesaveform">
        <label class="templatesaveformlabel">Template name</label>
        <input type="text" id="templateSaveNameInput" value="${escapeHtml(t.title)}">
        <label class="templatesaveformlabel">This list's own name <span class="templatesaveformhint">e.g. "Packing List: Madrid Trip"</span></label>
        <input type="text" id="templateSaveSpecificInput" placeholder="New List">
        <div class="templatesaveformactions">
          <button class="templatecreateconfirm" onclick="confirmSaveListAsTemplate('${t.id}')">Save</button>
          <button class="templatecreatecancel" onclick="cancelSaveListAsTemplate()">Cancel</button>
        </div>
      </div>`;
  }
  const linkedTemplate = t.templateId ? (state.checklistTemplates||[]).find(tpl=>tpl.id===t.templateId) : null;
  if(linkedTemplate){
    const itemsChanged = JSON.stringify((t.subtasks||[]).map(s=>s.text)) !== JSON.stringify(linkedTemplate.items);
    return `<button class="templatesavebtn" ${itemsChanged?'':'disabled'} onclick="updateTemplateFromList('${t.id}')"
      title="${itemsChanged ? `Overwrite &quot;${escapeHtml(linkedTemplate.name)}&quot; with this list's current items` : 'No changes to update'}">Update Template</button>`;
  }
  return `<button class="templatesavebtn" onclick="startSaveListAsTemplate('${t.id}')" title="Save this list's items as a reusable template">Save as Template</button>`;
}
async function deleteChecklistTemplate(id){
  const idx = (state.checklistTemplates||[]).findIndex(tp=>tp.id===id);

  if(checklistTemplateCreateId === id) checklistTemplateCreateId = null;

  queueSave();
}

// Builds "<Template Name>: <specific>" per the explicit ask (the grayed
// prefix shown alongside the input, see .templatenameprefix in <style>,

// never drift apart since neither is hand-typed twice). Opens the new

    id: newId('task'), title, category: categoryId, status:'open', urgent:false, dueDate:'',
