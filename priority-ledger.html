function startEditSubtask(el, taskId, subId){
  const t = state.tasks.find(t=>t.id===taskId);
  const s = t && (t.subtasks||[]).find(s=>s.id===subId);
  if(!s) return;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'subedit';
  input.value = s.text;
  el.replaceWith(input);
  input.focus();
  input.select();
  let committed = false;
  const commit = async () => {
    if(committed) return;
    committed = true;
    const val = input.value.trim();
    if(val && val !== s.text){
      pushUndo(`Renamed step to "${val}"`);
      s.text = val;
      queueSave();
    }
    render();
    reopen(taskId);
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); input.blur(); } });
}

// Same swap-in-a-text-input trick as startEditSubtask(), but the typed
// value goes through parseNaturalDate() rather than being saved as-is.
// An empty input clears the date; a non-empty value that fails to parse
// just reverts to whatever was there before — silently guessing wrong
// would be worse than making the user retype it.
function startEditSubtaskDate(el, taskId, subId){
  const t = state.tasks.find(t=>t.id===taskId);
  const s = t && (t.subtasks||[]).find(s=>s.id===subId);
  if(!s) return;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'subdateedit';
  input.value = s.dueDate ? fmtDateShort(s.dueDate) : '';
  input.placeholder = 'today, tmrw, 9/1, tue…';
  el.replaceWith(input);
  input.focus();
  input.select();
  let committed = false;
  const commit = async () => {
    if(committed) return;
    committed = true;
    const raw = input.value.trim();
    if(!raw){
      if(s.dueDate) await updateSubtaskDueDate(taskId, subId, '');
      else { render(); reopen(taskId); }
      return;
    }
    const parsed = parseNaturalDate(raw);
    if(parsed) await updateSubtaskDueDate(taskId, subId, parsed);
    else { render(); reopen(taskId); } // unparseable — revert, don't save
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); input.blur(); } });
}

// Same auto-plan-onto-its-due-day behavior as updateDueDate — see the

  pushUndo(dueDate ? `Dated step "${s.text}"` : `Cleared date for step "${s.text}"`);

      await ensureDay(dueDate);
    }
  }
  render();
  reopen(taskId);
  queueSave();
}

// Completing a task stamps completedAt; reopening it clears that stamp
// entirely rather than keeping a history of past completions — the undo
// stack is already this app's history mechanism for "what did this used
// to be," so a second, per-field log would just be redundant bookkeeping.
async function toggleStatus(id){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  const willBeDone = t.status !== 'done';
  pushUndo(willBeDone ? `Completed "${t.title}"` : `Reopened "${t.title}"`);
  t.status = willBeDone ? 'done' : 'open';
  t.completedAt = willBeDone ? todayStr() : '';

// Setting a due date within isDueWithinDays' 3-day/overdue window also
// plans the task onto that due date's daily — same window the "Add to
// this day" tree already uses to decide what's eligible to pull in, just
// applied automatically instead of waiting for a manual tree add.
// ensureDay() creates that day if it doesn't exist yet. One-way, same as
// updateTimeframe's "today" plan: pushing the due date back out past the
// window later doesn't retroactively unplan it.
async function updateDueDate(id, val){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  if(val === t.dueDate) return;
  pushUndo(`Changed due date for "${t.title}"`);
  t.dueDate = val;
  if(val && isDueWithinDays(val, 3)){
    if(!t.plannedDates) t.plannedDates = [];
    if(!t.plannedDates.includes(val)){
      t.plannedDates.push(val);
      await ensureDay(val);
    }
  }
  render();
  reopen(id);
  queueSave();
}

// render() rebuilds the relevant view's whole innerHTML on every
// mutation, which destroys and recreates the "add a step/item" input
// rather than just clearing it in place — so the freshly-typed-into
// input loses focus after every single Enter unless something
// explicitly refocuses whichever new .subadd render() just created.
// Scoped to the currently visible one (offsetParent is null for a
// display:none element) since a hidden task's own .subadd can still be
// in the DOM even when it's not the one the user was just typing into.
function focusVisibleSubadd(){
  for(const el of document.querySelectorAll('.subadd')){
    if(el.offsetParent !== null){ el.focus(); return; }
  }
}

function toggleAuthMode(){

  document.getElementById('authSubmitBtn').textContent = authMode === 'signin' ? 'Sign In' : 'Create Account';
  document.getElementById('authModeToggle').textContent =
    authMode === 'signin' ? 'Need an account? Create one' : 'Already have an account? Sign in';
  document.getElementById('authError').textContent = '';
}

async function submitAuth(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const errEl = document.getElementById('authError');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'Enter an email and password.'; return; }
  const endpoint = authMode === 'signin'
    ? `${SUPABASE_URL}/auth/v1/token?grant_type=password`
    : `${SUPABASE_URL}/auth/v1/signup`;
  try{
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if(!res.ok){ errEl.textContent = data.error_description || data.msg || 'Something went wrong.'; return; }
    if(!data.access_token){
      errEl.textContent = 'Check your email to confirm your account, then sign in.';
      return;
    }
    saveSession({
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: Date.now() + data.expires_in * 1000,
      user_id: data.user.id,
      email: data.user.email
    });
    await enterApp();
  }catch(e){
    errEl.textContent = 'Network error — try again.';
  }
}

function signOut(){
  saveSession(null);

async function enterApp(){
  // Undo history is scoped to one login session — it should never let you
  // undo into a different account's data, or across a page reload.
  undoStack = [];
  redoStack = [];
  expandedTaskIds = new Set();
  claudeView = null;
  selectedListId = null;
  checklistPendingOpen = false;
  dailyCalendarOpen = false;
  dayReturnToCalendar = false;
  document.getElementById('authShell').style.display = 'none';
  document.getElementById('appShell').style.display = '';
  const signOutRow = document.getElementById('signOutRow');
  if(signOutRow){
    signOutRow.style.display = (window.storage || !session) ? 'none' : '';
    document.getElementById('authEmailLabel').textContent = session ? session.email : '';
  }
  const refreshBtn = document.getElementById('refreshBtn');
  if(refreshBtn) refreshBtn.style.display = (localOnlyMode || window.storage) ? 'none' : '';
  await loadState();
  // Restore whichever tab was active before the last reload/sign-in, rather
  // than always landing on "All" — visibleTabs() guards against a stale id
  // (a deleted category, or a tab left over from a different account on
  // this device) by falling back to whatever activeTab already is ('all').
  const lastTab = localStorage.getItem('ledger-last-tab');
  if(lastTab && visibleTabs().includes(lastTab)) activeTab = lastTab;
  applyTheme();
  applyDevSettings();
  render();
  appEntered = true;
  startAutoRefresh();
  // A `?claude=1` (or `?claude=full`) URL lets an agent (e.g. the Claude
  // Chrome extension) navigate straight to the plain-text view instead of
  // clicking through Settings, as long as it's using a browser session
  // that's already signed in here.
  const claudeParam = new URLSearchParams(location.search).get('claude');
  if(claudeParam) openClaudeView(claudeParam);
}

// ---------- Calendar view ----------
// A month grid over the exact same state.days/plannedDates data the
// Daily tab lists day-by-day. Nothing here owns or duplicates any data —
// every number on the grid comes straight from dayItemsSummary(), the
// same function Daily's own day-list/day-detail already use, so the two
// views can never disagree about what's on a given day.
//
// Two entry points share this same grid markup (see calendarBodyHtml()):
//   - renderDailyCalendar() — a compact "Calendar" tag on Daily's own day
//     list (see renderDayList() in 11-daily-core.js) opens this. Deliberately
//     NOT wrapped in .stackedpage, and its own tag back to the day list is
//     compact too (a "Daily" tag, same component as "Calendar"/"Pending") —
//     the day list and the calendar are two peer views of the one Daily
//     tab, not a page and a drilldown on top of it, so neither should read
//     as "stacked over" the other. This is the normal way anyone reaches a
//     calendar view.
//   - renderCalendar() — an optional 'calendar' category type
//     (isCalendarCategory() in 01-categories-theme.js), gated behind the
//     calendarTabTypeEnabled dev setting (see devSettingsFieldsHtml() in
//     01-categories-theme.js). Kept working rather than deleted since it
//     was already-functional code, just no longer the primary path.

// Which month is currently browsed — transient UI state, not persisted
// (same idiom as expandedMonths), so it always starts back on
// the current month on a fresh load. Deliberately NOT reset when the
// calendar view closes: reopening it (either entry point) should still
// show whatever month you were last looking at.
let calendarViewMonth = null;

function calendarMonth(){
  if(!calendarViewMonth) calendarViewMonth = monthKey(todayStr());
  return calendarViewMonth;
}

function shiftMonthKey(key, n){
  const [y, m] = key.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

// Re-renders whichever host is currently showing a calendar — at most one
// of the two is ever active at once (dailyCalendarOpen vs. the active tab
// being a calendar category), so checking dailyCalendarOpen first and
// falling back to the category-tab renderer covers both without the nav
// buttons needing to know which one opened them.
function rerenderCalendarHost(){
  if(dailyCalendarOpen) renderDaily();
  else renderCalendar();
}

function calendarShiftMonth(delta){
  calendarViewMonth = shiftMonthKey(calendarMonth(), delta);
  rerenderCalendarHost();
}

function calendarJumpToday(){
  calendarViewMonth = monthKey(todayStr());
  rerenderCalendarHost();
}

// One cell per calendar day in the visible month, padded with blank
// leading/trailing cells so the grid always fills complete weeks (a
// ragged final row reads as a bug, not a design choice). Every day's
// total/done comes from dayItemsSummary() regardless of whether that
// date happens to be in state.days yet — a date with nothing planned
// just comes back {total:0, done:0}. `exists` is tracked separately
// (state.days.includes(dateStr)) specifically so an already-logged-but-
// empty day can still be told apart from one that's never been touched —
// clicking either currently creates the day via ensureDay() (see
// openCalendarDay() below), which was the exact ambiguity that made
// clicking around "just to check" feel like it was cluttering the Daily
// list by accident.
function calendarMonthCells(monthKeyStr){
  const [y, m] = monthKeyStr.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const startWeekday = new Date(y, m - 1, 1).getDay();
  const today = todayStr();
  // dayCategoryIds() is only worth computing when the active
  // calendarCellStyle actually shows category chips — the default
  // ('ratio') never reads `cats`, so there's no reason to pay for it on
  // every cell for every real user who hasn't opted into the dev variant.
  const needsCats = (state.devSettings.calendarCellStyle || 'ratio') !== 'ratio';
  const cells = [];
  for(let i = 0; i < startWeekday; i++) cells.push({ blank: true });
  for(let d = 1; d <= daysInMonth; d++){
    const dateStr = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const { total, done } = dayItemsSummary(dateStr);
    cells.push({ blank: false, dateStr, dayNum: d, isToday: dateStr === today, exists: state.days.includes(dateStr), total, done, cats: needsCats ? dayCategoryIds(dateStr) : [] });
  }
  while(cells.length % 7 !== 0) cells.push({ blank: true });
  return cells;
}

function calendarMonthSummary(monthKeyStr){
  const [y, m] = monthKeyStr.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  let total = 0, done = 0;
  for(let d = 1; d <= daysInMonth; d++){
    const dateStr = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const s = dayItemsSummary(dateStr);
    total += s.total; done += s.done;
  }
  return { total, done };
}

const CALENDAR_WEEKDAY_LABELS = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

// Small category chips for the calendar's dev-only calendarCellStyle
// variants — 'dots-top' (plain color swatches) or 'icons-below' (colored
// glyphs, the same CATEGORY_ICON_GLYPHS every other category marker in
// the app uses). Capped at CALENDAR_CELL_CAT_CAP with a "+N" overflow
// chip rather than wrapping unbounded — a calendar cell is a fixed
// aspect-ratio:1 box (see .calcell in <style>), so more chips than fit
// would spill past the cell's own edges on a narrow (phone-width) card
// instead of growing it; .calcell's own overflow:hidden is the last-
// resort backstop if this cap is ever raised too far.
const CALENDAR_CELL_CAT_CAP = 3;
function calendarCatChipsHtml(cats, iconMode){
  if(!cats.length) return '';
  const shown = cats.slice(0, CALENDAR_CELL_CAT_CAP);
  const overflow = cats.length - shown.length;
  const chips = shown.map(c => iconMode
    ? `<span class="calcatchip icon" style="color:${c.hex}">${CATEGORY_ICON_GLYPHS[c.icon] || CATEGORY_ICON_GLYPHS.dot}</span>`
    : `<span class="calcatchip dot" style="background:${c.hex}"></span>`
  ).join('');
  const overflowHtml = overflow > 0 ? `<span class="calcatchip more">+${overflow}</span>` : '';
  return `<span class="calcatchips">${chips}${overflowHtml}</span>`;
}

// The nav row + summary + grid — everything both hosts share. Neither
// host's own tag(s) live in here, since the label/action differs per host
// (a compact "Today" shortcut for the category-tab overview vs. a compact
// "Daily" tag back to the day list for the normal, Daily-embedded path).
function calendarBodyHtml(monthKeyStr){
  const cells = calendarMonthCells(monthKeyStr);
  const summary = calendarMonthSummary(monthKeyStr);
  const cellStyle = state.devSettings.calendarCellStyle || 'ratio';
  return `
    <div class="calnav">
      <button class="navarrow" onclick="calendarShiftMonth(-1)" title="Previous month">‹</button>
      <button class="calmonthlabel" onclick="calendarJumpToday()" title="Jump to the current month">${monthLabel(monthKeyStr)}</button>
      <button class="navarrow" onclick="calendarShiftMonth(1)" title="Next month">›</button>
    </div>
    <div class="calsummary">${summary.total ? `${summary.done} of ${summary.total} done this month` : 'Nothing planned this month yet'}</div>
    <div class="calweekdays">${CALENDAR_WEEKDAY_LABELS.map(d => `<span>${d}</span>`).join('')}</div>
    <div class="calgrid">
      ${cells.map(c => c.blank
        ? `<div class="calcell calblank"></div>`
        : `<button class="calcell ${c.isToday ? 'today' : ''} ${c.exists ? 'exists' : ''}" onclick="openCalendarDay('${c.dateStr}')" title="${c.exists ? 'This day is already logged' : 'Not logged yet'}">
             ${cellStyle==='dots-top' ? calendarCatChipsHtml(c.cats, false) : ''}
             <span class="caldatenum">${c.dayNum}</span>
             ${c.total ? `<span class="calratio">${c.done}/${c.total}</span>` : (c.exists ? `<span class="calratio calexistsdot">·</span>` : '')}
             ${cellStyle==='icons-below' ? calendarCatChipsHtml(c.cats, true) : ''}
           </button>`
      ).join('')}
    </div>
  `;
}

// Reached only when the (dev-only) 'calendar' category type is enabled
// and a tab of that type exists — see toggleDevSetting('calendarTabTypeEnabled', ...)
// in the Dev Settings section. Not the normal path any more (that's
// renderDailyCalendar() below) but kept working since the rendering code
// underneath (calendarBodyHtml() etc.) is the same either way.
function renderCalendar(){
  const el = document.getElementById('calendarView');
  const todayOpen = tabOpenCount('daily');
  // A compact page tag, same component the checklist overview's "Pending"
  // trigger uses — matched purely by sharing the .pagetag.compact class,
  // so it automatically picks up whatever dev pendingTagStyle/
  // pendingTagColor is set, no calendar-specific wiring needed.
  el.innerHTML = `
    ${pageTagHtml(`openCalendarDay('${todayStr()}')`, todayOpen > 0 ? `Today · ${todayOpen}` : 'Today', true)}
    ${calendarBodyHtml(calendarMonth())}
  `;
}

// The normal way to reach a calendar view — a compact "Calendar" tag on
// Daily's own day list (renderDayList() in 11-daily-core.js), mirroring
// the checklist overview's "Pending" trigger. Its own tag back to the day
// list is compact too (no .stackedpage) — see the file-header comment
// above for why: the day list and this are peer views of the same Daily
// tab, so both link to each other the same small way, rather than one
// treating the other as a "back" destination out of a drilldown.
function renderDailyCalendar(){
  return `
    ${pageTagHtml('closeDailyCalendar()', 'Daily', true)}
    ${calendarBodyHtml(calendarMonth())}
  `;
}

function openDailyCalendar(){
  dailyCalendarOpen = true;
  renderDaily();
}
function closeDailyCalendar(){
  dailyCalendarOpen = false;
  renderDaily();
}

// Clicking any date — whether or not it already has a state.days entry —
// jumps straight into that day's own detail page, same page Daily's own
// day list opens. Mirrors addDay()/addDayByText()'s "only pushUndo if
// this actually creates a new day" rule: ensureDay() itself is a no-op
// (and ends up not calling queueSave()) for a date already in state.days,
// so tracking an undo step for that case would record a change that
// never happened. Always closes dailyCalendarOpen (harmless if it was
// already false, e.g. reached via the category-tab path instead) and
// switches to 'daily' — both hosts land on the exact same day-detail
// page this way, which is what "opens up the Page for the Daily" asked
// for either way you got here. openDay(dateStr, true) marks the day as
// reached from the calendar (see dayReturnToCalendar in
// 02-storage-state.js) so its own back tag — and Esc — return to the
// calendar instead of the plain day list.
async function openCalendarDay(dateStr){
  if(!state.days.includes(dateStr)) pushUndo('Added a day');
  await ensureDay(dateStr);
  dailyCalendarOpen = false;
  switchTab('daily');
  openDay(dateStr, true);
}
// Esc: close whatever's most local first — a Settings popover (a
// category's color/icon picker incl. its own custom-wheel sub-view, UI
// Colors, Desk & Ledger, or a theme swatch's wheel — see
// closeAllSettingsPopovers() in 09-settings.js) beats the Settings panel
// itself beats a task's expanded detail beats an open day (closeDay(),
// which returns to the calendar instead of the plain day list when the
// day was reached that way — see dayReturnToCalendar in
// 02-storage-state.js) beats the calendar view itself, and only falls
// back to jumping to the All tab if none of those was open. Enter does the same one
// thing Esc does for a popover specifically (closes it) — checked before
// the inField guard below, since the wheel's own hex field is itself a
// text input and needs Enter to reach here too; its own onkeydown
// already commits the color first (no stopPropagation), so by the time
// this runs the popover is just along for the ride, closing on top of
// that. Cmd/Ctrl+Z / Shift+Z (or Ctrl+Y) drive undo/redo, but only when
// focus isn't in a text field — typing needs its own native undo, not
// this app's content-level one.
document.addEventListener('keydown', (e) => {
  const appShell = document.getElementById('appShell');
  if(!appShell || appShell.style.display === 'none') return;

  const popoverOpen = openCategoryPickerId || uiColorPickerOpen || deskPaperPickerOpen || themeColorWheelKey || locationEditorOpenId;

  if(e.key === 'Escape' || e.key === 'Enter'){
    if(popoverOpen){ closeAllSettingsPopovers(); render(); return; }
    if(e.key !== 'Escape') return; // Enter has nothing else to do app-wide
    // Mobile UI Lab overlays (see 01-categories-theme.js/16-task-crud.js) —
    // both float above literally everything else including Settings, so
    // they're checked before any of it.
    if(fabAddOpen){ closeFabAdd(); return; }
    if(taskSettingsOpenId){ closeTaskSettingsSheet(); return; }
    if(quickAddOpen){ toggleQuickAddSheet(false); return; }
    if(claudeView){ closeClaudeView(); return; }
    if(settingsOpen){ toggleSettings(); return; }
    if(checklistPendingOpen){ closeChecklistPending(); return; }
    if(selectedListId){ closeChecklistList(); return; }
    if(taskDetailId){ closeTaskDetail(); return; }
    if(selectedDay){ closeDay(); return; }
    if(dailyCalendarOpen){ closeDailyCalendar(); return; }
    const openExpand = document.querySelector('.expand.open');
    if(openExpand){
      expandedTaskIds.delete(openExpand.id.replace('exp-', ''));
      openExpand.classList.remove('open');
      return;
    }
    if(activeTab !== 'all'){ switchTab('all'); }
    return;
  }

  const target = document.activeElement;
  const inField = target && ['INPUT','TEXTAREA','SELECT'].includes(target.tagName);
  if(inField) return;

  // Left/right steps to the adjacent logged day, mirroring the .navarrow
  // pair in .daynavrow — gated on that row actually being on screen
  // (rather than enumerating every overlay flag — settingsOpen, taskDetailId,
  // selectedListId, dailyCalendarOpen, etc. — that could otherwise be
  // hiding the day-detail page even while selectedDay is still set from
  // before) so the keys only ever act on the day you're actually looking
  // at. goToAdjacentDay() itself already no-ops at either end of your
  // logged days, same as clicking a disabled arrow would.
  if(e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
    if(document.querySelector('.daynavrow')){
      goToAdjacentDay(e.key === 'ArrowLeft' ? -1 : 1);
      return;
    }
  }

  const meta = e.metaKey || e.ctrlKey;
  if(meta && e.key.toLowerCase()==='z'){
    e.preventDefault();
    if(e.shiftKey) redo(); else undo();
  } else if(meta && e.key.toLowerCase()==='y'){
    e.preventDefault();
    redo();
  }
});

// ---------- Swipe navigation (touch) ----------
// A left/right finger drag steps between days (Daily) or months
// (Calendar), mirroring the ArrowLeft/ArrowRight handling above; a
// rightward drag on any drilldown page triggers that page's own .pagetag
// "back" action, mirroring a tap on the tag itself. See
// defaultDevSettings()'s fullPageSwipeNav comment in 02-storage-state.js
// for how the day/month-nav zone and the swipe-back zone are kept from
// fighting over the same touch — classifySwipeZone() below is the single
// place that decides which (if either) a given touch belongs to.

let swipeGesture = null; // { mode:'day'|'month'|'back', card, backTag?, startX, startY, startT, lastX, axis:null|'x'|'y' }

const SWIPE_AXIS_PX = 10;      // movement before committing to horizontal vs. vertical
const SWIPE_COMMIT_PX = 90;    // drag distance that commits the action on release
const SWIPE_COMMIT_VPX = 0.55; // px/ms — a fast short flick commits even under that distance

// Checked in this order: the day-nav row (.daynavrow) or the calendar's
// own nav row (.calnav) claim the gesture either when the touch actually
// started inside that row, or — with fullPageSwipeNav on — anywhere on
// that page at all. Only once neither claims it does swipe-right-to-
// go-back get a chance, and only against a *non-compact* .pagetag (see
// the Page Tag vs. Compact Tag distinction in devSettingsFieldsHtml()'s
// comment in 01-categories-theme.js) — a compact tag links two peer
// views (Daily's day-list<->Calendar, a checklist's own Pending view),
// not a "back" out of a drilldown, so a directional swipe doesn't have
// one obvious meaning there the way it does for a real back tag. A
// Settings popover (color wheel, icon/location picker) opts out entirely
// — those are their own drag surfaces and shouldn't have a page-level
// swipe competing with them.
function classifySwipeZone(target){
  if(!target || !target.closest) return null;
  if(openCategoryPickerId || uiColorPickerOpen || deskPaperPickerOpen || themeColorWheelKey || locationEditorOpenId) return null;
  const dev = state.devSettings || {};
  const daynav = document.querySelector('.daynavrow');
  if(daynav && (dev.fullPageSwipeNav || daynav.contains(target))){
    return { mode:'day', card: daynav.parentElement };
  }
  const calnav = document.querySelector('.calnav');
  if(calnav && (dev.fullPageSwipeNav || calnav.contains(target))){
    return { mode:'month', card: calnav.parentElement };
  }
  const stackedpage = target.closest('.stackedpage');
  if(stackedpage){
    const backTag = stackedpage.querySelector('.pagetag:not(.compact)');
    if(backTag) return { mode:'back', card: stackedpage, backTag };
  }
  return null;
}

// Follows the finger 1:1 — translateX plus a light rotate/fade so the
// card reads as a physical thing being pushed, not just sliding. A
// back-swipe only means anything moving right; dragging the wrong way
// gives a little rubber-band resistance instead of doing nothing, so the
// card still feels attached to your finger either direction.
function swipeApplyDrag(g, dx){
  const eff = (g.mode === 'back' && dx < 0) ? dx * 0.15 : dx;
  g.card.style.transform = `translateX(${eff}px) rotate(${eff / 26}deg)`;
  g.card.style.opacity = String(Math.max(1 - Math.abs(eff) / 700, 0.55));
}

function swipeSnapBack(card){
  card.style.transition = 'transform 220ms cubic-bezier(.2,.8,.3,1), opacity 220ms ease';
  card.style.transform = '';
  card.style.opacity = '';
  setTimeout(() => { card.style.transition = ''; }, 220);
}

// Continues the card the rest of the way off-screen in the direction it
// was already being dragged, then hands off to `after` (the actual
// navigation) once it's clear. Clears the inline style back off *before*
// calling `after`, not just after — for 'day'/'back' the card (.stackedpage)
// gets discarded by the next render anyway so this is a no-op, but for
// 'month' the card is #dailyView/#calendarView itself, which render()
// only ever replaces the *contents* of, never the element — left
// untouched, the fly-off transform/opacity would still be sitting on
// that element when the new month's markup lands inside it a moment
// later, hiding it off-screen exactly like the swipe never ended.
function swipeFlyAway(card, dir, after){
  card.style.transition = 'transform 200ms ease-in, opacity 200ms ease-in';
  card.style.transform = `translateX(${dir * Math.max(window.innerWidth, 320)}px) rotate(${dir * 12}deg)`;
  card.style.opacity = '0';
  setTimeout(() => {
    card.style.transition = '';
    card.style.transform = '';
    card.style.opacity = '';
    after();
  }, 200);
}

document.addEventListener('touchstart', (e) => {
  const appShell = document.getElementById('appShell');
  if(!appShell || appShell.style.display === 'none' || e.touches.length !== 1){
    swipeGesture = null;
    return;
  }
  const zone = classifySwipeZone(e.touches[0].target);
  if(!zone){ swipeGesture = null; return; }
  const t = e.touches[0];
  swipeGesture = { ...zone, startX: t.clientX, startY: t.clientY, lastX: t.clientX, startT: Date.now(), axis: null };
}, { passive: true });

// Not passive — once a gesture has locked onto the horizontal axis this
// needs to preventDefault() so the page doesn't also scroll/rubber-band
// underneath the drag. Before that lock, nothing is prevented at all, so
// an ordinary vertical scroll starting anywhere in a swipe zone (the
// day-detail task list, most obviously, once fullPageSwipeNav is on)
// behaves exactly as if this listener didn't exist.
document.addEventListener('touchmove', (e) => {
  if(!swipeGesture) return;
  const t = e.touches[0];
  const dx = t.clientX - swipeGesture.startX;
  const dy = t.clientY - swipeGesture.startY;
  if(swipeGesture.axis === null){
    if(Math.abs(dx) < SWIPE_AXIS_PX && Math.abs(dy) < SWIPE_AXIS_PX) return;
    swipeGesture.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if(swipeGesture.axis === 'y'){ swipeGesture = null; return; } // hand off to native scroll
    swipeGesture.card.style.transition = 'none';
  }
  if(swipeGesture.axis !== 'x') return;
  e.preventDefault();
  swipeGesture.lastX = t.clientX;
  swipeApplyDrag(swipeGesture, dx);
}, { passive: false });

function swipeEnd(){
  const g = swipeGesture;
  swipeGesture = null;
  if(!g || g.axis !== 'x') return;
  const dx = g.lastX - g.startX;
  const elapsed = Math.max(Date.now() - g.startT, 1);
  const committed = Math.abs(dx) > SWIPE_COMMIT_PX || Math.abs(dx) / elapsed > SWIPE_COMMIT_VPX;

  if(g.mode === 'back'){
    if(committed && dx > 0) swipeFlyAway(g.card, 1, () => g.backTag.click());
    else swipeSnapBack(g.card);
    return;
  }

  // Swipe left (negative dx) advances forward, same convention as a
  // photo carousel — swipe right steps back. This is the opposite sign
  // from the ArrowLeft/ArrowRight keys above on purpose: a right *arrow
  // key* means "go right, i.e. forward," but a right *swipe* pushes the
  // current card away to reveal the previous one, same direction .pagetag
  // back-swipes already use above.
  const dir = dx < 0 ? 1 : -1;
  const canGo = g.mode === 'month' || !!adjacentDayStr(selectedDay, dir);
  if(committed && canGo){
    swipeFlyAway(g.card, dir, () => {
      if(g.mode === 'day') goToAdjacentDay(dir);
      else calendarShiftMonth(dir);
    });
  } else {
    swipeSnapBack(g.card);
  }
}

document.addEventListener('touchend', swipeEnd);
document.addEventListener('touchcancel', swipeEnd);

// Resizing the window can change how tabs wrap into rows even with no
// state change (nothing else calls render() in that case), which would
// leave renderTabRowLines()'s shelf lines stale — so re-measure on resize.
// Also re-checks the Mobile UI Lab's mobileUiActive() gate (01-categories-
// theme.js), since dragging a desktop browser window narrower/wider is the
// other way (besides mobileUiPreviewOnDesktop) that gate's answer changes
// without any state mutation to trigger it.
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { renderTabRowLines(); refreshMobileUiActive(); updateTabScrollFade(); }, 120);
});

// #tabs itself is a static element (renderTabs() only ever replaces its
// innerHTML, see 06-tabs-render.js) so this listener is safe to attach
// once here rather than re-attaching on every render. A no-op whenever
// tabBarMobileStyle's "scroll" variant isn't active — see the comment on
// updateTabScrollFade() for why.
document.getElementById('tabs').addEventListener('scroll', updateTabScrollFade, { passive:true });

// saveState() now retries indefinitely rather than dropping a failed save,
// but that only helps while the tab stays open — closing it mid-retry
// would still lose the edit silently. This is the last line of defense:
// the browser's native "leave site?" prompt, gated on unsavedChanges so it
// only appears when there's actually something not yet confirmed saved.
window.addEventListener('beforeunload', (e) => {
  if(!unsavedChanges) return;
  e.preventDefault();
  e.returnValue = '';
});

// Dev-only bypass: ?localdev=1 skips straight past the login screen into
// local-only mode (localStorage, same as clicking "Continue without an
// account"). Gated to localhost/file:// so it can never do anything on
// the real hosted site — it's purely a shortcut for testing this file
// directly, not a feature for real users.
function isLocalDevHost(){
  return location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:';
}

(async function init(){
  if(window.storage){ await enterApp(); return; }
  if(isLocalDevHost() && new URLSearchParams(location.search).has('localdev')){
    localOnlyMode = true;
    await enterApp();
    return;
  }
  session = loadSession();
  if(session && await ensureFreshSession()){ await enterApp(); return; }
  document.getElementById('authShell').style.display = '';
})();
</script>
</body>
</html>
