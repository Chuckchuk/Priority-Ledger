<style>

  .backbtn{

  .pulladd select{

    background: var(--paper-dim); border:1px solid var(--line); border-radius:5px; padding:7px 6px; color:var(--ink);
  }
  .pullbtn{

    background:transparent; border:1px solid var(--brass); color:var(--brass); border-radius:5px; padding:7px 12px; cursor:pointer; flex-shrink:0;

  .authform input{

    font-family:'IBM Plex Sans', sans-serif; font-size:0.92rem; padding:10px 12px; color:var(--ink); outline:none;
  }

  .authsubmit{
    width:100%; font-family:'IBM Plex Mono', monospace; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em;
    padding:12px 14px; border-radius:8px; border:none; background: var(--brass); color:white; cursor:pointer; margin-top:4px;
  }

    background:none; border:none; font-family:'IBM Plex Mono', monospace; font-size:0.62rem; text-transform:uppercase;

</style>

<body>
<div class="shell" id="authShell" style="display:none;">
  <div class="masthead">
    <h1>The Ledger</h1>
    <div class="tagline">sign in to your ledger</div>
  </div>
  <div class="card">
    <div class="authform">
      <input type="email" id="authEmail" placeholder="Email">
      <input type="password" id="authPassword" placeholder="Password" onkeydown="if(event.key==='Enter') submitAuth()">
    </div>
    <div class="autherror" id="authError"></div>
    <button class="authsubmit" id="authSubmitBtn" onclick="submitAuth()">Sign In</button>
    <div class="footer-row"><button onclick="toggleAuthMode()" id="authModeToggle">Need an account? Create one</button></div>
    <div class="footer-row"><button onclick="continueLocally()">Continue without an account (this device only)</button></div>
  </div>
</div>
<div class="shell" id="appShell" style="display:none;">
  <div class="masthead">
    <h1>The Ledger</h1>
    <div class="tagline">family &nbsp;·&nbsp; projects &nbsp;·&nbsp; estate</div>
    <button class="locbadge" id="locBadge" onclick="toggleLocation()"></button>
  </div>
  <div class="status-line" id="statusLine"></div>
  <div class="status-line" id="signOutRow" style="display:none;"><button class="signoutbtn" onclick="signOut()">Sign out (<span id="authEmailLabel"></span>)</button></div>
  <div class="tabs" id="tabs"></div>
  <div class="card">
    <div id="categoryView">
      <div class="quickadd">
        <input type="text" id="quickInput" placeholder="What needs doing?" onkeydown="if(event.key==='Enter') addTask()">
        <select id="quickCategory"></select>
        <button class="flagbtn" id="urgentToggle" onclick="toggleUrgentDraft()" title="Mark urgent">⚑</button>
        <button class="addbtn" onclick="addTask()">+</button>
      </div>
      <ul class="tasks" id="taskList"></ul>
      <div class="footer-row"><button id="showDoneBtn" onclick="toggleShowDone()"></button></div>
    </div>
    <div id="dailyView" style="display:none;"></div>
  </div>
  <div class="savestatus" id="saveStatus"></div>
</div>

<script>
const CATEGORIES = {
  family:   { label: 'Family Business', color: 'var(--family)',   hex:'#3C5A45', locations: ['MA','Argentina'] },
  projects: { label: 'Game & Software', color: 'var(--projects)', hex:'#3E4A6B', locations: ['MA','Argentina'] },
  estate:   { label: 'Estate Upkeep',   color: 'var(--estate)',   hex:'#9C4530', locations: ['MA'] },
  personal: { label: 'Personal',        color: 'var(--personal)', hex:'#A9782F', locations: ['MA','Argentina'] },
  misc:     { label: 'Misc',            color: 'var(--misc)',     hex:'#5B6560', locations: ['MA','Argentina'] },
};
const TAB_ORDER = ['all','family','projects','estate','personal','daily'];
// Filled in once the project exists — see CLAUDE.md for setup steps.
const SUPABASE_URL = 'https://kyswrzkgiphsniepahje.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5c3dyemtnaXBoc25pZXBhaGplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMzk1NTAsImV4cCI6MjEwMjgxNTU1MH0.mvDp9f1KcqAol3Tq4Libi32tODMCrVv8HdD3C9-x30c';
const EMPTY_MSG = {
  all: "The ledger's empty. Start logging what needs doing.",
  family: "No family business items on the books. Add one above.",
  projects: "Nothing queued for the workshop. What are you building?",
  estate: "The house is quiet, for now. Log anything that needs fixing.",
  personal: "Nothing personal pending. Good place to add that wedding gift.",
};

let state = { location: 'MA', tasks: [], days: [] };
let activeTab = 'all';
let showDone = false;
let urgentDraft = false;
let selectedDay = null;
let expandedMonths = new Set();
let session = null; // { access_token, refresh_token, expires_at, user_id, email }
let localOnlyMode = false; // explicit opt-out of an account, chosen on the auth screen
let authMode = 'signin';

function loadSession(){
  const raw = localStorage.getItem('ledger-auth');
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}

function saveSession(s){
  session = s;
  if(s) localStorage.setItem('ledger-auth', JSON.stringify(s));
  else localStorage.removeItem('ledger-auth');
}

// Refreshes the Supabase session if the access token is expired or about to
// be — auth tokens are short-lived, so this runs before every storage call
// while logged in. Returns null (and clears the stored session) if the
// refresh token itself is no longer valid, which sends the user back to login.
async function ensureFreshSession(){
  if(!session) return null;
  if(Date.now() < session.expires_at - 60000) return session;
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    });
    if(!res.ok) throw new Error('refresh failed');
    const data = await res.json();
    const fresh = {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: Date.now() + data.expires_in * 1000,
      user_id: data.user.id,
      email: data.user.email
    };
    saveSession(fresh);
    return fresh;
  }catch(e){
    saveSession(null);
    return null;
  }
}

// Forces a re-login when a Supabase session can't be refreshed mid-use —
// storage must never silently drop to localStorage in this case, or a task
// added believing it's synced to the cloud would quietly stop being so.
function forceReauth(){
  saveSession(null);
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('authShell').style.display = '';
  const errEl = document.getElementById('authError');
  if(errEl) errEl.textContent = 'Your session expired — please sign in again.';
}

// Storage adapter — tries sources in order, all behind the same
// storage.get/storage.set contract:
//   1. window.storage — the real Claude.ai artifact storage, present only
//      when this file is pasted into a claude.ai conversation as an artifact.
//   2. localStorage — ONLY when localOnlyMode was explicitly chosen on the
//      auth screen, for local testing without a Supabase account.
//   3. Supabase — the hosted app's durable, per-user cloud storage, used
//      whenever someone is logged in. If the session can't be refreshed,
//      this forces a re-login rather than silently falling back to
//      localStorage, so data never "goes local" without the user knowing.
const storage = {
  async get(key){
    if(window.storage) return window.storage.get(key);
    if(localOnlyMode){
      const raw = localStorage.getItem('ledger-local:' + key);
      if(raw === null){ throw new Error('not found'); }
      return { key, value: raw, shared: false };
    }
    const s = await ensureFreshSession();
    if(!s){ forceReauth(); throw new Error('session expired'); }
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/ledger_state?user_id=eq.${s.user_id}&select=data`,
      { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${s.access_token}` } }
    );
    if(!res.ok) throw new Error('supabase get failed: ' + res.status);
    const rows = await res.json();
    if(!rows.length){ throw new Error('not found'); }
    return { key, value: JSON.stringify(rows[0].data), shared: false };
  },
  async set(key, value){
    if(window.storage) return window.storage.set(key, value);
    if(localOnlyMode){
      localStorage.setItem('ledger-local:' + key, value);
      return { key, value, shared: false };
    }
    const s = await ensureFreshSession();
    if(!s){ forceReauth(); throw new Error('session expired'); }
    const res = await fetch(`${SUPABASE_URL}/rest/v1/ledger_state`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${s.access_token}`,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({ user_id: s.user_id, data: JSON.parse(value), updated_at: new Date().toISOString() })
    });
    if(!res.ok) throw new Error('supabase set failed: ' + res.status);
    return { key, value, shared: false };
  }
};

function todayStr(){ return new Date().toISOString().slice(0,10); }

function defaultState(){
  return {
    location: 'MA',
    days: [],
    tasks: []
  };
}

function normalizeState(){
  if(!Array.isArray(state.days)) state.days = [];
  state.tasks.forEach(t=>{
    if(t.subtasks===undefined) t.subtasks = [];
    if(t.plannedDate===undefined) t.plannedDate = '';
  });
}

async function loadState(){
  // Retry once before giving up — a single failed request (e.g. a network
  // blip) should never be mistaken for "no saved data" and wipe the ledger.
  for(let attempt=0; attempt<2; attempt++){
    try{
      const res = await storage.get('tracker-state', false);
      if(res && res.value){ state = JSON.parse(res.value); normalizeState(); return; }
      break; // request succeeded and genuinely found nothing saved yet
    }catch(e){
      if(attempt===0){ await new Promise(r=>setTimeout(r,500)); continue; }
      console.error('Could not load saved ledger after retry, starting fresh locally', e);
    }
  }
  // Use the default in memory, but do NOT write it to storage here — only
  // save once you actually interact, so a load failure can never overwrite
  // real saved data with a blank slate.
  state = defaultState();
  normalizeState();
}

async function saveState(){
  const statusEl = document.getElementById('saveStatus');
  if(statusEl) statusEl.textContent = 'Saving…';
  try{
    await storage.set('tracker-state', JSON.stringify(state), false);
    if(statusEl){
      statusEl.textContent = 'Saved';
      setTimeout(()=>{ if(statusEl.textContent==='Saved') statusEl.textContent=''; }, 1500);
    }
  }catch(e){
    console.error('Storage save failed', e);
    if(statusEl) statusEl.textContent = 'Save failed — check your connection';
  }
}

function isOverdue(t){
  return t.dueDate && t.status !== 'done' && new Date(t.dueDate) < new Date(todayStr());
}

function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

function sortTasks(list){
  return list.slice().sort((a,b)=>{
    if((a.status==='done') !== (b.status==='done')) return a.status==='done' ? 1 : -1;
    if(a.urgent !== b.urgent) return a.urgent ? -1 : 1;
    const ad = a.dueDate ? new Date(a.dueDate).getTime() : Infinity;
    const bd = b.dueDate ? new Date(b.dueDate).getTime() : Infinity;
    if(ad !== bd) return ad - bd;
    return new Date(b.createdAt) - new Date(a.createdAt);
  });
}

function visibleTabs(){
  return TAB_ORDER.filter(key => key==='all' || key==='daily' || CATEGORIES[key].locations.includes(state.location));
}

function renderLocBadge(){
  const el = document.getElementById('locBadge');
  el.textContent = state.location === 'MA' ? 'MA' : 'B.A.';
  const hidden = TAB_ORDER.filter(k => k!=='all' && k!=='daily' && !CATEGORIES[k].locations.includes(state.location));
  const hiddenNote = hidden.length ? ` · ${hidden.map(k=>CATEGORIES[k].label).join(', ')} tucked under All` : '';
  document.getElementById('statusLine').textContent =
    (state.location === 'MA' ? 'Based in Massachusetts right now' : 'Based in Buenos Aires right now') + hiddenNote;
}

function renderTabs(){
  const wrap = document.getElementById('tabs');
  wrap.innerHTML = visibleTabs().map(key=>{
    const openCount = key==='daily'
      ? state.tasks.filter(t=>t.plannedDate===todayStr() && t.status!=='done').length
      : state.tasks.filter(t => (key==='all'||t.category===key) && t.status!=='done').length;
    const dot = (key==='all'||key==='daily') ? '' : `<span class="dot" style="background:${CATEGORIES[key].hex}"></span>`;
    const label = key==='all' ? 'All' : key==='daily' ? 'Daily' : CATEGORIES[key].label;
    return `<button class="tab ${activeTab===key?'active':''}" onclick="switchTab('${key}')">${dot}${label} <span class="count">${openCount}</span></button>`;
  }).join('');
}

function renderQuickCategory(){
  const sel = document.getElementById('quickCategory');
  if(activeTab !== 'all'){
    sel.style.display = 'none';
    sel.value = activeTab;
  } else {
    sel.style.display = '';
    sel.innerHTML = Object.entries(CATEGORIES).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');
  }
  document.getElementById('quickInput').placeholder =
    activeTab==='estate' ? 'Log a house issue…' :
    activeTab==='projects' ? 'Add a project task…' :
    activeTab==='family' ? 'Add a family business item…' :
    activeTab==='personal' ? 'Add a personal to-do…' : 'What needs doing?';
}

function taskRowHtml(t, showDot, inDaily){
  const cat = CATEGORIES[t.category] || CATEGORIES.misc;
  const canRemoveHere = !inDaily || t.category==='misc';
  const overdue = isOverdue(t);
  let badge = '';
  if(overdue) badge = `<span class="badge overdue">Overdue</span>`;
  else if(t.dueDate) badge = `<span class="badge due">${fmtDate(t.dueDate)}</span>`;
  const dotHtml = showDot ? `<span class="cdot" style="background:${cat.hex}"></span>` : '';
  const subs = t.subtasks || [];
  const subDoneCount = subs.filter(s=>s.done).length;
  const subBadge = subs.length ? `<span class="badge subcount">${subDoneCount}/${subs.length}</span>` : '';
  return `
  <li class="task">
    <div class="row" onclick="toggleExpand(event,'${t.id}')">
      <div class="check ${t.status==='done'?'done':''}" onclick="event.stopPropagation(); toggleStatus('${t.id}')"></div>
      ${dotHtml}
      <div class="title ${t.status==='done'?'done':''}">${escapeHtml(t.title)}${t.urgent && t.status!=='done' ? ' ⚑' : ''}</div>
      <div class="meta">${subBadge}${badge}</div>
    </div>
    <div class="expand" id="exp-${t.id}">
      <input type="text" class="titleedit" value="${escapeHtml(t.title)}"
        onblur="updateTitle('${t.id}', this.value)"
        onkeydown="if(event.key==='Enter'){ event.preventDefault(); this.blur(); }">
      <div class="expand-row">
        <select class="catselect" onchange="updateCategory('${t.id}', this.value)">
          ${Object.entries(CATEGORIES).map(([k,v])=>`<option value="${k}" ${t.category===k?'selected':''}>${v.label}</option>`).join('')}
        </select>
        <label class="fieldlabel">DUE</label>
        <input type="date" value="${t.dueDate||''}" onchange="updateDueDate('${t.id}', this.value)">
        <button class="flagbtn ${t.urgent?'on':''}" onclick="toggleUrgent('${t.id}')" title="Toggle urgent">⚑</button>
        ${canRemoveHere ? `<button class="remove" onclick="deleteTask('${t.id}')">Remove</button>` : ''}
      </div>
      <div class="expand-row">
        <label class="fieldlabel">PLAN FOR DAY</label>
        <input type="date" value="${t.plannedDate||''}" onchange="updatePlannedDate('${t.id}', this.value)">
        ${t.plannedDate ? `<button class="remove" onclick="updatePlannedDate('${t.id}','')">Unplan</button>` : ''}
      </div>
      <div class="subwrap">
        <div class="sublabel">Steps</div>
        ${subs.map(s=>`
          <div class="subrow">
            <div class="subcheck ${s.done?'done':''}" onclick="toggleSubtask('${t.id}','${s.id}')"></div>
            <div class="subtext ${s.done?'done':''}" onclick="startEditSubtask(this,'${t.id}','${s.id}')">${escapeHtml(s.text)}</div>
            <button class="subdel" onclick="deleteSubtask('${t.id}','${s.id}')">×</button>
          </div>`).join('')}
        <input type="text" class="subadd" placeholder="+ add a step, enter to save" onkeydown="if(event.key==='Enter'){ addSubtask('${t.id}', this.value); this.value=''; }">
      </div>
      <textarea placeholder="Notes…" onblur="updateNotes('${t.id}', this.value)">${escapeHtml(t.notes||'')}</textarea>
    </div>
  </li>`;
}

function renderList(){
  const list = state.tasks.filter(t => activeTab==='all' || t.category===activeTab);
  const visible = sortTasks(list).filter(t => showDone || t.status!=='done');
  const doneCount = list.filter(t=>t.status==='done').length;

  const el = document.getElementById('taskList');
  if(visible.length===0){
    el.innerHTML = `<div class="empty">${EMPTY_MSG[activeTab] || 'Nothing here yet.'}</div>`;
  } else {
    el.innerHTML = visible.map(t=>taskRowHtml(t, activeTab==='all', false)).join('');
  }

  const btn = document.getElementById('showDoneBtn');
  btn.textContent = showDone ? `Hide completed (${doneCount})` : `Show completed (${doneCount})`;
  btn.style.display = doneCount>0 ? '' : 'none';
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  renderLocBadge();
  renderTabs();
  const isDaily = activeTab==='daily';
  const catView = document.getElementById('categoryView');
  const dayView = document.getElementById('dailyView');
  catView.style.display = isDaily ? 'none' : '';
  dayView.style.display = isDaily ? '' : 'none';
  if(isDaily){
    renderDaily();
    document.getElementById('taskList').innerHTML = ''; // avoid stale duplicate ids
  } else {
    renderQuickCategory();
    renderList();
    dayView.innerHTML = ''; // avoid stale duplicate ids
  }
}

function switchTab(key){ activeTab = key; render(); }

function toggleShowDone(){ showDone = !showDone; render(); }

function toggleUrgentDraft(){
  urgentDraft = !urgentDraft;
  document.getElementById('urgentToggle').classList.toggle('on', urgentDraft);
}

// ---------- Daily tab ----------

function monthKey(dateStr){ return dateStr.slice(0,7); }

function newId(prefix){ return prefix + '-' + Date.now() + '-' + Math.random().toString(36).slice(2,8); }

function addDaysToDateStr(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}

let pickerOpen = false;

function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('en-US', { month:'long', year:'numeric' });
}

function dayLabel(dateStr){
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { weekday:'long', month:'short', day:'numeric' });
}

function tasksForDay(dateStr){
  return state.tasks.filter(t=>t.plannedDate===dateStr);
}

async function ensureDay(dateStr){
  if(!state.days.includes(dateStr)){
    state.days.unshift(dateStr);
    await saveState();
  }
}

async function addDay(){
  // Default is today — but if today (and however many days after it) already
  // exist, roll forward to the next day that isn't taken yet, rather than
  // trying to create a duplicate "Today".
  let dateStr = todayStr();
  while(state.days.includes(dateStr)){
    dateStr = addDaysToDateStr(dateStr, 1);
  }
  await ensureDay(dateStr);
  selectedDay = dateStr;
  render();
}

function togglePicker(){ pickerOpen = !pickerOpen; renderDaily(); }

async function confirmPickDate(){
  const input = document.getElementById('pickDateInput');
  const val = input ? input.value : '';
  if(!val) return;
  pickerOpen = false;
  await ensureDay(val); // no-op if that day already exists — never duplicates
  selectedDay = val;
  render();
}

async function rescheduleDay(oldDate, newDate){
  const msgEl = document.getElementById('rescheduleMsg');
  if(!newDate || newDate===oldDate) return;
  if(newDate < todayStr()){
    if(msgEl) msgEl.textContent = "Can't move a day into the past.";
    return;
  }
  if(state.days.includes(newDate)){
    if(msgEl) msgEl.textContent = 'That day already exists.';
    return;
  }
  state.tasks.forEach(t=>{ if(t.plannedDate===oldDate) t.plannedDate = newDate; });
  state.days = state.days.filter(d=>d!==oldDate);
  state.days.unshift(newDate);
  await saveState();
  selectedDay = newDate;
  render();
}

async function cascadeUnfinished(dateStr){
  const nextDate = addDaysToDateStr(dateStr, 1);
  const unfinished = state.tasks.filter(t=>t.plannedDate===dateStr && t.status!=='done');
  if(unfinished.length===0) return;
  await ensureDay(nextDate);
  unfinished.forEach(t=>{
    state.tasks.unshift({
      id: newId('task'),
      title: t.title,
      category: t.category,
      status: 'open',
      urgent: t.urgent,
      dueDate: t.dueDate,
      notes: t.notes,
      subtasks: (t.subtasks||[]).map(s=>({ id:newId('sub'), text:s.text, done:s.done })),
      plannedDate: nextDate,
      createdAt: todayStr()
    });
  });
  await saveState();
  selectedDay = nextDate;
  render();
}

function openDay(dateStr){ selectedDay = dateStr; render(); }
function closeDay(){ selectedDay = null; render(); }

function toggleMonthGroup(key){
  if(expandedMonths.has(key)) expandedMonths.delete(key); else expandedMonths.add(key);
  renderDaily();
}

function renderDaily(){
  const el = document.getElementById('dailyView');
  el.innerHTML = selectedDay ? renderDayDetail(selectedDay) : renderDayList();
}

function renderDayList(){
  const days = state.days.slice().sort((a,b)=> b.localeCompare(a));
  let html = `
    <div class="adddayrow">
      <button class="addday" onclick="addDay()">+ Add a Day</button>
      <button class="pickdatebtn" onclick="togglePicker()">${pickerOpen ? 'Cancel' : 'Pick a date…'}</button>
    </div>
    ${pickerOpen ? `
    <div class="pickerwrap">
      <input type="date" id="pickDateInput" value="${todayStr()}">
      <button class="pullbtn" onclick="confirmPickDate()">Add this day</button>
    </div>` : ''}
  `;

  if(days.length===0){
    html += `<div class="empty">No days logged yet. Add today and start a priority list.</div>`;
    return html;
  }

  const curKey = monthKey(todayStr());
  const currentDays = days.filter(d=>monthKey(d)===curKey);
  const pastDays = days.filter(d=>monthKey(d)!==curKey);
  const pastGroups = {};
  pastDays.forEach(d=>{ const k=monthKey(d); (pastGroups[k]=pastGroups[k]||[]).push(d); });
  const pastKeys = Object.keys(pastGroups).sort((a,b)=>b.localeCompare(a));

  html += `<div class="daylistlabel">This Month</div>`;
  html += currentDays.length
    ? currentDays.map(dayItemHtml).join('')
    : `<div class="empty" style="padding:14px 4px;">Nothing logged yet this month.</div>`;

  pastKeys.forEach(k=>{
    const open = expandedMonths.has(k);
    html += `
      <div class="monthgroup">
        <button class="monthhead" onclick="toggleMonthGroup('${k}')">
          <span>${monthLabel(k)}</span>
          <span class="count">${pastGroups[k].length} day${pastGroups[k].length===1?'':'s'} ${open?'▾':'▸'}</span>
        </button>
        ${open ? `<div class="monthbody">${pastGroups[k].map(dayItemHtml).join('')}</div>` : ''}
      </div>`;
  });

  return html;
}

function dayItemHtml(dateStr){
  const tasks = tasksForDay(dateStr);
  const doneCount = tasks.filter(t=>t.status==='done').length;
  const ratio = tasks.length ? `<span class="badge subcount">${doneCount}/${tasks.length}</span>` : `<span class="badge due">Empty</span>`;
  const isToday = dateStr === todayStr();
  return `
    <button class="dayitem" onclick="openDay('${dateStr}')">
      <span class="daydate">${dayLabel(dateStr)}${isToday ? '<span class="todaytag">Today</span>' : ''}</span>
      ${ratio}
    </button>`;
}

function renderDayDetail(dateStr){
  const allTasks = tasksForDay(dateStr);
  const sorted = sortTasks(allTasks);
  const doneCount = allTasks.filter(t=>t.status==='done').length;
  const unfinishedCount = allTasks.length - doneCount;
  const unplanned = state.tasks.filter(t=>t.plannedDate!==dateStr && t.status!=='done');
  const isPast = dateStr < todayStr();
  const nextDate = addDaysToDateStr(dateStr, 1);

  // Every task shows, including completed ones — completed just render
  // crossed out, so you can see the whole day's shape at a glance.
  const list = sorted.length
    ? sorted.map(t=>taskRowHtml(t, true, true)).join('')
    : `<div class="empty">Nothing planned for this day yet.</div>`;

  return `
    <button class="backbtn" onclick="closeDay()">‹ All Days</button>
    <div class="daydetailhead">
      <h2>${dayLabel(dateStr)}</h2>
      <div class="dayprogress">${allTasks.length ? `${doneCount} of ${allTasks.length} done` : 'Nothing planned yet'}</div>
    </div>
    ${isPast ? `
    <div class="lockednote">
      <span>🔒 This day has passed — locked</span>
      ${unfinishedCount>0 ? `<button class="pullbtn" onclick="cascadeUnfinished('${dateStr}')">Copy ${unfinishedCount} unfinished → ${fmtDate(nextDate)}</button>` : ''}
    </div>` : `
    <div class="reschedule">
      <label class="fieldlabel">MOVE THIS DAY TO</label>
      <input type="date" id="rescheduleInput" min="${todayStr()}" value="${dateStr}">
      <button class="pullbtn" onclick="rescheduleDay('${dateStr}', document.getElementById('rescheduleInput').value)">Move</button>
      <span class="reschedulemsg" id="rescheduleMsg"></span>
    </div>`}
    <div class="quickadd">
      <input type="text" id="dayQuickInput" placeholder="Add a priority for this day…" onkeydown="if(event.key==='Enter') addDayTask('${dateStr}')">
      <select id="dayQuickCategory">
        ${Object.entries(CATEGORIES).map(([k,v])=>`<option value="${k}" ${k==='misc'?'selected':''}>${v.label}</option>`).join('')}
      </select>
      <button class="addbtn" onclick="addDayTask('${dateStr}')">+</button>
    </div>
    ${unplanned.length ? `
    <div class="pulladd">
      <select id="pullTaskSelect">
        <option value="">Pull in an existing task…</option>
        ${unplanned.map(t=>`<option value="${t.id}">${escapeHtml((CATEGORIES[t.category]||CATEGORIES.misc).label)} — ${escapeHtml(t.title)}</option>`).join('')}
      </select>
      <button class="pullbtn" onclick="pullTaskToDay('${dateStr}')">Add</button>
    </div>` : ''}
    <ul class="tasks">${list}</ul>
  `;
}

async function addDayTask(dateStr){
  const input = document.getElementById('dayQuickInput');
  const title = input.value.trim();
  if(!title) return;
  const category = document.getElementById('dayQuickCategory').value;
  await ensureDay(dateStr);
  state.tasks.unshift({
    id: newId('task'),
    title, category, status:'open', urgent:false, dueDate:'', notes:'', subtasks:[], plannedDate: dateStr, createdAt: todayStr()
  });
  await saveState();
  render();
}

async function pullTaskToDay(dateStr){
  const sel = document.getElementById('pullTaskSelect');
  const id = sel.value;
  if(!id) return;
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  t.plannedDate = dateStr;
  await ensureDay(dateStr);
  await saveState();
  render();
}

async function updatePlannedDate(id, val){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  t.plannedDate = val;
  if(val) await ensureDay(val);
  await saveState();
  render();
  reopen(id);
}

function startEditSubtask(el, taskId, subId){
  const t = state.tasks.find(t=>t.id===taskId);
  const s = t && (t.subtasks||[]).find(s=>s.id===subId);
  if(!s) return;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'subedit';
  input.value = s.text;
  el.replaceWith(input);
  input.focus();
  input.select();
  let committed = false;
  const commit = async () => {
    if(committed) return;
    committed = true;
    const val = input.value.trim();
    if(val) s.text = val;
    await saveState();
    render();
    reopen(taskId);
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); input.blur(); } });
}

async function addTask(){
  const input = document.getElementById('quickInput');
  const title = input.value.trim();
  if(!title) return;
  const category = activeTab==='all' ? document.getElementById('quickCategory').value : activeTab;
  state.tasks.unshift({
    id: newId('task'),
    title, category, status:'open', urgent: urgentDraft, dueDate:'', notes:'', subtasks: [], plannedDate: '', createdAt: todayStr()
  });
  input.value = '';
  urgentDraft = false;
  document.getElementById('urgentToggle').classList.remove('on');
  await saveState();
  render();
}

async function toggleStatus(id){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  t.status = t.status==='done' ? 'open' : 'done';
  await saveState();
  render();
}

async function toggleUrgent(id){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  t.urgent = !t.urgent;
  await saveState();
  render();
  reopen(id);
}

async function updateDueDate(id, val){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  t.dueDate = val;
  await saveState();
  render();
  reopen(id);
}

function reopen(id){
  const exp = document.getElementById('exp-' + id);
  if(exp) exp.classList.add('open');
}

async function updateTitle(id, val){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  const newVal = val.trim();
  if(newVal) t.title = newVal;
  await saveState();
  render();
  reopen(id);
}

async function updateCategory(id, val){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  t.category = val;
  await saveState();
  render();
  reopen(id);
}

async function addSubtask(taskId, text){
  const val = (text||'').trim();
  if(!val) return;
  const t = state.tasks.find(t=>t.id===taskId);
  if(!t) return;
  if(!t.subtasks) t.subtasks = [];
  t.subtasks.push({ id: newId('sub'), text: val, done:false });
  await saveState();
  render();
  reopen(taskId);
}

async function toggleSubtask(taskId, subId){
  const t = state.tasks.find(t=>t.id===taskId);
  if(!t) return;
  const s = (t.subtasks||[]).find(s=>s.id===subId);
  if(!s) return;
  s.done = !s.done;
  await saveState();
  render();
  reopen(taskId);
}

async function deleteSubtask(taskId, subId){
  const t = state.tasks.find(t=>t.id===taskId);
  if(!t) return;
  t.subtasks = (t.subtasks||[]).filter(s=>s.id!==subId);
  await saveState();
  render();
  reopen(taskId);
}

async function updateNotes(id, val){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  t.notes = val;
  await saveState();
}

async function deleteTask(id){
  state.tasks = state.tasks.filter(t=>t.id!==id);
  await saveState();
  render();
}

function toggleExpand(evt, id){
  const exp = document.getElementById('exp-' + id);
  exp.classList.toggle('open');
}

async function toggleLocation(){
  state.location = state.location==='MA' ? 'Argentina' : 'MA';
  await saveState();
  if(!visibleTabs().includes(activeTab)) activeTab = 'all';
  render();
}

function toggleAuthMode(){
  authMode = authMode === 'signin' ? 'signup' : 'signin';
  document.getElementById('authSubmitBtn').textContent = authMode === 'signin' ? 'Sign In' : 'Create Account';
  document.getElementById('authModeToggle').textContent =
    authMode === 'signin' ? 'Need an account? Create one' : 'Already have an account? Sign in';
  document.getElementById('authError').textContent = '';
}

async function submitAuth(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const errEl = document.getElementById('authError');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'Enter an email and password.'; return; }
  const endpoint = authMode === 'signin'
    ? `${SUPABASE_URL}/auth/v1/token?grant_type=password`
    : `${SUPABASE_URL}/auth/v1/signup`;
  try{
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if(!res.ok){ errEl.textContent = data.error_description || data.msg || 'Something went wrong.'; return; }
    if(!data.access_token){
      errEl.textContent = 'Check your email to confirm your account, then sign in.';
      return;
    }
    saveSession({
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: Date.now() + data.expires_in * 1000,
      user_id: data.user.id,
      email: data.user.email
    });
    await enterApp();
  }catch(e){
    errEl.textContent = 'Network error — try again.';
  }
}

function signOut(){
  saveSession(null);
  localOnlyMode = false;
  document.getElementById('authEmail').value = '';
  document.getElementById('authPassword').value = '';
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('authShell').style.display = '';
}

function continueLocally(){
  localOnlyMode = true;
  enterApp();
}

async function enterApp(){
  document.getElementById('authShell').style.display = 'none';
  document.getElementById('appShell').style.display = '';
  const signOutRow = document.getElementById('signOutRow');
  if(signOutRow){
    signOutRow.style.display = (window.storage || !session) ? 'none' : '';
    document.getElementById('authEmailLabel').textContent = session ? session.email : '';
  }
  await loadState();
  render();
}

(async function init(){
  if(window.storage){ await enterApp(); return; }
  session = loadSession();
  if(session && await ensureFreshSession()){ await enterApp(); return; }
  document.getElementById('authShell').style.display = '';
})();
</script>
</body>
