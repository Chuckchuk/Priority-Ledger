</style>
</head>
<body>
<!-- Pull-to-refresh indicator — see the Pull-to-refresh section in
     19-bootstrap.js. Always in the DOM (harmless at rest, opacity:0)
     rather than created/destroyed per gesture, same idiom as #ctxMenu
     below. A single bare glyph, deliberately no wrapping span — its own
     transform carries both the fixed centering AND the armed-state
     rotate together (see .pullrefresh in <style>), so there's no need to
     split those across a parent/child pair. -->
<div class="pullrefresh" id="pullRefresh" aria-hidden="true">↓</div>
<div class="shell" id="authShell" style="display:none;">
  <div class="masthead">
    <h1>The Ledger</h1>
    <div class="tagline">sign in to your ledger</div>
  </div>
  <div class="card">
    <!-- A real <form> (not a <div>) with autocomplete/name on each field
         is what actually gets iOS/Safari's "Save Password?" prompt to
         appear at all — a plain div with onclick-driven fetch() calls
         never counted as a form submission in the first place, which is
         why credentials never offered to save on the standalone "Add to
         Home Screen" install. onsubmit does the actual work (so Enter in
         either field submits too, no per-field onkeydown needed anymore)
         and preventDefault()s the native navigation a real form submit
         would otherwise cause. -->
    <form class="authform" id="authForm" onsubmit="event.preventDefault(); submitAuth(); return false;">
      <input type="email" id="authEmail" name="email" autocomplete="email" placeholder="Email">
      <input type="password" id="authPassword" name="password" autocomplete="current-password" placeholder="Password">
      <button type="submit" class="authsubmit" id="authSubmitBtn">Sign In</button>
    </form>
    <div class="autherror" id="authError"></div>
    <div class="footer-row" id="forgotPasswordRow"><button onclick="showForgotPassword()">Forgot password?</button></div>
    <div class="footer-row"><button onclick="toggleAuthMode()" id="authModeToggle">Need an account? Create one</button></div>
    <div class="footer-row"><button onclick="continueLocally()">Continue without an account (this device only)</button></div>
  </div>
</div>
<div class="shell" id="forgotShell" style="display:none;">
  <div class="masthead">
    <h1>The Ledger</h1>
    <div class="tagline">reset your password</div>
  </div>
  <div class="card">
    <form class="authform" id="forgotForm" onsubmit="event.preventDefault(); requestPasswordReset(); return false;">
      <input type="email" id="forgotEmail" name="email" autocomplete="email" placeholder="Email">
      <button type="submit" class="authsubmit" id="forgotSubmitBtn">Send reset link</button>
    </form>
    <div class="autherror" id="forgotError"></div>
    <div class="footer-row"><button onclick="hideForgotPassword()">Back to sign in</button></div>
  </div>
</div>
<div class="shell" id="resetShell" style="display:none;">
  <div class="masthead">
    <h1>The Ledger</h1>
    <div class="tagline">set a new password</div>
  </div>
  <div class="card">
    <form class="authform" id="resetForm" onsubmit="event.preventDefault(); submitPasswordReset(); return false;">
      <input type="password" id="resetPassword" name="new-password" autocomplete="new-password" placeholder="New password">
      <input type="password" id="resetPasswordConfirm" name="new-password-confirm" autocomplete="new-password" placeholder="Confirm new password">
      <button type="submit" class="authsubmit" id="resetSubmitBtn">Set new password</button>
    </form>
    <div class="autherror" id="resetError"></div>
  </div>
</div>
<div class="shell" id="appShell" style="display:none;">
  <div class="masthead">
    <button class="settingsbtn" id="settingsBtn" onclick="toggleSettings()" title="Settings">⚙</button>
    <button class="dailyshortcut" id="dailyShortcutBtn" onclick="switchTab('daily')" title="Daily">▤</button>
    <h1>The Ledger</h1>
    <button class="locbadge" id="locBadge" onclick="toggleLocation()"></button>
  </div>
  <div class="status-line" id="statusLine"></div>
  <div class="status-line" id="signOutRow" style="display:none;"><button class="signoutbtn" onclick="signOut()">Sign out (<span id="authEmailLabel"></span>)</button></div>
  <!-- .appmain is a plain, unstyled wrapper by default (transparent to
       block flow, identical to #tabs/.leathercover being direct .shell
       children) — it exists only so the EXPERIMENTAL tabBarDesktopStyle
       "sidetabs" look (see defaultDevSettings() in 02-storage-state.js)
       has a single flex container to turn into a row, without having to
       make #appShell itself a flex container (it holds the masthead and
       status lines too, which must stay stacked regardless). .tabswrap
       is the similar hook for tabBarMobileStyle's "scroll" fade hint. -->
  <div class="appmain" id="appMain">
    <div class="tabswrap">
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="leathercover" id="leatherCover">
      <div class="bookmark"></div>
      <!-- tabBarDesktopStyle "sidetabs"'s own peeking index-tab column
           (see layoutSidetabsPeek() in 06-tabs-render.js and the
           .sidetabspeek rules in <style>) — a real #appCard sibling, same
           reasoning as #tabConnector below and .bookmark above: it needs
           to paint above .leathercover's own background/texture but below
           #appCard, and only a genuine DOM child positioned here (not a
           z-index trick on the real .tab elements, which live outside
           .leathercover entirely) can do that reliably. Empty/inert
           unless that style is actually selected. -->
      <div class="sidetabspeek" id="sidetabsPeek"></div>
      <div class="card" id="appCard">
      <!-- tabBarDesktopStyle "overlap"'s active-tab connector (see
           layoutOverlapTabs() in 06-tabs-render.js and the .tabconnector
           rule in <style>) — empty/inert by default. A genuine #appCard
           child so it trivially paints above #appCard's own background
           and above the whole (separately stacked, see .tabs) tab bar,
           without needing to fight #appCard for z-index priority the way
           the real .tab.active element itself never successfully could. -->
      <div class="tabconnector" id="tabConnector"></div>
      <div id="categoryView">
        <!-- Mobile UI Lab (quickAddMobileStyle) — the trigger is a fixed,
             sticky bottom button whenever mobileui-active (see .quickaddtrigger
             in <style>); the setting only picks what tapping it opens
             (topsheet/bottomsheet/inline, via body[data-quickadd-mode]).
             Inert (display:none) on desktop, same as the rest of this file's
             Mobile UI Lab markup. -->
        <button class="quickaddtrigger" id="quickAddTrigger" onclick="toggleQuickAddSheet()">+ Add Task</button>
        <div class="quickaddscrim" id="quickAddScrim" onclick="toggleQuickAddSheet(false)"></div>
        <div class="quickadd" id="quickAddBar">
          <div class="quickaddsheethead">
            <span class="quickaddsheetgrabber"></span>
            <button class="quickaddsheetclose" onclick="toggleQuickAddSheet(false)" title="Close">×</button>
          </div>
          <input type="text" id="quickInput" placeholder="What needs doing?" onkeydown="if(event.key==='Enter') addTask()">
          <select id="quickCategory"></select>
          <select id="quickTimeframe" title="Timeframe">
            <option value="">Timeframe</option>
            <option value="today">Today</option>
            <option value="short">Short</option>
            <option value="medium">Medium</option>
            <option value="long">Long</option>
            <option value="urgent">Urgent</option>
          </select>
          <!-- fieldPickerStyle (see defaultDevSettings() in 02-storage-
               state.js) — the select above stays the real value source
               either way (addTask() reads it directly); renderQuickCategory()
               just hides it and fills this instead when a custom style is on. -->
          <div class="fieldpicker" id="quickTimeframePicker" style="display:none;"></div>
          <select id="quickPriority" title="Priority">
            <option value="0">Priority</option>
            <option value="1">Low</option>
            <option value="2">Medium</option>
            <option value="3">High</option>
          </select>
          <div class="fieldpicker" id="quickPriorityPicker" style="display:none;"></div>
          <button class="flagbtn" id="urgentToggle" onclick="toggleUrgentDraft()" title="Mark urgent">⚑</button>
          <button class="addbtn" onclick="addTask()">+</button>
        </div>
        <div class="sortrow" id="sortRow"></div>
        <ul class="tasks" id="taskList"></ul>
        <div class="footer-row"><button id="showDoneBtn" onclick="toggleShowDone()"></button></div>
      </div>
      <div id="dailyView" style="display:none;"></div>
      <div id="checklistView" style="display:none;"></div>
      <div id="settingsView" style="display:none;"></div>
      <div id="claudeView" style="display:none;"></div>
      <!-- taskLongPressMode 'detail' (see openMobileTaskDetail() in
           08-render-core.js) — the same full-page task detail Daily's own
           taskDetailId uses, reachable via long-press from any category
           tab's row instead of just from within Daily. -->
      <div id="mobileTaskDetailView" style="display:none;"></div>
    </div>
    </div>
  </div>
  <div class="undoRow">
    <button class="undobtn" id="undoBtn" onclick="undo()" title="Undo" disabled>↺</button>
    <span class="undostatus" id="undoStatus"></span>
    <button class="undobtn" id="redoBtn" onclick="redo()" title="Redo" disabled>↻</button>
  </div>
  <div class="savestatus" id="saveStatus"></div>
  <div class="status-line"><button class="signoutbtn" onclick="refreshFromServer(true)" id="refreshBtn">Refresh</button></div>

  <!-- Mobile UI Lab (floatingAddButton) — sits outside .leathercover/#appCard
       on purpose so it stays reachable regardless of which tab/overlay is
       showing inside them (see openFabAdd() in 16-task-crud.js); inert
       (display:none) unless mobileui-active AND the dev setting is on. -->
  <button class="fabaddbtn" id="fabAddBtn" onclick="openFabAdd()" title="Add a task">+</button>
  <div class="fabaddscrim" id="fabAddScrim" onclick="closeFabAdd()"></div>
  <div class="fabaddsheet" id="fabAddSheet">
    <div class="quickaddsheethead">
      <span class="quickaddsheetgrabber"></span>
      <button class="quickaddsheetclose" onclick="closeFabAdd()" title="Close">×</button>
    </div>
    <input type="text" id="fabAddInput" placeholder="What needs doing?" onkeydown="if(event.key==='Enter') submitFabAdd()">
    <select id="fabAddCategory"></select>
    <button class="addbtn" onclick="submitFabAdd()">+</button>
  </div>

  <!-- taskLongPressMode 'split' (see openTaskSettingsSheet() in 08-render-
       core.js) — one shared sheet reused for whichever task was long-
       pressed, same reasoning and reused .fabaddsheet/.fabaddscrim base
       mechanics as the FAB's own sheet just above, gated by a different
       body class (.tasksettings-open) since either can be open without
       the other. -->
  <div class="fabaddscrim" id="taskSettingsScrim" onclick="closeTaskSettingsSheet()"></div>
  <div class="fabaddsheet tasksettingssheet" id="taskSettingsSheet">
    <div class="quickaddsheethead">
      <span class="quickaddsheetgrabber"></span>
      <button class="quickaddsheetclose" onclick="closeTaskSettingsSheet()" title="Close">×</button>
    </div>
    <div id="taskSettingsBody"></div>
  </div>

  <!-- customContextMenu (desktop-only, see handleTaskContextMenu() in
       08-render-core.js) — position:fixed and placed at click coordinates
       by openTaskContextMenu(), so a fixed spot in the DOM is all this
       needs; no scrim, closed by the document-level click/Esc/scroll
       listeners in 19-bootstrap.js instead. -->
  <div class="ctxmenu" id="ctxMenu"></div>
</div>

<div class="devpanel" id="devPanel" style="display:none;">
  <button class="devpaneltab" id="devPanelTab" onclick="toggleDevPanel()" title="Dev settings">DEV</button>
  <div class="devpanelbody" id="devPanelBody"></div>
</div>

<script>
