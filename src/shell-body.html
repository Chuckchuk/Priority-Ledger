</style>
</head>
<body>
<!-- Pull-to-refresh indicator — see the Pull-to-refresh section in
     19-bootstrap.js. Always in the DOM (harmless at rest, opacity:0)
     rather than created/destroyed per gesture, same idiom as #ctxMenu
     below. A single bare glyph, deliberately no wrapping span — its own
     transform carries both the fixed centering AND the armed-state
     rotate together (see .pullrefresh in <style>), so there's no need to
     split those across a parent/child pair. -->
<div class="pullrefresh" id="pullRefresh" aria-hidden="true">↓</div>
<div class="shell" id="authShell" style="display:none;">
  <div class="masthead">
    <h1>The Ledger</h1>
    <div class="tagline">sign in to your ledger</div>
  </div>
  <div class="card">
    <!-- A real <form> (not a <div>) with autocomplete/name on each field
         is what actually gets iOS/Safari's "Save Password?" prompt to
         appear at all — a plain div with onclick-driven fetch() calls
         never counted as a form submission in the first place, which is
         why credentials never offered to save on the standalone "Add to
         Home Screen" install. onsubmit does the actual work (so Enter in
         either field submits too, no per-field onkeydown needed anymore)
         and preventDefault()s the native navigation a real form submit
         would otherwise cause. -->
    <form class="authform" id="authForm" onsubmit="event.preventDefault(); submitAuth(); return false;">
      <input type="email" id="authEmail" name="email" autocomplete="email" placeholder="Email">
      <input type="password" id="authPassword" name="password" autocomplete="current-password" placeholder="Password">
      <button type="submit" class="authsubmit" id="authSubmitBtn">Sign In</button>
    </form>
    <div class="autherror" id="authError"></div>
    <div class="footer-row" id="forgotPasswordRow"><button onclick="showForgotPassword()">Forgot password?</button></div>
    <div class="footer-row"><button onclick="toggleAuthMode()" id="authModeToggle">Need an account? Create one</button></div>
    <div class="footer-row"><button onclick="continueLocally()">Continue without an account (this device only)</button></div>
  </div>
</div>
<div class="shell" id="forgotShell" style="display:none;">
  <div class="masthead">
    <h1>The Ledger</h1>
    <div class="tagline">reset your password</div>
  </div>
  <div class="card">
    <form class="authform" id="forgotForm" onsubmit="event.preventDefault(); requestPasswordReset(); return false;">
      <input type="email" id="forgotEmail" name="email" autocomplete="email" placeholder="Email">
      <button type="submit" class="authsubmit" id="forgotSubmitBtn">Send reset link</button>
    </form>
    <div class="autherror" id="forgotError"></div>
    <div class="footer-row"><button onclick="hideForgotPassword()">Back to sign in</button></div>
  </div>
</div>
<div class="shell" id="resetShell" style="display:none;">
  <div class="masthead">
    <h1>The Ledger</h1>
    <div class="tagline">set a new password</div>
  </div>
  <div class="card">
    <form class="authform" id="resetForm" onsubmit="event.preventDefault(); submitPasswordReset(); return false;">
      <input type="password" id="resetPassword" name="new-password" autocomplete="new-password" placeholder="New password">
      <input type="password" id="resetPasswordConfirm" name="new-password-confirm" autocomplete="new-password" placeholder="Confirm new password">
      <button type="submit" class="authsubmit" id="resetSubmitBtn">Set new password</button>
    </form>
    <div class="autherror" id="resetError"></div>
  </div>
</div>
<!-- Standalone read-only view for a ?share=<id> link opened with no
     account signed in (see showShareStandalone(), 19-sharing.js) — same
     .shell/.masthead/.card pattern as authShell/resetShell above, just
     with its content filled in by JS instead of a static form. Its own
     "sign in to save this" CTA re-shows authShell without losing the
     pending share id (showShareAuthPrompt()), so the normal login/signup
     flow underneath is untouched. -->
<div class="shell" id="shareShell" style="display:none;"></div>
<div class="shell" id="appShell" style="display:none;">
  <div class="masthead">
    <button class="settingsbtn" id="settingsBtn" onclick="toggleSettings()" title="Settings">⚙</button>
    <!-- A calendar-with-a-marked-day glyph, not the old ▤ (a plain
         document/list icon with no "today"/date meaning at all) — per the
         project owner's own callout that the old icon didn't actually
         communicate "jump to today." fill="none"/stroke="currentColor" for
         the calendar body/header (so it picks up .dailyshortcut's own
         color, including the white .on state, the same way every other
         icon in the header row does) plus one small solid currentColor dot
         standing in for "today" marked on the grid. -->
    <button class="dailyshortcut" id="dailyShortcutBtn" onclick="goToDailyToday()" title="Today"><svg viewBox="0 0 24 24" width="1em" height="1em" style="display:block" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/><circle cx="12" cy="15" r="2" fill="currentColor" stroke="none"/></svg></button>
    <h1>The Ledger</h1>
    <button class="locbadge" id="locBadge" onclick="toggleLocation()"></button>
    <button class="signoutbtn2" id="signOutBtn" onclick="signOut()" title="Sign out" style="display:none;">Sign out</button>
  </div>
  <div class="status-line" id="statusLine"></div>
  <!-- .appmain is a plain, unstyled wrapper by default (transparent to
       block flow, identical to #tabs/.leathercover being direct .shell
       children) — it exists only so the EXPERIMENTAL tabBarDesktopStyle
       "sidetabs" look (see defaultDevSettings() in 02-storage-state.js)
       has a single flex container to turn into a row, without having to
       make #appShell itself a flex container (it holds the masthead and
       status lines too, which must stay stacked regardless). .tabswrap
       is the similar hook for tabBarMobileStyle's "scroll" fade hint. -->
  <div class="appmain" id="appMain">
    <div class="tabswrap">
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="leathercover" id="leatherCover">
      <div class="bookmark"></div>
      <!-- tabBarDesktopStyle "sidetabs"'s own peeking index-tab column
           (see layoutSidetabsPeek() in 06-tabs-render.js and the
           .sidetabspeek rules in <style>) — a real #appCard sibling, same
           reasoning as #tabConnector below and .bookmark above: it needs
           to paint above .leathercover's own background/texture but below
           #appCard, and only a genuine DOM child positioned here (not a
           z-index trick on the real .tab elements, which live outside
           .leathercover entirely) can do that reliably. Empty/inert
           unless that style is actually selected. -->
      <div class="sidetabspeek" id="sidetabsPeek"></div>
      <div class="card" id="appCard">
      <!-- tabBarDesktopStyle "overlap"'s active-tab connector (see
           layoutOverlapTabs() in 06-tabs-render.js and the .tabconnector
           rule in <style>) — empty/inert by default. A genuine #appCard
           child so it trivially paints above #appCard's own background
           and above the whole (separately stacked, see .tabs) tab bar,
           without needing to fight #appCard for z-index priority the way
           the real .tab.active element itself never successfully could. -->
      <div class="tabconnector" id="tabConnector"></div>
      <div id="categoryView">
        <!-- "Shared N" compact tag (renderList(), 08-render-core.js) —
             only ever filled in on the All tab. .pagetag.compact is
             position:absolute against #appCard so this empty div costs
             no layout space of its own when there's nothing to show. -->
        <div id="sharedTagSlot"></div>
        <!-- Mobile UI Lab (quickAddBarStyle) — the trigger is docked
             wherever the dev setting picks (see .quickaddtrigger in
             <style>); tapping it either expands the bar open in place
             ('top', the default) or opens it as a bottom sheet behind a
             dimming scrim ('bottom' — the grabber+close row inside
             #quickAddBar only shows for that variant). Inert
             (display:none) on desktop, same as the rest of this file's
             Mobile UI Lab markup. -->
        <button class="quickaddtrigger" id="quickAddTrigger" onclick="toggleQuickAddSheet()">+ Add Task</button>
        <div class="quickaddscrim" id="quickAddScrim" onclick="toggleQuickAddSheet(false)"></div>
        <div class="quickadd" id="quickAddBar">
          <div class="quickaddsheethead">
            <span class="quickaddsheetgrabber"></span>
            <button class="quickaddsheetclose" onclick="toggleQuickAddSheet(false)" title="Close">×</button>
          </div>
          <!-- Row 1 is the whole point: the title input is most of the
               space, and everything else here is either required
               (Category, only on the All tab — see renderQuickCategory(),
               06-tabs-render.js) or a single small fixed-size control, so
               this row never has anything to wrap onto a second line —
               per the explicit "+ should never end up on its own line"
               ask. Timeframe/Priority (optional, advanced-mode-only
               fields) live on their own secondary row below instead of
               competing with title-entry for attention here. -->
          <div class="quickaddrow1">
            <input type="text" id="quickInput" placeholder="What needs doing?" onkeydown="if(event.key==='Enter') addTask()">
            <!-- The real value source, same idiom fieldPickerStyle's custom
                 pickers already used elsewhere (addTask() reads these
                 directly) — always hidden now, since quickCategoryBtn/
                 quickTimeframeBtn/quickPriorityBtn (below and in row 2)
                 are the only UI for all three, everywhere, not just under
                 an opt-in dev setting. 'today'/'urgent' stay dropped from
                 the Timeframe options (kept only in TIMEFRAME_LABELS,
                 02-storage-state.js, for any task that already has one
                 saved) — both already duplicate a separate existing
                 concept (this row's own "Mark urgent" toggle, and the
                 "add to today" pin) rather than adding anything Short/
                 Medium/Long doesn't already cover. -->
            <select id="quickCategory" style="display:none"></select>
            <select id="quickTimeframe" style="display:none" title="Timeframe">
              <option value="">Timeframe</option>
              <option value="short">Short</option>
              <option value="medium">Medium</option>
              <option value="long">Long</option>
            </select>
            <select id="quickPriority" style="display:none" title="Priority">
              <option value="0">Priority</option>
              <option value="1">Low</option>
              <option value="2">Medium</option>
              <option value="3">High</option>
            </select>
            <!-- Only shown on the All tab (renderQuickCategory() hides it
                 everywhere else, same as the old <select> did) — a real
                 category tab already implies its own category, nothing to
                 pick. No default selection there: addTask() flashes this
                 red and refuses to create the task rather than silently
                 picking whichever category happened to render first. -->
            <button type="button" class="quickfieldbtn" id="quickCategoryBtn" onclick="event.stopPropagation(); openQuickFieldMenu(this,'category')"></button>
            <button class="flagbtn" id="urgentToggle" onclick="toggleUrgentDraft()" title="Mark urgent">⚑</button>
            <button class="addbtn" onclick="addTask()">+</button>
          </div>
          <!-- Row 2: Timeframe/Priority, only when advancedTaskFields is on
               (renderQuickCategory() toggles this row's own display) —
               secondary, optional fields get their own smaller, lower-
               emphasis row rather than crowding row 1. -->
          <div class="quickaddrow2" id="quickAddRow2">
            <button type="button" class="quickfieldbtn secondary" id="quickTimeframeBtn" onclick="event.stopPropagation(); openQuickFieldMenu(this,'timeframe')">Timeframe</button>
            <button type="button" class="quickfieldbtn secondary" id="quickPriorityBtn" onclick="event.stopPropagation(); openQuickFieldMenu(this,'priority')">Priority</button>
          </div>
        </div>
        <div class="sortrow" id="sortRow"></div>
        <ul class="tasks" id="taskList"></ul>
        <div class="footer-row"><button id="showDoneBtn" onclick="toggleShowDone()"></button></div>
      </div>
      <div id="dailyView" style="display:none;"></div>
      <div id="checklistView" style="display:none;"></div>
      <div id="settingsView" style="display:none;"></div>
      <div id="claudeView" style="display:none;"></div>
      <!-- The same full-page task detail Daily's own taskDetailId uses
           (see openGenericTaskDetail() in 08-render-core.js), reachable
           from any category tab's row — via its own always-visible ⛶
           button, the desktop right-click menu, or a plain tap on mobile
           — instead of just from within Daily. -->
      <div id="genericTaskDetailView" style="display:none;"></div>
      <!-- The "Shared N" compact tag's own drilldown (openSharedItems(),
           19-sharing.js) — same top-tier overlay pattern as
           #genericTaskDetailView just above. -->
      <div id="sharedItemsView" style="display:none;"></div>
    </div>
    </div>
  </div>
  <div class="undoRow">
    <button class="undobtn" id="undoBtn" onclick="undo()" title="Undo" disabled>↺</button>
    <span class="undostatus" id="undoStatus"></span>
    <button class="undobtn" id="redoBtn" onclick="redo()" title="Redo" disabled>↻</button>
  </div>
  <div class="savestatus" id="saveStatus"></div>
  <div class="status-line"><button class="signoutbtn" onclick="refreshFromServer(true)" id="refreshBtn">Refresh</button></div>

  <!-- Shake-to-undo/redo (see 04-undo.js) — uses the shared bottom-sheet
       mechanics (.fabaddsheet/.fabaddscrim, see <style>), gated by its own
       body class. Always in the DOM, harmless at rest. -->
  <div class="fabaddscrim" id="shakeUndoScrim" onclick="closeShakeUndoMenu()"></div>
  <div class="fabaddsheet shakeundosheet" id="shakeUndoSheet">
    <div class="quickaddsheethead">
      <span class="quickaddsheetgrabber"></span>
      <button class="quickaddsheetclose" onclick="closeShakeUndoMenu()" title="Close">×</button>
    </div>
    <div id="shakeUndoBody"></div>
  </div>

  <!-- customContextMenu (desktop-only, see handleTaskContextMenu() in
       08-render-core.js) — position:fixed and placed at click coordinates
       by openTaskContextMenu(), so a fixed spot in the DOM is all this
       needs; no scrim, closed by the document-level click/Esc/scroll
       listeners in 19-bootstrap.js instead. -->
  <div class="ctxmenu" id="ctxMenu"></div>

  <!-- Hover-preview of a task's own Notes, shown from the inline quick
       view (a category tab's row list) after a short hold — see
       noteHoverStart() in 08-render-core.js. Same position:fixed/no-scrim
       idiom as #ctxMenu just above, styled off the same .ctxmenu visual
       language (see .notehovertip in <style>) since this is also a small
       floating popup anchored to a row, just non-interactive text instead
       of buttons. -->
  <div class="notehovertip" id="noteHoverTip"></div>

  <!-- Share menu (openShareMenu(), 19-sharing.js) — same anchored-popover
       idiom as #ctxMenu above (position:fixed, placed by JS at the
       clicked button's rect) but richer content (a link field, not just
       a flat button list), so it gets its own container rather than
       overloading #ctxMenu's markup assumptions. -->
  <div class="sharemenu" id="shareMenu"></div>

  <!-- Import dialog for a ?share=<id> link opened while already signed
       in (openShareImportDialog(), 19-sharing.js) — a centered modal
       rather than an anchored popover, since it opens at boot with no
       button to anchor to. Its category picker reuses .ctxmenu's own
       styling (see .ctxmenu-embedded in <style>) to match the
       .categorylabel "Move to" menu's look, per the explicit ask to keep
       this feeling like the same category picker. -->
  <div class="shareimport" id="shareImportModal"></div>
  <!-- "Move item(s) to another list" target picker (openMoveTargetPicker(),
       13-checklist.js) — same static-top-level-div idiom as
       #shareImportModal just above, manipulated purely via
       renderMoveTargetModal() rather than living inside #checklistView's
       own innerHTML, so typing in its search field (or any other in-modal
       interaction) never gets wiped out by an unrelated render() of the
       checklist view underneath it. -->
  <div class="moveitem" id="moveItemModal"></div>
</div>

<div class="devpanel" id="devPanel" style="display:none;">
  <button class="devpaneltab" id="devPanelTab" onclick="toggleDevPanel()" title="Dev settings">DEV</button>
  <div class="devpanelbody" id="devPanelBody"></div>
</div>

<script>
